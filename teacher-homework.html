    async function createOrEditHomework(){

    /*
    =====================================================
    CREATE IS ALLOWED ONLY IF NO HOMEWORK EXISTS
    =====================================================
    */

    const teacherId =
        sessionStorage.getItem("teacherId");

    const className =
        sessionStorage.getItem("homeworkClass");

    const subject =
        sessionStorage.getItem("homeworkSubject");

    const date =
        new Date()
        .toISOString()
        .split("T")[0];


    if(
        !teacherId ||
        !className ||
        !subject
    ){

        alert(
            "Homework class information is missing."
        );

        return;

    }


    try{

        const res = await fetch(

            "https://academy-backend-eatl.onrender.com/api/lesson-plans?teacherId=" +
            encodeURIComponent(teacherId)

        );


        const result =
            await res.json();


        if(!result.success){

            alert(
                "Unable to check existing homework."
            );

            return;

        }


        /*
        =====================================================
        SAME TEACHER + CLASS + SUBJECT + DATE
        =====================================================
        */

        const periodId =
    sessionStorage.getItem("homeworkPeriodId");

const existing =
    result.data.find(plan =>

        plan.date === date &&

        String(plan.className).trim()
        ===
        String(className).trim() &&

        String(plan.subject).trim()
        ===
        String(subject).trim() &&

        String(plan.periodId)
        ===
        String(periodId)

    );


        /*
        =====================================================
        HOMEWORK ALREADY EXISTS
        =====================================================
        */

        if(existing){

            updateCreateHomeworkButton(true);

            alert(
                "Homework has already been created for this period and date.\n\nYou can use the Edit button to update it."
            );

            return;

        }


        /*
        =====================================================
        NO HOMEWORK EXISTS
        CREATE NEW
        =====================================================
        */

        window.editLessonPlanId = null;


        document.getElementById(
            "addTopicBtn"
        ).style.display =
            "inline-block";


        showCreateHomeworkPanel();


    }catch(error){

        console.error(
            "Create homework check error:",
            error
        );

        alert(
            "Unable to check existing homework."
        );

    }

}

    async function saveHomeworkDraft(){

        const selectedSubjects = Array.from(
    document.querySelectorAll(".hwSubjectCheckbox:checked")
);

if (selectedSubjects.length === 0) {
    alert("Please select at least one subject.");
    return;
}

    const lessons=[];

    document.querySelectorAll("#topicContainer > div").forEach((card,index)=>{

    const topic=
    card.querySelector(".topicName").value;

    if (!card.dataset.subject) {
    alert("A topic is missing its subject. Please select the subject again.");
    return;
}

    const topicSummary=
    card.querySelector(".topicDescription").value;

    const homework=
    card.querySelector(".homeworkGiven").value;

    const videoLinks=[];

    card.querySelectorAll(".videoLink").forEach(v=>{

    if(v.value.trim()){

    videoLinks.push(v.value.trim());

    }

    });

        const subjectCode = (card.dataset.subject || "HW").substring(0, 3).toUpperCase();

    const dateCode =
    document.getElementById("hwDate")
    .value
    .replaceAll("-","");

    const topicId =
    card.dataset.topicId ||
    `${subjectCode}-${dateCode}-${String(index+1).padStart(2,"0")}`;

    lessons.push({
    topicId,
    subject: card.dataset.subject || card.querySelector("h2").textContent.replace("Topic:", "").trim(),
    topic,
    topicSummary,
    homework,
    videoLinks,
    classMaterials: card.lessonMaterials || [],
    homeworkDocuments: card.homeworkDocuments || []
});

    });

    const payload={

    teacherId:
    sessionStorage.getItem("teacherId") || "",

    teacherName:
    sessionStorage.getItem("teacherName") || "",

    className:
    document.getElementById("hwClass").value,

        subject: Array.from(
        document.querySelectorAll(".hwSubjectCheckbox:checked")
    ).map(checkbox => checkbox.value).join(", "),

    day:
    sessionStorage.getItem("homeworkDay") || "",

    startTime:
    sessionStorage.getItem("homeworkStartTime") || "",

    endTime:
sessionStorage.getItem("homeworkEndTime") || "",

periodId:
sessionStorage.getItem("homeworkPeriodId") || "",

    date:
    document.getElementById("hwDate").value,

    lessons

    };

    let url =
    "https://academy-backend-eatl.onrender.com/api/create-homework";

    let method = "POST";

    if(window.editLessonPlanId){

    url =

    "https://academy-backend-eatl.onrender.com/api/lesson-plan/"

    +

    window.editLessonPlanId;

    method = "PUT";

    }

    const res = await fetch(

    url,

    {

    method,

    headers:{

    "Content-Type":"application/json"

    },

    body:JSON.stringify(payload)

    }

    );

    const data=await res.json();

    if(data.success){

    alert("Homework Saved Successfully");


    /*
    =====================================================
    CREATE / EDIT RESULT
    =====================================================
    */

    if(window.editLessonPlanId){

        /*
        -----------------------------------------------
        EDIT MODE

        Keep Create button disabled.
        Editing can happen unlimited times.
        -----------------------------------------------
        */

        updateCreateHomeworkButton(true);

    }else{

        /*
        -----------------------------------------------
        CREATE MODE

        Homework has now been created.
        Disable Create.
        -----------------------------------------------
        */

        updateCreateHomeworkButton(true);

    }


    // Reset Edit Mode
    window.editLessonPlanId = null;

        const saveBtn = document.querySelector(
            'button[onclick="saveHomeworkDraft()"]'
        );

        if(saveBtn){

            saveBtn.innerText = "Save Homework";

            saveBtn.style.background = "#28a745";

        }

        closeHomeworkPanel();

        load();

    }else{

        alert(data.message);

    }

    }

    async function uploadLessonMaterial(button){

    const card = button.closest("#topicContainer > div");

    const inputs = card.querySelectorAll(".lessonMaterialFile");

    const formData = new FormData();

    let hasFile = false;

    inputs.forEach(input => {

        for(const file of input.files){

            formData.append("files", file);

            hasFile = true;

        }

    });

    if(!hasFile){

        alert("Please choose a file.");

        return;

    }

    const res = await fetch(

    "https://academy-backend-eatl.onrender.com/api/upload-lesson-material",

    {

    method:"POST",

    body:formData

    }

    );

    const data = await res.json();

    if(!data.success){

    alert(data.message);

    return;

    }

    if(!card.lessonMaterials){

    card.lessonMaterials=[];

    }

    card.lessonMaterials.push(...data.files);

    const list = card.querySelector(".uploadedLessonMaterials");

    list.innerHTML="";

    card.lessonMaterials.forEach((file,index)=>{

    list.innerHTML += `

    <div style="
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:10px;
    ">

    📎

    <a href="${file.s3Url}" target="_blank">

    ${file.fileName}

    </a>

    <button
    type="button"
    onclick="deleteLessonMaterial(this,${index})"
    style="
    background:red;
    color:white;
    border:none;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    ">

    ✖

    </button>

    </div>

    `;

    });

    inputs.forEach(input => input.value = "");

    alert("File uploaded successfully.");

    }

    function deleteLessonMaterial(button,index){

    const card = button.closest("#topicContainer > div");

    card.lessonMaterials.splice(index,1);

    const list = card.querySelector(".uploadedLessonMaterials");

    list.innerHTML = "";

    card.lessonMaterials.forEach((file,i)=>{

    list.innerHTML += `

    <div style="
    margin-top:8px;
    display:flex;

    <a href="${file.s3Url}" target="_blank">

async function deleteReviewedFile(homeworkId, s3Key){

    if(!confirm("Delete this reviewed file?")){
        return;
    }

    const res = await fetch(

        "https://academy-backend-eatl.onrender.com/api/delete-reviewed-file",

        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                homeworkId,
                s3Key

            })

        }

    );

    const data = await res.json();

    if(data.success){

        alert("Reviewed file deleted successfully.");

        load();

    }else{

        alert(data.message);

    }

}
