<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Schedule</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --gpa-navy: #10264a;
            --gpa-navy2: #173866;
            --gpa-gold: #c7a45b;
            --gpa-ink: #17243a;
            --gpa-soft: #f4f7fb;
            --gpa-line: #dbe3ef;
        }

        body.dashboard-page {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--gpa-soft);
        }

        .main-content {
            padding: 28px;
            color: var(--gpa-ink);
            max-width: 1200px;
            margin: auto;
        }

        .main-content h2 {
            color: var(--gpa-navy);
            font-weight: 800;
            letter-spacing: .2px;
            margin: 8px 0 22px;
        }

        #gpaScheduleForm {
            background: #fff;
            border: 1px solid var(--gpa-line);
            border-top: 4px solid var(--gpa-gold);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 28px rgba(16,38,74,.08);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 13px;
            margin-bottom: 22px;
        }

        #gpaScheduleForm select, #gpaScheduleForm input {
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #cbd6e5;
            border-radius: 9px;
            background: #fff;
            color: var(--gpa-ink);
            box-sizing: border-box;
        }

        #gpaScheduleForm select[multiple] {
            min-height: 88px;
        }

        #gpaScheduleForm button, .schedule-filter-box button {
            border: 0;
            border-radius: 9px;
            background: var(--gpa-navy);
            color: #fff;
            font-weight: 700;
            padding: 12px 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #gpaScheduleForm button:hover {
            background: var(--gpa-navy2);
        }

        #gpaStudentPicker {
            grid-column: 1 / -1;
            border: 1px solid var(--gpa-line);
            border-radius: 12px;
            background: var(--gpa-soft);
            padding: 14px;
        }

        #gpaStudentPicker h3 { margin: 0 0 8px; color: var(--gpa-navy); }

        #gpaStudentCards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 10px;
            max-height: 390px;
            overflow: auto;
            margin-top: 10px;
        }

        .gpa-student-card {
            background: white;
            border: 1px solid var(--gpa-line);
            border-radius: 10px;
            padding: 12px;
        }

        .schedule-filter-box {
            background: #fff;
            border: 1px solid var(--gpa-line);
            border-radius: 12px;
            padding: 15px;
            margin: 18px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        #scheduleTable {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
            border: 1px solid var(--gpa-line);
            border-radius: 12px;
            overflow: hidden;
        }

        #scheduleTable th {
            background: var(--gpa-navy);
            color: #fff;
            padding: 12px 10px;
            text-align: left;
        }

        #scheduleTable td {
            padding: 11px 10px;
            border-bottom: 1px solid #e7edf5;
        }

        #clashWarning {
            grid-column: 1 / -1;
            display: none;
            color: white;
            background: #dc3545;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Modal Styles */
        #editSchedulePopup {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .class-block {
            background: var(--gpa-navy);
            color: white;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
        }

        @media(max-width: 768px) {
            #gpaScheduleForm { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="dashboard-page">

<div class="main-content">
    <h2>Teacher Weekly Timetable</h2>

    <form id="gpaScheduleForm" onsubmit="event.preventDefault(); addSchedule();">
        <select id="teacher" required><option value="">Loading Teachers...</option></select>
        
        <select id="day" required>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
        </select>

        <select id="className" required onchange="renderGpaStudentCards()">
            <option value="">Select Class</option>
            <option>Pre.KG</option>
            <option>LKG</option>
            <option>Grade - 1</option>
            <option>Grade - 2</option>
            <option>Grade - 3</option>
            <option>Grade - 4</option>
            <option>Grade - 5</option>
            <option>Grade - 6</option>
            <option>Grade - 7</option>
            <option>Grade - 8</option>
            <option>Grade - 9</option>
            <option>Grade - 10</option>
            <option>Grade - 11</option>
            <option>Grade - 12</option>
        </select>

        <select id="subject" multiple size="1" title="Hold Ctrl to select multiple"></select>
        <select id="eca" multiple size="1" title="Hold Ctrl to select multiple"></select>
        <select id="language" multiple size="1" title="Hold Ctrl to select multiple"></select>

        <input type="time" id="startTime" required>
        <input type="time" id="endTime" required>

        <div id="clashWarning"></div>

        <div id="gpaStudentPicker">
            <h3>Assign students to this period</h3>
            <div style="margin-bottom:10px">
                <button type="button" onclick="selectAllGpaStudents(true)">Select All</button>
                <button type="button" onclick="selectAllGpaStudents(false)" style="background:#64748b">Clear</button>
            </div>
            <div id="gpaStudentCards"><span>Loading students...</span></div>
        </div>

        <button type="submit" id="submitBtn">Add Schedule + Student Mapping</button>
    </form>

    <div class="schedule-filter-box">
        <strong>Filters:</strong>
        <select id="filterTeacher"><option value="all">All Teachers</option></select>
        <select id="filterDay">
            <option value="all">All Days</option>
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
        </select>
        <button type="button" onclick="applyScheduleFilters()">Apply</button>
        <button type="button" onclick="clearScheduleFilters()" style="background:#666">Reset</button>
    </div>

    <div style="overflow-x:auto">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Teacher</th>
                    <th>Day</th>
                    <th>Class</th>
                    <th>Subjects</th>
                    <th>Languages</th>
<th>ECA</th>
                    <th>Students</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h2 style="margin-top:40px;">Weekly Grid View</h2>
    <div style="margin-bottom: 20px;">
        <select id="gridTeacher" onchange="filterGrid()"><option value="all">All Teachers</option></select>
        <button onclick="downloadPDF()" style="margin-left:10px;">Download PDF</button>
    </div>

    <div id="pdfContent">
        <h2 style="text-align:center;">Teacher Timetable Grid</h2>
        <div style="overflow-x:auto">
            <table id="gridTable" border="1" style="width:100%; border-collapse:collapse;">
                <thead><tr><th>Day</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="editSchedulePopup">
    <div class="modal-content">
        <h2>Edit Schedule</h2>
        <input type="hidden" id="editId">
        <label>Teacher</label><select id="editTeacher" style="width:100%; margin-bottom:10px;"></select>
        <label>Day</label><select id="editDay" style="width:100%; margin-bottom:10px;"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select>
        <label>Class</label><select id="editClass" style="width:100%; margin-bottom:10px;"></select>
        <label>Times</label>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="time" id="editStart" style="flex:1">
            <input type="time" id="editEnd" style="flex:1">
        </div>
        <div id="gpaEditStudentCards"></div>
        <div style="margin-top:15px;">
            <button onclick="saveScheduleEdit()">Save Changes</button>
            <button onclick="closeSchedulePopup()" style="background:#666">Cancel</button>
        </div>
    </div>
</div>

<script>
const API_BASE = "https://academy-backend-eatl.onrender.com/api/founder";
let teachers = [];
let allSchedules = [];
let gpaStudents = [];
let currentEditId = null;

// Initialize
document.addEventListener("DOMContentLoaded", async () => {
    await loadTeachers();
    await loadGpaStudents();
    await loadSchedules();
    setupLiveClash();
});

async function loadTeachers() {
    try {
        const token = localStorage.getItem("token");
        const res = await fetch(`${API_BASE}/teachers`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        teachers = data.teachers || [];
        
        const selectors = ["teacher", "filterTeacher", "gridTeacher", "editTeacher"];
        selectors.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (id !== "teacher" && id !== "editTeacher") el.innerHTML = '<option value="all">All Teachers</option>';
            else el.innerHTML = '<option value="">Select Teacher</option>';
            
            teachers.forEach(t => {
                el.innerHTML += `<option value="${t._id}">${t.name} (${t.teacherId || 'N/A'})</option>`;
            });
        });

        document.getElementById("teacher").addEventListener("change", updateOptionsFromTeacher);
    } catch (e) { console.error("Teacher load error", e); }
}

function updateOptionsFromTeacher() {
    const tid = document.getElementById("teacher").value;
    const teacher = teachers.find(t => t._id === tid);
    if (!teacher) return;

    ["subject", "eca", "language"].forEach(key => {
        const el = document.getElementById(key);
        el.innerHTML = "";
        (teacher[key] || []).forEach(val => {
            el.innerHTML += `<option value="${val}">${val}</option>`;
        });
    });
    renderGpaStudentCards();
}

async function loadGpaStudents() {
    try {
        const token = localStorage.getItem("token");
        const res = await fetch(`${API_BASE}/students`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        gpaStudents = data.students || data || [];
        renderGpaStudentCards();
    } catch (e) { document.getElementById("gpaStudentCards").innerHTML = "Error loading students"; }
}


function renderGpaStudentCards(assignments = []) {
    const box = document.getElementById("gpaStudentCards");
    if (!box) return;

    const selectedClass = document.getElementById("className").value;

    // Show students belonging only to the selected class/grade.
    const filteredStudents = selectedClass
        ? gpaStudents.filter(student =>
            String(student.grade || "").trim().toLowerCase() ===
            selectedClass.trim().toLowerCase()
          )
        : [];

    if (!selectedClass) {
        box.innerHTML = "Please select a class to view its students.";
        return;
    }

    if (filteredStudents.length === 0) {
        box.innerHTML = "No students found for " + selectedClass + ".";
        return;
    }

    box.innerHTML = filteredStudents.map(student => {
        const isSelected = assignments.some(a =>
            String(a.studentId || a.student?._id || a.student || "") ===
            String(student._id)
        );

        return `
            <div class="gpa-student-card" data-id="${student._id}">
                <label>
                    <input
                        type="checkbox"
                        class="gpa-student-select"
                        ${isSelected ? "checked" : ""}
                    >
                    ${student.name}
                </label>
            </div>
        `;
    }).join("");
}

async function loadSchedules() {
    const token = localStorage.getItem("token");
    const res = await fetch(`${API_BASE}/schedules`, { headers: { Authorization: `Bearer ${token}` } });
    const data = await res.json();
    allSchedules = data.schedules || [];
    renderTable(allSchedules);
    buildGrid(allSchedules);
}

function renderTable(data) {
    const tbody = document.querySelector("#scheduleTable tbody");
    tbody.innerHTML = data.map(s => `
        <tr>
            <td>${s.teacher?.name || 'Unknown'}</td>
            <td>${s.day}</td>
            <td>${s.className}</td>
            <td>${(s.subject || []).join(", ") || "-"}</td>
<td>${(s.language || []).join(", ") || "-"}</td>
<td>${(s.eca || []).join(", ") || "-"}</td>
<td>${(s.assignments || []).length} mapped</td>
<td>${s.startTime}</td>
<td>${s.endTime}</td>
            <td>
                <button onclick="editSchedule('${s._id}')">Edit</button>
                <button onclick="deleteSchedule('${s._id}')" style="background:#dc3545">Del</button>
            </td>
        </tr>
    `).join("");
}

function applyScheduleFilters() {
    const teacherId = document.getElementById("filterTeacher").value;
    const day = document.getElementById("filterDay").value;

    const filteredSchedules = allSchedules.filter(schedule => {
        const scheduleTeacherId =
            schedule.teacher?._id || schedule.teacher;

        const matchesTeacher =
            teacherId === "all" || scheduleTeacherId === teacherId;

        const matchesDay =
            day === "all" || schedule.day === day;

        return matchesTeacher && matchesDay;
    });

    renderTable(filteredSchedules);
}

function clearScheduleFilters() {
    document.getElementById("filterTeacher").value = "all";
    document.getElementById("filterDay").value = "all";
    renderTable(allSchedules);
}


async function addSchedule() {
    const token = localStorage.getItem("token");
    const payload = {
        teacher: document.getElementById("teacher").value,
        day: document.getElementById("day").value,
        className: document.getElementById("className").value,
        startTime: document.getElementById("startTime").value,
        endTime: document.getElementById("endTime").value,
        subject: Array.from(document.getElementById("subject").selectedOptions).map(o => o.value),
        eca: Array.from(document.getElementById("eca").selectedOptions).map(o => o.value),
        language: Array.from(document.getElementById("language").selectedOptions).map(o => o.value),
        assignments: Array.from(document.querySelectorAll('.gpa-student-card'))
            .filter(c => c.querySelector('.gpa-student-select').checked)
            .map(c => ({ studentId: c.dataset.id }))
    };

    if (!payload.teacher || !payload.startTime || !payload.endTime) return alert("Fill required fields");

    if (document.getElementById("submitBtn").disabled) {
    return alert("Please resolve the schedule conflict before saving.");
}

    const res = await fetch(`${API_BASE}/add-schedule`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        alert("Schedule added!");
        loadSchedules();
    } else {
        const err = await res.json();
        alert(err.message || "Error adding schedule");
    }
}

async function deleteSchedule(id) {
    if (!confirm("Delete this entry?")) return;
    const token = localStorage.getItem("token");
    await fetch(`${API_BASE}/delete-schedule/${id}`, { 
        method: "DELETE", 
        headers: { Authorization: `Bearer ${token}` } 
    });
    loadSchedules();
}

function buildGrid(schedules) {
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const timeSlots = [...new Set(schedules.map(s => `${s.startTime}-${s.endTime}`))].sort();
    
    const thead = document.querySelector("#gridTable thead tr");
    thead.innerHTML = "<th>Day</th>" + timeSlots.map(t => `<th>${t}</th>`).join("");

    const tbody = document.querySelector("#gridTable tbody");
    tbody.innerHTML = days.map(day => {
        let row = `<tr><td><strong>${day}</strong></td>`;
        timeSlots.forEach(slot => {
            const match = schedules.find(s => s.day === day && `${s.startTime}-${s.endTime}` === slot);
            row += `<td>${match ? `<button class="class-block" onclick="editSchedule('${match._id}')">${match.className}<br>${match.teacher?.name || ''}</button>` : ''}</td>`;
        });
        return row + "</tr>";
    }).join("");
}

function selectAllGpaStudents(val) {
    document.querySelectorAll('.gpa-student-select').forEach(cb => cb.checked = val);
}

function downloadPDF() {
    const element = document.getElementById("pdfContent");
    const opt = { margin: 10, filename: 'timetable.pdf', jsPDF: { orientation: 'landscape' } };
    html2pdf().set(opt).from(element).save();
}

// Placeholder for Live Clash (Logic varies based on backend implementation)
// Check teacher timetable clashes using TeacherStudentSchedule data.
function setupLiveClash() {
    const fields = ["teacher", "day", "startTime", "endTime"];
    const warning = document.getElementById("clashWarning");
    const submitBtn = document.getElementById("submitBtn");

    let checkNumber = 0;

    async function checkClash() {
        const currentCheck = ++checkNumber;

        const teacher = document.getElementById("teacher").value;
        const day = document.getElementById("day").value;
        const startTime = document.getElementById("startTime").value;
        const endTime = document.getElementById("endTime").value;

        warning.style.display = "none";
        warning.textContent = "";
        submitBtn.disabled = false;

        if (!teacher || !day || !startTime || !endTime) return;

        if (endTime <= startTime) {
            warning.textContent = "End time must be later than start time.";
            warning.style.display = "block";
            submitBtn.disabled = true;
            return;
        }

        try {
            const token = localStorage.getItem("token");

            const response = await fetch(`${API_BASE}/schedules`, {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error("Could not verify existing schedules.");
            }

            const data = await response.json();

            // Ignore outdated responses if the user changes a field quickly.
            if (currentCheck !== checkNumber) return;

            const schedules = data.schedules || [];

            const conflict = schedules.find(schedule => {
                const existingTeacher =
                    schedule.teacher?._id || schedule.teacher;

                if (
                    String(existingTeacher) !== String(teacher) ||
                    schedule.day !== day
                ) {
                    return false;
                }

                const existingStart = schedule.startTime;
                const existingEnd = schedule.endTime;

                if (!existingStart || !existingEnd) return false;

                const newStartMinutes =
                    Number(startTime.split(":")[0]) * 60 +
                    Number(startTime.split(":")[1]);

                const newEndMinutes =
                    Number(endTime.split(":")[0]) * 60 +
                    Number(endTime.split(":")[1]);

                const oldStartMinutes =
                    Number(existingStart.split(":")[0]) * 60 +
                    Number(existingStart.split(":")[1]);

                const oldEndMinutes =
                    Number(existingEnd.split(":")[0]) * 60 +
                    Number(existingEnd.split(":")[1]);

                // Require a minimum 2-minute gap.
                return (
                    newStartMinutes < oldEndMinutes + 2 &&
                    newEndMinutes > oldStartMinutes - 2
                );
            });

            if (conflict) {
                const teacherName =
                    teachers.find(t => String(t._id) === String(teacher))
                        ?.name || "This teacher";

                warning.textContent =
                    `${teacherName} already has a class on ${day}, ` +
                    `${conflict.startTime}–${conflict.endTime}. ` +
                    `Choose another time with at least a 2-minute gap.`;

                warning.style.display = "block";
                submitBtn.disabled = true;
            }
        } catch (error) {
            console.error("Schedule clash check failed:", error);

            if (currentCheck !== checkNumber) return;

            warning.textContent =
                "Unable to verify the timetable. Please try again before saving.";

            warning.style.display = "block";
            submitBtn.disabled = true;
        }
    }

    fields.forEach(field => {
        document.getElementById(field).addEventListener("change", checkClash);
    });
}
async function editSchedule(id) {
    currentEditId = id;
    const s = allSchedules.find(item => item._id === id);
    if (!s) return;

    document.getElementById("editTeacher").value = s.teacher?._id || "";
    document.getElementById("editDay").value = s.day;
    document.getElementById("editStart").value = s.startTime;
    document.getElementById("editEnd").value = s.endTime;
    
    document.getElementById("editSchedulePopup").style.display = "flex";
}

function closeSchedulePopup() {
    document.getElementById("editSchedulePopup").style.display = "none";
}

async function saveScheduleEdit() {
    const token = localStorage.getItem("token");
    const payload = {
        teacher: document.getElementById("editTeacher").value,
        day: document.getElementById("editDay").value,
        startTime: document.getElementById("editStart").value,
        endTime: document.getElementById("editEnd").value
    };

    const res = await fetch(`${API_BASE}/update-schedule/${currentEditId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify(payload)
    });

    if (res.ok) {
        alert("Updated!");
        closeSchedulePopup();
        loadSchedules();
    }
}
</script>
</body>
</html>
