    <meta charset="UTF-8">

        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPA Messenger</title>


    <!-- =====================================================

    <!-- =====================================================
         MODULE 5
         CONTACTS CSS
         ===================================================== -->

    <style>

        /* =====================================================
           CONTACTS PANEL
           ===================================================== */

        .gpa-messenger-contacts {

            width: 300px;

            border-right: 1px solid #ddd;

            background: #ffffff;

            overflow-y: auto;

            flex-shrink: 0;
        }


        .gpa-messenger-contacts-header {

            padding: 18px;

            font-size: 20px;

            font-weight: bold;

            border-bottom: 1px solid #ddd;

        }


        .gpa-messenger-contact {

            padding: 14px 16px;

            border-bottom: 1px solid #eeeeee;

            cursor: pointer;

        }


        .gpa-messenger-contact:hover {

            background: #f5f7fb;

        }


        .gpa-messenger-contact-name {

            font-weight: 600;

            font-size: 15px;

        }


        .gpa-messenger-contact-info {

            margin-top: 4px;

            font-size: 13px;

            color: #777;

        }


        .gpa-messenger-contact-role {

            margin-top: 3px;

            font-size: 12px;

            color: #3155a6;

            text-transform: capitalize;

        }


        .gpa-messenger-contacts-loading {

            padding: 20px;

            color: #777;

        }


        .gpa-messenger-contacts-error {

            padding: 20px;

            color: #c62828;

        }


        /* =====================================================
           MESSENGER LAYOUT
           ===================================================== */

        .gpa-messenger-layout {

            display: flex;

            height: 100vh;

            width: 100%;

        }


        .gpa-messenger-chat-area {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

        }


        .gpa-primary-messenger-header {

            flex-shrink: 0;

        }

        /* Messenger online and last-seen status */

#gpaMessengerContactName {
    font-size: 16px;
    font-weight: 600;
}

.gpa-messenger-presence-status {
    margin-top: 3px;
    font-size: 12px;
    color: #777;
    min-height: 14px;
}

.gpa-messenger-presence-status.online {
    color: #16803c;
}


        #gpaPrimaryConversation {

            flex: 1;

            overflow-y: auto;

        }


        .gpa-primary-composer {

            flex-shrink: 0;

        }


        /* =====================================================
   MODULE 5
   CONTACT ROLE SECTIONS
   ===================================================== */

.gpa-messenger-contact-section {
    border-bottom: 1px solid #ddd;
}


.gpa-messenger-contact-section-title {

    padding: 12px 14px;

    background: #f1f4f9;

    font-size: 13px;

    font-weight: bold;

    color: #3155a6;

    position: sticky;

    top: 0;

    z-index: 2;

}

/* =====================================================
   MODULE 5
   STEP 7
   SELECTED CONTACT
   ===================================================== */

.gpa-messenger-contact {
    transition: background 0.15s ease;
}

.gpa-messenger-contact.selected {
    background: #e8eefc;
}

.gpa-messenger-contact:active {
    background: #dce6fa;
}

    </style>

</head>


<body>


    <!-- =====================================================
         GPA MESSENGER
         MODULE 5
         ===================================================== -->

    <div class="gpa-messenger-layout">

             CONTACTS
             ================================================= -->

        <div

                Contacts

                <div

    <!-- =====================================================
         MODULE 5
         CONTACTS
         ===================================================== -->

    <script>

        /**
         * ====================================================
         * GPA MESSENGER
         * MODULE 5
         * LOAD CONTACTS
         * ====================================================
         */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadMessengerContacts();

            }
        );


        async function loadMessengerContacts() {

            const contactsContainer =
                document.getElementById(
                    "gpaMessengerContacts"
                );


            // =================================================
            // GET EXISTING ACADEMY LOGIN TOKEN
            // =================================================

           
const token =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");



            if (!token) {

                

                contactsContainer.innerHTML = `
                    <div class="gpa-messenger-contacts-error">
                        Login required.
                    </div>
                `;

                console.error(
                    "[GPA MESSENGER CONTACTS] " +
                    "No login token found."
                );

                return;

            }


            try {

                // =============================================
                // CALL CONTACTS API
                // =============================================

                const response =
                    await fetch(
                        "https://academy-backend-eatl.onrender.com/api/messenger/contacts",
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "[GPA MESSENGER CONTACTS]",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load contacts."
                    );

                }


                // =============================================
                // DISPLAY CONTACTS
                // =============================================

                displayMessengerContacts(
                    data.contacts || []
                );


            } catch (error) {

                console.error(
                    "[GPA MESSENGER CONTACTS] " +
                    "Failed:",
                    error
                );


                contactsContainer.innerHTML = `

                    <div
                        class="gpa-messenger-contacts-error"
                    >
                        Unable to load contacts.
                    </div>

                `;

            }

        }


        function displayMessengerContacts(
    contacts
) {

    const contactsContainer =
        document.getElementById(
            "gpaMessengerContacts"
        );


    if (!contacts || contacts.length === 0) {

        contactsContainer.innerHTML = `

            <div
                class="gpa-messenger-contacts-loading"
            >
                No contacts found.
            </div>

        `;

        return;

    }


    // =====================================================
    // SEPARATE CONTACTS BY ROLE
    // =====================================================

    const founders =
    contacts.filter(
        contact =>
            contact.role === "founder"
    );

const students =
    contacts.filter(
        contact =>
            contact.role === "student"
    );

const teachers =
    contacts.filter(
        contact =>
            contact.role === "teacher"
    );

const admins =
    contacts.filter(
        contact =>
            contact.role === "admin"
    );

const parents =
    contacts.filter(
        contact =>
            contact.role === "parent"
    );


    // =====================================================
    // CREATE CONTACT SECTION
    // =====================================================

    function createContactSection(
        title,
        contactList
    ) {

        if (
            !contactList ||
            contactList.length === 0
        ) {

            return "";

        }


        let html = `

            <div
                class="gpa-messenger-contact-section"
            >

                <div
                    class="gpa-messenger-contact-section-title"
                >
                    ${title}
                </div>

        `;


        contactList.forEach(
            function (contact) {

                html += `

    <div
        class="gpa-messenger-contact"
        data-contact-id="${contact._id}"
        onclick="selectMessengerContact('${contact._id}')"
    >

        <div
            class="gpa-messenger-contact-name"
        >
            ${escapeMessengerText(
                contact.name ||
                "Unknown"
            )}
        </div>


        <div
            class="gpa-messenger-contact-info"
        >
            ${escapeMessengerText(
                contact.email ||
                ""
            )}
        </div>

    </div>

`;

            }
        );


        html += `

            </div>

        `;


        return html;

    }


    // =====================================================
    // DISPLAY SEPARATE ROLE SECTIONS
    // =====================================================

    window.GPAMessengerContacts =
    contacts;


    contactsContainer.innerHTML =

    createContactSection(
        "👑 FOUNDER",
        founders
    )

    +

    createContactSection(
        "👨‍🎓 STUDENTS",
        students
    )

    +

    createContactSection(
        "👨‍🏫 TEACHERS",
        teachers
    )

    +

    createContactSection(
        "👨‍💼 ADMINS",
        admins
    )

    +

    createContactSection(
        "👨‍👩‍👧 PARENTS",
        parents
    );

}

// =====================================================
// MODULE 5
// STEP 7
// SELECT CONTACT
// =====================================================

let selectedMessengerContact = null;


async function selectMessengerContact(
    contactId
) {

    console.log(
        "[GPA MESSENGER] Contact selected:",
        contactId
    );


    // =================================================
    // REMOVE PREVIOUS SELECTION
    // =================================================

    const allContacts =
        document.querySelectorAll(
            ".gpa-messenger-contact"
        );


    allContacts.forEach(
        function (contactElement) {

            contactElement.classList.remove(
                "selected"
            );

        }
    );


    // =================================================
    // SELECT CLICKED CONTACT
    // =================================================

    const selectedElement =
        document.querySelector(
            `.gpa-messenger-contact[data-contact-id="${contactId}"]`
        );


    if (selectedElement) {

        selectedElement.classList.add(
            "selected"
        );

    }


    // =================================================
    // FIND CONTACT DATA
    // =================================================

   
const token =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");



    // Contacts are stored from the API response.
    // Find the selected contact from the displayed list.

    if (
        window.GPAMessengerContacts &&
        Array.isArray(
            window.GPAMessengerContacts
        )
    ) {

        selectedMessengerContact =
            window.GPAMessengerContacts.find(
                function (contact) {

                    return (
                        String(contact._id) ===
                        String(contactId)
                    );

                }
            );

    }


    console.log(
        "[GPA MESSENGER] Selected contact:",
        selectedMessengerContact
    );

        // =================================================
    // MODULE 5
    // STEP 8
    // LOAD / CREATE CONVERSATION
    // =================================================

    if (!selectedMessengerContact) {

        console.error(
            "[GPA MESSENGER] No contact selected."
        );

        return;

    }


    const conversationToken =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");



    if (!conversationToken) {

        console.error(
            "[GPA MESSENGER] Login token not found."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "https://academy-backend-eatl.onrender.com/api/messenger/conversation",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            conversationToken
                    },

                    body: JSON.stringify({

                        receiverId:
                            selectedMessengerContact._id

                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "[GPA MESSENGER] Conversation response:",
            data
        );


        if (
    data.success &&
    data.conversation
) {

    window.GPAMessengerConversation =
        data.conversation;

    // =================================================
    // STEP 10
    // STORE CURRENT CONVERSATION DETAILS
    // =================================================

    window.GPAMessengerConversationId =
        data.conversation._id;

    window.GPAMessengerReceiverId =
        selectedMessengerContact._id;

    console.log(
        "[GPA MESSENGER] Conversation ID:",
        window.GPAMessengerConversationId
    );

    console.log(
        "[GPA MESSENGER] Receiver ID:",
        window.GPAMessengerReceiverId
    );


    // =================================================
    // STEP 11
    // LOAD SELECTED CONVERSATION HISTORY
    // =================================================

    const conversationContainer =
        document.getElementById(
            "gpaPrimaryConversation"
        );

    if (window.GPAPrimaryUserChat && typeof window.GPAPrimaryUserChat.clearConversation === "function") {
        window.GPAPrimaryUserChat.clearConversation();
    } else if (conversationContainer) {
        conversationContainer.innerHTML = "";
    }

    if (
        window.GPAPrimaryUserSocket &&
        typeof window.GPAPrimaryUserSocket
            .loadConversationHistory ===
            "function"
    ) {

        window.GPAPrimaryUserSocket
            .loadConversationHistory(
                window.GPAMessengerConversationId
            );

    }

    
    if (
        window.GPAPrimaryUserSocket &&
        typeof window.GPAPrimaryUserSocket.requestContactPresence === "function"
    ) {
        window.GPAPrimaryUserSocket.requestContactPresence(
            selectedMessengerContact._id
        );
    }



} else {

    console.error(
        "[GPA MESSENGER] Conversation failed:",
        data
    );

}

    } catch (error) {

        console.error(
            "[GPA MESSENGER] Conversation API error:",
            error
        );

    }


    // =================================================
    // UPDATE CHAT HEADER
    // =================================================

    const header =
        document.querySelector(
            ".gpa-primary-messenger-header"
        );


    if (
    header &&
    selectedMessengerContact
) {
    const nameElement = document.getElementById(
        "gpaMessengerContactName"
    );

    if (nameElement) {
        nameElement.textContent =
            selectedMessengerContact.name || "Unknown";
    }

    if (
        typeof window.updateGPAMessengerPresenceDisplay ===
        "function"
    ) {
        window.updateGPAMessengerPresenceDisplay(
            selectedMessengerContact._id
        );
    }
}

}
        

function escapeMessengerText(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }

        // ================================================
// GPA MESSENGER - ONLINE / LAST SEEN DISPLAY
// ================================================

window.updateGPAMessengerPresenceDisplay = function (contactId) {
    const statusElement = document.getElementById(
        "gpaMessengerPresenceStatus"
    );

    if (!statusElement) return;

    const presence = window.GPAMessengerPresence || {};
    const contactPresence = presence[String(contactId)];

    statusElement.classList.remove("online");

    if (!contactPresence) {
        statusElement.textContent = "";
        return;
    }

    if (contactPresence.isOnline) {
        statusElement.textContent = "● Online";
        statusElement.classList.add("online");
        return;
    }

    if (contactPresence.lastSeenAt) {
        const lastSeenDate = new Date(
            contactPresence.lastSeenAt
        );

        if (!Number.isNaN(lastSeenDate.getTime())) {
            statusElement.textContent =
                "Last seen " +
                lastSeenDate.toLocaleString([], {
                    day: "2-digit",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit"
                });

            return;
        }
    }

    statusElement.textContent = "Offline";
};


// Refresh the selected contact's status when a socket update arrives.
window.addEventListener(
    "gpa:primary:presence:update",
    function (event) {
        const selectedId =
            window.GPAMessengerReceiverId;

        if (
            selectedId &&
            event.detail &&
            String(event.detail.userId) === String(selectedId)
        ) {
            window.updateGPAMessengerPresenceDisplay(
                selectedId
            );
        }
    }
);

    </script>

            authDomain: "gopes-pinnacle-academy.firebaseapp.com",
            projectId: "gopes-pinnacle-academy",
            storageBucket: "gopes-pinnacle-academy.firebasestorage.app",
            messagingSenderId: "445901611941",
            appId: "1:445901611941:web:0f595217e4780839fb3e4c"

        if (!firebase.apps.length) {

        const permission = await Notification.requestPermission();

        const vapidKey = "BI6SwaAVxhppd01Rt8EKJGV4Gl8qQ55irUIsvSX4FGirZ5FbvyB800fyQDYQxy0KqVYKExn43I5vIiky2_XTThU";

        const token = await messaging.getToken({

        if (!token) {

const authToken =

if (!authToken) {

}


        
const response = await fetch(
