<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Dashboard - Gopes Pinnacle Academy</title>

<link
    rel="stylesheet"
    href="style.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

/* =========================================================
   ADMIN DASHBOARD
========================================================= */

.admin-dashboard-page{

    margin:0;

    min-height:100vh;

    background:#f4f7fb;

    font-family:'Segoe UI', sans-serif;

}


/* ================= HEADER ================= */

.admin-header{

    background:#0d1b2a;

    color:white;

    padding:15px 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

}


.admin-header-left{

    display:flex;

    align-items:center;

    gap:15px;

}


.admin-header-left img{

    height:50px;

    width:auto;

}


.admin-header-title{

    font-size:20px;

    font-weight:600;

}


.admin-header-right{

    display:flex;

    align-items:center;

    gap:15px;

}


.admin-name{

    font-size:14px;

    opacity:.9;

}


/* ================= LOGOUT ================= */

.logout-btn{

    border:none;

    background:#dc3545;

    color:white;

    padding:9px 15px;

    border-radius:6px;

    cursor:pointer;

    font-weight:600;

}

.logout-btn:hover{

    background:#bb2d3b;

}


/* ================= MAIN ================= */

.admin-main{

    max-width:1200px;

    margin:0 auto;

    padding:45px 25px;

}


.admin-welcome{

    margin-bottom:30px;

}


.admin-welcome h1{

    color:#0d1b2a;

    margin-bottom:8px;

}


.admin-welcome p{

    color:#666;

}


/* ================= CARDS ================= */

.admin-cards{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(260px,1fr));

    gap:25px;

}


.admin-card{

    background:white;

    border-radius:12px;

    padding:30px;

    min-height:150px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.08);

    cursor:pointer;

    transition:.25s;

}


.admin-card:hover{

    transform:translateY(-4px);

    box-shadow:
        0 12px 25px rgba(0,0,0,.12);

}


.admin-card-icon{

    width:55px;

    height:55px;

    border-radius:12px;

    background:#0d1b2a;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    margin-bottom:18px;

}


.admin-card h2{

    margin:0 0 8px 0;

    color:#0d1b2a;

    font-size:20px;

}


.admin-card p{

    margin:0;

    color:#666;

    line-height:1.5;

}


/* ================= MOBILE ================= */

@media(max-width:768px){

    .admin-header{

        padding:12px 15px;

    }


    .admin-header-left img{

        height:42px;

    }


    .admin-header-title{

        font-size:16px;

    }


    .admin-name{

        display:none;

    }


    .admin-main{

        padding:30px 15px;

    }


    .admin-welcome h1{

        font-size:26px;

    }


    .admin-cards{

        grid-template-columns:1fr;

    }


    .admin-card{

        padding:25px;

    }

}

</style>

</head>


<body class="admin-dashboard-page">


<!-- =========================================================
     HEADER
========================================================= -->

<header class="admin-header">


    <div class="admin-header-left">

        <img
            src="images/logo.png"
            alt="Gopes Pinnacle Academy"
        >

        <div class="admin-header-title">
            Admin Dashboard
        </div>

    </div>


    <div class="admin-header-right">

        <span
            class="admin-name"
            id="adminName"
        >
            Admin
        </span>


        <button
            class="logout-btn"
            onclick="logout()"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</header>



<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="admin-main">


    <div class="admin-welcome">

        <h1>
            Welcome Admin
        </h1>

        <p>
            Manage your Gopes Pinnacle Academy services.
        </p>

    </div>



    <!-- =====================================================
         ADMIN CARDS
    ====================================================== -->

    <div class="admin-cards">


        <!-- GPA MESSENGER -->

        <div
            class="admin-card"
            onclick="openMessenger()"
        >

            <div class="admin-card-icon">

                <i class="fa-solid fa-comments"></i>

            </div>


            <h2>
                GPA Messenger
            </h2>


            <p>
                Chat with Teachers and Students
                and use voice calling.
            </p>

        </div>



        <!-- MY PROFILE -->

        <div
            class="admin-card"
            onclick="openProfile()"
        >

            <div class="admin-card-icon">

                <i class="fa-solid fa-user"></i>

            </div>


            <h2>
                My Profile
            </h2>


            <p>
                View your Admin profile and
                account information.
            </p>

        </div>


    </div>

</main>



<script>

/* =========================================================
   CHECK ADMIN LOGIN
========================================================= */

const token =
    localStorage.getItem("token");


const role =
    localStorage.getItem("role");


if(!token || role !== "admin"){

    window.location.href =
        "admin-login.html";

}


/* =========================================================
   LOAD ADMIN INFORMATION
========================================================= */

async function loadAdminProfile(){

    try{

        const response =
            await fetch(
                "https://academy-backend-eatl.onrender.com/api/messenger/me",
                {
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(!response.ok){

            return;

        }


        const data =
            await response.json();


        console.log(
            "ADMIN PROFILE:",
            data
        );


        /*
         * The Messenger /me response contains
         * the authenticated user information.
         *
         * We only use the name here.
         */

        if(data.user){

            document.getElementById(
                "adminName"
            ).innerText =
                data.user.name ||
                "Admin";

        }

    }
    catch(error){

        console.log(
            "ADMIN PROFILE ERROR:",
            error
        );

    }

}


loadAdminProfile();


/* =========================================================
   GPA MESSENGER
========================================================= */

function openMessenger(){

    window.location.href =
        "gpa-messenger.html";

}


/* =========================================================
   MY PROFILE
========================================================= */

function openProfile(){

    alert(
        "Admin Profile will be added next."
    );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

    localStorage.removeItem("token");

    localStorage.removeItem("role");

    localStorage.removeItem("user");

    window.location.href =
        "admin-login.html";

}

</script>


</body>

</html>
