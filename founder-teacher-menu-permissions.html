<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Teacher Menu Permissions</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

.permission-card{

max-width:900px;

margin:30px auto;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 2px 10px rgba(0,0,0,.15);

}

.permission-row{

display:flex;

justify-content:space-between;

align-items:center;

padding:15px 0;

border-bottom:1px solid #eee;

font-size:18px;

}

.permission-row:last-child{

border-bottom:none;

}

.save-btn{

margin-top:30px;

padding:12px 35px;

background:#0d6efd;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

font-size:18px;

}

</style>

</head>

<body class="dashboard-page">

<div id="sidebar-container"></div>

<script>

fetch("sidebar.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML=data;

});

</script>

<div class="main-content">

<div class="permission-card">

<h2 id="teacherName">

Loading...

</h2>

<hr>

<div id="permissionList">

</div>

<button
class="save-btn">

Save Permissions

</button>

</div>

</div>

<script src="assets/js/founder/teacherMenuPermissions.js"></script>

</body>

</html>
