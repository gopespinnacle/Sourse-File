<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse Demo Classes | Gopes Pinnacle Academy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
color:#0d1b2a;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:30px;
}

.gradeGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.gradeCard{
background:white;
padding:22px;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 3px 10px rgba(0,0,0,.08);
transition:.2s;
}

.gradeCard:hover{
background:#0d6efd;
color:white;
transform:translateY(-4px);
}

.backBtn{
margin-bottom:25px;
padding:10px 20px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<button class="backBtn" onclick="history.back()">← Back</button>

<h1>🎥 Browse Demo Classes</h1>

<p>Select your grade to view available demo subjects.</p>

<div class="gradeGrid" id="gradeGrid"></div>

</div>

<script>

const grades=[];

for(let i=1;i<=12;i++){
grades.push("Grade " + i);
}

const gradeGrid=document.getElementById("gradeGrid");

grades.forEach(grade=>{

const card=document.createElement("div");

card.className="gradeCard";

card.innerHTML=grade;

card.onclick=()=>{

window.location.href=
`demo-subjects.html?grade=${encodeURIComponent(grade)}`;

};

gradeGrid.appendChild(card);

});

</script>

</body>
</html>
