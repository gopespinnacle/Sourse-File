<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gopes Pinnacle Academy - Virtual Classroom
    </title>


    <!-- =====================================================
         SOCKET.IO
         ===================================================== -->

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


    <!-- =====================================================
         BASIC CLASSROOM STYLE
         ===================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /* =====================================================
           CLASSROOM
           ===================================================== */

        #classroom {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        #topBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            background: #1f2937;

            border-bottom:
                1px solid #374151;

        }


        #academyTitle {

            font-size: 18px;

            font-weight: 600;

        }


        #meetingInfo {

            display: flex;

            align-items: center;

            gap: 18px;

            font-size: 14px;

        }


        /* =====================================================
           ROLE
           ===================================================== */

        #userRole {

            font-weight: 600;

        }


        /* =====================================================
           CONNECTION STATUS
           ===================================================== */

        #connectionStatus {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        #connectionDot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #f59e0b;

        }


        #connectionText {

            color: #d1d5db;

        }


        /* =====================================================
           MAIN AREA
           ===================================================== */

        #mainArea {

            flex: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        #welcomeMessage {

            text-align: center;

            color: #d1d5db;

        }


        #welcomeMessage h2 {

            margin: 0 0 10px 0;

            font-size: 26px;

        }


        #welcomeMessage p {

            margin: 7px 0;

            font-size: 14px;

        }


        /* =====================================================
           PARTICIPANT CAPACITY
           ===================================================== */

        #capacityInfo {

            margin-top: 18px;

            padding: 10px 16px;

            border-radius: 8px;

            background: #1f2937;

            color: #9ca3af;

            font-size: 13px;

        }


        /* =====================================================
           BOTTOM BAR
           ===================================================== */

        #bottomBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #1f2937;

            border-top:
                1px solid #374151;

        }


        #systemStatus {

            font-size: 13px;

            color: #9ca3af;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            #topBar {

                height: auto;

                min-height: 60px;

                padding: 10px 12px;

                gap: 10px;

            }


            #academyTitle {

                font-size: 14px;

            }


            #meetingInfo {

                gap: 8px;

                font-size: 11px;

            }


            #welcomeMessage h2 {

                font-size: 21px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CLASSROOM
         ===================================================== -->

    <div id="classroom">


        <!-- =================================================
             TOP BAR
             ================================================= -->

        <header id="topBar">


            <div id="academyTitle">

                GOPES PINNACLE ACADEMY

            </div>


            <div id="meetingInfo">


                <div>

                    Room:

                    <strong id="roomName">
                        -
                    </strong>

                </div>


                <div>

                    Role:

                    <strong id="userRole">
                        -
                    </strong>

                </div>


                <div id="connectionStatus">

                    <span id="connectionDot"></span>

                    <span id="connectionText">
                        Connecting...
                    </span>

                </div>


            </div>

        </header>


        <!-- =================================================
             MAIN AREA
             ================================================= -->

        <main id="mainArea">


            <div id="welcomeMessage">


                <h2>
                    Virtual Classroom
                </h2>


                <p>
                    Gopes Pinnacle Academy
                </p>


                <p id="systemStatus">
                    Connecting to classroom server...
                </p>


                <div id="capacityInfo">

                    Maximum Classroom Capacity:
                    <strong>
                        1 Founder + 2 Teachers + 10 Students
                    </strong>

                    <br>

                    <span>
                        Maximum 13 participants
                    </span>

                </div>


            </div>


        </main>


        <!-- =================================================
             BOTTOM BAR
             ================================================= -->

        <footer id="bottomBar">

            <div id="systemStatusFooter">

                Gopes Pinnacle Academy

            </div>

        </footer>


    </div>


    <!-- =====================================================
         NEW MEETING FRONTEND
         PHASE 1
         ===================================================== -->

    <script>

        /*
        ========================================================
        GOPES PINNACLE ACADEMY
        VIRTUAL CLASSROOM
        ========================================================

        PHASE 1

        This module currently handles ONLY:

        1. Server connection
        2. Room information
        3. User role
        4. Socket connection status

        NOT YET IMPLEMENTED:

        - WebRTC
        - Camera
        - Microphone
        - Participants
        - Whiteboard
        - PDF
        - Screen sharing
        - Chat
        - Recording
        - Attendance

        ========================================================
        */


        /* =====================================================
           SERVER
           ===================================================== */

        const SERVER_URL =
            "https://academy-backend-eatl.onrender.com";


        /* =====================================================
           MAXIMUM CLASSROOM CAPACITY
           ===================================================== */

        const MAX_FOUNDERS = 1;

        const MAX_TEACHERS = 2;

        const MAX_STUDENTS = 10;

        const MAX_PARTICIPANTS =
            MAX_FOUNDERS +
            MAX_TEACHERS +
            MAX_STUDENTS;


        /* =====================================================
           READ URL PARAMETERS
           ===================================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        /* =====================================================
           ROOM
           ===================================================== */

        const meetingRoom =
            urlParams.get("room") ||
            localStorage.getItem("meetingRoom") ||
            "";


        /* =====================================================
           ROLE
           ===================================================== */

        const meetingRole =
            (
                urlParams.get("role") ||
                localStorage.getItem("meetingRole") ||
                ""
            ).toLowerCase();


        /* =====================================================
           USER ID
           ===================================================== */

        const meetingUserId =
            urlParams.get("userId") ||
            localStorage.getItem("meetingUserId") ||
            "";


        /* =====================================================
           USER NAME
           ===================================================== */

        const meetingUserName =
            urlParams.get("name") ||
            localStorage.getItem("meetingUserName") ||
            "";


        /* =====================================================
           VALID ROLES
           ===================================================== */

        const VALID_ROLES = [
            "founder",
            "teacher",
            "student"
        ];


        /* =====================================================
           ROLE VALIDATION
           ===================================================== */

        if (
            meetingRole &&
            !VALID_ROLES.includes(meetingRole)
        ) {

            console.warn(
                "Unknown meeting role:",
                meetingRole
            );

        }


        /* =====================================================
           DISPLAY ROOM
           ===================================================== */

        document.getElementById(
            "roomName"
        ).textContent =
            meetingRoom || "Not specified";


        /* =====================================================
           DISPLAY ROLE
           ===================================================== */

        document.getElementById(
            "userRole"
        ).textContent =
            meetingRole || "Not specified";


        /* =====================================================
           DEBUG INFORMATION
           ===================================================== */

        console.log(
            "=========================================="
        );

        console.log(
            "GOPES PINNACLE ACADEMY"
        );

        console.log(
            "NEW VIRTUAL CLASSROOM"
        );

        console.log(
            "PHASE 1"
        );

        console.log(
            "=========================================="
        );

        console.log(
            "Server:",
            SERVER_URL
        );

        console.log(
            "Room:",
            meetingRoom
        );

        console.log(
            "Role:",
            meetingRole
        );

        console.log(
            "User ID:",
            meetingUserId
        );

        console.log(
            "User Name:",
            meetingUserName
        );

        console.log(
            "Maximum Participants:",
            MAX_PARTICIPANTS
        );

        console.log(
            "=========================================="
        );


        /* =====================================================
           SOCKET.IO CONNECTION
           ===================================================== */

        const socket =
            io(
                SERVER_URL,
                {

                    transports: [
                        "websocket",
                        "polling"
                    ],

                    reconnection: true,

                    reconnectionAttempts: Infinity,

                    reconnectionDelay: 1000

                }
            );


            /* =====================================================
   JOIN MEETING ROOM
   ===================================================== */

function joinMeetingRoom() {

    /*
    -----------------------------------------------------
    BASIC ROOM CHECK
    -----------------------------------------------------
    */

    if (!meetingRoom) {

        console.error(
            "Cannot join meeting: room is missing."
        );

        document.getElementById(
            "systemStatus"
        ).textContent =
            "Meeting room is missing.";

        return;

    }


    /*
    -----------------------------------------------------
    ROLE CHECK
    -----------------------------------------------------
    */

    if (
        !VALID_ROLES.includes(
            meetingRole
        )
    ) {

        console.error(
            "Cannot join meeting: invalid role.",
            meetingRole
        );

        document.getElementById(
            "systemStatus"
        ).textContent =
            "Invalid meeting role.";

        return;

    }


    /*
    -----------------------------------------------------
    NAME

    For now we read the name from:

    1. URL ?name=
    2. localStorage meetingUserName

    We do NOT invent a real user name.
    -----------------------------------------------------
    */

    const participantName =
        meetingUserName;


    /*
    -----------------------------------------------------
    NAME CHECK
    -----------------------------------------------------
    */

    if (!participantName) {

        console.error(
            "Cannot join meeting: participant name is missing."
        );

        document.getElementById(
            "systemStatus"
        ).textContent =
            "Participant name is missing.";

        return;

    }


    /*
    -----------------------------------------------------
    BUILD JOIN DATA
    -----------------------------------------------------
    */

    const joinData = {

        room:
            meetingRoom,

        role:
            meetingRole,

        name:
            participantName,

        userId:
            meetingUserId || null,

        studentId:
            meetingRole === "student"
                ? (
                    localStorage.getItem(
                        "studentId"
                    ) ||
                    null
                )
                : null,

        periodId:
            urlParams.get("periodId") ||
            null

    };


    /*
    -----------------------------------------------------
    DEBUG
    -----------------------------------------------------
    */

    console.log(
        "=========================================="
    );

    console.log(
        "JOINING MEETING ROOM"
    );

    console.log(
        "=========================================="
    );

    console.log(
        "Room:",
        joinData.room
    );

    console.log(
        "Role:",
        joinData.role
    );

    console.log(
        "Name:",
        joinData.name
    );

    console.log(
        "User ID:",
        joinData.userId
    );

    console.log(
        "Student ID:",
        joinData.studentId
    );

    console.log(
        "Period ID:",
        joinData.periodId
    );

    console.log(
        "=========================================="
    );


    /*
    -----------------------------------------------------
    SEND JOIN REQUEST
    -----------------------------------------------------
    */

    socket.emit(
        "joinRoom",
        joinData
    );


    /*
    -----------------------------------------------------
    UI
    -----------------------------------------------------
    */

    document.getElementById(
        "systemStatus"
    ).textContent =
        "Joining classroom...";

}


        /* =====================================================
           SOCKET CONNECT
           ===================================================== */

        socket.on(
            "connect",
            () => {

                console.log(
                    "=========================================="
                );

                console.log(
                    "SOCKET CONNECTED"
                );

                console.log(
                    "Socket ID:",
                    socket.id
                );

                console.log(
                    "=========================================="
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#22c55e";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Connected";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Connected to classroom server";


              /*
==================================================
JOIN MEETING ROOM
==================================================
*/

joinMeetingRoom();

            }
        );


        /* =====================================================
   JOIN ACCEPTED
   ===================================================== */

socket.on(
    "joinAccepted",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "JOIN ACCEPTED"
        );

        console.log(
            data
        );

        console.log(
            "=========================================="
        );


        document.getElementById(
            "systemStatus"
        ).textContent =
            "You have joined the classroom.";


        /*
        -------------------------------------------------
        SAVE CURRENT SOCKET ID
        -------------------------------------------------
        */

        window.MeetingConfig.socketId =
            data.socketId;


        /*
        -------------------------------------------------
        SAVE JOIN STATE
        -------------------------------------------------
        */

        window.MeetingConfig.joined =
            true;


        /*
        -------------------------------------------------
        SAVE SERVER CAPACITY
        -------------------------------------------------
        */

        window.MeetingConfig.maxParticipants =
            data.maxParticipants;


        window.MeetingConfig.maxFounders =
            data.maxFounders;


        window.MeetingConfig.maxTeachers =
            data.maxTeachers;


        window.MeetingConfig.maxStudents =
            data.maxStudents;


        console.log(
            "MeetingConfig updated:",
            window.MeetingConfig
        );

    }
);

/* =====================================================
   JOIN REJECTED
   ===================================================== */

socket.on(
    "joinRejected",
    (data) => {

        console.error(
            "=========================================="
        );

        console.error(
            "JOIN REJECTED"
        );

        console.error(
            data
        );

        console.error(
            "=========================================="
        );


        document.getElementById(
            "connectionDot"
        ).style.background =
            "#ef4444";


        document.getElementById(
            "connectionText"
        ).textContent =
            "Join rejected";


        document.getElementById(
            "systemStatus"
        ).textContent =
            data.reason ||
            "Unable to join classroom.";

    }
);

/* =====================================================
   PARTICIPANT LIST
   ===================================================== */

socket.on(
    "participantList",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "EXISTING PARTICIPANTS"
        );

        console.log(
            data.participants
        );

        console.log(
            "=========================================="
        );


        window.MeetingConfig.participants =
            data.participants || [];


        console.log(
            "Current participant count:",
            window.MeetingConfig
                .participants
                .length
        );

    }
);

/* =====================================================
   PARTICIPANT JOINED
   ===================================================== */

socket.on(
    "participantJoined",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "NEW PARTICIPANT JOINED"
        );

        console.log(
            data.participant
        );

        console.log(
            "=========================================="
        );


        const participant =
            data.participant;


        if (!participant) {
            return;
        }


        if (
            !window.MeetingConfig.participants
        ) {

            window.MeetingConfig.participants =
                [];

        }


        /*
        -------------------------------------------------
        AVOID DUPLICATES
        -------------------------------------------------
        */

        const alreadyExists =
            window.MeetingConfig.participants
                .some(
                    existing =>
                        existing.socketId ===
                        participant.socketId
                );


        if (!alreadyExists) {

            window.MeetingConfig.participants
                .push(
                    participant
                );

        }


        console.log(
            "Current participants:",
            window.MeetingConfig.participants
        );

    }
);

/* =====================================================
   ROOM PARTICIPANTS
   ===================================================== */

socket.on(
    "roomParticipants",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "ROOM PARTICIPANTS"
        );

        console.log(
            data
        );

        console.log(
            "=========================================="
        );


        window.MeetingConfig.participants =
            data.participants || [];


        window.MeetingConfig.counts =
            data.counts || {};


        window.MeetingConfig.capacity =
            data.capacity || {};


        console.log(
            "Founder:",
            data.counts?.founder
        );

        console.log(
            "Teachers:",
            data.counts?.teachers
        );

        console.log(
            "Students:",
            data.counts?.students
        );

        console.log(
            "Total:",
            data.counts?.total
        );

    }
);


        /* =====================================================
           SOCKET DISCONNECT
           ===================================================== */

        socket.on(
            "disconnect",
            (reason) => {

                console.warn(
                    "SOCKET DISCONNECTED:",
                    reason
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#ef4444";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Disconnected";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Connection lost";

            }
        );


        /* =====================================================
           CONNECTION ERROR
           ===================================================== */

        socket.on(
            "connect_error",
            (error) => {

                console.error(
                    "SOCKET CONNECTION ERROR:",
                    error
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#ef4444";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Connection Error";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Unable to connect to classroom server";

            }
        );


        /* =====================================================
           RECONNECT ATTEMPT
           ===================================================== */

        socket.io.on(
            "reconnect_attempt",
            (attempt) => {

                console.log(
                    "RECONNECT ATTEMPT:",
                    attempt
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#f59e0b";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Reconnecting...";

            }
        );


        /* =====================================================
           RECONNECTED
           ===================================================== */

        socket.io.on(
            "reconnect",
            (attempt) => {

                console.log(
                    "SOCKET RECONNECTED:",
                    attempt
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#22c55e";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Connected";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Connection restored";

            }
        );


        /* =====================================================
           GLOBAL MEETING OBJECT
           ===================================================== */

        window.MeetingConfig = {

            serverURL:
                SERVER_URL,

            room:
                meetingRoom,

            role:
                meetingRole,

            userId:
                meetingUserId,

            userName:
                meetingUserName,

            maxFounders:
                MAX_FOUNDERS,

            maxTeachers:
                MAX_TEACHERS,

            maxStudents:
                MAX_STUDENTS,

            maxParticipants:
                MAX_PARTICIPANTS

        };


        /* =====================================================
           GLOBAL SOCKET
           ===================================================== */

        window.MeetingSocket =
            socket;


        console.log(
            "MeetingConfig:",
            window.MeetingConfig
        );

    </script>


</body>

</html>
