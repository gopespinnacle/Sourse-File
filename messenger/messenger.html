<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPA Messenger</title>


    <!-- =====================================================
         MODULE 1 CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="chat/primaryUserChat.css"
    >

</head>


<body>


    <!-- =====================================================
         GPA MESSENGER
         MODULE 1
         PRIMARY USER
         ===================================================== -->

    <div class="gpa-primary-messenger">


        <!-- =================================================
             HEADER
             ================================================= -->

        <div
            class="gpa-primary-messenger-header"
        >

            GPA Messenger

        </div>


        <!-- =================================================
             CONVERSATION
             ================================================= -->

        <div
            id="gpaPrimaryConversation"
        ></div>


        <!-- =================================================
             COMPOSER
             ================================================= -->

        <div
            class="gpa-primary-composer"
        >


            <textarea
                id="gpaPrimaryMessageInput"
                placeholder="Type a message..."
                rows="1"
            ></textarea>


            <button
                id="gpaPrimarySendButton"
                type="button"
            >
                Send
            </button>


        </div>


    </div>


    <!-- =====================================================
         MODULE 1 JAVASCRIPT
         ===================================================== -->

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="chat/primaryUserChatSocket.js"></script>

<script src="chat/primaryUserChat.js"></script>


</body>

</html>
