function convertToMinutes(time){

    // normalize
    time = time.trim();

    // handle AM/PM
    if (time.includes("AM") || time.includes("PM")) {
        let [t, modifier] = time.split(" ");
        let [h, m] = t.split(":").map(Number);

        if (modifier === "PM" && h !== 12) h += 12;
        if (modifier === "AM" && h === 12) h = 0;

        return h * 60 + m;
    }

    // handle 24h
    let [h, m] = time.split(":").map(Number);
    return h * 60 + m;
}

function convertTo12Hour(time){

let [hours, minutes] = time.split(":");

hours = parseInt(hours);

let ampm = hours >= 12 ? "PM" : "AM";

hours = hours % 12;

hours = hours ? hours : 12;

return hours.toString().padStart(2,'0') + ":" + minutes + " " + ampm;

}

    const teacher = teachers.find(
        t => t._id === schedule.teacher._id

    return teacher ? (teacher.teacherId || "-") : "-";
}

function applyScheduleFilters() {

    const teacherId =

    const day =
        document.getElementById("filterDay").value;

    const classSearch =
        document.getElementById("filterClass").value
        .trim()
        .toLowerCase();


    const filteredSchedules = allSchedules.filter(s => {

        // -----------------------------
        // TEACHER FILTER
        // -----------------------------
        if (teacherId !== "all") {

            if (
                !s.teacher ||
                s.teacher._id !== teacherId
            ) {
                return false;
            }
        }


        // -----------------------------
        // DAY FILTER
        // -----------------------------
        if (day !== "all") {

            if (s.day !== day) {
                return false;
            }
        }


        // -----------------------------
        // CLASS FILTER
        // -----------------------------
        if (classSearch !== "all") {

    if (s.className !== classSearch) {
        return false;
    }
}


        return true;
    });


       renderScheduleTable(filteredSchedules);
}

function buildGrid(schedules){

const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

// SORT
schedules.sort((a, b) => a.startTime.localeCompare(b.startTime));

// HOURS
const hours = [...new Set(
    schedules.map(s => `${s.startTime}-${s.endTime}`)
)];

// ✅ FIRST define
const thead = document.querySelector("#gridTable thead tr");
const tbody = document.querySelector("#gridTable tbody");

// ✅ THEN use
thead.innerHTML = "<th>Day</th>";

hours.forEach(hour => {
    thead.innerHTML += `<th>${hour}</th>`;
});

tbody.innerHTML = "";

days.forEach(day=>{

let row = `<tr><td><b>${day}</b></td>`;

hours.forEach(hour=>{

const found = schedules.find(s => {
return s.day === day && `${s.startTime}-${s.endTime}` === hour;
});

if(found){

row += `<td>
<button
class="class-block ${[String(found.subject || ""), String(found.eca || ""), String(found.language || "")]
    .join(" ")
    .toLowerCase()}"
onclick="openPeriod('${found._id}')">
${found.className}<br>
${found.subject || found.eca || found.language}<br>
${convertTo12Hour(found.startTime)} - ${convertTo12Hour(found.endTime)}
</button>
</td>`;

}else{

row += `<td></td>`;

}

});

row += "</tr>";

tbody.innerHTML += row;

});

}

let currentEditId = null;

function editSchedule(id) {
    const schedule = allSchedules.find(s => s._id === id);

    if (!schedule) {
        alert("Schedule not found. Please refresh the page.");
        return;
    }

    currentEditId = id;

    const teacherSelect = document.getElementById("editTeacher");
    teacherSelect.innerHTML = "";

    teachers.forEach(t => {
        const option = document.createElement("option");
        option.value = t._id;
        option.textContent = t.name + " - " + t.teacherId;
        teacherSelect.appendChild(option);
    });

    const selectedTeacherId = schedule.teacher?._id || schedule.teacher;
    teacherSelect.value = selectedTeacherId || "";

    document.getElementById("editDay").value = schedule.day || "Monday";
    document.getElementById("editClass").value = schedule.className || "";
    document.getElementById("editStart").value = schedule.startTime || "";
    document.getElementById("editEnd").value = schedule.endTime || "";

    populateEditOptions(schedule, selectedTeacherId);

    document.getElementById("editSchedulePopup").style.display = "flex";
}

function populateEditOptions(schedule, teacherId) {
    const teacher = teachers.find(t => t._id === teacherId);

    const fields = [
        { id: "editSubject", values: teacher?.subject || [], selected: schedule.subject },
        { id: "editEca", values: teacher?.eca || [], selected: schedule.eca },
        { id: "editLanguage", values: teacher?.language || [], selected: schedule.language }
    ];

    fields.forEach(field => {
        const select = document.getElementById(field.id);
        const selectedValues = Array.isArray(field.selected)
            ? field.selected.map(String)
            : field.selected
                ? [String(field.selected)]
                : [];

        select.innerHTML = "";

        field.values.forEach(value => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            option.selected = selectedValues.includes(String(value));
            select.appendChild(option);
        });
    });
}


document.getElementById("editTeacher").addEventListener("change", function () {
    const schedule = allSchedules.find(s => s._id === currentEditId);

    if (!schedule) return;

    const updatedSchedule = {
        ...schedule,
        subject: [],
        eca: [],
        language: []
    };

    populateEditOptions(updatedSchedule, this.value);
});


function closeSchedulePopup() {
    document.getElementById("editSchedulePopup").style.display = "none";
    currentEditId = null;
}


async function saveScheduleEdit() {
    if (!currentEditId) {
        alert("No existing schedule selected.");
        return;
    }

    const teacherId = document.getElementById("editTeacher").value;
    const day = document.getElementById("editDay").value;
    const className = document.getElementById("editClass").value;
    const startTime = document.getElementById("editStart").value;
    const endTime = document.getElementById("editEnd").value;

    const getSelectedValues = (id) =>
        Array.from(document.getElementById(id).selectedOptions)
            .map(option => option.value)
            .filter(value => value !== "");

    const subject = getSelectedValues("editSubject");
    const eca = getSelectedValues("editEca");
    const language = getSelectedValues("editLanguage");

    if (!teacherId || !startTime || !endTime) {
        alert("Please select a teacher and enter both times.");
        return;
    }

    if (startTime >= endTime) {
        alert("End time must be after start time.");
        return;
    }

    if (subject.length === 0 && eca.length === 0 && language.length === 0) {
        alert("Select at least one Subject, ECA, or Language.");
        return;
    }

    const token = localStorage.getItem("token");

    try {
        const clashRes = await fetch(
            "https://academy-backend-eatl.onrender.com/api/founder/check-clash",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    teacher: teacherId,
                    day,
                    startTime,
                    endTime,
                    scheduleId: currentEditId
                })
            }
        );

        const clashData = await clashRes.json();

        if (clashData.clash) {
            alert(clashData.message || "This teacher has a schedule clash.");
            return;
        }

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/founder/update-schedule/" + currentEditId,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    teacher: teacherId,
                    day,
                    className,
                    subject,
                    eca,
                    language,
                    startTime,
                    endTime
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            alert(result.message || "Unable to update schedule.");
            return;
        }

        alert("Schedule updated successfully.");
        closeSchedulePopup();
        await loadSchedules();

    } catch (error) {
        console.error("Schedule update error:", error);
        alert("Unable to update schedule. Please try again.");
    }
}

/* SUBJECT */

(teacher.subject || []).forEach(s=>{
subjectSelect.innerHTML += `<option value="${s}">${s}</option>`;

async function checkTimeClashLive() {

    const teacherId = document.getElementById("teacher").value;
    const day = document.getElementById("day").value;

    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;

    const warningBox = document.getElementById("clashWarning");

    // ❌ if empty → hide
    if (!startTime || !endTime) {
        warningBox.style.display = "none";
        return;
    }

    try {
const token = localStorage.getItem("token");

const res = await fetch("https://academy-backend-eatl.onrender.com/api/founder/check-clash", {
    method: "POST",
    headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
        teacher: teacherId,
        day,
        startTime,
        endTime
    })
});

        const data = await res.json();

        if (data.clash) {
            warningBox.style.display = "block";
            warningBox.innerText = "⚠ " + data.message;
        } else {
            warningBox.style.display = "none";
        }

    } catch (err) {
        console.log("Live clash error:", err);
    }
}
function suggestNextSlot() {

    const teacherId = document.getElementById("teacher").value;
    const day = document.getElementById("day").value;

    const schedules = allSchedules
        .filter(s => s.teacher && s.teacher._id === teacherId && s.day === day)
        .sort((a,b)=> a.endTime.localeCompare(b.endTime));

    if (schedules.length === 0) return;

    const last = schedules[schedules.length - 1];

    
let [h, m] = last.endTime.split(":").map(Number);

// ADD 2-MINUTE BUFFER
m += 2;

if (m >= 60) {
    h += Math.floor(m / 60);
    m = m % 60;
}

if (h >= 24) {
    h = h % 24;
}

const start =
    String(h).padStart(2, "0") + ":" +
    String(m).padStart(2, "0");

document.getElementById("startTime").value = start;

// DEFAULT CLASS DURATION: 40 MINUTES
m += 40;

if (m >= 60) {
    h += Math.floor(m / 60);
    m = m % 60;
}

if (h >= 24) {
    h = h % 24;
}

const end =
    String(h).padStart(2, "0") + ":" +
    String(m).padStart(2, "0");

document.getElementById("endTime").value = end;

}
