
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Students</title>

<link rel="stylesheet"

<style>
body {
    margin: 0;
}

.main-content {
    margin-left: 240px;
    padding: 20px;
    width: calc(100% - 240px);
    box-sizing: border-box;
}

.student-card {
    background: #fff;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.student-name {
    font-size: 16px;
    font-weight: bold;
    color: #142b50;
    margin-bottom: 8px;
}

.tag {
    display: inline-block;
    background: #eef;
    padding: 4px 8px;
    border-radius: 6px;
    margin: 3px;
    font-size: 12px;
}

.mobile-students-header,
.mobile-back-btn,
.mobile-student-search,
.mobile-grade-heading {
    display: none;
}

/* MOBILE DESIGN */
@media screen and (max-width: 700px) {

    body {
        background: #eef3fb;
    }

    .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        padding: 0 14px 30px !important;
    }

    #sidebar-container {
        display: none !important;
    }

    .mobile-students-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: #fff;
        margin: 0 -14px 15px;
        padding: 22px 16px;
        border-bottom: 1px solid #e1e8f3;
    }

    .mobile-students-header h2 {
        margin: 0;
        color: #102b58;
        font-size: 25px;
        font-weight: 800;
    }

    .mobile-students-header p {
        margin: 5px 0 0;
        color: #718096;
        font-size: 14px;
    }

    .mobile-back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-shrink: 0;
        border: none;
        border-radius: 12px;
        padding: 11px 13px;
        background: #102b58;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .mobile-student-search {
        display: flex;
        align-items: center;
        gap: 12px;
        background: white;
        border: 1px solid #d6e0f0;
        border-radius: 14px;
        padding: 0 14px;
        margin-bottom: 18px;
        height: 52px;
    }

    .mobile-student-search i {
        color: #64748b;
        font-size: 18px;
    }

    .mobile-student-search input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
        color: #142b50;
    }

    .student-card {
        padding: 14px;
        margin-bottom: 12px;
        border: 1px solid #e4eaf4;
        border-radius: 16px;
        background: white;
        box-shadow: 0 3px 10px rgba(20,45,85,.08);
    }

    .student-name {
        color: #142b50;
        font-size: 17px;
        margin-bottom: 10px;
    }

    .student-category {
        margin-top: 8px;
        color: #334155;
        font-size: 13px;
        line-height: 1.8;
    }

    .student-category strong {
        display: inline-block;
        min-width: 75px;
        color: #102b58;
    }

    .student-card .tag {
        display: inline-block;
        margin: 3px 3px 3px 0;
        padding: 6px 9px;
        border-radius: 8px;
        background: #eaf1ff;
        color: #173d79;
        font-size: 12px;
        font-weight: 600;
    }

    .mobile-grade-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 2px 10px;
        color: #102b58;
        font-size: 19px;
        font-weight: 800;
    }

    .mobile-grade-count {
        background: #dce9ff;
        color: #17458b;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="sidebar-container"></div>

<script>
fetch("teacher-sidebar.html")
.then(res => res.text())
.then(data => {
    document.getElementById("sidebar-container").innerHTML = data;
})
.catch(err => console.error("Sidebar loading error:", err));
</script>

<div class="main-content">

    <div class="mobile-students-header">
        <div>
            <h2>My Students</h2>
            <p>Manage your assigned students</p>
        </div>

        <button type="button"
                class="mobile-back-btn"
                onclick="goBackPage()">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>
    </div>

    <div class="mobile-student-search">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            id="studentSearch"
            placeholder="Search students or class..."
            oninput="renderStudents()">
    </div>

    <div id="studentsContainer"></div>

</div>

<script>

// ======================================
// NATIVE ANDROID SESSION INTEGRATION
// ======================================

if (window.GPAAndroid) {

    const nativeToken = window.GPAAndroid.getToken();
    const nativeRole = window.GPAAndroid.getRole();

    if (nativeToken) {
        sessionStorage.setItem("token", nativeToken);
    }

    if (nativeRole) {
        sessionStorage.setItem("role", nativeRole);
    }
}

// Read the authenticated session
const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

window.allStudents = [];

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}

/* CONVERT VALUES INTO ARRAYS */
function toArray(value) {

    if (!value) return [];

    if (Array.isArray(value)) {
        return value.filter(Boolean);
    }

    return [value];
}

/* LOAD STUDENTS */
async function loadStudents() {

    const container = document.getElementById("studentsContainer");

    try {

        const res = await fetch(
            "https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        if (!res.ok) {
            throw new Error("Unable to load student assignments");
        }

        const data = await res.json();

        if (!data.data || !Array.isArray(data.data)) {
            throw new Error("Invalid student assignment response");
        }

        const studentMap = {};

        data.data.forEach(item => {

            if (!Array.isArray(item.students)) return;

            item.students.forEach(st => {

                /*
                 * IMPORTANT:
                 * Supports both structures:
                 *
                 * st.student = populated User
                 * OR
                 * st = populated User directly
                 */

                const user = st.student || st;

                const studentId =
                    user._id || st.student || st._id;

                if (!studentId) return;

                if (!studentMap[studentId]) {

                    studentMap[studentId] = {
                        name: user.name || st.name || "Student",
                        classes: []
                    };
                }

                /*
                 * SUBJECTS, LANGUAGES AND ECA
                 * Usually stored in the student assignment subdocument.
                 */

                const subjects = [
                    ...toArray(st.subjects),
                    ...toArray(st.subject)
                ];

                const languages = toArray(st.languages);

                const eca = toArray(st.eca);

                /*
                 * Include period subject if available.
                 */

                if (item.subject) {
                    subjects.push(item.subject);
                }

                studentMap[studentId].classes.push({

                    className: item.className || "Other",

                    subjects: subjects,

                    languages: languages,

                    eca: eca,

                    day: item.day || "",

                    time:
                        (item.startTime || "") +
                        " - " +
                        (item.endTime || "")

                });

            });

        });

        window.allStudents = Object.entries(studentMap).map(
            ([id, student]) => ({
                id,
                ...student
            })
        );

        renderStudents();

        console.log("Students loaded:", window.allStudents);

    } catch (err) {

        console.error("Student loading error:", err);

        container.innerHTML =
            "<p>Error loading students. Please refresh the page.</p>";

    }
}


/* RENDER GRADE-WISE STUDENTS */
function renderStudents() {

    const container = document.getElementById("studentsContainer");

    const search =
        document.getElementById("studentSearch")
        ?.value.trim().toLowerCase() || "";

    const gradeGroups = {};

    window.allStudents.forEach(student => {

        const matchingClasses = student.classes.filter(c => {

            const searchableText = [

                student.name,

                c.className,

                ...(c.subjects || []),

                ...(c.languages || []),

                ...(c.eca || []),

                c.day,

                c.time

            ].join(" ").toLowerCase();

            return searchableText.includes(search);

        });

        matchingClasses.forEach(c => {

            const grade = c.className || "Other";

            if (!gradeGroups[grade]) {
                gradeGroups[grade] = {};
            }

            if (!gradeGroups[grade][student.id]) {

                gradeGroups[grade][student.id] = {

                    name: student.name,

                    subjects: new Set(),

                    languages: new Set(),

                    eca: new Set()

                };

            }

            const current = gradeGroups[grade][student.id];

            function addUniqueValues(target, values) {
    (values || []).flat(Infinity).forEach(value => {

        if (typeof value !== "string") return;

        const cleaned = value.trim();

        if (!cleaned) return;

        const alreadyExists = [...target].some(
            existing => existing.toLowerCase() === cleaned.toLowerCase()
        );

        if (!alreadyExists) {
            target.add(cleaned);
        }
    });
}

addUniqueValues(current.subjects, c.subjects);
addUniqueValues(current.languages, c.languages);
addUniqueValues(current.eca, c.eca);

        });

    });

    container.innerHTML = "";

    const grades = Object.keys(gradeGroups).sort(
        (a, b) => a.localeCompare(b, undefined, { numeric: true })
    );

    if (grades.length === 0) {

        container.innerHTML = "<p>No matching students found.</p>";

        return;
    }

    grades.forEach(grade => {

        const students = Object.values(gradeGroups[grade]);

        let studentsHTML = "";

        students.forEach(student => {

            const subjectHTML = [...student.subjects].map(value =>
                `<span class="tag">${value}</span>`
            ).join("");

            const languageHTML = [...student.languages].map(value =>
                `<span class="tag">${value}</span>`
            ).join("");

            const ecaHTML = [...student.eca].map(value =>
                `<span class="tag">${value}</span>`
            ).join("");

            studentsHTML += `

                <div class="student-card">

                    <div class="student-name">
                        ${student.name}
                    </div>

                    ${subjectHTML ? `
                        <div class="student-category">
                            <strong>Subjects:</strong>
                            ${subjectHTML}
                        </div>
                    ` : ""}

                    ${languageHTML ? `
                        <div class="student-category">
                            <strong>Languages:</strong>
                            ${languageHTML}
                        </div>
                    ` : ""}

                    ${ecaHTML ? `
                        <div class="student-category">
                            <strong>ECA:</strong>
                            ${ecaHTML}
                        </div>
                    ` : ""}

                    ${!subjectHTML && !languageHTML && !ecaHTML ? `
                        <div class="student-category">
                            No subject details available
                        </div>
                    ` : ""}

                </div>

            `;

        });

        container.innerHTML += `

            <div class="mobile-grade-heading">

                <span>${grade}</span>

                <span class="mobile-grade-count">
                    ${students.length} Students
                </span>

            </div>

            ${studentsHTML}

        `;

    });

}


/* BACK BUTTON */
function goBackPage() {

    if (
        window.GPAAndroid &&
        typeof window.GPAAndroid.goBack === "function"
    ) {

        window.GPAAndroid.goBack();

    } else if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href = "teacher-dashboard.html";

    }

}

function go(page) {
    window.location.href = page;
}

function logout() {
    sessionStorage.clear();
    window.location.replace("teacher-login.html");
}


/* START */
loadStudents();

</script>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="messenger/chat/messengerWebNotifications.js"></script>
<script src="messenger/chat/primaryUserChatSocket.js"></script>

</body>
</html>
