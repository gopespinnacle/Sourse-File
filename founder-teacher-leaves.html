<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teacher Leave Requests | Founder</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

    background:#f1f5f9;

    color:#1e293b;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:240px;

    height:100vh;

    background:#0f172a;

    color:white;

}

.sidebar h2{

    text-align:center;

    padding:20px 10px;

    margin:0;

    border-bottom:
    1px solid rgba(255,255,255,.08);

}

.sidebar ul{

    list-style:none;

    padding:0;

    margin:15px 0;

}

.sidebar li{

    padding:15px 20px;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:12px;

}

.sidebar li:hover{

    background:#1e293b;

}

.sidebar li.active{

    background:#2563eb;

}


/* =========================================================
   MAIN
   ========================================================= */

.main{

    margin-left:240px;

    padding:25px;

}


/* =========================================================
   HEADER
   ========================================================= */

.page-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}

.page-header h1{

    margin:0;

    font-size:28px;

}

.page-header p{

    margin:5px 0 0;

    color:#64748b;

}


/* =========================================================
   SUMMARY
   ========================================================= */

.summary-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:15px;

    margin-bottom:25px;

}

.summary-card{

    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:
    0 4px 15px
    rgba(15,23,42,.07);

}

.summary-card i{

    font-size:22px;

    margin-bottom:8px;

}

.summary-number{

    font-size:28px;

    font-weight:700;

}

.summary-label{

    color:#64748b;

    font-size:13px;

}


/* =========================================================
   FILTER
   ========================================================= */

.filter-card{

    background:white;

    padding:18px;

    border-radius:12px;

    margin-bottom:20px;

    box-shadow:
    0 4px 15px
    rgba(15,23,42,.07);

    display:flex;

    gap:15px;

    align-items:end;

    flex-wrap:wrap;

}

.filter-group{

    display:flex;

    flex-direction:column;

    gap:6px;

}

.filter-group label{

    font-size:12px;

    font-weight:700;

}

.filter-group select,
.filter-group input{

    padding:9px;

    border:
    1px solid #cbd5e1;

    border-radius:7px;

}


/* =========================================================
   REQUEST CARDS
   ========================================================= */

.requests{

    display:flex;

    flex-direction:column;

    gap:15px;

}

.request-card{

    background:white;

    border-radius:14px;

    box-shadow:
    0 4px 15px
    rgba(15,23,42,.08);

    overflow:hidden;

}

.request-header{

    padding:16px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#f8fafc;

    border-bottom:
    1px solid #e2e8f0;

}

.teacher-info{

    display:flex;

    align-items:center;

    gap:12px;

}

.teacher-avatar{

    width:42px;

    height:42px;

    border-radius:50%;

    background:#1e3a5f;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:700;

}

.teacher-name{

    font-weight:700;

}

.request-created{

    font-size:11px;

    color:#64748b;

}

.status{

    padding:6px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:700;

}

.status-pending{

    background:#fef3c7;

    color:#92400e;

}

.status-approved{

    background:#dcfce7;

    color:#166534;

}

.status-rejected{

    background:#fee2e2;

    color:#991b1b;

}

.status-cancelled{

    background:#e2e8f0;

    color:#475569;

}


/* =========================================================
   DETAILS
   ========================================================= */

.request-body{

    padding:20px;

}

.details-grid{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:12px;

}

.detail{

    background:#f8fafc;

    border:
    1px solid #e2e8f0;

    border-radius:8px;

    padding:11px;

}

.detail-label{

    display:block;

    font-size:10px;

    text-transform:uppercase;

    color:#64748b;

    margin-bottom:5px;

}

.detail-value{

    font-size:13px;

    font-weight:700;

}


/* =========================================================
   EXPLANATION / COMPENSATION
   ========================================================= */

.info-section{

    margin-top:18px;

}

.info-section h4{

    margin:0 0 8px;

    font-size:14px;

}

.explanation{

    background:#f8fafc;

    padding:12px;

    border-radius:8px;

    color:#475569;

    min-height:40px;

}

.compensation{

    background:#eff6ff;

    border:
    1px solid #bfdbfe;

    padding:15px;

    border-radius:9px;

}

.compensation-title{

    color:#1e40af;

    font-weight:700;

    margin-bottom:6px;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.request-actions{

    display:flex;

    gap:10px;

    padding:16px 20px;

    border-top:
    1px solid #e2e8f0;

}

.approve-btn,
.reject-btn{

    border:none;

    padding:10px 18px;

    border-radius:7px;

    color:white;

    font-weight:700;

    cursor:pointer;

}

.approve-btn{

    background:#16a34a;

}

.approve-btn:hover{

    background:#15803d;

}

.reject-btn{

    background:#dc2626;

}

.reject-btn:hover{

    background:#b91c1c;

}

.approve-btn:disabled,
.reject-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{

    background:white;

    padding:60px 20px;

    text-align:center;

    border-radius:14px;

    color:#64748b;

    box-shadow:
    0 4px 15px
    rgba(15,23,42,.07);

}


/* =========================================================
   MODAL
   ========================================================= */

.modal-overlay{

    display:none;

    position:fixed;

    inset:0;

    background:
    rgba(15,23,42,.65);

    z-index:5000;

    padding:20px;

}

.modal{

    width:min(520px,100%);

    margin:100px auto;

    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
    0 20px 60px
    rgba(0,0,0,.3);

}

.modal-header{

    padding:18px 20px;

    background:#0f172a;

    color:white;

    display:flex;

    justify-content:space-between;

}

.modal-header button{

    border:none;

    background:transparent;

    color:white;

    font-size:20px;

    cursor:pointer;

}

.modal-body{

    padding:20px;

}

.modal-body textarea{

    width:100%;

    min-height:110px;

    resize:vertical;

    padding:10px;

    border:
    1px solid #cbd5e1;

    border-radius:8px;

}

.modal-actions{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:15px;

}

.cancel-btn{

    border:none;

    background:#e2e8f0;

    padding:10px 18px;

    border-radius:7px;

    cursor:pointer;

}

.confirm-btn{

    border:none;

    color:white;

    padding:10px 18px;

    border-radius:7px;

    cursor:pointer;

    font-weight:700;

}

.confirm-approve{

    background:#16a34a;

}

.confirm-reject{

    background:#dc2626;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){

    .sidebar{

        width:210px;

    }

    .main{

        margin-left:210px;

    }

    .summary-grid{

        grid-template-columns:
        1fr;

    }

    .details-grid{

        grid-template-columns:
        repeat(2,1fr);

    }

}

@media(max-width:650px){

    .sidebar{

        position:static;

        width:100%;

        height:auto;

    }

    .sidebar ul{

        display:flex;

        overflow-x:auto;

    }

    .sidebar li{

        white-space:nowrap;

    }

    .main{

        margin-left:0;

        padding:15px;

    }

    .details-grid{

        grid-template-columns:1fr;

    }

    .page-header{

        flex-direction:column;

        align-items:flex-start;

        gap:10px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<div class="sidebar">

    <h2>
        Founder ERP
    </h2>

    <ul>

        <li
        onclick="go('founder-dashboard.html')">

            <i class="fa fa-home"></i>

            Dashboard

        </li>

        <li class="active">

            <i class="fa fa-calendar-check"></i>

            Teacher Leaves

        </li>

        <li onclick="logout()">

            <i class="fa fa-sign-out-alt"></i>

            Logout

        </li>

    </ul>

</div>


<!-- =========================================================
     MAIN
     ========================================================= -->

<div class="main">


    <div class="page-header">

        <div>

            <h1>
                Teacher Leave Requests
            </h1>

            <p>
                Review and manage teacher leave applications.
            </p>

        </div>

    </div>


    <!-- =====================================================
         SUMMARY
         ===================================================== -->

    <div class="summary-grid">

        <div class="summary-card">

            <i
            class="fa fa-clock"
            style="color:#d97706;">
            </i>

            <div
            class="summary-number"
            id="pendingCount">
                0
            </div>

            <div class="summary-label">
                Pending
            </div>

        </div>


        <div class="summary-card">

            <i
            class="fa fa-check-circle"
            style="color:#16a34a;">
            </i>

            <div
            class="summary-number"
            id="approvedCount">
                0
            </div>

            <div class="summary-label">
                Approved
            </div>

        </div>


        <div class="summary-card">

            <i
            class="fa fa-times-circle"
            style="color:#dc2626;">
            </i>

            <div
            class="summary-number"
            id="rejectedCount">
                0
            </div>

            <div class="summary-label">
                Rejected
            </div>

        </div>

    </div>


    <!-- =====================================================
         FILTER
         ===================================================== -->

    <div class="filter-card">

        <div class="filter-group">

            <label>
                Status
            </label>

            <select
            id="statusFilter"
            onchange="renderRequests()">

                <option value="">
                    All
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Approved">
                    Approved
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>

        </div>


        <div class="filter-group">

            <label>
                Date
            </label>

            <input
            type="date"
            id="dateFilter"
            onchange="renderRequests()">

        </div>

    </div>


    <!-- =====================================================
         REQUESTS
         ===================================================== -->

    <div
    id="requests"
    class="requests">

    </div>

</div>


<!-- =========================================================
     ACTION MODAL
     ========================================================= -->

<div
id="actionModal"
class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <strong id="modalTitle">
                Review Leave
            </strong>

            <button
            onclick="closeActionModal()">

                ✕

            </button>

        </div>


        <div class="modal-body">

            <p id="modalMessage"></p>

            <label>
                Founder Comment
                (Optional)
            </label>

            <br><br>

            <textarea
            id="founderComment"
            placeholder="Enter your comment...">
            </textarea>


            <div class="modal-actions">

                <button
                class="cancel-btn"
                onclick="closeActionModal()">

                    Cancel

                </button>

                <button
                id="confirmActionBtn"
                class="confirm-btn">

                    Confirm

                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   API / AUTH
   ========================================================= */

const API =
"https://academy-backend-eatl.onrender.com/api";

const token =
sessionStorage.getItem("token");

const role =
sessionStorage.getItem("role");


if(
    !token ||
    role !== "founder"
){

    alert(
        "Please login as Founder."
    );

    window.location.href =
        "founder-login.html";

}


/* =========================================================
   DATA
   ========================================================= */

let leaveRequests = [];

let selectedLeaveId = null;

let selectedAction = null;


/* =========================================================
   LOAD REQUESTS
   ========================================================= */

async function loadLeaveRequests(){

    try{

        const res =
        await fetch(
            API +
            "/founder/teacher-leaves",
            {
                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        );


        const result =
        await res.json();


        if(!result.success){

            throw new Error(
                result.message ||
                "Unable to load leave requests."
            );

        }


        leaveRequests =
        result.data || [];


        updateSummary();

        renderRequests();


    }catch(err){

        console.error(err);

        document.getElementById(
            "requests"
        ).innerHTML = `

            <div class="empty">

                <i
                class="fa fa-triangle-exclamation"
                style="
                font-size:35px;
                margin-bottom:15px;
                ">
                </i>

                <br>

                Unable to load teacher leave requests.

                <br><br>

                ${err.message}

            </div>

        `;

    }

}


/* =========================================================
   SUMMARY
   ========================================================= */

function updateSummary(){

    document.getElementById(
        "pendingCount"
    ).innerText =
        leaveRequests.filter(
            l =>
            l.status === "Pending"
        ).length;


    document.getElementById(
        "approvedCount"
    ).innerText =
        leaveRequests.filter(
            l =>
            l.status === "Approved"
        ).length;


    document.getElementById(
        "rejectedCount"
    ).innerText =
        leaveRequests.filter(
            l =>
            l.status === "Rejected"
        ).length;

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(time){

    if(!time){

        return "";

    }

    let [
        hour,
        minute
    ] =
    time.split(":");


    hour =
    parseInt(hour);


    const ampm =
        hour >= 12
        ? "PM"
        : "AM";


    hour =
        hour % 12;


    hour =
        hour || 12;


    return (
        hour +
        ":" +
        minute +
        " " +
        ampm
    );

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(dateString){

    if(!dateString){

        return "—";

    }

    const date =
    new Date(
        dateString +
        "T00:00:00"
    );


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   RENDER REQUESTS
   ========================================================= */

function renderRequests(){

    const container =
    document.getElementById(
        "requests"
    );


    const status =
    document.getElementById(
        "statusFilter"
    ).value;


    const date =
    document.getElementById(
        "dateFilter"
    ).value;


    let filtered =
    leaveRequests.filter(
        leave => {

            if(
                status &&
                leave.status !== status
            ){

                return false;

            }


            if(
                date &&
                leave.date !== date
            ){

                return false;

            }


            return true;

        }
    );


    container.innerHTML = "";


    if(
        filtered.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                <i
                class="fa fa-calendar-check"
                style="
                font-size:40px;
                margin-bottom:15px;
                ">
                </i>

                <br>

                No leave requests found.

            </div>

        `;

        return;

    }


    filtered.forEach(
        leave => {

            container.appendChild(
                createRequestCard(
                    leave
                )
            );

        }
    );

}


/* =========================================================
   REQUEST CARD
   ========================================================= */

function createRequestCard(leave){

    const card =
    document.createElement(
        "div"
    );

    card.className =
    "request-card";


    const teacherName =
        leave.teacherName
        ||
        (
            leave.teacher &&
            (
                leave.teacher.name
                ||
                leave.teacher.teacherName
            )
        )
        ||
        "Teacher";


    const initials =
        teacherName
        .split(" ")
        .map(
            word =>
            word.charAt(0)
        )
        .join("")
        .substring(0,2)
        .toUpperCase();


    const isPending =
        leave.status ===
        "Pending";


    const compensation =
        leave.compensationDate
        ?

        `${formatDate(
            leave.compensationDate
        )}
        |
        ${formatTime(
            leave.compensationStartTime
        )}
        -
        ${formatTime(
            leave.compensationEndTime
        )}`

        :

        "No compensation class specified";


    card.innerHTML = `

        <div class="request-header">

            <div class="teacher-info">

                <div
                class="teacher-avatar">

                    ${initials}

                </div>

                <div>

                    <div
                    class="teacher-name">

                        ${teacherName}

                    </div>

                    <div
                    class="request-created">

                        Request submitted
                        ${formatDate(
                            leave.createdAt
                            ?
                            leave.createdAt
                            .substring(0,10)
                            :
                            leave.date
                        )}

                    </div>

                </div>

            </div>


            <span
            class="
            status
            status-${leave.status.toLowerCase()}
            ">

                ${leave.status}

            </span>

        </div>


        <div class="request-body">

            <div class="details-grid">


                <div class="detail">

                    <span
                    class="detail-label">

                        Leave Date

                    </span>

                    <span
                    class="detail-value">

                        ${formatDate(
                            leave.date
                        )}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Day

                    </span>

                    <span
                    class="detail-value">

                        ${leave.day}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Period

                    </span>

                    <span
                    class="detail-value">

                        ${formatTime(
                            leave.startTime
                        )}
                        -
                        ${formatTime(
                            leave.endTime
                        )}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Class

                    </span>

                    <span
                    class="detail-value">

                        ${leave.className}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Subject

                    </span>

                    <span
                    class="detail-value">

                        ${leave.subject || "General"}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Category

                    </span>

                    <span
                    class="detail-value">

                        ${leave.leaveCategory}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Subcategory

                    </span>

                    <span
                    class="detail-value">

                        ${leave.leaveSubcategory}

                    </span>

                </div>


                <div class="detail">

                    <span
                    class="detail-label">

                        Compensation

                    </span>

                    <span
                    class="detail-value">

                        ${leave.compensationDate
                        ? "Provided"
                        : "Not Provided"}

                    </span>

                </div>

            </div>


            <div
            class="info-section">

                <h4>
                    Explanation
                </h4>

                <div
                class="explanation">

                    ${
                        leave.explanation
                        ||
                        "No explanation provided."
                    }

                </div>

            </div>


            <div
            class="info-section">

                <h4>
                    📚 Compensation Class
                </h4>

                <div
                class="compensation">

                    <div
                    class="compensation-title">

                        Proposed Compensation Session

                    </div>

                    ${compensation}

                </div>

            </div>


            ${
                leave.founderComment
                ?

                `

                <div
                class="info-section">

                    <h4>
                        Founder Comment
                    </h4>

                    <div
                    class="explanation">

                        ${leave.founderComment}

                    </div>

                </div>

                `

                :

                ""

            }

        </div>


        ${
            isPending

            ?

            `

            <div
            class="request-actions">

                <button
                class="approve-btn"
                onclick="
                openActionModal(
                    '${leave._id}',
                    'approve'
                )">

                    <i
                    class="fa fa-check">
                    </i>

                    Approve

                </button>


                <button
                class="reject-btn"
                onclick="
                openActionModal(
                    '${leave._id}',
                    'reject'
                )">

                    <i
                    class="fa fa-times">
                    </i>

                    Reject

                </button>

            </div>

            `

            :

            ""

        }

    `;


    return card;

}


/* =========================================================
   OPEN ACTION MODAL
   ========================================================= */

function openActionModal(
    leaveId,
    action
){

    selectedLeaveId =
    leaveId;

    selectedAction =
    action;


    document.getElementById(
        "founderComment"
    ).value = "";


    const title =
    action ===
    "approve"
    ?
    "Approve Teacher Leave"
    :
    "Reject Teacher Leave";


    const message =
    action ===
    "approve"

    ?

    "Are you sure you want to approve this leave request?"

    :

    "Are you sure you want to reject this leave request?";


    document.getElementById(
        "modalTitle"
    ).innerText =
    title;


    document.getElementById(
        "modalMessage"
    ).innerText =
    message;


    const button =
    document.getElementById(
        "confirmActionBtn"
    );


    button.innerText =
        action ===
        "approve"
        ?
        "Approve Leave"
        :
        "Reject Leave";


    button.className =
        "confirm-btn " +
        (
            action ===
            "approve"
            ?
            "confirm-approve"
            :
            "confirm-reject"
        );


    button.onclick =
        confirmAction;


    document.getElementById(
        "actionModal"
    ).style.display =
    "block";

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeActionModal(){

    document.getElementById(
        "actionModal"
    ).style.display =
    "none";

    selectedLeaveId =
    null;

    selectedAction =
    null;

}


/* =========================================================
   CONFIRM ACTION
   ========================================================= */

async function confirmAction(){

    if(
        !selectedLeaveId ||
        !selectedAction
    ){

        return;

    }


    const comment =
    document.getElementById(
        "founderComment"
    ).value.trim();


    const button =
    document.getElementById(
        "confirmActionBtn"
    );


    button.disabled =
    true;

    button.innerText =
    "Processing...";


    try{

        const endpoint =
            selectedAction ===
            "approve"

            ?

            `/founder/teacher-leaves/${selectedLeaveId}/approve`

            :

            `/founder/teacher-leaves/${selectedLeaveId}/reject`;


        const res =
        await fetch(
            API +
            endpoint,
            {

                method:"PUT",

                headers:{

                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + token

                },

                body:JSON.stringify({

                    comment:
                    comment

                })

            }
        );


        const result =
        await res.json();


        if(!result.success){

            alert(
                result.message ||
                "Unable to process leave request."
            );

            return;

        }


        alert(
            selectedAction ===
            "approve"

            ?

            "Leave approved successfully."

            :

            "Leave rejected successfully."
        );


        closeActionModal();


        await loadLeaveRequests();


    }catch(err){

        console.error(err);

        alert(
            "Server error while processing leave."
        );

    }finally{

        button.disabled =
        false;

    }

}

    window.location.href =

   ========================================================= */

loadLeaveRequests();

</script>
