<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Profile</title>

<style>
body{
    font-family:Segoe UI;
    background:#f1f5f9;
    margin:0;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>

</head>

<body>

<div class="container">

<h2>Student Profile</h2>

<div class="card" id="studentInfo">Loading...</div>

<div class="card">
<h3>Assigned Periods</h3>
<div id="periods">Loading...</div>
</div>

</div>


<script>

const API = "https://academy-backend-eatl.onrender.com/api/founder";

const params = new URLSearchParams(window.location.search);
const studentId = params.get("id");
const token = localStorage.getItem("token");

const studentInfo = document.getElementById("studentInfo");
const periodsDiv = document.getElementById("periods");

function authHeaders() {
    return {
        "Authorization": "Bearer " + token
    };
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

/* =================================
   LOAD STUDENT INFORMATION
================================= */

async function loadStudent() {
    try {
        const res = await fetch(API + "/students", {
            headers: authHeaders()
        });

        if (!res.ok) throw new Error("Unable to load students");

        const data = await res.json();

        const student = (data.students || []).find(
            s => String(s._id) === String(studentId)
        );

        if (!student) {
            studentInfo.innerText = "Student not found";
            return;
        }

        studentInfo.innerHTML = `
            <b>Name:</b> ${escapeHTML(student.name)}<br>
            <b>Grade:</b> ${escapeHTML(student.grade)}<br>
            <b>Board:</b> ${escapeHTML(student.board)}<br>
            <b>Mobile:</b> ${escapeHTML(student.mobile)}<br><br>
            <b>Login ID:</b> ${escapeHTML(student.loginEmail || student.email)}
        `;

    } catch (error) {
        console.error(error);
        studentInfo.innerText = "Error loading student information";
    }
}

/* =================================
   LOAD STUDENT ASSIGNED PERIODS
================================= */

async function loadPeriods() {
    try {
        periodsDiv.innerHTML = "Loading periods...";

        const res = await fetch(
            API + "/student/" + encodeURIComponent(studentId) +
            "/assigned-periods",
            {
                headers: authHeaders()
            }
        );

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.message || "Unable to load periods");
        }

        const periods = data.periods || [];

        if (!periods.length) {
            periodsDiv.innerHTML = `
                <p style="color:#64748b;">
                    No periods assigned to this student.
                </p>
            `;
            return;
        }

        let html = "";

        periods.forEach((p, index) => {

            const subjects = [
                ...(p.subjects || []),
                ...(p.languages || []),
                ...(p.eca || [])
            ];

            html += `
                <div style="
                    background:#f8fafc;
                    border:1px solid #e2e8f0;
                    border-radius:10px;
                    padding:15px;
                    margin-bottom:12px;
                ">

                    <h3 style="margin:0 0 10px;color:#1d4ed8;">
                        Period ${index + 1}
                    </h3>

                    <p>
                        <b>Teacher:</b>
                        ${escapeHTML(p.teacher)}
                    </p>

                    <p>
                        <b>Assistant Teacher:</b>
                        ${escapeHTML(p.assistantTeacher)}
                    </p>

                    <p>
                        <b>Class:</b>
                        ${escapeHTML(p.className)}
                    </p>

                    <p>
                        <b>Subject:</b>
                        ${escapeHTML(subjects.length ? [...new Set(subjects)].join(", ") : "Not specified")}
                    </p>

                    <p>
                        <b>Day:</b>
                        ${escapeHTML(p.day)}
                    </p>

                    <p>
                        <b>Time:</b>
                        ${escapeHTML(p.startTime)} -
                        ${escapeHTML(p.endTime)}
                    </p>

                    <button
                        onclick="deletePeriod('${p.scheduleId}')"
                        style="
                            background:#dc2626;
                            color:white;
                            border:none;
                            padding:8px 14px;
                            border-radius:6px;
                            cursor:pointer;
                        ">
                        Remove Student From This Period
                    </button>

                </div>
            `;
        });

        periodsDiv.innerHTML = html;

    } catch (error) {
        console.error("PERIOD LOADING ERROR:", error);

        periodsDiv.innerHTML = `
            <p style="color:red;">
                ${escapeHTML(error.message)}
            </p>
        `;
    }
}

/* =================================
   REMOVE STUDENT FROM ONE PERIOD
================================= */

async function deletePeriod(scheduleId) {

    if (!confirm(
        "Remove this student from this period? Other students will remain assigned."
    )) return;

    try {

        const res = await fetch(
            API + "/student-period/" +
            encodeURIComponent(scheduleId) + "/" +
            encodeURIComponent(studentId),
            {
                method: "DELETE",
                headers: authHeaders()
            }
        );

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.message || "Unable to remove assignment");
        }

        alert("Student removed successfully.");

        await loadPeriods();

    } catch (error) {
        console.error(error);
        alert(error.message);
    }
}

/* =================================
   INITIAL LOAD
================================= */

if (!studentId || !token) {
    studentInfo.innerText = "Student ID or login session missing";
    periodsDiv.innerText = "Unable to load periods";
} else {
    loadStudent();
    loadPeriods();
}

</script>



</body>
</html>
