    <!-- =====================================================
         BASIC CLASSROOM STYLE
         ===================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /* =====================================================
           CLASSROOM
           ===================================================== */

        #classroom {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        #topBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            background: #1f2937;

            border-bottom:
                1px solid #374151;

        }


        #academyTitle {

            font-size: 18px;

            font-weight: 600;

        }


        #meetingInfo {

            display: flex;

            align-items: center;

            gap: 18px;

            font-size: 14px;

        }


        /* =====================================================
           ROLE
           ===================================================== */

        #userRole {

            font-weight: 600;

        }


        /* =====================================================
           CONNECTION STATUS
           ===================================================== */

        #connectionStatus {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        #connectionDot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #f59e0b;

        }


        #connectionText {

            color: #d1d5db;

        }


        /* =====================================================
           MAIN AREA
           ===================================================== */

        #mainArea {

            flex: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        #welcomeMessage {

            text-align: center;

            color: #d1d5db;

        }


        #welcomeMessage h2 {

            margin: 0 0 10px 0;

            font-size: 26px;

        }


        #welcomeMessage p {

            margin: 7px 0;

            font-size: 14px;

        }


        /* =====================================================
           PARTICIPANT CAPACITY
           ===================================================== */

        #capacityInfo {

            margin-top: 18px;

            padding: 10px 16px;

            border-radius: 8px;

            background: #1f2937;

            color: #9ca3af;

            font-size: 13px;

        }


        /* =====================================================
           BOTTOM BAR
           ===================================================== */

        #bottomBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #1f2937;

            border-top:
                1px solid #374151;

        }


        #systemStatus {

            font-size: 13px;

            color: #9ca3af;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            #topBar {

                height: auto;

                min-height: 60px;

                padding: 10px 12px;

                gap: 10px;

            }


            #academyTitle {

                font-size: 14px;

            }


            #meetingInfo {

                gap: 8px;

                font-size: 11px;

            }


            #welcomeMessage h2 {

                font-size: 21px;

            }

        }

    </style>

    <link
    rel="stylesheet"
    href="assets/css/meeting/meetingV2.css">

</head>


<body>

    <!-- =====================================================
         NEW MEETING FRONTEND
         PHASE 1
         ===================================================== -->

    <script>

        /*
        ========================================================
        GOPES PINNACLE ACADEMY
        VIRTUAL CLASSROOM
        ========================================================

        PHASE 1

        This module currently handles ONLY:

        1. Server connection
        2. Room information
        3. User role
        4. Socket connection status

        NOT YET IMPLEMENTED:

        - WebRTC
        - Camera
        - Microphone
        - Participants
        - Whiteboard
        - PDF
        - Screen sharing
        - Chat
        - Recording
        - Attendance

        ========================================================
        */


        /* =====================================================
           SERVER
           ===================================================== */

        const SERVER_URL =
            "https://academy-backend-eatl.onrender.com";


        /* =====================================================
           MAXIMUM CLASSROOM CAPACITY
           ===================================================== */

        const MAX_FOUNDERS = 1;

        const MAX_TEACHERS = 2;

        const MAX_STUDENTS = 10;

        const MAX_PARTICIPANTS =
            MAX_FOUNDERS +
            MAX_TEACHERS +
            MAX_STUDENTS;


        /* =====================================================
           READ URL PARAMETERS
           ===================================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        /* =====================================================
           ROOM
           ===================================================== */

        const meetingRoom =
            urlParams.get("room") ||
            localStorage.getItem("meetingRoom") ||
            "";


        /* =====================================================
           ROLE
           ===================================================== */

        const meetingRole =
            (
                urlParams.get("role") ||
                localStorage.getItem("meetingRole") ||
                ""
            ).toLowerCase();


        /* =====================================================
           USER ID
           ===================================================== */

        const meetingUserId =
    urlParams.get("userId") ||
    (
        meetingRole === "student"
            ? (
                sessionStorage.getItem("studentId") ||
                localStorage.getItem("studentId") ||
                ""
            )
            : (
                sessionStorage.getItem("teacherId") ||
                localStorage.getItem("meetingUserId") ||
                ""
            )
    );


        /* =====================================================
           USER NAME
           ===================================================== */

        const meetingUserName =
    urlParams.get("name") ||
    (
        meetingRole === "student"
            ? (
                sessionStorage.getItem("studentName") ||
                localStorage.getItem("studentName") ||
                urlParams.get("student") ||
                ""
            )
            : (
                sessionStorage.getItem("teacherName") ||
                localStorage.getItem("meetingUserName") ||
                ""
            )
    );


        /* =====================================================
           VALID ROLES
           ===================================================== */

        const VALID_ROLES = [
            "founder",
            "teacher",
            "student"
        ];


        /* =====================================================
           ROLE VALIDATION
           ===================================================== */

        if (
            meetingRole &&
            !VALID_ROLES.includes(meetingRole)
        ) {

            console.warn(
                "Unknown meeting role:",
                meetingRole
            );

        }


       /* =====================================================
   DISPLAY MEETING INFORMATION
   ===================================================== */

const meetingClassInfo =
    document.getElementById(
        "meetingClassInfo"
    );


if (meetingClassInfo) {

    meetingClassInfo.textContent =
        `${meetingRoom || "Virtual Classroom"} • ${
            meetingRole || "Participant"
        }`;

}


        /* =====================================================
           DEBUG INFORMATION
           ===================================================== */

        console.log(
            "=========================================="
        );

        console.log(
            "GOPES PINNACLE ACADEMY"
        );

        console.log(
            "NEW VIRTUAL CLASSROOM"
        );

        console.log(
            "PHASE 1"
        );

        console.log(
            "=========================================="
        );

        console.log(
            "Server:",
            SERVER_URL
        );

        console.log(
            "Room:",
            meetingRoom
        );

        console.log(
            "Role:",
            meetingRole
        );

        console.log(
            "User ID:",
            meetingUserId
        );

        console.log(
            "User Name:",
            meetingUserName
        );

        console.log(
            "Maximum Participants:",
            MAX_PARTICIPANTS
        );

        console.log(
            "=========================================="
        );



        /* =====================================================
   SOCKET CONNECTION
   ===================================================== */

const socket =
    MeetingSocket.connect(
        SERVER_URL
    );


            /* =====================================================
   GLOBAL MEETING OBJECT
   ===================================================== */

window.MeetingConfig = {

    serverURL:
        SERVER_URL,

    room:
        meetingRoom,

    role:
        meetingRole,

    userId:
        meetingUserId,

    userName:
        meetingUserName,

    maxFounders:
        MAX_FOUNDERS,

    maxTeachers:
        MAX_TEACHERS,

    maxStudents:
        MAX_STUDENTS,

    maxParticipants:
        MAX_PARTICIPANTS,

    participants:
        [],

    counts:
        {},

    capacity:
        {},

    socketId:
        null,

    joined:
        false

};


            /* =====================================================
   JOIN MEETING ROOM
   ===================================================== */

function joinMeetingRoom() {

    /*
    -----------------------------------------------------
    BASIC ROOM CHECK
    -----------------------------------------------------
    */

    if (!meetingRoom) {

        console.error(
            "Cannot join meeting: room is missing."
        );

        document.getElementById(
            "systemStatus"
        ).textContent =
            "Meeting room is missing.";

        return;

    }


    /*
    -----------------------------------------------------
    ROLE CHECK
    -----------------------------------------------------
    */

    if (
        !VALID_ROLES.includes(
            meetingRole
        )
    ) {

        console.error(
            "Cannot join meeting: invalid role.",
            meetingRole
        );

        document.getElementById(
            "systemStatus"
        ).textContent =
            "Invalid meeting role.";

        return;

    }


    /*
    -----------------------------------------------------
    NAME

    For now we read the name from:

    1. URL ?name=
    2. localStorage meetingUserName

    We do NOT invent a real user name.
    -----------------------------------------------------
    */

    const participantName =
        meetingUserName;


    /*
    -----------------------------------------------------
    NAME CHECK
    -----------------------------------------------------
    */

    if (!participantName) {

        console.error(
            "Cannot join meeting: participant name is missing."
        );

        document.getElementById(
            "systemStatus"
        ).textContent =
            "Participant name is missing.";

        return;

    }


    /*
    -----------------------------------------------------
    BUILD JOIN DATA
    -----------------------------------------------------
    */

    const joinData = {

        room:
            meetingRoom,

        role:
            meetingRole,

        name:
            participantName,

        userId:
            meetingUserId || null,

        studentId:
    meetingRole === "student"
        ? (
            sessionStorage.getItem(
                "studentId"
            ) ||
            localStorage.getItem(
                "studentId"
            ) ||
            null
        )
        : null,

        periodId:
            urlParams.get("periodId") ||
            null

    };


    /*
    -----------------------------------------------------
    DEBUG
    -----------------------------------------------------
    */

    console.log(
        "=========================================="
    );

    console.log(
        "JOINING MEETING ROOM"
    );

    console.log(
        "=========================================="
    );

    console.log(
        "Room:",
        joinData.room
    );

    console.log(
        "Role:",
        joinData.role
    );

    console.log(
        "Name:",
        joinData.name
    );

    console.log(
        "User ID:",
        joinData.userId
    );

    console.log(
        "Student ID:",
        joinData.studentId
    );

    console.log(
        "Period ID:",
        joinData.periodId
    );

    console.log(
        "=========================================="
    );


    /*
    -----------------------------------------------------
    SEND JOIN REQUEST
    -----------------------------------------------------
    */

    socket.emit(
        "joinRoom",
        joinData
    );


    /*
    -----------------------------------------------------
    UI
    -----------------------------------------------------
    */

    document.getElementById(
        "systemStatus"
    ).textContent =
        "Joining classroom...";

}


        /* =====================================================
           SOCKET CONNECT
           ===================================================== */

        socket.on(
            "connect",
            () => {

                console.log(
                    "=========================================="
                );

                console.log(
                    "SOCKET CONNECTED"
                );

                console.log(
                    "Socket ID:",
                    socket.id
                );

                console.log(
                    "=========================================="
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#22c55e";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Connected";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Connected to classroom server";


              /*
==================================================
JOIN MEETING ROOM
==================================================
*/

joinMeetingRoom();

            }
        );


        /* =====================================================
   JOIN ACCEPTED
   ===================================================== */

socket.on(
    "joinAccepted",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "JOIN ACCEPTED"
        );

        console.log(
            data
        );

        console.log(
            "=========================================="
        );


        document.getElementById(
            "systemStatus"
        ).textContent =
            "You have joined the classroom.";


        /*
        -------------------------------------------------
        SAVE CURRENT SOCKET ID
        -------------------------------------------------
        */

        window.MeetingConfig.socketId =
            data.socketId;


        /*
        -------------------------------------------------
        SAVE JOIN STATE
        -------------------------------------------------
        */

        window.MeetingConfig.joined =
            true;


        /*
        -------------------------------------------------
        SAVE SERVER CAPACITY
        -------------------------------------------------
        */

        window.MeetingConfig.maxParticipants =
            data.maxParticipants;


        window.MeetingConfig.maxFounders =
            data.maxFounders;


        window.MeetingConfig.maxTeachers =
            data.maxTeachers;


        window.MeetingConfig.maxStudents =
            data.maxStudents;


        console.log(
            "MeetingConfig updated:",
            window.MeetingConfig
        );

        /*
=====================================================
START CAMERA + MICROPHONE AUTOMATICALLY
=====================================================
*/

/*
=====================================================
START CAMERA + MICROPHONE AUTOMATICALLY
=====================================================
*/

if (
    window.MediaManagerV2 &&
    typeof MediaManagerV2.startMedia === "function"
) {

    console.log(
        "STARTING CAMERA + MICROPHONE"
    );


    MediaManagerV2.startMedia()
        .then(
            stream => {

                if (!stream) {

                    console.warn(
                        "Media stream was not created."
                    );

                    return;

                }


                console.log(
                    "CAMERA STREAM READY"
                );


                /*
                ------------------------------------------------
                CONNECT CAMERA STREAM TO WEBRTC
                ------------------------------------------------
                */

                if (
                    window.MeetingWebRTC &&
                    typeof MeetingWebRTC.setLocalStream ===
                    "function"
                ) {

                    MeetingWebRTC.setLocalStream(
    stream
);


/*
=====================================================
CAMERA READY
NOW CONNECT TEACHER TO EXISTING STUDENTS
=====================================================
*/

if (
    window.MeetingConfig &&
    window.MeetingConfig.role === "teacher" &&
    window.MeetingParticipants &&
    window.MeetingWebRTC &&
    MeetingWebRTC.getLocalStream()
) {

    const participants =
        MeetingParticipants.getAll();


    participants.forEach(
        participant => {

            if (
                participant.role !== "student"
            ) {

                return;

            }


            if (
                !participant.socketId
            ) {

                return;

            }


            console.log(
                "CAMERA READY - CONNECTING TO STUDENT:",
                participant.socketId
            );


            MeetingWebRTC.createOffer(
                participant.socketId
            )
            .catch(
                error => {

                    console.error(
                        "CAMERA READY WEBRTC OFFER ERROR:",
                        error
                    );

                }
            );

        }
    );

}

                }

            }
        )
        .catch(
            error => {

                console.error(
                    "MEDIA START ERROR:",
                    error
                );

            }
        );

}

    }
);

/* =====================================================
   JOIN REJECTED
   ===================================================== */

socket.on(
    "joinRejected",
    (data) => {

        console.error(
            "=========================================="
        );

        console.error(
            "JOIN REJECTED"
        );

        console.error(
            data
        );

        console.error(
            "=========================================="
        );


        document.getElementById(
            "connectionDot"
        ).style.background =
            "#ef4444";


        document.getElementById(
            "connectionText"
        ).textContent =
            "Join rejected";


        document.getElementById(
            "systemStatus"
        ).textContent =
            data.reason ||
            "Unable to join classroom.";

    }
);

/* =====================================================
   PARTICIPANT LIST
   ===================================================== */

/* =====================================================
   PARTICIPANT LIST
   ===================================================== */

socket.on(
    "participantList",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "PARTICIPANT LIST"
        );

        console.log(
            data
        );

        console.log(
            "=========================================="
        );


        /*
        -------------------------------------------------
        SAVE PARTICIPANTS IN CENTRAL CONFIG
        -------------------------------------------------
        */

        window.MeetingConfig.participants =
            data.participants || [];


        /*
        -------------------------------------------------
        UPDATE PARTICIPANT MANAGER
        -------------------------------------------------
        */

        MeetingParticipants.clear();


        window.MeetingConfig.participants
            .forEach(
                participant => {

                    MeetingParticipants.set(
                        participant
                    );

                }
            );


        /*
        -------------------------------------------------
        RENDER UI
        -------------------------------------------------
        */

        MeetingUI.render();


        /*
        =================================================
        CONNECT TEACHER TO EXISTING STUDENTS
        =================================================
        */

        if (
            window.MeetingConfig &&
            window.MeetingConfig.role === "teacher" &&
            window.MeetingWebRTC &&
            MeetingWebRTC.getLocalStream()
        ) {

            window.MeetingConfig.participants
                .forEach(
                    participant => {

                        if (
                            participant.role !== "student"
                        ) {

                            return;

                        }


                        if (
                            !participant.socketId
                        ) {

                            return;

                        }


                        console.log(
                            "TEACHER CONNECTING TO EXISTING STUDENT:",
                            participant.socketId
                        );


                        MeetingWebRTC.createOffer(
                            participant.socketId
                        )
                        .catch(
                            error => {

                                console.error(
                                    "EXISTING STUDENT WEBRTC OFFER ERROR:",
                                    error
                                );

                            }
                        );

                    }
                );

        }

    }
);
/* =====================================================
   PARTICIPANT JOINED
   ===================================================== */

socket.on(
    "participantJoined",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "PARTICIPANT JOINED"
        );

        console.log(
            data.participant
        );

        console.log(
            "=========================================="
        );


        if (!data.participant) {

            return;

        }


        MeetingParticipants.set(
            data.participant
        );


        MeetingUI.render();

       /*
=====================================================
AUTOMATIC WEBRTC CONNECTION
=====================================================

ONLY TEACHER CREATES THE OFFER.

Teacher:
    OFFER
        ↓
Student:
    ANSWER

Student NEVER creates an offer.
=====================================================
*/

if (
    window.MeetingConfig &&
window.MeetingConfig.role === "teacher" &&
    window.MeetingWebRTC &&
    data.participant.socketId &&
    MeetingWebRTC.getLocalStream()
) {

    console.log(
        "TEACHER CREATING WEBRTC OFFER FOR:",
        data.participant.socketId
    );


    MeetingWebRTC.createOffer(
        data.participant.socketId
    )
    .catch(
        error => {

            console.error(
                "TEACHER WEBRTC OFFER ERROR:",
                error
            );

        }
    );

}


        MeetingUI.setStatus(
            `${data.participant.name} joined the classroom.`
        );


        setTimeout(
            () => {

                MeetingUI.setStatus(
                    "You have joined the classroom."
                );

            },
            2500
        );

    }
);

/* =====================================================
   WEBRTC OFFER
   ===================================================== */

socket.on(
    "offer",
    async (data) => {

        console.log(
            "WEBRTC OFFER RECEIVED:",
            data
        );


        if (
            !window.MeetingWebRTC ||
            !data.senderSocketId ||
            !data.offer
        ) {

            return;

        }


        try {

            await MeetingWebRTC.receiveOffer(
                data.senderSocketId,
                data.offer
            );


            console.log(
                "WEBRTC OFFER PROCESSED"
            );

        }

        catch (error) {

            console.error(
                "WEBRTC OFFER PROCESSING ERROR:",
                error
            );

        }

    }
);

/* =====================================================
   WEBRTC ANSWER
   ===================================================== */

socket.on(
    "answer",
    async (data) => {

        console.log(
            "WEBRTC ANSWER RECEIVED:",
            data
        );


        if (
            !window.MeetingWebRTC ||
            !data.senderSocketId ||
            !data.answer
        ) {

            return;

        }


        try {

            await MeetingWebRTC.receiveAnswer(
                data.senderSocketId,
                data.answer
            );


            console.log(
                "WEBRTC ANSWER PROCESSED"
            );

        }

        catch (error) {

            console.error(
                "WEBRTC ANSWER PROCESSING ERROR:",
                error
            );

        }

    }
);

/* =====================================================
   WEBRTC ICE CANDIDATE
   ===================================================== */

socket.on(
    "ice-candidate",
    async (data) => {

        console.log(
            "WEBRTC ICE RECEIVED:",
            data
        );


        if (
            !window.MeetingWebRTC ||
            !data.senderSocketId ||
            !data.candidate
        ) {

            return;

        }


        try {

            await MeetingWebRTC.receiveIce(
                data.senderSocketId,
                data.candidate
            );


            console.log(
                "WEBRTC ICE PROCESSED"
            );

        }

        catch (error) {

            console.error(
                "WEBRTC ICE PROCESSING ERROR:",
                error
            );

        }

    }
);
/* =====================================================
   PARTICIPANT RECONNECTED
   ===================================================== */

socket.on(
    "participantReconnected",
    (data) => {

        console.log(
            "PARTICIPANT RECONNECTED",
            data
        );


        if (!data.participant) {

            return;

        }


        if (data.oldSocketId) {

            MeetingParticipants.remove(
                data.oldSocketId
            );

        }


        MeetingParticipants.set(
            data.participant
        );


        MeetingUI.render();

    }
);

/* =====================================================
   PARTICIPANT LEFT
   ===================================================== */

socket.on(
    "participantLeft",
    (data) => {

        console.log(
            "PARTICIPANT LEFT",
            data
        );


        MeetingParticipants.remove(
            data.socketId
        );


        MeetingUI.render();


        if (data.name) {

            MeetingUI.setStatus(
                `${data.name} left the classroom.`
            );

        }

    }
);

/* =====================================================
   ROOM PARTICIPANTS
   ===================================================== */

socket.on(
    "roomParticipants",
    (data) => {

        console.log(
            "=========================================="
        );

        console.log(
            "ROOM PARTICIPANTS"
        );

        console.log(
            data
        );

        console.log(
            "=========================================="
        );


        MeetingParticipants.clear();


        (data.participants || [])
            .forEach(
                participant => {

                    MeetingParticipants.set(
                        participant
                    );

                }
            );


        window.MeetingConfig.counts =
            data.counts || {};


        window.MeetingConfig.capacity =
            data.capacity || {};


        MeetingUI.render();


        console.log(
            "Founder:",
            data.counts?.founder
        );


        console.log(
            "Teachers:",
            data.counts?.teachers
        );


        console.log(
            "Students:",
            data.counts?.students
        );


        console.log(
            "Total:",
            data.counts?.total
        );

    }
);

        /* =====================================================
           SOCKET DISCONNECT
           ===================================================== */

        socket.on(
            "disconnect",
            (reason) => {

                console.warn(
                    "SOCKET DISCONNECTED:",
                    reason
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#ef4444";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Disconnected";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Connection lost";

            }
        );


        /* =====================================================
           CONNECTION ERROR
           ===================================================== */

        socket.on(
            "connect_error",
            (error) => {

                console.error(
                    "SOCKET CONNECTION ERROR:",
                    error
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#ef4444";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Connection Error";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Unable to connect to classroom server";

            }
        );


        /* =====================================================
           RECONNECT ATTEMPT
           ===================================================== */

        socket.io.on(
            "reconnect_attempt",
            (attempt) => {

                console.log(
                    "RECONNECT ATTEMPT:",
                    attempt
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#f59e0b";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Reconnecting...";

            }
        );


        /* =====================================================
           RECONNECTED
           ===================================================== */

        socket.io.on(
            "reconnect",
            (attempt) => {

                console.log(
                    "SOCKET RECONNECTED:",
                    attempt
                );


                document.getElementById(
                    "connectionDot"
                ).style.background =
                    "#22c55e";


                document.getElementById(
                    "connectionText"
                ).textContent =
                    "Connected";


                document.getElementById(
                    "systemStatus"
                ).textContent =
                    "Connection restored";

            }
        );
       


        /* =====================================================
           GLOBAL SOCKET
           ===================================================== */

        window.MeetingSocket =
            socket;


        console.log(
            "MeetingConfig:",
            window.MeetingConfig
        );

        /* =====================================================
   INITIALIZE MEETING UI
   ===================================================== */

MeetingUI.init();

    </script>
