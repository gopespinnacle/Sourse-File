<style>

.register-page {

    padding: 25px;

}

.register-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;

}

.register-header h1 {

    margin: 0;

    color: #12395f;

}

.filters {

    display: flex;

    flex-wrap: wrap;

    gap: 15px;

    background: white;

    padding: 18px;

    border-radius: 10px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

    margin-bottom: 20px;

}

.filter-group {

    display: flex;

    flex-direction: column;

    gap: 6px;

}

.filter-group label {

    font-weight: 600;

    color: #333;

}

.filter-group input,
.filter-group select {

    padding: 9px 11px;

    border: 1px solid #ccd5df;

    border-radius: 6px;

    min-width: 180px;

}

.filter-button {

    align-self: end;

    padding: 10px 18px;

    background: #12395f;

    color: white;

    border: none;

    border-radius: 6px;

    cursor: pointer;

    font-weight: 600;

}

.summary {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 20px;

}

.summary-card {

    background: white;

    padding: 18px;

    border-radius: 10px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

}

.summary-title {

    font-size: 14px;

    color: #666;

}

.summary-value {

    font-size: 25px;

    font-weight: 700;

    color: #12395f;

    margin-top: 5px;

}

.table-container {

    background: white;

    border-radius: 10px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

    overflow-x: auto;

}

.register-table {

    width: 100%;

    border-collapse: collapse;

    min-width: 1100px;

}

.register-table th {

    background: #12395f;

    color: white;

    padding: 12px 10px;

    text-align: left;

    font-size: 14px;

}

.register-table td {

    padding: 12px 10px;

    border-bottom: 1px solid #e5e7eb;

    vertical-align: top;

    font-size: 14px;

}

.register-table tbody tr:hover {

    background: #f8fafc;

}

.status-present {

    color: #16803c;

    font-weight: 700;

}

.status-absent {

    color: #c62828;

    font-weight: 700;

}

.attendance-present {

    color: #16803c;

    font-weight: 600;

}

.attendance-absent {

    color: #c62828;

    font-weight: 600;

}

.leave-row {

    background: #fff5f5;

}

.loading {

    text-align: center;

    padding: 35px;

    color: #666;

}

.error-message {

    text-align: center;

    padding: 25px;

    color: #c62828;

}

.no-data {

    text-align: center;

    padding: 35px;

    color: #777;

}

@media (max-width: 800px) {

    .register-page {

        padding: 15px;

    }

    .register-header {

        align-items: flex-start;

        flex-direction: column;

    }

    .summary {

        grid-template-columns: 1fr;

    }

    .filters {

        flex-direction: column;

    }

    .filter-group input,
    .filter-group select {

        width: 100%;

        box-sizing: border-box;

    }

    .filter-button {

        align-self: stretch;

    }

}

</style>

<!-- MAIN CONTENT -->

<div class="main-content">

<div class="register-page">


    <!-- HEADER -->

    <div class="register-header">

        <h1>

            <i class="fa fa-clipboard-list"></i>

    </div>


    <!-- FILTERS -->

    <!-- SUMMARY -->

            </div>

            </div>

                class="summary-value"
                id="conductedCount"
            >

                0

            </div>

                Teacher Leave

            </div>

            <div
                class="summary-value"

                    <th>Grade</th>

<script>


const API_BASE =
    "https://academy-backend-eatl.onrender.com";


const token =
    localStorage.getItem("token");

    let currentRegisters = [];


/* =================================================
   AUTHENTICATION
================================================= */

if (!token) {

    window.location.href =
        "founder-login.html";

}


/* =================================================
   LOAD TEACHERS
================================================= */

async function loadTeachers() {

    const select =
        document.getElementById(
            "teacherFilter"
        );

        select.innerHTML = `
    <option value="">
        All Teachers
    </option>
`;

    try {

        const response =
            await fetch(
                `${API_BASE}/api/founder/teachers`,
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load teachers"
            );

        }


        const teachers =
            data.teachers ||
            data.data ||
            data;


        teachers.forEach(
            teacher => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    teacher._id ||
                    teacher.id;

                option.textContent =
                    `${teacher.name || "Teacher"}`
                    +
                    (
                        teacher.teacherId
                            ? ` (${teacher.teacherId})`
                            : ""
                    );

                select.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(
            "TEACHER LOAD ERROR:",
            error
        );

    }

}


/* =================================================
   LOAD DAILY REGISTER
================================================= */

async function loadRegister() {

    const tbody =
        document.getElementById(
            "registerTableBody"
        );


    tbody.innerHTML = `

        <tr>

            <td
                colspan="11"
                class="loading"
            >

                Loading...

            </td>

        </tr>

    `;


    /* ================= FILTER VALUES ================= */

    const month =
        document.getElementById(
            "registerMonth"
        ).value;


    const teacher =
        document.getElementById(
            "teacherFilter"
        ).value;


    const student =
        document.getElementById(
            "studentFilter"
        ).value;


    /* ================= API PARAMETERS ================= */

    const params =
        new URLSearchParams();


    if (teacher) {

        params.append(
            "teacher",
            teacher
        );

    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/founder/daily-class-register?${params.toString()}`,
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load register"
            );

        }


        let registers =
            data.data || [];


        /* =================================================
           FILTER BY MONTH
        ================================================= */

        if (month) {

            const [
                selectedYear,
                selectedMonth
            ] =
                month
                    .split("-")
                    .map(Number);


            registers =
                registers.filter(
                    register => {

                        if (!register.date) {

                            return false;

                        }


                        const registerDate =
                            new Date(
                                register.date
                            );


                        return (

                            registerDate.getFullYear()
                            ===
                            selectedYear

                            &&

                            registerDate.getMonth() + 1
                            ===
                            selectedMonth

                        );

                    }
                );

        }


       

        /* =========================================
   APPLY STUDENT FILTER
   FILTER STUDENTS INSIDE EACH CLASS
========================================= */
let filteredRegisters = registers;
if (student) {

    

    filteredRegisters =
        filteredRegisters
            .map(register => {

                const students =
                    Array.isArray(
                        register.students
                    )
                        ? register.students
                        : [];


                const matchingStudents =
                    students.filter(
                        item => {

                            const studentId =
                                String(
                                    item.studentId ||
                                    ""
                                );


                            const mongoStudentId =
                                String(
                                    item.student ||
                                    ""
                                );


                            return (
                                studentId
                                ===
                                String(student)
                            )
                            ||
                            (
                                mongoStudentId
                                ===
                                String(student)
                            );

                        }
                    );


                if (
                    matchingStudents.length === 0
                ) {

                    return null;

                }


                return {

                    ...register,

                    students:
                        matchingStudents

                };

            })
            .filter(
                register => register !== null
            );

}

        currentRegisters =
    filteredRegisters;

populateStudentFilter(
    registers
);

renderRegister(
    filteredRegisters
);


    } catch (error) {

        console.error(
            "DAILY REGISTER ERROR:",
            error
        );


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="11"
                    class="error-message"
                >

                    Error loading daily class register.

                </td>

            </tr>

        `;

    }

}
/* =================================================
   BUILD STUDENT FILTER
================================================= */

function populateStudentFilter(
    registers
) {

    const select =
        document.getElementById(
            "studentFilter"
        );


    const currentValue =
        select.value;


    const students =
        new Map();


    registers.forEach(
        register => {

            const list =
                Array.isArray(
                    register.students
                )
                    ? register.students
                    : [];


            list.forEach(
                student => {

                    const id =
                        student.studentId ||
                        student.student ||
                        "";


                    if(!id){

                        return;

                    }


                    students.set(
                        String(id),
                        {
                            id:
                                id,

                            name:
                                student.studentName ||
                                "Student"
                        }
                    );

                }
            );

        }
    );


    select.innerHTML = `

        <option value="">

            All Students

        </option>

    `;


    Array.from(
        students.values()
    )
    .sort(
        (a,b) =>
            a.name.localeCompare(
                b.name
            )
    )
    .forEach(
        student => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                student.id;


            option.textContent =
                `${student.name} (${student.id})`;


            select.appendChild(
                option
            );

        }
    );


    if(
        currentValue &&
        students.has(
            String(currentValue)
        )
    ){

        select.value =
            currentValue;

    }

}

/* =================================================
   RENDER REGISTER
================================================= */

function renderRegister(
    registers
) {

    const tbody =
        document.getElementById(
            "registerTableBody"
        );


    tbody.innerHTML = "";


    let conducted =
        0;

    let leaves =
        0;


    registers.forEach(
        register => {


            const teacher =
                register.teacher ||
                {};


            const teacherName =
                teacher.name ||
                "Teacher";


            const teacherId =
                teacher.teacherId ||
                "-";


            const date =
                formatDate(
                    register.date
                );


            const time =
                `${register.scheduledStartTime || "-"}`
                +
                ` - `
                +
                `${register.scheduledEndTime || "-"}`;


            const isAbsent =
                register.teacherStatus ===
                "Absent";


            if (isAbsent) {

                leaves++;

            } else {

                conducted++;

            }


            /* =====================================
               TEACHER ABSENT / LEAVE
            ===================================== */

            if (isAbsent) {

                const row =
                    document.createElement(
                        "tr"
                    );

                row.className =
                    "leave-row";


                row.innerHTML = `

                    <td>${date}</td>

                    <td>${time}</td>

                    <td>${escapeHtml(teacherName)}</td>

                    <td>${escapeHtml(teacherId)}</td>

                    <td>${escapeHtml(register.className || "-")}</td>

                    <td>${escapeHtml(register.subject || "-")}</td>

                    <td>—</td>

                    <td>—</td>

                    <td>—</td>

                    <td>—</td>

                    <td class="status-absent">

                        Absent / Leave

                    </td>

                `;


                tbody.appendChild(
                    row
                );

                return;

            }


            /* =====================================
               CONDUCTED CLASS
            ===================================== */

            const students =
                Array.isArray(
                    register.students
                )
                    ? register.students
                    : [];


            if (!students.length) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>${date}</td>

                    <td>${time}</td>

                    <td>${escapeHtml(teacherName)}</td>

                    <td>${escapeHtml(teacherId)}</td>

                    <td>${escapeHtml(register.className || "-")}</td>

                    <td>${escapeHtml(register.subject || "-")}</td>

                    <td>—</td>

                    <td>—</td>

                    <td>—</td>

                    <td>${escapeHtml(register.topicCovered || "-")}</td>

                    <td class="status-present">

                        Present

                    </td>

                `;


                tbody.appendChild(
                    row
                );

                return;

            }


            students.forEach(
                student => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    const attendance =
                        student.attendance ||
                        "-";


                    const attendanceClass =
                        attendance === "Present"
                            ? "attendance-present"
                            : "attendance-absent";


                    row.innerHTML = `

                        <td>${date}</td>

                        <td>${time}</td>

                        <td>${escapeHtml(teacherName)}</td>

                        <td>${escapeHtml(teacherId)}</td>

                        <td>${escapeHtml(register.className || "-")}</td>

                        <td>${escapeHtml(register.subject || "-")}</td>

                        <td>${escapeHtml(student.studentName || "-")}</td>

                        <td>${escapeHtml(student.studentId || "-")}</td>

                        <td class="${attendanceClass}">

                            ${escapeHtml(attendance)}

                        </td>

                        <td>${escapeHtml(register.topicCovered || "-")}</td>

                        <td class="status-present">

                            Present

                        </td>

                    `;


                    tbody.appendChild(
                        row
                    );

                }
            );

        }
    );


    document.getElementById(
        "sessionCount"
    ).innerText =
        registers.length;


    document.getElementById(
        "conductedCount"
    ).innerText =
        conducted;


    document.getElementById(
        "leaveCount"
    ).innerText =
        leaves;


    if (!registers.length) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="11"
                    class="no-data"
                >

                    No class register records found.

                </td>

            </tr>

        `;

    }

}


/* =================================================
   DATE FORMAT
================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (isNaN(date.getTime())) {

        return "-";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =================================================
   HTML SAFETY
================================================= */

function escapeHtml(
    value
) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

function loadPDFImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.onload =
                () => resolve(img);

            img.onerror =
                () => reject(
                    new Error(
                        "Logo could not be loaded."
                    )
                );

            img.src = src;

        }
    );

}

/* =================================================
   EXPORT PDF
================================================= */

async function exportRegisterPDF() {

    /* =========================================
       CHECK DATA
    ========================================= */

    if (
        !Array.isArray(currentRegisters) ||
        currentRegisters.length === 0
    ) {

        alert(
            "There are no class register records to export."
        );

        return;

    }


    /* =========================================
       CREATE PDF
    ========================================= */

    const {
        jsPDF
    } = window.jspdf;

    const logo =
    await loadPDFImage(
        "images/logo.png"
    );


    const doc =
        new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: "a4"
        });


    /* =========================================
       SELECTED FILTERS
    ========================================= */

    const month =
        document.getElementById(
            "registerMonth"
        ).value;


    const studentSelect =
        document.getElementById(
            "studentFilter"
        );


    const teacherSelect =
        document.getElementById(
            "teacherFilter"
        );


    const studentText =
        studentSelect.options[
            studentSelect.selectedIndex
        ]?.text ||
        "All Students";


    const teacherText =
        teacherSelect.options[
            teacherSelect.selectedIndex
        ]?.text ||
        "All Teachers";


    let monthText =
        "All Months";


    if (month) {

        const [
            year,
            monthNumber
        ] =
            month.split("-");


        const date =
            new Date(
                Number(year),
                Number(monthNumber) - 1,
                1
            );


        monthText =
            date.toLocaleDateString(
                "en-IN",
                {
                    month: "long",
                    year: "numeric"
                }
            );

    }


    /* =========================================
       ACADEMY HEADER
    ========================================= */

   /* =========================================
   LOGO — TOP LEFT
========================================= */

doc.addImage(
    logo,
    "PNG",
    10,
    8,
    42,
    18
);


/* =========================================
   PDF TITLE
========================================= */

doc.setFont(
    "helvetica",
    "bold"
);

doc.setFontSize(16);

doc.text(
    "DAILY CLASS REGISTER",
    148.5,
    17,
    {
        align: "center"
    }
);


    doc.setFontSize(13);


    doc.text(
        "DAILY CLASS REGISTER",
        148.5,
        23,
        {
            align: "center"
        }
    );


    /* =========================================
       FILTER INFORMATION
    ========================================= */

    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.setFontSize(9);


    doc.text(
        `Month: ${monthText}`,
        14,
        32
    );


    doc.text(
        `Student: ${studentText}`,
        14,
        38
    );


    doc.text(
        `Teacher: ${teacherText}`,
        14,
        44
    );


    /* =========================================
       SUMMARY
    ========================================= */

    let conducted =
        0;

    let teacherLeave =
        0;


    currentRegisters.forEach(
        register => {

            if (
                register.teacherStatus ===
                "Absent"
            ) {

                teacherLeave++;

            } else {

                conducted++;

            }

        }
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        `Class Sessions: ${currentRegisters.length}`,
        175,
        32
    );


    doc.text(
        `Conducted Classes: ${conducted}`,
        175,
        38
    );


    doc.text(
        `Teacher Leave: ${teacherLeave}`,
        175,
        44
    );


    /* =========================================
       BUILD TABLE ROWS
    ========================================= */

    const rows = [];


    currentRegisters.forEach(
        register => {

            const date =
                formatDate(
                    register.date
                );


            const time =
                `${register.scheduledStartTime || "-"}`
                +
                ` - `
                +
                `${register.scheduledEndTime || "-"}`;


            const teacher =
                register.teacher ||
                {};


            const teacherName =
                teacher.name ||
                "Teacher";


            const teacherId =
                teacher.teacherId ||
                "-";


            const grade =
                register.className ||
                "-";


            const subject =
                register.subject ||
                "-";


            const topic =
                register.topicCovered ||
                "-";


            /* =================================
               TEACHER ABSENT
            ================================= */

            if (
                register.teacherStatus ===
                "Absent"
            ) {

                rows.push([

                    date,

                    time,

                    teacherName,

                    teacherId,

                    grade,

                    subject,

                    "-",

                    "-",

                    "-",

                    "-",

                    "Absent / Leave"

                ]);


                return;

            }


            /* =================================
               STUDENTS
            ================================= */

            const students =
                Array.isArray(
                    register.students
                )
                    ? register.students
                    : [];


            if (
                students.length === 0
            ) {

                rows.push([

                    date,

                    time,

                    teacherName,

                    teacherId,

                    grade,

                    subject,

                    "-",

                    "-",

                    "-",

                    topic,

                    "Present"

                ]);


                return;

            }


            students.forEach(
                student => {

                    rows.push([

                        date,

                        time,

                        teacherName,

                        teacherId,

                        grade,

                        subject,

                        student.studentName ||
                            "-",

                        student.studentId ||
                            "-",

                        student.attendance ||
                            "-",

                        topic,

                        "Present"

                    ]);

                }
            );

        }
    );


    /* =========================================
       PDF TABLE
    ========================================= */

    doc.autoTable({

        startY: 50,

        head: [[

            "Date",

            "Time",

            "Teacher",

            "Teacher ID",

            "Grade",

            "Subject",

            "Student",

            "Student ID",

            "Attendance",

            "Topic Covered",

            "Status"

        ]],

        body: rows,

        theme: "grid",

        styles: {

            font: "helvetica",

            fontSize: 7,

            cellPadding: 2,

            valign: "middle"

        },

        headStyles: {

            fontStyle: "bold",

            halign: "center"

        },

        columnStyles: {

            0: {
                cellWidth: 20
            },

            1: {
                cellWidth: 23
            },

            2: {
                cellWidth: 28
            },

            3: {
                cellWidth: 20
            },

            4: {
                cellWidth: 17
            },

            5: {
                cellWidth: 20
            },

            6: {
                cellWidth: 27
            },

            7: {
                cellWidth: 20
            },

            8: {
                cellWidth: 22
            },

            9: {
                cellWidth: 32
            },

            10: {
                cellWidth: 25
            }

        },

        didParseCell:
            function(data) {

                if (
                    data.section ===
                    "body"
                ) {

                    const status =
                        data.row.raw[10];


                    const attendance =
                        data.row.raw[8];


                    if (
                        status ===
                        "Absent / Leave"
                    ) {

                        data.cell.styles
                            .fontStyle =
                            "bold";

                    }


                    if (
                        attendance ===
                        "Absent"
                    ) {

                        data.cell.styles
                            .fontStyle =
                            "bold";

                    }

                }

            },

        margin: {

            left: 8,

            right: 8

        }

    });


    /* =========================================
       FOOTER
    ========================================= */

    const pageCount =
        doc.internal
            .getNumberOfPages();


    for (
        let page = 1;
        page <= pageCount;
        page++
    ) {

        doc.setPage(
            page
        );


        doc.setFontSize(
            8
        );


        doc.setFont(
            "helvetica",
            "normal"
        );


        doc.text(
            `Gopes Pinnacle Academy | Daily Class Register | Page ${page} of ${pageCount}`,
            148.5,
            202,
            {
                align: "center"
            }
        );

    }


    /* =========================================
       FILE NAME
    ========================================= */

    const safeMonth =
        month
            ? month
            : "all";


    const safeStudent =
        studentText
            .replace(
                /[^a-z0-9]+/gi,
                "-"
            )
            .replace(
                /^-+|-+$/g,
                ""
            );


    const fileName =
        `Daily-Class-Register-${safeMonth}-${safeStudent || "All-Students"}.pdf`;


    /* =========================================
       DOWNLOAD
    ========================================= */

    doc.save(
        fileName
    );

}


/* =================================================
   INITIAL LOAD
================================================= */

(async function () {

    await loadTeachers();

    await loadRegister();

})();




</script>

</body>

</html>
