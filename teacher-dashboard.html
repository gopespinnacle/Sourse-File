<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="overlay"
onclick="closeMenu()">
</div>

<div class="mobile-header">

    <button class="menu-btn"
    onclick="toggleMenu()">
        <i class="fa fa-bars"></i>
    </button>

    <div class="welcome-box">

    <div class="welcome-text">
        Welcome
    </div>

    <div id="mobileTeacherName"
    class="teacher-mobile-name">
    </div>

</div>

    <i class="fa fa-user-circle"></i>

</div>
<div class="sidebar">
    <h2>Academy ERP</h2>
    <ul>

        <li id="menu-dashboard">
            <i class="fa fa-chart-line"></i> Dashboard
        </li>

        <li id="menu-myClasses" onclick="goToClasses()">
            <i class="fa fa-book"></i> My Classes
        </li>

        <li id="menu-attendance">
            <i class="fa fa-calendar-check"></i> Attendance
        </li>

        <li id="menu-aiAssessment" onclick="location.href='teacher-ai-assessment.html'">
            <i class="fa fa-robot"></i> AI Assessment
        </li>

        <li id="menu-homework" onclick="location.href='teacher-homework.html'">
            <i class="fa fa-tasks"></i> Homework
        </li>

        <li id="menu-calendar" onclick="location.href='teacher-calendar.html'">
            <i class="fa fa-calendar-alt"></i> Calendar
        </li>

        <li id="menu-marksEntry">
            <i class="fa fa-pen"></i> Marks Entry
        </li>

        <li onclick="logout()">
            <i class="fa fa-sign-out-alt"></i> Logout
        </li>

    </ul>
</div>

<div class="main">

    <div class="topbar">
        <h3>Welcome, <span id="teacherName"></span></h3>
        <div class="profile">
            <i class="fa fa-user-circle"></i>
        </div>
    </div>

    <div class="cards">

      <div class="card" onclick="goToPeriods()">
    <i class="fa fa-book"></i>
    <h4>My Classes</h4>
    <p id="totalClasses">0</p>
</div>

        <div class="card" onclick="goToStudentsPage()">
            <i class="fa fa-users"></i>
            <h4>Total Students</h4>
            <p id="totalStudents">0</p>
        </div>

        


<div class="card" onclick="location.href='teacher-calendar.html'">

    <i class="fa fa-calendar-alt"></i>

    <h4>Calendar</h4>

    <p>View Academy Events</p>

</div>
    </div>

</div>

<div class="bottom-nav">

    <div onclick="location.href='teacher-dashboard.html'">
        <i class="fa fa-home"></i>
        <span>Home</span>
    </div>

    <div onclick="location.href='teacher-periods.html'">
        <i class="fa fa-book"></i>
        <span>Classes</span>
    </div>

    <div onclick="location.href='teacher-homework.html'">
        <i class="fa fa-tasks"></i>
        <span>Work</span>
    </div>

    <div onclick="location.href='teacher-calendar.html'">
    <i class="fa fa-calendar-alt"></i>
    <span>Calendar</span>
</div>

</div>

<script>
   
const name = sessionStorage.getItem("teacherName");
const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}

document.getElementById("teacherName").innerText = name || "";

document.getElementById(
    "mobileTeacherName"
).innerText =
name || "";

async function loadDashboard() {

    const res = await fetch(
        "https://academy-backend-eatl.onrender.com/api/teacher/classes",
        {
            headers: {
                "Authorization": "Bearer " + token
            }
        }
    );
if (!res.ok) {
    console.error("API failed:", res.status);
    return;
}
    /* GET PERIOD DATA */
const res2 = await fetch(
    "https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
    {
        headers: {
            "Authorization": "Bearer " + token
        }
    }
);

const data2 = await res2.json();

console.log(data2);

/* TOTAL PERIODS (My Classes) */
const totalClasses = data2.data.length;

/* UNIQUE STUDENTS */
let studentSet = new Set();

data2.data.forEach(p => {
    if(p.student){
        studentSet.add(p.student._id);
    }
});

const totalStudents = studentSet.size;

/* UPDATE UI */
animateNumber("totalClasses", totalClasses);
animateNumber("totalStudents", totalStudents);

    /* Assessments (this is OK) */
    const res3 = await fetch("https://academy-backend-eatl.onrender.com/api/teacher/assessments", {
        headers: { "Authorization": "Bearer " + token }
    });

    const data3 = await res3.json();
   // animateNumber("assessmentCount", data3.assessments.length);
}

function logout(){
    sessionStorage.clear();
    window.location.href = "teacher-login.html";
}

loadDashboard();
function animateNumber(id, number) {

    if (number === 0) {
        document.getElementById(id).innerText = 0;
        return;
    }

    let count = 0;

    const interval = setInterval(() => {
        count++;
        document.getElementById(id).innerText = count;

        if (count >= number) {
            clearInterval(interval);
        }
    }, 40);
}
function goToClasses(){
    window.location.href = "teacher-classes.html";
}
function goToPeriods(){
    window.location.href = "teacher-periods.html";
}
function goToStudentsPage(){
    window.location.href = "teacher-students.html";
}


function toggleMenu(){

    document
    .querySelector(".sidebar")
    .classList.toggle("show");

    document
    .querySelector(".overlay")
    .classList.toggle("show");

}

function closeMenu(){

    document
    .querySelector(".sidebar")
    .classList.remove("show");

    document
    .querySelector(".overlay")
    .classList.remove("show");

}

const permissions = JSON.parse(
sessionStorage.getItem("menuPermissions") || "{}"
);

Object.keys(permissions).forEach(menu=>{

    if(permissions[menu] === false){

        const item = document.getElementById("menu-" + menu);

        if(item){

            item.style.display = "none";

        }

    }

});
</script>

</body>
</html>
