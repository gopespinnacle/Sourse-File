<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gopes Pinnacle Academy - Annotation
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /*
        =====================================================
        MAIN ANNOTATION APPLICATION
        =====================================================
        */

        #annotationApp {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /*
        =====================================================
        TOP BAR
        =====================================================
        */

        #annotationTopBar {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;

    background: #171a1f;

    border-bottom:
        1px solid #2d333b;

    position: relative;

    z-index: 1000;

}


        #academyTitle {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: .3px;

    color: #ffffff;

}


        #materialTitle {

            font-size: 14px;

            color: #d1d5db;

        }


        /*
        =====================================================
        CONNECTION / STATUS
        =====================================================
        */

        #annotationStatus {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

        }


        #annotationStatusDot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }

        #annotationTopActions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            min-width: 0;
        }

        #joinClassFromAnnotation {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            background: #16a34a;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,.18);
        }

        #joinClassFromAnnotation:hover { background: #15803d; }
        #joinClassFromAnnotation:disabled { opacity: .65; cursor: wait; }

        @media (max-width: 700px) {
            #annotationTopActions { gap: 8px; }
            #joinClassFromAnnotation { padding: 8px 10px; font-size: 12px; }
            #annotationStatus { gap: 5px; font-size: 11px; }
        }


        /*
        =====================================================
        MAIN WORKSPACE
        =====================================================
        */

        
#annotationMain {

    flex: 1;

    position: relative;

    background: #e5e7eb;

    overflow: auto;

}

/*
=====================================================
ANNOTATION WORKSPACE
=====================================================
*/



#annotationWorkspaceV1 {
    position: absolute;
    isolation: isolate;

    width: min(210mm, calc(100% - 32px));
    aspect-ratio: 210 / 297;
    height: auto;

    left: 50%;
    top: 20px;
    bottom: auto;
    transform: translateX(-50%);

    background: #ffffff;
    overflow: hidden;

    border: 1.5px solid #000000;
    border-radius: 0;

    box-shadow: 0 4px 18px rgba(0, 0, 0, .15);
}

/* Notebook background is a separate layer and is never erased */
#annotationPageBackgroundV1 {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    display: block;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    z-index: 0;
    pointer-events: none;
    background-color: #fff;
}

/* Keep the canvas filling the A4 page */
#annotationCanvasV1 {
    position: absolute !important;
    inset: 0;
    z-index: 2 !important;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: auto !important;
    touch-action: none;
    background: transparent !important;
    cursor: crosshair;
}


/* A4 page inner margin — all four sides */
#annotationWorkspaceV1::before {
    content: "";
    position: absolute;
    top: 10mm;
    right: 10mm;
    bottom: 10mm;
    left: 10mm;
    border: 1.5px solid #000;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 10;
}




/*
=====================================================
ANNOTATION TOOLBAR V1
=====================================================
*/

#annotationToolbarV1 {

    position: absolute;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 2000;

}


        


        /*
        =====================================================
        MATERIAL INFORMATION
        =====================================================
        */

        #materialInfo {

    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;
    padding: 8px 20px;
    background: rgba(17, 24, 39, .94);
    border-radius: 20px;
    font-size: 13px;
    line-height: 1.25;
    text-align: center;
    pointer-events: none;
    max-width: calc(100% - 24px);
    white-space: normal;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 8px rgba(0,0,0,.16);
}

#materialInfo > div { margin: 1px 0; }
#materialSubject { font-weight: 700; }
#materialChapterNumber { font-size: 12px; color: #e5e7eb; }
#materialTopic { font-size: 12px; color: #f3f4f6; }


        /*
        =====================================================
        MOBILE
        =====================================================
        */

        @media (max-width: 700px) {

            #annotationTopBar {

                height: 52px;

                padding:
                    0 12px;

            }

            #academyTitle {

                font-size: 14px;

            }

            #materialTitle {

                display: none;

            }
            #annotationWorkspaceV1 {

    left: 8px;

    right: 8px;

    top: 10px;

    bottom: 10px;

    border-radius: 6px;

}

            

        }

        /*
===========================================================
CLOSE CONFIRMATION MODAL
===========================================================
*/

.annotationCloseOverlayV1 {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0, 0, 0, .65);

    backdrop-filter:
        blur(4px);

}


.annotationCloseDialogV1 {

    width: 420px;

    max-width: calc(100vw - 32px);

    padding: 28px;

    background: #171a1f;

    border:
        1px solid #343b45;

    border-radius: 16px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, .45);

    text-align: center;

}


.annotationCloseIconV1 {

    width: 48px;

    height: 48px;

    margin:
        0 auto 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #3a2f16;

    color: #fbbf24;

    font-size: 23px;

}


.annotationCloseTitleV1 {

    font-size: 19px;

    font-weight: 700;

    color: #ffffff;

    margin-bottom: 10px;

}


.annotationCloseMessageV1 {

    font-size: 14px;

    line-height: 1.6;

    color: #cbd5e1;

}


.annotationCloseActionsV1 {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

}


.annotationCloseButtonV1 {

    min-width: 105px;

    padding:
        10px 16px;

    border: none;

    border-radius: 8px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .15s ease,
        opacity .15s ease;

}


.annotationCloseButtonV1:hover {

    transform:
        translateY(-1px);

    opacity: .9;

}


.annotationCloseSaveButtonV1 {

    background: #2563eb;

    color: #ffffff;

}


.annotationCloseDontSaveButtonV1 {

    background: #374151;

    color: #ffffff;

}


.annotationCloseCancelButtonV1 {

    background: #111827;

    color: #d1d5db;

    border:
        1px solid #4b5563;

}


/*
===========================================================
MOBILE
===========================================================
*/

@media (max-width: 700px) {

    .annotationCloseDialogV1 {

        padding: 22px;

    }


    .annotationCloseActionsV1 {

        flex-direction: column;

    }


    .annotationCloseButtonV1 {

        width: 100%;

    }

}

    </style>

</head>

<!-- Learning material header values passed from period-students.html -->
<script>
(function populateAnnotationMaterialHeader(){
    const params = new URLSearchParams(window.location.search);
    let saved = {};
    try {
        saved = JSON.parse(sessionStorage.getItem("learningMaterialDetails") || "{}");
    } catch (error) {
        saved = {};
    }

    const subject = params.get("subject") || saved.subject || "Subject";
    const chapterNumber = params.get("chapterNumber") || saved.chapterNumber || "";
    const topic = params.get("topic") || saved.topic || "Topic";

    const subjectElement = document.getElementById("materialSubject");
    const chapterElement = document.getElementById("materialChapterNumber");
    const topicElement = document.getElementById("materialTopic");

    if (subjectElement) subjectElement.textContent = subject;
    if (chapterElement) chapterElement.textContent = chapterNumber ? "Chapter No. " + chapterNumber : "";
    if (topicElement) topicElement.textContent = topic;
})();
</script>

<script>
/*
===========================================================
JOIN THE LOGGED-IN TEACHER'S GOOGLE MEET FROM ANNOTATION
Uses the same backend endpoint as the existing Attend Class flow.
===========================================================
*/
async function joinClassFromAnnotation() {
    const button = document.getElementById("joinClassFromAnnotation");
    if (!button || button.disabled) return;

    // Open synchronously from the button click to avoid popup blockers.
    const meetWindow = window.open("about:blank", "_blank");
    if (!meetWindow) {
        alert("Please allow pop-ups for this website to join the class.");
        return;
    }

    button.disabled = true;
    const originalText = button.textContent;
    button.textContent = "Connecting...";

    try {
        const token = sessionStorage.getItem("token");
        if (!token) {
            meetWindow.close();
            alert("Your login session was not found. Please sign in again, then reopen the annotation page.");
            return;
        }

        const meetingResponse = await fetch(
            "https://academy-backend-eatl.onrender.com/api/teacher/my-meeting-link",
            {
                method: "GET",
                headers: { "Authorization": "Bearer " + token }
            }
        );

        let meetingData = {};
        try { meetingData = await meetingResponse.json(); } catch (_) {}

        if (!meetingResponse.ok || !meetingData.meetingLink) {
            meetWindow.close();
            alert(meetingData.message || "Google Meet link is not available for the logged-in teacher.");
            return;
        }

        // This endpoint resolves the unique meeting link for the logged-in teacher.
        meetWindow.location.href = meetingData.meetingLink;
        sessionStorage.setItem("teacherMeetingLink", meetingData.meetingLink);
    } catch (error) {
        console.error("ANNOTATION JOIN CLASS ERROR:", error);
        if (meetWindow && !meetWindow.closed) meetWindow.close();
        alert("Unable to open Google Meet. Please try again.");
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}
</script>

<!-- =====================================================
     SOCKET.IO
     REQUIRED FOR ANNOTATION PERSISTENCE
     ===================================================== -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>

/*
===========================================================
GOPES PINNACLE ACADEMY
STANDALONE ANNOTATION SOCKET
===========================================================

IMPORTANT:

The classroom already has a socket.

The standalone annotation page is a NEW browser tab,
so it needs its own Socket.IO connection.

AnnotationCanvasV1 expects:

    window.socket

===========================================================
*/

window.socket =
    io(
        "https://academy-backend-eatl.onrender.com",
        {

            transports: [
                "websocket",
                "polling"
            ],

            reconnection: true,

            reconnectionAttempts:
                Infinity,

            reconnectionDelay:
                1000,

            reconnectionDelayMax:
                5000,

            timeout:
                20000

        }
    );


/*
===========================================================
SOCKET CONNECTED
===========================================================
*/

window.socket.on(
    "connect",
    () => {

        console.log(
            "ANNOTATION TAB: SOCKET CONNECTED",
            window.socket.id
        );

    }
);


/*
===========================================================
SOCKET DISCONNECTED
===========================================================
*/

window.socket.on(
    "disconnect",
    reason => {

        console.warn(
            "ANNOTATION TAB: SOCKET DISCONNECTED",
            reason
        );

    }
);


/*
===========================================================
SOCKET ERROR
===========================================================
*/

window.socket.on(
    "connect_error",
    error => {

        console.error(
            "ANNOTATION TAB: SOCKET ERROR",
            error
        );

    }
);

</script>
