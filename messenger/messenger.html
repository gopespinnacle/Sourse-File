    <!-- =====================================================

    <style>

        /* =====================================================
           CONTACTS PANEL
           ===================================================== */

        .gpa-messenger-contacts {

            width: 300px;

            border-right: 1px solid #ddd;

            background: #ffffff;

            overflow-y: auto;

            flex-shrink: 0;
        }


        .gpa-messenger-contacts-header {

            padding: 18px;

            font-size: 20px;

            font-weight: bold;

            border-bottom: 1px solid #ddd;

        }


        .gpa-messenger-contact {

            padding: 14px 16px;

            border-bottom: 1px solid #eeeeee;

            cursor: pointer;

        }


        .gpa-messenger-contact:hover {

            background: #f5f7fb;

        }


        .gpa-messenger-contact-name {

            font-weight: 600;

            font-size: 15px;

        }

        
/* GPA Messenger unread message badge */
.gpa-messenger-unread-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 21px;
    height: 21px;
    padding: 0 6px;
    border-radius: 12px;
    background: #25d366;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    margin-left: 8px;
    flex-shrink: 0;
}

.gpa-messenger-contact-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
}



        .gpa-messenger-contact-info {

            margin-top: 4px;

            font-size: 13px;

            color: #777;

        }


        .gpa-messenger-contact-role {

            margin-top: 3px;

            font-size: 12px;

            color: #3155a6;

            text-transform: capitalize;

        }


        .gpa-messenger-contacts-loading {

            padding: 20px;

            color: #777;

        }


        .gpa-messenger-contacts-error {

            padding: 20px;

            color: #c62828;

        }


        /* =====================================================
           MESSENGER LAYOUT
           ===================================================== */

        .gpa-messenger-layout {

            display: flex;

            height: 100vh;

            width: 100%;

        }


        .gpa-messenger-chat-area {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

        }


        .gpa-primary-messenger-header {

            flex-shrink: 0;

        }

        /* Messenger online and last-seen status */

#gpaMessengerContactName {
    font-size: 16px;
    font-weight: 600;
}

.gpa-messenger-presence-status {
    margin-top: 3px;
    font-size: 12px;
    color: #777;
    min-height: 14px;
}

.gpa-messenger-presence-status.online {
    color: #16803c;
}


        #gpaPrimaryConversation {

            flex: 1;

            overflow-y: auto;

        }


        .gpa-primary-composer {

            flex-shrink: 0;

        }


        /* =====================================================
   MODULE 5
   CONTACT ROLE SECTIONS
   ===================================================== */

.gpa-messenger-contact-section {
    border-bottom: 1px solid #ddd;
}


.gpa-messenger-contact-section-title {

    padding: 12px 14px;

    background: #f1f4f9;

    font-size: 13px;

    font-weight: bold;

    color: #3155a6;

    position: sticky;

    top: 0;

    z-index: 2;

}

/* =====================================================
   MODULE 5
   STEP 7
   SELECTED CONTACT
   ===================================================== */

.gpa-messenger-contact {
    transition: background 0.15s ease;
}

.gpa-messenger-contact.selected {
    background: #e8eefc;
}

.gpa-messenger-contact:active {
    background: #dce6fa;
}




/* =========================================
   GPA MESSENGER - MOBILE UI ONLY
   Desktop layout remains unchanged
   ========================================= */

#mobileMessengerBack {
    display: none;
}


@media screen and (max-width: 600px) {

    html,
    body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .gpa-messenger-layout {
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
    }

    .gpa-messenger-contacts {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-width: 0;
        flex: 1;
        border-right: none;
        overflow: hidden;
        background: #fff;
    }

    .gpa-messenger-contacts-header {
        flex-shrink: 0;
        padding: 20px 18px;
        font-size: 22px;
        font-weight: 700;
        color: #075e54;
        background: #fff;
    }

    #gpaMessengerContacts {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .gpa-messenger-contact-section-title {
        padding: 12px 16px;
        font-size: 12px;
        background: #f1f4f8;
    }

    .gpa-messenger-contact {
        padding: 15px 16px;
        background: #fff;
    }

    .gpa-messenger-contact-name {
        font-size: 15px;
        overflow-wrap: anywhere;
    }

    .gpa-messenger-contact-info {
        font-size: 12px;
        overflow-wrap: anywhere;
    }

    /* Hide the chat until a contact is selected */
    .gpa-messenger-chat-area {
        display: none;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        flex: 1;
        overflow: hidden;
    }

    .gpa-messenger-layout.mobile-chat-open
    .gpa-messenger-contacts {
        display: none;
    }

    .gpa-messenger-layout.mobile-chat-open
    .gpa-messenger-chat-area {
        display: flex;
        flex-direction: column;
    }

    .gpa-primary-messenger-header {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 64px;
        padding: 10px 12px;
        box-sizing: border-box;
        background: #075e54;
        color: #fff;
    }

    #mobileMessengerBack {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: #fff;
        font-size: 28px;
    }

    .gpa-messenger-header-details {
        min-width: 0;
    }

    #gpaMessengerContactName {
        font-size: 16px;
        font-weight: 700;
        overflow-wrap: anywhere;
    }

    .gpa-messenger-presence-status {
        font-size: 12px;
        color: #e0f2f1;
    }

    #gpaPrimaryConversation {
        flex: 1;
        min-height: 0;
        width: 100%;
        padding: 12px 10px;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }

    .gpa-primary-composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-shrink: 0;
        width: 100%;
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #f7f7f7;
    }

    #gpaPrimaryMessageInput {
        flex: 1;
        min-width: 0;
        min-height: 42px;
        max-height: 120px;
        box-sizing: border-box;
        border-radius: 22px;
        font-size: 15px;
    }

    #gpaPrimarySendButton {
        flex-shrink: 0;
        min-height: 42px;
        border-radius: 22px;
        background: #128c7e;
        color: #fff;
    }
}

    <!-- =====================================================
         MODULE 5
         CONTACTS
         ===================================================== -->

    <script>

        /**
         * ====================================================
         * GPA MESSENGER
         * MODULE 5
         * LOAD CONTACTS
         * ====================================================
         */

       document.addEventListener(
    "DOMContentLoaded",
    function () {
        loadMessengerContacts();

        const backButton = document.getElementById(
            "mobileMessengerBack"
        );

        backButton?.addEventListener("click", function () {
            document.querySelector(".gpa-messenger-layout")
                ?.classList.remove("mobile-chat-open");
        });
    }
);

        async function loadMessengerContacts() {

            const contactsContainer =
                document.getElementById(
                    "gpaMessengerContacts"
                );


            // =================================================
            // GET EXISTING ACADEMY LOGIN TOKEN
            // =================================================

           
const token =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");



            if (!token) {

                

                contactsContainer.innerHTML = `
                    <div class="gpa-messenger-contacts-error">
                        Login required.
                    </div>
                `;

                console.error(
                    "[GPA MESSENGER CONTACTS] " +
                    "No login token found."
                );

                return;

            }


            try {

                // =============================================
                // CALL CONTACTS API
                // =============================================

                const response =
                    await fetch(
                        "https://academy-backend-eatl.onrender.com/api/messenger/contacts",
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "[GPA MESSENGER CONTACTS]",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load contacts."
                    );

                }


                // =============================================
                // DISPLAY CONTACTS
                // =============================================

                displayMessengerContacts(
                    data.contacts || []
                );


            } catch (error) {

                console.error(
                    "[GPA MESSENGER CONTACTS] " +
                    "Failed:",
                    error
                );


                contactsContainer.innerHTML = `

                    <div
                        class="gpa-messenger-contacts-error"
                    >
                        Unable to load contacts.
                    </div>

                `;

            }

        }


        function displayMessengerContacts(
    contacts
) {

    const contactsContainer =
        document.getElementById(
            "gpaMessengerContacts"
        );


    if (!contacts || contacts.length === 0) {

        contactsContainer.innerHTML = `

            <div
                class="gpa-messenger-contacts-loading"
            >
                No contacts found.
            </div>

        `;

        return;

    }


    // =====================================================
    // SEPARATE CONTACTS BY ROLE
    // =====================================================

    const founders =
    contacts.filter(
        contact =>
            contact.role === "founder"
    );

const students =
    contacts.filter(
        contact =>
            contact.role === "student"
    );

const teachers =
    contacts.filter(
        contact =>
            contact.role === "teacher"
    );

const admins =
    contacts.filter(
        contact =>
            contact.role === "admin"
    );

const parents =
    contacts.filter(
        contact =>
            contact.role === "parent"
    );


    // =====================================================
    // CREATE CONTACT SECTION
    // =====================================================

    function createContactSection(
        title,
        contactList
    ) {

        if (
            !contactList ||
            contactList.length === 0
        ) {

            return "";

        }


        let html = `

            <div
                class="gpa-messenger-contact-section"
            >

                <div
                    class="gpa-messenger-contact-section-title"
                >
                    ${title}
                </div>

        `;


        contactList.forEach(
            function (contact) {

                html += `

    <div
        class="gpa-messenger-contact"
        data-contact-id="${contact._id}"
        onclick="selectMessengerContact('${contact._id}')"
    >

       
<div class="gpa-messenger-contact-name-row">
    <div class="gpa-messenger-contact-name">
        ${escapeMessengerText(
            contact.name ||
            "Unknown"
        )}
    </div>

    <span
        class="gpa-messenger-unread-badge"
        data-unread-contact-id="${contact._id}"
        style="display: none;"
    >0</span>
</div>



        <div
            class="gpa-messenger-contact-info"
        >
            ${escapeMessengerText(
                contact.email ||
                ""
            )}
        </div>

    </div>

`;

            }
        );


        html += `

            </div>

        `;


        return html;

    }


    // =====================================================
    // DISPLAY SEPARATE ROLE SECTIONS
    // =====================================================

    window.GPAMessengerContacts =
    contacts;


    contactsContainer.innerHTML =

    createContactSection(
        "👑 FOUNDER",
        founders
    )

    +

    createContactSection(
        "👨‍🎓 STUDENTS",
        students
    )

    +

    createContactSection(
        "👨‍🏫 TEACHERS",
        teachers
    )

    +

    createContactSection(
        "👨‍💼 ADMINS",
        admins
    )

    +

    createContactSection(
        "👨‍👩‍👧 PARENTS",
        parents
    );

    window.updateGPAMessengerUnreadCounts(
    window.GPAMessengerUnreadCounts || {}
);

}

// =====================================================
// MODULE 5
// STEP 7
// SELECT CONTACT
// =====================================================

let selectedMessengerContact = null;


async function selectMessengerContact(
    contactId
) {

    console.log(
        "[GPA MESSENGER] Contact selected:",
        contactId
    );

    // Mobile UI: open the selected conversation
if (window.matchMedia("(max-width: 600px)").matches) {
    document.querySelector(".gpa-messenger-layout")
        ?.classList.add("mobile-chat-open");
}


    // =================================================
    // REMOVE PREVIOUS SELECTION
    // =================================================

    const allContacts =
        document.querySelectorAll(
            ".gpa-messenger-contact"
        );


    allContacts.forEach(
        function (contactElement) {

            contactElement.classList.remove(
                "selected"
            );

        }
    );


    // =================================================
    // SELECT CLICKED CONTACT
    // =================================================

    const selectedElement =
        document.querySelector(
            `.gpa-messenger-contact[data-contact-id="${contactId}"]`
        );


    if (selectedElement) {

        selectedElement.classList.add(
            "selected"
        );

    }


    // =================================================
    // FIND CONTACT DATA
    // =================================================

   
const token =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");



    // Contacts are stored from the API response.
    // Find the selected contact from the displayed list.

    if (
        window.GPAMessengerContacts &&
        Array.isArray(
            window.GPAMessengerContacts
        )
    ) {

        selectedMessengerContact =
            window.GPAMessengerContacts.find(
                function (contact) {

                    return (
                        String(contact._id) ===
                        String(contactId)
                    );

                }
            );

    }


    console.log(
        "[GPA MESSENGER] Selected contact:",
        selectedMessengerContact
    );

        // =================================================
    // MODULE 5
    // STEP 8
    // LOAD / CREATE CONVERSATION
    // =================================================

    if (!selectedMessengerContact) {

        console.error(
            "[GPA MESSENGER] No contact selected."
        );

        return;

    }


    const conversationToken =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");



    if (!conversationToken) {

        console.error(
            "[GPA MESSENGER] Login token not found."
        );

        return;

    }


    try {

        const response =
            await fetch(
                "https://academy-backend-eatl.onrender.com/api/messenger/conversation",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            conversationToken
                    },

                    body: JSON.stringify({

                        receiverId:
                            selectedMessengerContact._id

                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "[GPA MESSENGER] Conversation response:",
            data
        );


        if (
    data.success &&
    data.conversation
) {

    window.GPAMessengerConversation =
        data.conversation;

    // =================================================
    // STEP 10
    // STORE CURRENT CONVERSATION DETAILS
    // =================================================

    window.GPAMessengerConversationId =
        data.conversation._id;

    window.GPAMessengerReceiverId =
        selectedMessengerContact._id;

    console.log(
        "[GPA MESSENGER] Conversation ID:",
        window.GPAMessengerConversationId
    );

    console.log(
        "[GPA MESSENGER] Receiver ID:",
        window.GPAMessengerReceiverId
    );


    // =================================================
    // STEP 11
    // LOAD SELECTED CONVERSATION HISTORY
    // =================================================

    const conversationContainer =
        document.getElementById(
            "gpaPrimaryConversation"
        );

    if (window.GPAPrimaryUserChat && typeof window.GPAPrimaryUserChat.clearConversation === "function") {
        window.GPAPrimaryUserChat.clearConversation();
    } else if (conversationContainer) {
        conversationContainer.innerHTML = "";
    }

    if (
        window.GPAPrimaryUserSocket &&
        typeof window.GPAPrimaryUserSocket
            .loadConversationHistory ===
            "function"
    ) {

        window.GPAPrimaryUserSocket
            .loadConversationHistory(
                window.GPAMessengerConversationId
            );

    }

    
    if (
        window.GPAPrimaryUserSocket &&
        typeof window.GPAPrimaryUserSocket.requestContactPresence === "function"
    ) {
        window.GPAPrimaryUserSocket.requestContactPresence(
            selectedMessengerContact._id
        );
    }



} else {

    console.error(
        "[GPA MESSENGER] Conversation failed:",
        data
    );

}

    } catch (error) {

        console.error(
            "[GPA MESSENGER] Conversation API error:",
            error
        );

    }


    // =================================================
    // UPDATE CHAT HEADER
    // =================================================

    const header =
        document.querySelector(
            ".gpa-primary-messenger-header"
        );


    if (
    header &&
    selectedMessengerContact
) {
    const nameElement = document.getElementById(
        "gpaMessengerContactName"
    );

    if (nameElement) {
        nameElement.textContent =
            selectedMessengerContact.name || "Unknown";
    }

    if (
        typeof window.updateGPAMessengerPresenceDisplay ===
        "function"
    ) {
        window.updateGPAMessengerPresenceDisplay(
            selectedMessengerContact._id
        );
    }
}

}
        

function escapeMessengerText(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }

        
/* ================================================
   GPA MESSENGER - UNREAD COUNT BADGES
   ================================================ */


/* GPA Messenger - unread count badges */
window.GPAMessengerUnreadCounts = {};

window.updateGPAMessengerUnreadCounts = function (counts) {
    window.GPAMessengerUnreadCounts = counts || {};

    const badges = document.querySelectorAll(
        ".gpa-messenger-unread-badge"
    );

    badges.forEach(function (badge) {
        const contactId = String(
            badge.getAttribute("data-unread-contact-id")
        );

        const count = Number(
            window.GPAMessengerUnreadCounts[contactId] || 0
        );

        if (count > 0) {
            badge.textContent = count > 99 ? "99+" : String(count);
            badge.style.display = "inline-flex";
        } else {
            badge.textContent = "0";
            badge.style.display = "none";
        }
    });
};



        // ================================================
// GPA MESSENGER - ONLINE / LAST SEEN DISPLAY
// ================================================

window.updateGPAMessengerPresenceDisplay = function (contactId) {
    const statusElement = document.getElementById(
        "gpaMessengerPresenceStatus"
    );

    if (!statusElement) return;

    const presence = window.GPAMessengerPresence || {};
    const contactPresence = presence[String(contactId)];

    statusElement.classList.remove("online");

    if (!contactPresence) {
        statusElement.textContent = "";
        return;
    }

    if (contactPresence.isOnline) {
        statusElement.textContent = "● Online";
        statusElement.classList.add("online");
        return;
    }

    if (contactPresence.lastSeenAt) {
        const lastSeenDate = new Date(
            contactPresence.lastSeenAt
        );

        if (!Number.isNaN(lastSeenDate.getTime())) {
            statusElement.textContent =
                "Last seen " +
                lastSeenDate.toLocaleString([], {
                    day: "2-digit",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit"
                });

            return;
        }
    }

    statusElement.textContent = "Offline";
};


// Refresh the selected contact's status when a socket update arrives.
window.addEventListener(
    "gpa:primary:presence:update",
    function (event) {
        const selectedId =
            window.GPAMessengerReceiverId;

        if (
            selectedId &&
            event.detail &&
            String(event.detail.userId) === String(selectedId)
        ) {
            window.updateGPAMessengerPresenceDisplay(
                selectedId
            );
        }
    }
);
