<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daily Income & Expense</title>


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f9;

            color: #222;

        }


        /* ================= SIDEBAR ================= */

        .sidebar {

            position: fixed;

            left: 0;

            top: 0;

            bottom: 0;

            width: 165px;

            background: #17395f;

            color: white;

            overflow-y: auto;

            padding: 12px 8px;

        }


        .sidebar h2 {

            font-size: 18px;

            margin: 0 0 25px 5px;

        }


        .sidebar a {

            display: block;

            color: white;

            text-decoration: none;

            padding: 10px 8px;

            margin-bottom: 3px;

            border-radius: 4px;

            font-size: 14px;

        }


        .sidebar a:hover {

            background: #28527d;

        }


        .sidebar a.active {

            background: #28527d;

        }


        .sidebar i {

            width: 20px;

        }


        /* ================= MAIN ================= */

        .main {

            margin-left: 165px;

            padding: 25px;

            min-height: 100vh;

        }


        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .page-header h1 {

            margin: 0;

            color: #17395f;

            font-size: 28px;

        }


        /* ================= VIEW CONTROLS ================= */

        .controls {

            background: white;

            padding: 18px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

            margin-bottom: 20px;

        }


        .view-buttons {

            display: flex;

            gap: 8px;

            margin-bottom: 18px;

        }


        .view-btn {

            padding: 9px 20px;

            border: none;

            border-radius: 6px;

            background: #e8edf3;

            color: #17395f;

            cursor: pointer;

            font-weight: 600;

        }


        .view-btn.active {

            background: #17395f;

            color: white;

        }


        .filter-row {

            display: flex;

            gap: 15px;

            align-items: end;

            flex-wrap: wrap;

        }


        .filter-group {

            display: flex;

            flex-direction: column;

            gap: 6px;

        }


        .filter-group label {

            font-size: 13px;

            font-weight: 600;

            color: #555;

        }


        .filter-group input,

        .filter-group select {

            padding: 9px 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            min-width: 160px;

        }


        .filter-btn {

            padding: 9px 18px;

            border: none;

            border-radius: 5px;

            background: #17395f;

            color: white;

            cursor: pointer;

            font-weight: 600;

        }


        /* ================= SUMMARY ================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .summary-card {

            background: white;

            border-radius: 10px;

            padding: 18px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

        }


        .summary-card .label {

            font-size: 13px;

            color: #666;

            margin-bottom: 8px;

        }


        .summary-card .amount {

            font-size: 24px;

            font-weight: 700;

            color: #17395f;

        }


        /* ================= ADD BUTTON ================= */

        .add-section {

            display: flex;

            justify-content: flex-end;

            margin-bottom: 15px;

        }


        .add-btn {

            background: #17395f;

            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;

        }


        /* ================= TABLE ================= */

        .table-container {

            background: white;

            border-radius: 10px;

            padding: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;

        }


        th {

            background: #17395f;

            color: white;

            padding: 11px 9px;

            text-align: left;

            font-size: 13px;

        }


        td {

            padding: 11px 9px;

            border-bottom:
                1px solid #ddd;

            font-size: 13px;

        }


        tr:hover td {

            background: #f8fafc;

        }


        .income {

            color: #16803c;

            font-weight: 600;

        }


        .expense {

            color: #c62828;

            font-weight: 600;

        }


        .empty-row {

            text-align: center;

            padding: 35px;

            color: #777;

        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .sidebar {

                width: 60px;

            }


            .sidebar h2 {

                display: none;

            }


            .sidebar a {

                text-align: center;

                font-size: 0;

            }


            .sidebar i {

                font-size: 17px;

            }


            .main {

                margin-left: 60px;

                padding: 15px;

            }


            .page-header h1 {

                font-size: 22px;

            }


            .summary-grid {

                grid-template-columns: 1fr;

            }

        }

        /* ================= ADD TRANSACTION MODAL ================= */

.modal-overlay {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    z-index: 9999;

    align-items: center;

    justify-content: center;

}


.modal-box {

    background: white;

    width: 520px;

    max-width: 92%;

    border-radius: 10px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.2);

    overflow: hidden;

}


.modal-header {

    background: #17395f;

    color: white;

    padding: 15px 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.modal-header h2 {

    margin: 0;

    font-size: 20px;

}


.modal-close {

    background: none;

    border: none;

    color: white;

    font-size: 22px;

    cursor: pointer;

}


.modal-body {

    padding: 20px;

}


.form-group {

    margin-bottom: 15px;

}


.form-group label {

    display: block;

    margin-bottom: 6px;

    font-size: 13px;

    font-weight: 600;

    color: #444;

}


.form-group input,

.form-group select,

.form-group textarea {

    width: 100%;

    padding: 10px;

    border: 1px solid #ccc;

    border-radius: 5px;

    font-family: inherit;

    font-size: 14px;

}


.form-group textarea {

    min-height: 80px;

    resize: vertical;

}


.form-actions {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 20px;

}


.cancel-btn {

    padding: 10px 18px;

    border: 1px solid #ccc;

    background: #f3f3f3;

    border-radius: 5px;

    cursor: pointer;

}


.save-btn {

    padding: 10px 20px;

    border: none;

    background: #17395f;

    color: white;

    border-radius: 5px;

    cursor: pointer;

    font-weight: 600;

}


.save-btn:disabled {

    background: #999;

    cursor: not-allowed;

}


.form-message {

    display: none;

    padding: 10px;

    border-radius: 5px;

    margin-bottom: 15px;

    font-size: 13px;

}


.form-message.error {

    display: block;

    background: #fde8e8;

    color: #b42318;

}


.form-message.success {

    display: block;

    background: #e8f7ed;

    color: #16733c;

}


@media (max-width: 800px) {

    .modal-box {

        width: 95%;

    }

}

    </style>

    <script>

        const API_BASE =
            "https://academy-backend-eatl.onrender.com";


        let currentView =
            "day";

            let editingTransactionId = null;


        // ================= SET DEFAULT DATE =================

        function setDefaultDate() {

            const today =
                new Date();


            const year =
                today.getFullYear();


            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    today.getDate()
                ).padStart(2, "0");


            document.getElementById(
                "filterDate"
            ).value =
                `${year}-${month}-${day}`;


            document.getElementById(
                "filterMonth"
            ).value =
                `${year}-${month}`;

        }


        // ================= SET VIEW =================

        function setView(view) {

            currentView =
                view;


            const dayButton =
                document.getElementById(
                    "dayViewBtn"
                );


            const monthButton =
                document.getElementById(
                    "monthViewBtn"
                );


            const dayFilter =
                document.getElementById(
                    "dayFilter"
                );


            const monthFilter =
                document.getElementById(
                    "monthFilter"
                );


            if (view === "day") {

                dayButton.classList.add(
                    "active"
                );

                monthButton.classList.remove(
                    "active"
                );

                dayFilter.style.display =
                    "flex";

                monthFilter.style.display =
                    "none";

            } else {

                dayButton.classList.remove(
                    "active"
                );

                monthButton.classList.add(
                    "active"
                );

                dayFilter.style.display =
                    "none";

                monthFilter.style.display =
                    "flex";

            }

        }


        // ================= LOAD TRANSACTIONS =================

        async function loadTransactions() {

    try {

        const token =
            localStorage.getItem("token");


        if (!token) {

            alert(
                "Login session expired. Please login again."
            );

            return;

        }


        let url =
            `${API_BASE}/api/founder/finance-transactions`;


        // ================= DAY VIEW =================

        if (currentView === "day") {

            const date =
                document.getElementById(
                    "filterDate"
                ).value;


            if (!date) {

                alert(
                    "Please select a date."
                );

                return;

            }


            url +=
                `?view=day&date=${encodeURIComponent(date)}`;

        }


        // ================= MONTH VIEW =================

        else {

            const monthValue =
                document.getElementById(
                    "filterMonth"
                ).value;


            if (!monthValue) {

                alert(
                    "Please select a month."
                );

                return;

            }


            const parts =
                monthValue.split("-");


            const year =
                parts[0];


            const month =
                Number(parts[1]);


            url +=
                `?view=month&month=${month}&year=${year}`;

        }


        console.log(
            "FINANCE REPORT URL:",
            url
        );


        const response =
            await fetch(
                url,
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await response.json();


        console.log(
            "FINANCE REPORT:",
            data
        );


        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Unable to load finance report."
            );

            return;

        }


        // ================= UPDATE TOTALS =================

        document.getElementById(
            "totalIncome"
        ).textContent =
            formatCurrency(
                data.totals.totalIncome
            );


        document.getElementById(
            "totalExpense"
        ).textContent =
            formatCurrency(
                data.totals.totalExpense
            );


        document.getElementById(
            "netBalance"
        ).textContent =
            formatCurrency(
                data.totals.netBalance
            );


        // ================= UPDATE TABLE =================

        renderTransactions(
            data.transactions
        );


    } catch (error) {

        console.error(
            "LOAD FINANCE TRANSACTIONS ERROR:",
            error
        );

        alert(
            "Unable to load finance transactions."
        );

    }

}


        // ================= ADD TRANSACTION =================

        function openAddTransaction() {

    editingTransactionId = null;


    const modal =
        document.getElementById(
            "transactionModal"
        );


    const form =
        document.getElementById(
            "transactionForm"
        );


    form.reset();


    clearFormMessage();


    document.getElementById(
        "transactionDate"
    ).value =

        document.getElementById(
            "filterDate"
        ).value ||

        getTodayDate();


    document.getElementById(
        "transactionCategory"
    ).innerHTML = `

        <option value="">
            Select Category
        </option>

    `;


    document.getElementById(
        "transactionSubCategory"
    ).innerHTML = `

        <option value="">
            Select Sub Category
        </option>

    `;


    document.querySelector(
        ".modal-header h2"
    ).innerHTML = `

        <i class="fa fa-wallet"></i>

        Add Income / Expense

    `;


    document.getElementById(
        "saveTransactionBtn"
    ).innerHTML = `

        <i class="fa fa-save"></i>

        Save Transaction

    `;


    modal.style.display =
        "flex";

}

async function editTransaction(
    transactionId
) {

    try {

        const token =
            localStorage.getItem(
                "token"
            );


        if (!token) {

            alert(
                "Login session expired. Please login again."
            );

            return;

        }


        const response =
            await fetch(

                `${API_BASE}/api/founder/finance-transactions`,

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to load transaction."
            );

            return;

        }


        const transaction =
            data.transactions.find(

                item =>
                    item._id === transactionId

            );


        if (!transaction) {

            alert(
                "Transaction not found."
            );

            return;

        }


        editingTransactionId =
            transactionId;


        // ================= OPEN FORM =================

        document.getElementById(
            "transactionModal"
        ).style.display =
            "flex";


        clearFormMessage();


        // ================= DATE =================

        const transactionDate =
            new Date(
                transaction.date
            );


        const year =
            transactionDate
                .getFullYear();


        const month =
            String(
                transactionDate.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                transactionDate.getDate()
            ).padStart(2, "0");


        document.getElementById(
            "transactionDate"
        ).value =
            `${year}-${month}-${day}`;


        // ================= TYPE =================

        document.getElementById(
            "transactionType"
        ).value =
            transaction.type;


        // ================= LOAD CATEGORIES =================

        await loadTransactionCategories();


        // ================= CATEGORY =================

        document.getElementById(
            "transactionCategory"
        ).value =
            transaction.category;


        // ================= LOAD SUB CATEGORIES =================

        await loadTransactionSubCategories();


        // ================= SUB CATEGORY =================

        document.getElementById(
            "transactionSubCategory"
        ).value =
            transaction.subCategory;


        // ================= DESCRIPTION =================

        document.getElementById(
            "transactionDescription"
        ).value =
            transaction.description || "";


        // ================= AMOUNT =================

        document.getElementById(
            "transactionAmount"
        ).value =
            transaction.amount;


        // ================= CHANGE HEADER =================

        document.querySelector(
            ".modal-header h2"
        ).innerHTML = `

            <i class="fa fa-edit"></i>

            Edit Income / Expense

        `;


        document.getElementById(
            "saveTransactionBtn"
        ).innerHTML = `

            <i class="fa fa-save"></i>

            Update Transaction

        `;


    } catch (error) {

        console.error(
            "EDIT TRANSACTION ERROR:",
            error
        );


        alert(
            "Unable to open transaction."
        );

    }

}
function getTodayDate() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;

}

function closeTransactionModal() {

    document.getElementById(
        "transactionModal"
    ).style.display =
        "none";

}

async function loadTransactionCategories() {

    const type =
        document.getElementById(
            "transactionType"
        ).value;


    const categorySelect =
        document.getElementById(
            "transactionCategory"
        );


    const subCategorySelect =
        document.getElementById(
            "transactionSubCategory"
        );


    categorySelect.innerHTML = `

        <option value="">
            Select Category
        </option>

    `;


    subCategorySelect.innerHTML = `

        <option value="">
            Select Sub Category
        </option>

    `;


    if (!type) {

        return;

    }


    try {

        const token =
            localStorage.getItem(
                "token"
            );


        const response =
            await fetch(

                `${API_BASE}/api/founder/finance-categories`,

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to load categories."
            );

            return;

        }


        const filteredCategories =
            data.categories.filter(
                item =>
                    item.type === type
            );


        filteredCategories.forEach(
            item => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    item.category;


                option.textContent =
                    item.category;


                categorySelect.appendChild(
                    option
                );

            }
        );


    } catch (error) {

        console.error(
            "LOAD FINANCE CATEGORIES ERROR:",
            error
        );


        alert(
            "Unable to load categories."
        );

    }

}

async function loadTransactionSubCategories() {

    const type =
        document.getElementById(
            "transactionType"
        ).value;


    const category =
        document.getElementById(
            "transactionCategory"
        ).value;


    const subCategorySelect =
        document.getElementById(
            "transactionSubCategory"
        );


    subCategorySelect.innerHTML = `

        <option value="">
            Select Sub Category
        </option>

    `;


    if (
        !type ||
        !category
    ) {

        return;

    }


    try {

        const token =
            localStorage.getItem(
                "token"
            );


        const response =
            await fetch(

                `${API_BASE}/api/founder/finance-categories`,

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            return;

        }


        const selectedCategory =
            data.categories.find(

                item =>

                    item.type === type &&
                    item.category === category

            );


        if (
            !selectedCategory
        ) {

            return;

        }


        selectedCategory.subCategories
            .forEach(
                subCategory => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    /*
                     * Supports both:
                     *
                     * "Monthly Tuition Fees"
                     *
                     * and future object format.
                     */

                    if (
                        typeof subCategory ===
                        "string"
                    ) {

                        option.value =
                            subCategory;

                        option.textContent =
                            subCategory;

                    } else {

                        option.value =
                            subCategory.name;

                        option.textContent =
                            subCategory.name;

                    }


                    subCategorySelect
                        .appendChild(
                            option
                        );

                }
            );


    } catch (error) {

        console.error(
            "LOAD SUB CATEGORIES ERROR:",
            error
        );

    }

}
async function saveTransaction(event) {

    event.preventDefault();


    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        alert(
            "Login session expired. Please login again."
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveTransactionBtn"
        );


    const date =
        document.getElementById(
            "transactionDate"
        ).value;


    const type =
        document.getElementById(
            "transactionType"
        ).value;


    const category =
        document.getElementById(
            "transactionCategory"
        ).value;


    const subCategory =
        document.getElementById(
            "transactionSubCategory"
        ).value;


    const description =
        document.getElementById(
            "transactionDescription"
        ).value.trim();


    const amount =
        Number(
            document.getElementById(
                "transactionAmount"
            ).value
        );


    if (!date) {

        showFormMessage(
            "Please select a date.",
            "error"
        );

        return;

    }


    if (!type) {

        showFormMessage(
            "Please select Income or Expense.",
            "error"
        );

        return;

    }


    if (!category) {

        showFormMessage(
            "Please select a Category.",
            "error"
        );

        return;

    }


    if (!subCategory) {

        showFormMessage(
            "Please select a Sub Category.",
            "error"
        );

        return;

    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        showFormMessage(
            "Please enter a valid amount.",
            "error"
        );

        return;

    }


    saveButton.disabled = true;

    saveButton.innerHTML = `
        <i class="fa fa-spinner fa-spin"></i>
        Saving...
    `;


    try {

                const requestUrl =

            editingTransactionId

                ? `${API_BASE}/api/founder/finance-transaction/${editingTransactionId}`

                : `${API_BASE}/api/founder/finance-transaction`;


        const requestMethod =

            editingTransactionId

                ? "PUT"

                : "POST";


        const response =
            await fetch(

                requestUrl,

                {

                    method: requestMethod,

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        JSON.stringify({

                            date,

                            type,

                            category,

                            subCategory,

                            description,

                            amount

                        })

                }

            );




        const data =
            await response.json();

            


        if (
            !response.ok ||
            !data.success
        ) {

            showFormMessage(

                data.message ||
                "Unable to save transaction.",

                "error"

            );

            return;

        }


        showFormMessage(

    editingTransactionId

        ? "Transaction updated successfully."

        : "Transaction saved successfully.",

    "success"

);


        /*
         * Refresh the report
         * after successful save.
         */

        await loadTransactions();

        editingTransactionId = null;


        setTimeout(
            () => {

                closeTransactionModal();

            },
            700
        );


    } catch (error) {

        console.error(
            "SAVE TRANSACTION ERROR:",
            error
        );


        showFormMessage(
            "Unable to save transaction.",
            "error"
        );


    } finally {

        saveButton.disabled =
            false;


        saveButton.innerHTML = `

            <i class="fa fa-save"></i>

            Save Transaction

        `;

    }

}

function showFormMessage(
    message,
    type
) {

    const messageBox =
        document.getElementById(
            "formMessage"
        );


    messageBox.textContent =
        message;


    messageBox.className =
        "form-message " + type;

}

async function deleteTransaction(
    transactionId
) {

    const confirmed =
        confirm(

            "Are you sure you want to delete this transaction?\n\n" +
            "This action cannot be undone."

        );


    if (!confirmed) {

        return;

    }


    try {

        const token =
            localStorage.getItem(
                "token"
            );


        if (!token) {

            alert(
                "Login session expired. Please login again."
            );

            return;

        }


        const response =
            await fetch(

                `${API_BASE}/api/founder/finance-transaction/${transactionId}`,

                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(

                data.message ||
                "Unable to delete transaction."

            );

            return;

        }


        alert(
            "Transaction deleted successfully."
        );


        await loadTransactions();


    } catch (error) {

        console.error(
            "DELETE TRANSACTION ERROR:",
            error
        );


        alert(
            "Unable to delete transaction."
        );

    }

}

function clearFormMessage() {

    const messageBox =
        document.getElementById(
            "formMessage"
        );


    messageBox.textContent =
        "";


    messageBox.className =
        "form-message";

}


        // ================= INITIAL LOAD =================

        setDefaultDate();

        loadTransactions();

        function formatCurrency(amount) {

    return new Intl.NumberFormat(
        "en-IN",
        {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(amount || 0)
    );

}

function renderTransactions(
    transactions
) {

    const tableBody =
        document.getElementById(
            "transactionTableBody"
        );


    if (
        !transactions ||
        transactions.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty-row"
                >
                    No transactions found
                </td>

            </tr>

        `;

        return;

    }


    tableBody.innerHTML =
        transactions.map(
            transaction => {

                const date =
                    new Date(
                        transaction.date
                    );


                const formattedDate =
                    date.toLocaleDateString(
                        "en-IN"
                    );


                const typeClass =
                    transaction.type ===
                    "Income"
                        ? "income"
                        : "expense";


                const sign =
                    transaction.type ===
                    "Income"
                        ? "+"
                        : "-";


                return `

                    <tr>

                        <td>
                            ${formattedDate}
                        </td>


                        <td
                            class="${typeClass}"
                        >
                            ${transaction.type}
                        </td>


                        <td>
                            ${escapeHtml(
                                transaction.category
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                transaction.subCategory
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                transaction.description ||
                                "-"
                            )}
                        </td>


                        <td
                            class="${typeClass}"
                        >
                            ${sign}
                            ${formatCurrency(
                                transaction.amount
                            )}
                        </td>


                        <td>

                            <button
    type="button"
    onclick="editTransaction('${transaction._id}')"
    style="
        background:#17395f;
        color:white;
        border:none;
        padding:6px 9px;
        border-radius:4px;
        cursor:pointer;
        margin-right:4px;
    "
    title="Edit"
>
    <i class="fa fa-edit"></i>
</button>

<button
    type="button"
    onclick="deleteTransaction('${transaction._id}')"
    style="
        background:#dc3545;
        color:white;
        border:none;
        padding:6px 9px;
        border-radius:4px;
        cursor:pointer;
    "
    title="Delete"
>
    <i class="fa fa-trash"></i>
</button>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
