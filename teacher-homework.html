    });

    input.type = "text";

    input.className = "videoLink";

    input.placeholder =

    input.style.width = "100%";

    input.style.padding = "10px";

    input.style.marginTop = "10px";

    videoContainer.appendChild(input);

    }

    });

    }

    async function createOrEditHomework(){

    /*
    =====================================================
    CREATE IS ALLOWED ONLY IF NO HOMEWORK EXISTS
    =====================================================
    */

    const teacherId =
        sessionStorage.getItem("teacherId");

    const className =
        sessionStorage.getItem("homeworkClass");

    const subject =
        sessionStorage.getItem("homeworkSubject");

    const date =
        new Date()
        .toISOString()
        .split("T")[0];


    if(
        !teacherId ||
        !className ||
        !subject
    ){

        alert(
            "Homework class information is missing."
        );

        return;

    }


    try{

        const res = await fetch(

            "https://academy-backend-eatl.onrender.com/api/lesson-plans?teacherId=" +
            encodeURIComponent(teacherId)

        );


        const result =
            await res.json();


        if(!result.success){

            alert(
                "Unable to check existing homework."
            );

            return;

        }


        /*
        =====================================================
        SAME TEACHER + CLASS + SUBJECT + DATE
        =====================================================
        */

        const existing =
            result.data.find(plan =>

                plan.date === date &&

                String(plan.className).trim()
                ===
                String(className).trim() &&

                String(plan.subject).trim()
                ===
                String(subject).trim()

            );


        /*
        =====================================================
        HOMEWORK ALREADY EXISTS
        =====================================================
        */

        if(existing){

            updateCreateHomeworkButton(true);

            alert(
                "Homework has already been created for this period and date.\n\nYou can use the Edit button to update it."
            );

            return;

        }


        /*
        =====================================================
        NO HOMEWORK EXISTS
        CREATE NEW
        =====================================================
        */

        window.editLessonPlanId = null;


        document.getElementById(
            "addTopicBtn"
        ).style.display =
            "inline-block";


        showCreateHomeworkPanel();


    }catch(error){

        console.error(
            "Create homework check error:",
            error
        );

        alert(

function updateCreateHomeworkButton(isCreated){

    const button =
        document.getElementById(
            "createHomeworkBtn"
        );

    if(!button){

        return;

    }


    if(isCreated){

        button.disabled = true;

        button.innerText =
            "✓ Homework Already Created";

        button.style.background =
            "#94a3b8";

        button.style.cursor =
            "not-allowed";

        button.style.opacity =
            "0.75";

    }else{

        button.disabled = false;

        button.innerText =
            "+ Create Homework";

        button.style.background =
            "green";

        button.style.cursor =
            "pointer";

        button.style.opacity =
            "1";

    }

}

    async function checkExistingLessonPlan(){

    const teacherId =
        sessionStorage.getItem("teacherId");

    const className =
        sessionStorage.getItem("homeworkClass");

    const subject =
        sessionStorage.getItem("homeworkSubject");

    const date =
        new Date()
        .toISOString()
        .split("T")[0];


    if(
        !teacherId ||
        !className ||
        !subject
    ){

        return;

    }


    try{

        const res = await fetch(

            "https://academy-backend-eatl.onrender.com/api/lesson-plans?teacherId=" +
            encodeURIComponent(teacherId)

        );


        const result =
            await res.json();


        if(!result.success){

            return;

        }


        const existing =
            result.data.find(plan =>

                plan.date === date &&

                String(plan.className).trim()
                ===
                String(className).trim() &&

                String(plan.subject).trim()
                ===
                String(subject).trim()

            );


        if(existing){

            /*
            =================================================
            HOMEWORK EXISTS

            ONLY CREATE IS DISABLED.

            EDIT REMAINS AVAILABLE.
            =================================================
            */

            updateCreateHomeworkButton(true);

        }else{

            /*
            =================================================
            NO HOMEWORK

            CREATE IS AVAILABLE.
            =================================================
            */

            updateCreateHomeworkButton(false);

        }


    }catch(error){

        console.error(
            "Check existing homework error:",
            error
        );

    }

}

    async function saveHomeworkDraft(){

    const lessons=[];

    document.querySelectorAll("#topicContainer > div").forEach((card,index)=>{

    const topic=
    card.querySelector(".topicName").value;

    const topicSummary=
    card.querySelector(".topicDescription").value;

    const homework=
    card.querySelector(".homeworkGiven").value;

    const videoLinks=[];

    card.querySelectorAll(".videoLink").forEach(v=>{

    if(v.value.trim()){

    videoLinks.push(v.value.trim());

    }

    });

    const subjectCode =
    document.getElementById("hwSubject")
    .value
    .substring(0,3)
    .toUpperCase();

    const dateCode =
    document.getElementById("hwDate")
    .value
    .replaceAll("-","");

    const topicId =
    card.dataset.topicId ||
    `${subjectCode}-${dateCode}-${String(index+1).padStart(2,"0")}`;

    lessons.push({

    topicId,

    topic,

    topicSummary,

    homework,

    videoLinks,

    classMaterials:
    card.lessonMaterials || [],

    homeworkDocuments:
    card.homeworkDocuments || []

    });

    });

    const payload={

    teacherId:
    sessionStorage.getItem("teacherId") || "",

    teacherName:
    sessionStorage.getItem("teacherName") || "",

    className:
    document.getElementById("hwClass").value,

    subject:
    document.getElementById("hwSubject").value,

    day:
    sessionStorage.getItem("homeworkDay") || "",

    startTime:
    sessionStorage.getItem("homeworkStartTime") || "",

    date:
    document.getElementById("hwDate").value,

    lessons

    };

    let url =
    "https://academy-backend-eatl.onrender.com/api/create-homework";

    let method = "POST";

    if(window.editLessonPlanId){

    url =

    "https://academy-backend-eatl.onrender.com/api/lesson-plan/"

    +

    window.editLessonPlanId;

    method = "PUT";

    }

    const res = await fetch(

    url,

    {

    method,

    headers:{

    "Content-Type":"application/json"

    },

    body:JSON.stringify(payload)

    }

    );

    const data=await res.json();

    if(data.success){

    alert("Homework Saved Successfully");


    /*
    =====================================================
    CREATE / EDIT RESULT
    =====================================================
    */

    if(window.editLessonPlanId){

        /*
        -----------------------------------------------
        EDIT MODE

        Keep Create button disabled.
        Editing can happen unlimited times.
        -----------------------------------------------
        */

        updateCreateHomeworkButton(true);

    }else{

        /*
        -----------------------------------------------
        CREATE MODE

        Homework has now been created.
        Disable Create.
        -----------------------------------------------
        */

        updateCreateHomeworkButton(true);

    }


    // Reset Edit Mode
    window.editLessonPlanId = null;

        const saveBtn = document.querySelector(
            'button[onclick="saveHomeworkDraft()"]'
        );

        if(saveBtn){

            saveBtn.innerText = "Save Homework";

            saveBtn.style.background = "#28a745";

        }

        closeHomeworkPanel();

        load();

    }else{

        alert(data.message);

    }

    }

    async function uploadLessonMaterial(button){

    const card = button.closest("#topicContainer > div");

    const inputs = card.querySelectorAll(".lessonMaterialFile");

    const formData = new FormData();

    let hasFile = false;

    inputs.forEach(input => {

        for(const file of input.files){

            formData.append("files", file);

            hasFile = true;

        }

    });

    if(!hasFile){

        alert("Please choose a file.");

        return;

    }

    const res = await fetch(

    "https://academy-backend-eatl.onrender.com/api/upload-lesson-material",

    {

    method:"POST",

    body:formData

    }

    );

    const data = await res.json();

    if(!data.success){

    alert(data.message);

    return;

    }

    if(!card.lessonMaterials){

    card.lessonMaterials=[];

    }

    card.lessonMaterials.push(...data.files);

    const list = card.querySelector(".uploadedLessonMaterials");

    list.innerHTML="";

    card.lessonMaterials.forEach((file,index)=>{

    list.innerHTML += `

    <div style="
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:10px;
    ">

    📎

    <a href="${file.s3Url}" target="_blank">

    ${file.fileName}

    </a>

    <button
    type="button"
    onclick="deleteLessonMaterial(this,${index})"
    style="
    background:red;
    color:white;
    border:none;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    ">

    ✖

    </button>

    </div>

    `;

    });

    inputs.forEach(input => input.value = "");

    alert("File uploaded successfully.");

    }
