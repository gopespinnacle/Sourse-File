<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Students</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
    margin:0;
}
.main-content {
    margin-left:240px;
    padding:20px;
    width: calc(100% - 240px);   /* 🔥 VERY IMPORTANT */
}

.student-card {
    background:#fff;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.student-name {
    font-size:16px;
    font-weight:bold;
}

.tag {
    display:inline-block;
    background:#eef;
    padding:4px 8px;
    border-radius:6px;
    margin:3px;
    font-size:12px;
}

/* =====================================
   MY STUDENTS — MOBILE APP DESIGN
   Desktop design remains unchanged
===================================== */

.mobile-students-header,
.mobile-back-btn {
    display: none;
}

@media screen and (max-width: 700px) {

    body {
        background: #eef3fb;
    }

    .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        box-sizing: border-box;
        padding: 0 14px 30px !important;
    }

    #sidebar-container {
        display: none !important;
    }

    .mobile-students-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: #ffffff;
        margin: 0 -14px 15px;
        padding: 22px 16px;
        border-bottom: 1px solid #e1e8f3;
    }

    .mobile-students-header h2 {
        margin: 0;
        color: #102b58;
        font-size: 25px;
        font-weight: 800;
    }

    .mobile-students-header p {
        margin: 5px 0 0;
        color: #718096;
        font-size: 14px;
    }

    .mobile-back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-shrink: 0;
        border: none;
        border-radius: 12px;
        padding: 11px 13px;
        background: #102b58;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .student-card {
        padding: 14px;
        margin-bottom: 12px;
        border: 1px solid #e4eaf4;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 3px 10px rgba(20, 45, 85, 0.08);
    }

    .student-name {
        color: #142b50;
        font-size: 17px;
        margin-bottom: 8px;
    }

    .student-card .tag {
        display: inline-block;
        margin: 3px 3px 3px 0;
        padding: 6px 9px;
        border-radius: 8px;
        background: #eaf1ff;
        color: #173d79;
        font-size: 12px;
        font-weight: 600;
    }
}

@media screen and (max-width: 700px) {

    .mobile-student-search {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #ffffff;
        border: 1px solid #d6e0f0;
        border-radius: 14px;
        padding: 0 14px;
        margin-bottom: 18px;
        height: 52px;
    }

    .mobile-student-search i {
        color: #64748b;
        font-size: 18px;
    }

    .mobile-student-search input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
        color: #142b50;
    }

    .mobile-grade-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 2px 10px;
        color: #102b58;
        font-size: 19px;
        font-weight: 800;
    }

    .mobile-grade-count {
        background: #dce9ff;
        color: #17458b;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
    }
}


@media screen and (max-width: 700px) {
    .student-category {
        margin-top: 8px;
        color: #334155;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<script>
fetch("teacher-sidebar.html")
.then(res => res.text())
.then(data=>{
document.getElementById("sidebar-container").innerHTML=data;
});
</script>

<div class="main-content">

<div class="mobile-students-header">
    <div>
        <h2>My Students</h2>
        <p>Manage your assigned students</p>
    </div>

    <button type="button" class="mobile-back-btn" onclick="goBackPage()">
        <i class="fa-solid fa-arrow-left"></i> Back
    </button>
</div>

<div class="mobile-student-search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
        type="text"
        id="studentSearch"
        placeholder="Search students or class..."
        oninput="renderStudents()"
    >
</div>

<div id="studentsContainer"></div>

</div>

<script>

const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}

async function loadStudents(){

    window.allStudents = [];

try{

const res = await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
{
headers:{
"Authorization":"Bearer " + token
}
}
);

const data = await res.json();

const container = document.getElementById("studentsContainer");
container.innerHTML = "";

/* 🔥 GROUP BY STUDENT */
let studentMap = {};

data.data.forEach(item=>{

item.students.forEach(st=>{

if(!studentMap[st._id]){
studentMap[st._id] = {
name: st.name,
classes: []
};
}

studentMap[st._id].classes.push({
    className: item.className,
    subjects: st.subjects || [],
    languages: st.languages || [],
    eca: st.eca || [],
    subject: item.subject,
    day: item.day,
    time: item.startTime + " - " + item.endTime
});

});

});

/* GRADE-WISE STUDENT DATA */
window.allStudents = Object.entries(studentMap).map(([id, student]) => ({
    id,
    ...student
}));

renderStudents();

}catch(err){

console.log(err);

document.getElementById("studentsContainer").innerHTML =
"<p>Error loading students</p>";

}

}

function renderStudents() {

    const container = document.getElementById("studentsContainer");
    const search = document.getElementById("studentSearch")?.value
        .trim()
        .toLowerCase() || "";

    const gradeGroups = {};

    window.allStudents.forEach(student => {

        const matchingClasses = student.classes.filter(c =>
            [
                student.name,
                c.className,
                c.subject,
                c.day,
                c.time
            ].join(" ").toLowerCase().includes(search)
        );

        matchingClasses.forEach(c => {

            const grade = c.className || "Other";

            if (!gradeGroups[grade]) {
                gradeGroups[grade] = {};
            }

            if (!gradeGroups[grade][student.id]) {
    gradeGroups[grade][student.id] = {
        name: student.name,
        subjects: new Set(),
        languages: new Set(),
        eca: new Set()
    };
}

            (c.subjects || []).forEach(v =>
    gradeGroups[grade][student.id].subjects.add(v)
);

(c.languages || []).forEach(v =>
    gradeGroups[grade][student.id].languages.add(v)
);

(c.eca || []).forEach(v =>
    gradeGroups[grade][student.id].eca.add(v)
);
        });
    });

    container.innerHTML = "";

    const grades = Object.keys(gradeGroups).sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true })
    );

    if (grades.length === 0) {
        container.innerHTML = "<p>No matching students found.</p>";
        return;
    }

    grades.forEach(grade => {

        const students = Object.values(gradeGroups[grade]);

        let studentsHTML = "";

        students.forEach(student => {

            const subjectHTML = [...student.subjects].map(v =>
    `<span class="tag">${v}</span>`
).join("");

const languageHTML = [...student.languages].map(v =>
    `<span class="tag">${v}</span>`
).join("");

const ecaHTML = [...student.eca].map(v =>
    `<span class="tag">${v}</span>`
).join("");

studentsHTML += `
    <div class="student-card">
        <div class="student-name">
            ${student.name}
        </div>

        ${subjectHTML ? `
            <div class="student-category">
                <strong>Subjects:</strong> ${subjectHTML}
            </div>
        ` : ""}

        ${languageHTML ? `
            <div class="student-category">
                <strong>Languages:</strong> ${languageHTML}
            </div>
        ` : ""}

        ${ecaHTML ? `
            <div class="student-category">
                <strong>ECA:</strong> ${ecaHTML}
            </div>
        ` : ""}
    </div>
`;
        });

        container.innerHTML += `
            <div class="mobile-grade-heading">
                <span>${grade}</span>
                <span class="mobile-grade-count">
                    ${students.length} Students
                </span>
            </div>

            ${studentsHTML}
        `;
    });
}

loadStudents();
</script>

<!-- ✅ ADD HERE -->
<script>
function go(page){
    window.location.href = page;
}

function goBackPage() {
    if (
        window.GPAAndroid &&
        typeof window.GPAAndroid.goBack === "function"
    ) {
        window.GPAAndroid.goBack();
    } else if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "teacher-dashboard.html";
    }
}

function logout(){
    sessionStorage.clear();
    window.location.replace("teacher-login.html");
}
</script>

<!-- GPA notifications on the teacher periods page -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="messenger/chat/messengerWebNotifications.js"></script>
<script src="messenger/chat/primaryUserChatSocket.js"></script>

</body>
</html>
