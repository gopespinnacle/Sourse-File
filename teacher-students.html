<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Students</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
    margin:0;
}
.main-content {
    margin-left:240px;
    padding:20px;
    width: calc(100% - 240px);   /* 🔥 VERY IMPORTANT */
}

.student-card {
    background:#fff;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.student-name {
    font-size:16px;
    font-weight:bold;
}

.tag {
    display:inline-block;
    background:#eef;
    padding:4px 8px;
    border-radius:6px;
    margin:3px;
    font-size:12px;
}

/* =====================================
   MY STUDENTS — MOBILE APP DESIGN
   Desktop design remains unchanged
===================================== */

.mobile-students-header,
.mobile-back-btn {
    display: none;
}

@media screen and (max-width: 700px) {

    body {
        background: #eef3fb;
    }

    .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        box-sizing: border-box;
        padding: 0 14px 30px !important;
    }

    #sidebar-container {
        display: none !important;
    }

    .mobile-students-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: #ffffff;
        margin: 0 -14px 15px;
        padding: 22px 16px;
        border-bottom: 1px solid #e1e8f3;
    }

    .mobile-students-header h2 {
        margin: 0;
        color: #102b58;
        font-size: 25px;
        font-weight: 800;
    }

    .mobile-students-header p {
        margin: 5px 0 0;
        color: #718096;
        font-size: 14px;
    }

    .mobile-back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-shrink: 0;
        border: none;
        border-radius: 12px;
        padding: 11px 13px;
        background: #102b58;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
    }

    .student-card {
        padding: 14px;
        margin-bottom: 12px;
        border: 1px solid #e4eaf4;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 3px 10px rgba(20, 45, 85, 0.08);
    }

    .student-name {
        color: #142b50;
        font-size: 17px;
        margin-bottom: 8px;
    }

    .student-card .tag {
        display: inline-block;
        margin: 3px 3px 3px 0;
        padding: 6px 9px;
        border-radius: 8px;
        background: #eaf1ff;
        color: #173d79;
        font-size: 12px;
        font-weight: 600;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<script>
fetch("teacher-sidebar.html")
.then(res => res.text())
.then(data=>{
document.getElementById("sidebar-container").innerHTML=data;
});
</script>

<div class="main-content">

<div class="mobile-students-header">
    <div>
        <h2>My Students</h2>
        <p>Manage your assigned students</p>
    </div>

    <button type="button" class="mobile-back-btn" onclick="goBackPage()">
        <i class="fa-solid fa-arrow-left"></i> Back
    </button>
</div>

<div id="studentsContainer"></div>

</div>

<script>

const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

if (!token || role !== "teacher") {
    alert("Please login first");
    window.location.href = "teacher-login.html";
}

async function loadStudents(){

try{

const res = await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher/all-period-assignments",
{
headers:{
"Authorization":"Bearer " + token
}
}
);

const data = await res.json();

const container = document.getElementById("studentsContainer");
container.innerHTML = "";

/* 🔥 GROUP BY STUDENT */
let studentMap = {};

data.data.forEach(item=>{

item.students.forEach(st=>{

if(!studentMap[st._id]){
studentMap[st._id] = {
name: st.name,
classes: []
};
}

studentMap[st._id].classes.push({
className: item.className,
subject: item.subject,
day: item.day,
time: item.startTime + " - " + item.endTime
});

});

});

/* DISPLAY */
Object.values(studentMap).forEach(student=>{

let classHTML = "";

student.classes.forEach(c=>{
classHTML += `
<div>
<span class="tag">📘 ${c.subject || "General"}</span>
<span class="tag">🏫 ${c.className}</span>
<span class="tag">📅 ${c.day}</span>
<span class="tag">⏰ ${c.time}</span>
</div>
`;
});

container.innerHTML += `
<div class="student-card">
<div class="student-name">👤 ${student.name}</div>
${classHTML}
</div>
`;

});

}catch(err){

console.log(err);

document.getElementById("studentsContainer").innerHTML =
"<p>Error loading students</p>";

}

}

loadStudents();
</script>

<!-- ✅ ADD HERE -->
<script>
function go(page){
    window.location.href = page;
}

function goBackPage() {
    if (
        window.GPAAndroid &&
        typeof window.GPAAndroid.goBack === "function"
    ) {
        window.GPAAndroid.goBack();
    } else if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "teacher-dashboard.html";
    }
}

function logout(){
    sessionStorage.clear();
    window.location.replace("teacher-login.html");
}
</script>
</script>
<!-- GPA notifications on the teacher periods page -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="messenger/chat/messengerWebNotifications.js"></script>
<script src="messenger/chat/primaryUserChatSocket.js"></script>

</body>
</html>
