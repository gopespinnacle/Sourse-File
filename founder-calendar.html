<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Academy Calendar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:30px;
}

.calendar-container{

max-width:1200px;

margin:auto;

background:#fff;

padding:20px;

border-radius:12px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.calendar-header{

display:grid;

grid-template-columns:250px 1fr 320px;

align-items:center;

gap:20px;

margin-bottom:20px;

}

.calendar-header button{

padding:10px 18px;

font-size:18px;

background:#0d6efd;

color:#fff;

border:none;

border-radius:8px;

cursor:pointer;

}

#monthYear{

font-size:34px;

font-weight:bold;

text-align:center;

margin:0;

}

.weekdays{

display:grid;

grid-template-columns:repeat(7,1fr);

background:#0d6efd;

color:white;

border-radius:8px 8px 0 0;

overflow:hidden;

}

.weekdays div{

padding:15px;

text-align:center;

font-weight:bold;

}

.calendar-grid{

display:grid;

grid-template-columns:repeat(7,1fr);

}

.day{

border:1px solid #ddd;

height:120px;

padding:8px;

background:white;

cursor:pointer;

transition:.2s;

}

.day:hover{

background:#eef5ff;

}

.day-number{

font-weight:bold;

margin-bottom:8px;

}

.today{

background:#dbeafe;

}

.event{
    margin-top:5px;
    padding:4px 6px;
    border-radius:4px;
    font-size:12px;
    color:white;
    background:#198754;
    line-height:1.3;
    min-height:34px;
    overflow:hidden;
}

.modal{

display:none;

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

z-index:1000;

}

.modal-content{

background:white;

width:500px;

max-width:90%;

margin:60px auto;

padding:25px;

border-radius:12px;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

.modal-content h2{

margin-bottom:20px;

}

.modal-content label{

display:block;

margin-top:15px;

margin-bottom:6px;

font-weight:bold;

}

.modal-content input,

.modal-content textarea,

.modal-content select{

width:100%;

padding:10px;

border:1px solid #ccc;

border-radius:6px;

}

.modal-content textarea{

height:90px;

resize:vertical;

}

.modal-content button{

margin-top:20px;

padding:12px 20px;

border:none;

border-radius:6px;

cursor:pointer;

background:#0d6efd;

color:white;

margin-right:10px;

}

.calendar-layout{

display:grid;

grid-template-columns:3fr 1fr;

gap:20px;

align-items:start;

}

.event-panel{

background:white;

padding:20px;

border-radius:12px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

min-height:650px;

}

.event-panel h2{

margin-bottom:20px;

}

.left-controls,
.right-controls{

display:flex;

justify-content:flex-end;

align-items:center;

gap:12px;

}

#todayBtn{

background:#198754;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}

#addEventBtn{

background:#0d6efd;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

#searchEvent{

width:180px;

padding:10px 14px;

border:1px solid #d0d7de;

border-radius:8px;

font-size:14px;

}

.audience-container{

    margin-top:10px;

    display:flex;

    flex-direction:column;

    gap:10px;

}

.audience-item{

    display:flex;

    align-items:center;

    gap:10px;

    font-weight:normal !important;

    margin:0 !important;

}

.audience-item input{

    width:18px;

    height:18px;

    cursor:pointer;

}

.audience-item span{

    font-size:15px;

}

#gradeFilter{

    width:150px;

    padding:10px;

    border:1px solid #d0d7de;

    border-radius:8px;

    font-size:14px;

}
</style>

</head>


<body>

<div class="calendar-layout">

    <div class="calendar-container">

    <div class="calendar-header">

    <div class="left-controls">

        <button id="prevMonth">◀</button>

        <button id="todayBtn">Today</button>

        <button id="nextMonth">▶</button>

    </div>

    <h2 id="monthYear"></h2>

    <div class="right-controls">

    <select id="gradeFilter">

        <option value="All">All Grades</option>

        <option>Grade 1</option>
        <option>Grade 2</option>
        <option>Grade 3</option>
        <option>Grade 4</option>
        <option>Grade 5</option>
        <option>Grade 6</option>
        <option>Grade 7</option>
        <option>Grade 8</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>

    </select>

    <input
        type="text"
        id="searchEvent"
        placeholder="Search events...">

    <button id="addEventBtn">

        + Add Event

    </button>

</div>

</div>

    <div class="weekdays">

        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>

    </div>

    <div id="calendarGrid" class="calendar-grid">

    </div>

</div>

<script>

let currentDate = new Date();

const API = "https://academy-backend-eatl.onrender.com/api/academy-calendar";

let events = [];

let editingEventId = null;

function drawCalendar(){

    const monthYear = document.getElementById("monthYear");

    const calendarGrid = document.getElementById("calendarGrid");

    calendarGrid.innerHTML = "";

    const year = currentDate.getFullYear();

    const month = currentDate.getMonth();

    const firstDay = new Date(year, month, 1).getDay();

    const daysInMonth = new Date(year, month + 1, 0).getDate();

    monthYear.innerHTML =
        currentDate.toLocaleString("default", {
            month: "long",
            year: "numeric"
        });

    // Empty boxes before the 1st day
    for(let i = 0; i < firstDay; i++){

        const empty = document.createElement("div");

        empty.className = "day";

        empty.style.background = "#f8f9fa";

        calendarGrid.appendChild(empty);

    }

    // Days of month
    for(let day = 1; day <= daysInMonth; day++){

        const cell = document.createElement("div");

        cell.className = "day";

        const today = new Date();

        if(
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ){
            cell.classList.add("today");
        }

        cell.innerHTML = `
    <div class="day-number">${day}</div>
`;

const cellDate = new Date(year, month, day);

const selectedGrade =
    document.getElementById("gradeFilter").value;

const todayEvents = events.filter(event => {

    const eventDate = new Date(event.startDate);

    const sameDate =
        eventDate.getFullYear() === cellDate.getFullYear() &&
        eventDate.getMonth() === cellDate.getMonth() &&
        eventDate.getDate() === cellDate.getDate();

    const gradeMatch =
        selectedGrade === "All" ||
        event.grade === "All" ||
        event.grade === selectedGrade;

    return sameDate && gradeMatch;

});

todayEvents.forEach(event => {

    const eventDiv = document.createElement("div");

    eventDiv.className = "event";

    eventDiv.style.background = event.color || "#198754";

    eventDiv.innerHTML = `
    <div style="font-weight:bold;">
        ${event.title}
    </div>

    <div style="
        font-size:10px;
        margin-top:2px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
    ">
        ${event.description || ""}
    </div>
`;

    eventDiv.onclick = function(e){

        e.stopPropagation();

        document.getElementById("eventDetails").innerHTML = `

<h3>${event.title}</h3>

<hr><br>

<p><b>Description:</b><br>${event.description || "-"}</p>

<br>

<p><b>Type:</b> ${event.eventType}</p>

<p><b>Grade:</b> ${event.grade}</p>

<p><b>Subject:</b> ${event.subject || "-"}</p>

<br>

<p><b>Date:</b></p>

<p>${new Date(event.startDate).toLocaleDateString()}</p>

<br>

<button
onclick="editEvent('${event._id}')">

✏ Edit Event

</button>

<button
onclick="deleteEvent('${event._id}')"
style="background:#dc3545;margin-left:10px;">

🗑 Delete

</button>

`;

    };

    cell.appendChild(eventDiv);

});

cell.onclick = function(){

    editingEventId = null;

    document.getElementById("eventTitle").value = "";

    document.getElementById("eventDescription").value = "";

    document.getElementById("eventType").value = "Holiday";

    document.getElementById("eventGrade").value = "All";

    document.getElementById("selectedDate").value =
        `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    document.querySelector(
        "#eventModal button[onclick='saveEvent()']"
    ).innerHTML = "Save Event";

    document.getElementById("eventModal").style.display = "block";

};

        calendarGrid.appendChild(cell);

    }

}

document.getElementById("prevMonth").onclick = ()=>{

    currentDate.setMonth(currentDate.getMonth()-1);

    drawCalendar();

};

document.getElementById("nextMonth").onclick = ()=>{

    currentDate.setMonth(currentDate.getMonth()+1);

    drawCalendar();

};

async function loadEvents(){

    const res = await fetch(`${API}/list`);

    const data = await res.json();

    if(data.success){

        events = data.data;

    }

    drawCalendar();

}
function getEventColor(type){

    switch(type){

        case "Holiday":
            return "#f4b400";

        case "Class":
            return "#34a853";

        case "Exam":
            return "#ea4335";

        case "Test":
            return "#fb8c00";

        case "Assignment":
            return "#8e24aa";

        case "Meeting":
            return "#1a73e8";

        default:
            return "#5f6368";

    }

}
function closeModal(){

    document.getElementById("eventModal").style.display = "none";

}

loadEvents();

async function saveEvent(){

    const audience = [];

document.querySelectorAll(".audience:checked").forEach(item => {

    audience.push(item.value);

});

const event = {

    title: document.getElementById("eventTitle").value,

    description: document.getElementById("eventDescription").value,

    eventType: document.getElementById("eventType").value,

    grade: document.getElementById("eventGrade").value,

    subject: "",

    startDate: document.getElementById("selectedDate").value,

    endDate: document.getElementById("selectedDate").value,

    allDay: true,

    color: getEventColor(
        document.getElementById("eventType").value
    ),

    audience: audience

};

    let url = `${API}/add`;

    let method = "POST";

    if(editingEventId){

        url = `${API}/${editingEventId}`;

        method = "PUT";

    }

    const res = await fetch(url,{

        method,

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(event)

    });

    const data = await res.json();

    if(data.success){

        closeModal();

        editingEventId = null;

        loadEvents();

        document.querySelector(
            "#eventModal button[onclick='saveEvent()']"
        ).innerHTML = "Save Event";

        alert(
            method === "POST"
                ? "Event Added Successfully"
                : "Event Updated Successfully"
        );

    }else{

        alert(data.message);

    }

}


/*
=========================================
DELETE EVENT
=========================================
*/

async function deleteEvent(id) {

    if (!confirm("Are you sure you want to delete this event?")) {
        return;
    }

    try {

        const response = await fetch(

            `${API}/${id}`,

            {
                method: "DELETE"
            }

        );

        const result = await response.json();

        if (!result.success) {

            alert(result.message);

            return;

        }

        alert("Event deleted successfully.");

        // Clear the event details panel
        document.getElementById("eventDetails").innerHTML = `
            Click an event to view its details.
        `;

        // Reload calendar events
        await loadEvents();

    } catch (err) {

        console.error(err);

        alert("Unable to delete event.");

    }

}

/*
=========================================
EDIT EVENT
=========================================
*/

function editEvent(id){

    const event = events.find(e => e._id === id);

    if(!event){

        alert("Event not found.");

        return;

    }

    editingEventId = id;

    document.getElementById("eventTitle").value = event.title || "";

    document.getElementById("eventDescription").value = event.description || "";

    document.getElementById("eventType").value = event.eventType || "Holiday";

    document.getElementById("eventGrade").value = event.grade || "All";

    // Clear all audience selections
document.querySelectorAll(".audience").forEach(item => {

    item.checked = false;

});

// Select saved audience
if(event.audience){

    event.audience.forEach(audience => {

        const checkbox = document.querySelector(
            `.audience[value="${audience}"]`
        );

        if(checkbox){

            checkbox.checked = true;

        }

    });

}

    document.getElementById("selectedDate").value =
        event.startDate.substring(0,10);

    document.querySelector(
        "#eventModal button[onclick='saveEvent()']"
    ).innerHTML = "Update Event";

    document.getElementById("eventModal").style.display = "block";

}

document.getElementById("gradeFilter").addEventListener("change", () => {

    drawCalendar();

});

</script>

<div class="event-panel">

    <h2>Event Details</h2>

    <div id="eventDetails">

        <p style="color:#777">

            Click an event to view details.

        </p>

    </div>

</div>

</div>

<div id="eventModal" class="modal">

    <div class="modal-content">

        <h2>Add Calendar Event</h2>

        <input type="hidden" id="selectedDate">

        <label>Title</label>
        <input type="text" id="eventTitle">

        <label>Description</label>
        <textarea id="eventDescription"></textarea>

        <label>Event Type</label>
        <select id="eventType">

            <option>Holiday</option>
            <option>Class</option>
            <option>Exam</option>
            <option>Test</option>
            <option>Assignment</option>
            <option>Meeting</option>
            <option>Event</option>

        </select>

        <label>Grade</label>
        <select id="eventGrade">

            <option>All</option>
            <option>Grade 1</option>
            <option>Grade 2</option>
            <option>Grade 3</option>
            <option>Grade 4</option>
            <option>Grade 5</option>
            <option>Grade 6</option>
            <option>Grade 7</option>
            <option>Grade 8</option>
            <option>Grade 9</option>
            <option>Grade 10</option>
            <option>Grade 11</option>
            <option>Grade 12</option>

        </select>

        <label style="margin-top:20px;">Visible To</label>



<div id="audienceSection" class="audience-container">

    <label class="audience-item">
        <input type="checkbox" class="audience" value="Public">
        <span>Public Website</span>
    </label>

    <label class="audience-item">
        <input type="checkbox" class="audience" value="Founder" checked>
        <span>Founder</span>
    </label>

    <label class="audience-item">
        <input type="checkbox" class="audience" value="Teacher">
        <span>Teacher</span>
    </label>

    <label class="audience-item">
        <input type="checkbox" class="audience" value="Student">
        <span>Student</span>
    </label>

    <label class="audience-item">
        <input type="checkbox" class="audience" value="Parent">
        <span>Parent</span>
    </label>

</div>

        <br><br>

        <button onclick="saveEvent()">Save Event</button>

        <button onclick="closeModal()">Cancel</button>

    </div>

</div>

</body>
</html>
