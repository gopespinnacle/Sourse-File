<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Material | Gopes Pinnacle Academy</title><style>body{margin:0;background:#eef1f5;font:14px Arial,sans-serif;color:#172033}.top{position:sticky;top:0;background:#171a1f;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}.top button{padding:9px 13px;border:0;border-radius:7px;cursor:pointer}.wrap{max-width:980px;margin:20px auto;padding:0 14px}.meta,.page{background:white;border:1px solid #d6dbe3;border-radius:10px;padding:18px;margin-bottom:18px}.page h3{margin:0 0 10px}.paper{position:relative;width:100%;max-width:800px;margin:auto;background:white;border:1px solid #333;aspect-ratio:210/297;overflow:hidden}.paper canvas{width:100%;height:100%;display:block}.info{color:#607086}.status{padding:20px;background:white;border-radius:10px}</style></head><body><header class="top"><strong>GOPES PINNACLE ACADEMY · Learning Material</strong><button onclick="history.back()">Back</button></header><main class="wrap"><div id="materialMeta" class="meta">Loading material…</div><div id="pages"></div></main><script>
(async()=>{const API='https://academy-backend-eatl.onrender.com/api/annotation-materials';const token=sessionStorage.getItem('token')||localStorage.getItem('token')||'';const id=new URLSearchParams(location.search).get('id');const meta=document.getElementById('materialMeta'),host=document.getElementById('pages');if(!token||!id){meta.textContent='Sign in and select a valid learning material.';return;}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const r=await fetch(`${API}/${encodeURIComponent(id)}`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'You are not assigned to this material.');const m=d.material;meta.innerHTML=`<h2>${esc(m.subject)} — ${esc(m.topic||m.chapterName)}</h2><div class="info">Grade: ${esc(m.className)} · Chapter ${esc(m.chapterNo)}: ${esc(m.chapterName)} · Teacher: ${esc(m.teacherName)} · ${esc(m.materialDate?new Date(m.materialDate).toLocaleDateString():'')}</div>`;const pages=Array.isArray(m.pages)?m.pages:[];if(!pages.length){host.innerHTML='<div class="status">This document contains no pages.</div>';return;}host.innerHTML=pages.map((p,i)=>`<section class="page"><h3>Page ${i+1} of ${pages.length}</h3><div class="paper" data-page="${i}"><canvas></canvas></div></section>`).join('');pages.forEach((p,i)=>renderPage(host.querySelectorAll('.paper canvas')[i],p));}catch(e){meta.textContent=e.message||'Could not load this material.';}
function renderPage(canvas,page){const ctx=canvas.getContext('2d');const w=800,h=1130;canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const bg=page.background||'white';if(bg==='ruled'||bg==='four-line'||bg==='grid'||bg==='dots'){ctx.lineWidth=1;for(let y=20;y<h;y+=(bg==='four-line'?44:bg==='ruled'?32:bg==='grid'?24:18)){if(bg==='dots'){for(let x=12;x<w;x+=18){ctx.fillStyle='#b8c5d8';ctx.fillRect(x,y,1.5,1.5);}continue;}ctx.strokeStyle=bg==='grid'?'#cbd5e1':(bg==='four-line'&&Math.round((y-20)/44)%3===2?'#df6666':'#9fc5ff');ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();if(bg==='grid'){ctx.beginPath();ctx.moveTo(y,0);ctx.lineTo(y,h);ctx.stroke();}}}const items=Array.isArray(page.history)?page.history:[];items.forEach(it=>{if(!it)return;ctx.save();ctx.strokeStyle=it.color||'#111';ctx.fillStyle=it.color||'#111';ctx.lineWidth=Number(it.width)||3;ctx.lineCap='round';ctx.lineJoin='round';if(it.type==='pen'||it.type==='eraser'||it.type==='highlighter'||Array.isArray(it.points)){const pts=it.points||[];if(pts.length){ctx.globalCompositeOperation=it.type==='eraser'?'destination-out':'source-over';ctx.beginPath();ctx.moveTo((pts[0].x||0), (pts[0].y||0));pts.slice(1).forEach(p=>ctx.lineTo(p.x||0,p.y||0));ctx.stroke();}}else if(it.type==='text'){ctx.font=`${Number(it.fontSize)||18}px ${it.fontFamily||'Arial'}`;String(it.text||'').split('\n').forEach((line,n)=>ctx.fillText(line,it.x||0,(it.y||0)+(n*(Number(it.fontSize)||18)*1.25))); }else if(it.type==='image'&&it.dataUrl){const img=new Image();img.onload=()=>{const sx=w/(canvas.clientWidth||w),sy=h/(canvas.clientHeight||h);ctx.drawImage(img,(it.x||0)*sx,(it.y||0)*sy,(it.width||img.width)*sx,(it.height||img.height)*sy);};img.src=it.dataUrl;}ctx.restore();});}
})();</script></body></html>
