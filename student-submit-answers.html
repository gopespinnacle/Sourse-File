<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Submit Assessment Answers</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f1f5f9;

    color: #1e293b;

}


.header {

    background: #0f172a;

    color: white;

    padding: 18px 25px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.header h1 {

    margin: 0;

    font-size: 22px;

}


.backBtn {

    border: none;

    background: #475569;

    color: white;

    padding: 9px 15px;

    border-radius: 7px;

    cursor: pointer;

}


.container {

    max-width: 800px;

    margin: 35px auto;

    padding: 0 20px;

}


.card {

    background: white;

    border-radius: 14px;

    padding: 25px;

    box-shadow:
        0 4px 15px
        rgba(15,23,42,.08);

}


#assessmentInfo {

    margin-bottom: 25px;

}


.infoRow {

    padding: 7px 0;

    color: #475569;

}


.infoRow strong {

    color: #0f172a;

}


.uploadArea {

    border: 2px dashed #94a3b8;

    border-radius: 12px;

    padding: 35px 20px;

    text-align: center;

    background: #f8fafc;

    cursor: pointer;

}


.uploadArea:hover {

    background: #f1f5f9;

}


.uploadIcon {

    font-size: 40px;

    margin-bottom: 10px;

}


.uploadText {

    font-weight: 600;

}


.uploadSubText {

    color: #64748b;

    font-size: 13px;

    margin-top: 5px;

}


#answerFiles {

    display: none;

}


#fileList {

    margin-top: 20px;

}


.fileItem {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding: 10px 12px;

    margin-bottom: 8px;

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 8px;

}


.fileName {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.removeBtn {

    border: none;

    background: #fee2e2;

    color: #b91c1c;

    padding: 6px 10px;

    border-radius: 6px;

    cursor: pointer;

}


.uploadBtn {

    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #16a34a;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

}


.uploadBtn:disabled {

    background: #94a3b8;

    cursor: not-allowed;

}


.message {

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    display: none;

}


.success {

    background: #dcfce7;

    color: #166534;

}


.error {

    background: #fee2e2;

    color: #991b1b;

}


@media(max-width:600px) {

    .header {

        padding: 15px;

    }

    .header h1 {

        font-size: 18px;

    }

    .container {

        margin: 20px auto;

        padding: 0 12px;

    }

    .card {

        padding: 18px;

    }

}

</style>

</head>


<body>


<div class="header">

    <h1>
        📤 Submit Answers
    </h1>

    <button
        class="backBtn"
        onclick="goBack()">

        ← Assessment Sheet

    </button>

</div>


<div class="container">

    <div class="card">

        <div id="assessmentInfo">

            Loading assessment...

        </div>


        <label
            class="uploadArea"
            for="answerFiles">

            <div class="uploadIcon">
                📎
            </div>

            <div class="uploadText">
                Select Answer Files
            </div>

            <div class="uploadSubText">

                You can select multiple files

            </div>

        </label>


        <input
            type="file"
            id="answerFiles"
            multiple>


        <div id="fileList"></div>


        <button
            id="uploadBtn"
            class="uploadBtn"
            onclick="uploadAnswers()">

            📤 Upload Answers

        </button>


        <div
            id="message"
            class="message">

        </div>

    </div>

</div>


<script
src="assets/js/meeting/ai/studentSubmitAnswers.js">
</script>


</body>

</html>
