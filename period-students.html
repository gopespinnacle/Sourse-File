<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Period Students</title>

<link rel="stylesheet" href="style.css">

<style>

#mobileHeading{
display:none;
}

@media(max-width:768px){

#desktopHeading{
display:none;
}

#mobileHeading{
display:block;
}

}


.main-content {
margin-left:220px;
padding:20px;
}

.student-card {
background:#fff;
padding:12px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
font-size:14px;
}

.mobile-header{

display:none;

}

@media(max-width:768px){

.mobile-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

}

.page-title{

margin:0;

font-size:20px;

text-align:center;

flex:1;

}

.back-btn,
.home-btn{

all:unset;

font-size:24px;

cursor:pointer;

padding:5px;

}

}

@media(max-width:768px){

#sidebar-container{
display:none !important;
}

#attendanceTable{
display:none;
}

body{
padding:0;
margin:0;
}

.main-content{
margin:0 !important;
padding:15px !important;
width:100% !important;
max-width:100% !important;
box-sizing:border-box;
}

#assignedContainer{
display:none;
}

#mobileAttendanceCards{
display:block;
width:100%;
}

h3{
display:none;
}

}

.attend-mobile-btn{
width:100%;
background:#28a745;
color:white;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
margin-bottom:15px;
}


/* CREATE LEARNING MATERIAL POPUP */
.learning-material-overlay{
    position:fixed; inset:0; z-index:99999;
    background:rgba(0,0,0,.72);
    display:none; align-items:center; justify-content:center;
    padding:16px; box-sizing:border-box;
}
.learning-material-modal{
    width:min(100%,448px); max-height:90vh; overflow:auto;
    background:#fff; color:#111; border-radius:12px;
    padding:24px 22px 22px; box-sizing:border-box;
    box-shadow:0 18px 55px rgba(0,0,0,.35);
    font-family:Arial,sans-serif;
}
.learning-material-brand{
    text-align:center; font-size:10px; letter-spacing:1.5px;
    color:#666; margin-bottom:5px;
}
.learning-material-modal h2{
    text-align:center; font-size:20px; margin:0 0 24px;
}
.learning-material-modal label{
    display:block; font-size:12px; color:#444;
    margin:0 0 6px; font-weight:600;
}
.learning-material-modal input,
.learning-material-modal textarea{
    width:100%; box-sizing:border-box; border:1px solid #ccc;
    border-radius:7px; padding:10px; margin-bottom:14px;
    font:12px Arial,sans-serif; color:#222; background:#fff;
}
.learning-material-modal input[readonly],
.learning-material-modal textarea[readonly]{
    background:#f5f5f5; color:#444;
}
.learning-material-modal textarea{min-height:58px; resize:vertical;}
.learning-material-actions{
    display:flex; justify-content:flex-end; gap:9px; margin-top:5px;
}
.learning-material-actions button{
    border:1px solid #ccc; border-radius:7px; padding:10px 18px;
    cursor:pointer; font-weight:600; background:#fff; color:#111;
}
.learning-material-actions .continue{
    background:#111; color:#fff; border-color:#111;
}
.learning-material-note{
    font-size:11px; color:#666; margin:-6px 0 13px;
}
@media(max-width:480px){
    .learning-material-modal{padding:20px 16px;}
}

</style>
</head>

<body class="dashboard-page">

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<script>

if(window.innerWidth > 768){

fetch("teacher-sidebar.html")
.then(res => res.text())
.then(data=>{

document.getElementById("sidebar-container").innerHTML = data;

});

}

</script>

<div class="main-content">

<div class="mobile-header">



<button
class="back-btn"
onclick="history.back()">
←
</button>

<h2 class="page-title">
Assigned Students
</h2>

<button
class="home-btn"
onclick="window.location.href='teacher-dashboard.html'">
🏠
</button>

</div>

<h2 id="desktopHeading">

Assigned Students (This Period)

</h2>

<button
id="attendBtn"
class="attend-mobile-btn"
onclick="joinClass()"
disabled>
⏳ Available 10 min before
</button>

<button
id="endClassBtn"
class="attend-mobile-btn"
style="background:#d32f2f;margin-top:10px;"
onclick="endClass()">
📞 End Class
</button>



<h2 id="desktopAttendanceHeading">
Class Attendance
</h2>

<div id="assignedContainer"></div>

<div id="mobileAttendanceCards"></div>
<!-- ✅ PASTE HERE -->


<table id="attendanceTable" style="
width:100%;
border-collapse:collapse;
background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

<thead style="background:#f1f1f1;">
<tr>
    <th>Date</th>
<th style="padding:10px;">Student</th>
<th>Student Status</th>
<th>Late Join</th>
<th>Teacher Status</th>
<th>Teacher Late</th>
<th>Compensation (mins)</th>
</tr>
</thead>

<tbody id="attendanceBody"></tbody>

</table>
<hr style="margin:40px 0;">

<!-- CREATE LEARNING MATERIAL POPUP: shown before Google Meet opens -->
<div id="learningMaterialOverlay" class="learning-material-overlay" role="dialog" aria-modal="true" aria-labelledby="learningMaterialTitle">
  <div class="learning-material-modal">
    <div class="learning-material-brand">GOPES PINNACLE ACADEMY</div>
    <h2 id="learningMaterialTitle">Create Learning Material</h2>

    <label for="materialDate">Date</label>
    <input id="materialDate" type="text" readonly>

    <label for="materialSubject">Subject</label>
    <input id="materialSubject" type="text" readonly>

    <label for="materialGrade">Grade</label>
    <input id="materialGrade" type="text" readonly>

    <label for="materialStudents">Assigned Students</label>
    <textarea id="materialStudents" readonly rows="2"></textarea>
    <div class="learning-material-note">All students assigned to this teacher and period are filled automatically.</div>

    <label for="materialChapterNumber">Chapter No : Example ( 4 )</label>
    <input id="materialChapterNumber" type="text" placeholder="Chapter number">

    <label for="materialChapterName">Chapter Name</label>
    <input id="materialChapterName" type="text" placeholder="Enter chapter name">

    <label for="materialTopic">Topic</label>
    <input id="materialTopic" type="text" placeholder="Enter topic">

    <label for="materialDescription">Description (Optional)</label>
    <textarea id="materialDescription" placeholder="Enter a short description of this topic"></textarea>

    <div class="learning-material-actions">
      <button type="button" onclick="cancelLearningMaterial()">Cancel</button>
      <button type="button" class="continue" onclick="continueToGoogleMeet()">Continue</button>
    </div>
  </div>
</div>




<script>

const token = sessionStorage.getItem("token");
let attendanceMarked = false;

let meetWindow = null;
let attendanceSubmittedForJoin = false;
let learningMaterialPopupOpen = false;

let periodStudents = [];
/* GET URL PARAMS */
const params = new URLSearchParams(window.location.search);

/* CLEAN PARAMS */
const cleanedParams = new URLSearchParams();

cleanedParams.append("className", params.get("className")?.trim());
cleanedParams.append("day", params.get("day")?.trim());
cleanedParams.append("startTime", params.get("startTime")?.trim());

const subject = params.get("subject");
const language = params.get("language");
const eca = params.get("eca");

if(subject){
cleanedParams.append("subject", subject.trim());
}

if(language){
cleanedParams.append("language", language.trim());
}

if(eca){
cleanedParams.append("eca", eca.trim());
}

/* LOAD STUDENTS */
async function loadPeriodStudents(){
console.log("TOKEN:", token);
try{
console.log("API URL:", cleanedParams.toString());
const res = await fetch(
"https://academy-backend-eatl.onrender.com/api/teacher/period-students?" + cleanedParams.toString(),
{
headers:{
"Authorization":"Bearer " + token
}
}
);

const data = await res.json();

periodStudents = data.data;

console.log("Response:", data);

const container = document.getElementById("assignedContainer");
container.innerHTML = "";

/* NO DATA */
if(!data.data || data.data.length === 0){
container.innerHTML = "<p>No students found ❌</p>";
return;
}

/* DISPLAY */
data.data.forEach(d=>{

let label =
d.subject ||
(d.languages?.join(", ")) ||
(d.eca?.join(", ")) ||
"General";

container.innerHTML += `
<div class="student-card">
<b>👤 ${d.student.name}</b><br>
📘 ${label}
</div>
`;

});
renderAttendanceTable(data.data);
updateTeacherStatus(); 
}catch(err){

console.log("FULL ERROR:", err);   // ✅ better debug

document.getElementById("assignedContainer").innerHTML =
"<p style='color:red;'>API ERROR - Check Console</p>";

}

}

window.onload = function(){

    loadPeriodStudents();

    checkClassTime();

};
/* 🔥 TIME CONTROL FUNCTION */
function checkClassTime(){

const params = new URLSearchParams(window.location.search);
const startTime = params.get("startTime");

const periodId = params.get("periodId");

if(!startTime) return;

const now = new Date();

const [hour, minute] = startTime.split(":");

const classTime = new Date();
classTime.setHours(parseInt(hour));
classTime.setMinutes(parseInt(minute));
classTime.setSeconds(0);

// 10 minutes before
const enableTime = new Date(classTime.getTime() - 10 * 60000);

const btn = document.getElementById("attendBtn");

if(now >= enableTime){
btn.disabled = false;
btn.style.background = "#28a745";
btn.innerText = "🎥 Attend Class";
}else{
btn.disabled = true;
btn.style.background = "gray";
btn.innerText = "⏳ Available 10 min before";
}

}
function updateTeacherStatus(){

const params = new URLSearchParams(window.location.search);
const startTime = params.get("startTime");

if(!startTime) return;

const now = new Date();

const [hour, minute] = startTime.split(":");

const classStart = new Date();
classStart.setHours(parseInt(hour));
classStart.setMinutes(parseInt(minute));
classStart.setSeconds(0);

// class end = +1 hour
const endTime = params.get("endTime");

if(!endTime) return;  // safety

const [endHour, endMinute] = endTime.split(":");

const classEnd = new Date();
classEnd.setHours(parseInt(endHour));
classEnd.setMinutes(parseInt(endMinute));
classEnd.setSeconds(0);

const teacherStatusElements = document.querySelectorAll("[id^='teacher-status-']");

teacherStatusElements.forEach(el => {

// BEFORE CLASS
// BEFORE CLASS
if(now < classStart){
el.innerHTML = "<span style='color:gray;'>Class yet to start</span>";
}

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML =
"Class yet to start";
mobileEl.style.color = "gray";
}

// DURING CLASS (NOT JOINED)
else if(now >= classStart && now <= classEnd){

if(el.innerText !== "Present"){

el.innerHTML =
"<span style='color:orange;'>Teacher not yet came</span>";

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML =
"Teacher not yet came";
mobileEl.style.color = "orange";
}

}

}

// AFTER CLASS (NOT CLICKED)
else if(now > classEnd){

if(!attendanceMarked && el.innerText !== "Present" && el.innerText !== "Absent"){

el.innerHTML = "<span style='color:red;'>Absent</span>";

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML = "Absent";
mobileEl.style.color = "red";
}

/* ✅ SAVE ABSENT IN DB */
fetch("https://academy-backend-eatl.onrender.com/api/teacher/attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId: sessionStorage.getItem("teacherId"),
teacherName: sessionStorage.getItem("teacherName"),
className: params.get("className"),
subject: params.get("subject") || "General",
day: params.get("day"),
startTime: params.get("startTime"),
date: new Date().toISOString(),
joinTime: null,
endTime: null,
status: "Absent"
})
});

// ✅ ADD THIS LINE HERE (OUTSIDE fetch)
attendanceMarked = true;

}

}

});

}
/* RUN EVERY 10 SECONDS */
setInterval(() => {
checkClassTime();
updateTeacherStatus();
}, 10000);
function renderAttendanceTable(students){

const tbody = document.getElementById("attendanceBody");
tbody.innerHTML = "";

const mobileCards =
document.getElementById("mobileAttendanceCards");

if(mobileCards){
mobileCards.innerHTML = "";
}

students.forEach(s => {

const today = new Date().toLocaleDateString("en-IN");

tbody.innerHTML += `
<tr>

<td>${today}</td>

<td style="padding:10px;">${s.student.name}</td>

<td id="status-${s.student._id}">
<span style="color:gray;">Pending</span>
</td>

<td id="late-${s.student._id}">0</td>

<td id="teacher-status-${s.student._id}">
<span style="color:gray;">Class yet to start</span>
</td>

<td>0</td>

<td>0</td>

</tr>
`;

if(window.innerWidth <= 768){

mobileCards.innerHTML += `

<div style="
background:white;
padding:15px;
border-radius:12px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
">

<b>👤 ${s.student.name}</b><br>

📘 ${params.get("subject") || "General"}<br><br>

📅 ${today}<br>

🟡 Student Status : Pending<br>

⏰ Late Join : 0 min<br><br>

👨‍🏫 Teacher Status :
<span
id="mobile-teacher-status-${s.student._id}"
style="color:gray;">
Class yet to start
</span><br>

⌛ Teacher Late : 0 min<br>

🎁 Compensation : 0 min

</div>

`;

}


});

}
async function joinClass(){
console.log("Attendance Marked ✅");
const params = new URLSearchParams(window.location.search);
const periodId = params.get("periodId");
const startTime = params.get("startTime");

// Preserve the exact MongoDB period ID through the entire Attend Class flow.
if (!periodId) {
    alert("This page is missing its assigned period ID. Please return to My Timetable and open this period again.");
    return;
}
sessionStorage.setItem("assignedPeriodId", periodId);
sessionStorage.setItem("currentPeriodId", periodId);
sessionStorage.setItem("periodId", periodId);
sessionStorage.setItem("annotationPeriodId", periodId);


const now = new Date();
const [hour, minute] = startTime.split(":");

const classStart = new Date();
classStart.setHours(parseInt(hour));
classStart.setMinutes(parseInt(minute));
classStart.setSeconds(0);

if(now < classStart){
alert("Class not started yet ❌");
return;
}

/* ✅ SET PRESENT */
document.querySelectorAll(
"[id^='teacher-status-']"
).forEach(el=>{

el.innerHTML =
"<span style='color:green;'>Present</span>";

const studentId =
el.id.replace("teacher-status-","");

const mobileEl =
document.getElementById(
`mobile-teacher-status-${studentId}`
);

if(mobileEl){
mobileEl.innerHTML = "Present";
mobileEl.style.color = "green";
}

});

const className = params.get("className");
const day = params.get("day");

const subject =
params.get("subject") ||
params.get("language") ||
params.get("eca") ||
"General";

const token = sessionStorage.getItem("token");
const teacherId = sessionStorage.getItem("teacherId");

/* API: submit attendance once for this page session */
if(!attendanceSubmittedForJoin){
try{
const attendanceResponse = await fetch("https://academy-backend-eatl.onrender.com/api/teacher/attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId,
className,
subject,
day,
startTime,
date: new Date().toISOString(),
joinTime: new Date().toISOString(),
endTime: null,
status: "Present"
})
});

if(attendanceResponse.ok){
attendanceSubmittedForJoin = true;
console.log("Attendance Marked ✅");
}else{
console.error("Attendance API returned:", attendanceResponse.status);
}
}catch(err){
console.log("Attendance Error ❌", err);
}
}

// Save teacher join time
sessionStorage.setItem(
    "teacherInTime",
    new Date().toISOString()
);

// Save class details for summary
sessionStorage.setItem(
    "summaryClassName",
    className
);

sessionStorage.setItem(
    "summarySubject",
    subject
);

sessionStorage.setItem(
    "summaryDate",
    new Date().toLocaleDateString()
);

sessionStorage.setItem(
    "summaryPeriodTime",
    startTime
);

sessionStorage.setItem(
    "summaryDay",
    day
);

sessionStorage.setItem(
    "summaryStartTime",
    startTime
);

sessionStorage.setItem(
    "summaryEndTime",
    params.get("endTime")
);

sessionStorage.setItem(
    "summaryStudents",
    JSON.stringify(

        periodStudents.map(s => ({

            studentId: s.student._id,

            studentName: s.student.name

        }))

    )
);

/* Show Create Learning Material before opening Google Meet */
    populateLearningMaterialPopup(subject);
    document.getElementById("learningMaterialOverlay").style.display = "flex";
    learningMaterialPopupOpen = true;
}

function getPeriodGrade(){
    const params = new URLSearchParams(window.location.search);
    // The className query parameter is the period's grade/class label in this page.
    const className = (params.get("className") || "").trim();
    if(className) return className;

    // Fallbacks in case the period-students API provides an explicit grade field.
    const first = Array.isArray(periodStudents) ? periodStudents[0] : null;
    return (
        first?.grade ||
        first?.student?.grade ||
        first?.student?.className ||
        first?.student?.standard ||
        "Not available"
    );
}

function populateLearningMaterialPopup(subjectValue){
    const now = new Date();
    const dateText = now.toLocaleDateString("en-GB");
    const names = (Array.isArray(periodStudents) ? periodStudents : [])
        .map(item => item?.student?.name)
        .filter(Boolean);

    document.getElementById("materialDate").value = dateText;
    document.getElementById("materialSubject").value = subjectValue || "General";
    document.getElementById("materialGrade").value = getPeriodGrade();
    document.getElementById("materialStudents").value =
        names.length ? names.join("\n") : "No assigned students found";
}

function cancelLearningMaterial(){
    document.getElementById("learningMaterialOverlay").style.display = "none";
    learningMaterialPopupOpen = false;
    alert("Google Meet has not been opened. Click Attend Class again when you are ready to continue.");
}

function continueToGoogleMeet(){
    if(!learningMaterialPopupOpen) return;

    const chapterNumber = document.getElementById("materialChapterNumber").value.trim();
    const chapterName = document.getElementById("materialChapterName").value.trim();
    const topic = document.getElementById("materialTopic").value.trim();
    const description = document.getElementById("materialDescription").value.trim();
    const date = document.getElementById("materialDate").value;
    const materialSubject = document.getElementById("materialSubject").value.trim();
    const grade = document.getElementById("materialGrade").value.trim();
    const students = document.getElementById("materialStudents").value.split("\n").filter(Boolean);

    if(!chapterNumber || !chapterName || !topic){
        alert("Please enter the chapter number, chapter name, and topic before continuing.");
        return;
    }

    // Always take the period ID from the actual period-students page URL first.
    const pageParams = new URLSearchParams(window.location.search);
    const periodId = pageParams.get("periodId") ||
        sessionStorage.getItem("assignedPeriodId") ||
        sessionStorage.getItem("currentPeriodId") ||
        sessionStorage.getItem("periodId");

    if(!periodId || periodId === "null" || periodId === "undefined"){
        alert("The assigned period ID is missing. Return to My Timetable and open this period using Attend Class.");
        return;
    }

    // Keep a single canonical ID available to the annotation page and its save controller.
    ["assignedPeriodId", "currentPeriodId", "periodId", "annotationPeriodId"].forEach(key => sessionStorage.setItem(key, periodId));

    const teacherName = sessionStorage.getItem("teacherName") || localStorage.getItem("teacherName") || "";
    const teacherId = sessionStorage.getItem("teacherId") || localStorage.getItem("teacherId") || "";
    const details = {
        date,
        materialDate: date,
        subject: materialSubject || "General",
        grade,
        className: grade,
        students,
        studentNames: students,
        chapterNumber,
        chapterNo: chapterNumber,
        chapterName,
        topic,
        description,
        periodId,
        assignedPeriodId: periodId,
        teacherId,
        teacher: teacherId,
        teacherName,
        room: "period-" + periodId
    };
    sessionStorage.setItem("learningMaterialDetails", JSON.stringify(details));

    const annotationParams = new URLSearchParams({
        subject: details.subject,
        chapterNumber,
        chapterName,
        topic,
        grade,
        className: grade,
        date,
        periodId
    });

    window.location.href = "annotation.html?" + annotationParams.toString();
}

async function openTeacherGoogleMeet(){
    /* ================= OPEN TEACHER GOOGLE MEET ================= */

    meetWindow = window.open("about:blank", "_blank");

    if(!meetWindow){
        alert("Please allow pop-ups for this website to join the class.");
        return;
    }

    try{
        const token = sessionStorage.getItem("token");

        const meetingResponse = await fetch(
            "https://academy-backend-eatl.onrender.com/api/teacher/my-meeting-link",
            {
                method:"GET",
                headers:{ "Authorization":"Bearer " + token }
            }
        );

        const meetingData = await meetingResponse.json();

        if(!meetingResponse.ok){
            meetWindow.close();
            alert(meetingData.message || "Teacher meeting link not available.");
            return;
        }

        if(!meetingData.meetingLink){
            meetWindow.close();
            alert("Google Meet link is not configured for this teacher.");
            return;
        }

        meetWindow.location.href = meetingData.meetingLink;
        sessionStorage.setItem("teacherMeetingLink", meetingData.meetingLink);
        attendanceMarked = true;
        document.getElementById("endClassBtn").style.display = "block";
    }catch(err){
        console.error("MEETING LINK ERROR:", err);
        if(meetWindow && !meetWindow.closed) meetWindow.close();
        alert("Unable to open the teacher's Google Meet.");
    }

}
async function endClass(){

    // Save teacher leave time
    sessionStorage.setItem(
        "teacherOutTime",
        new Date().toISOString()
    );

    if(meetWindow && !meetWindow.closed){
        meetWindow.close();
    }

    const params = new URLSearchParams(window.location.search);

    const token = sessionStorage.getItem("token");

    await fetch(
    "https://academy-backend-eatl.onrender.com/api/teacher/end-attendance",
    {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
            teacherId:sessionStorage.getItem("teacherId"),
            className:params.get("className"),
            subject:params.get("subject"),
            day:params.get("day"),
            startTime:params.get("startTime"),
            endTime:new Date().toISOString()
        })
    });

    // Open summary page
    window.location.href =
"teacher-class-summary.html";

}
async function testSaveAttendance(){

const params = new URLSearchParams(window.location.search);

await fetch("https://academy-backend-eatl.onrender.com/api/teacher/attendance",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer " + token
},
body: JSON.stringify({
teacherId: sessionStorage.getItem("teacherId"),
teacherName: sessionStorage.getItem("teacherName"),
className: params.get("className"),
subject: params.get("subject") || "General",
day: params.get("day"),
startTime: params.get("startTime"),
date: new Date().toISOString(),
joinTime: null,
endTime: null,
status: "Absent"
})
});

alert("Saved in DB ✅");

}
</script>
