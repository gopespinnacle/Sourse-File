<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Classroom Settings</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

.ai-settings-container {

    max-width: 700px;

    margin: 40px auto;

    background: white;

    padding: 35px;

    border-radius: 18px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.10);

}

.ai-settings-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;

}

.ai-settings-header h1 {

    margin: 0;

    color: #123a63;

}

.setting-group {

    margin-bottom: 25px;

}

.setting-group label {

    display: block;

    font-weight: 600;

    margin-bottom: 10px;

    color: #333;

}

.setting-group select {

    width: 100%;

    padding: 13px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 16px;

}

.interval-info {

    background: #f1f5f9;

    padding: 18px;

    border-radius: 10px;

    margin-top: 15px;

    line-height: 1.8;

}

.save-btn {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #1e045c,
            #337dec
        );

    color: white;

    font-size: 17px;

    font-weight: 600;

    cursor: pointer;

}

.save-btn:hover {

    opacity: 0.9;

}

.back-btn {

    padding: 10px 18px;

    border: none;

    border-radius: 8px;

    background: #e5e7eb;

    cursor: pointer;

    font-weight: 600;

}

.status-message {

    text-align: center;

    margin-top: 15px;

    font-weight: 600;

}

</style>

</head>


<body class="dashboard-page">


<!-- SIDEBAR -->

<div id="sidebar-container"></div>


<script>

fetch("sidebar.html")

.then(res => res.text())

.then(data => {

    document.getElementById(
        "sidebar-container"
    ).innerHTML = data;

});

</script>


<!-- MAIN -->

<div class="main-content">


<div class="ai-settings-container">


<div class="ai-settings-header">

<h1>
🤖 AI Classroom
</h1>

<button
class="back-btn"
onclick="window.location.href='founder-dashboard.html'">

← Back

</button>

</div>


<!-- ENABLE -->

<div class="setting-group">

<label>

AI Classroom Questions

</label>

<select id="aiEnabled">

<option value="true">
Enabled
</option>

<option value="false">
Disabled
</option>

</select>

</div>


<!-- INTERVAL -->

<div class="setting-group">

<label>

Generate Questions Every

</label>

<select
id="intervalMinutes"
onchange="updateQuestionInfo()">

<option value="5">
5 Minutes
</option>

<option value="10">
10 Minutes
</option>

<option value="15">
15 Minutes
</option>

<option value="20">
20 Minutes
</option>

</select>


<div
class="interval-info"
id="questionInfo">

</div>

</div>


<button
class="save-btn"
onclick="saveSettings()">

💾 Save AI Settings

</button>


<div
id="statusMessage"
class="status-message">
</div>


</div>


</div>


<script>

const API =
"https://academy-backend-eatl.onrender.com/api";


/* ==========================================
   QUESTION COUNT
========================================== */

function updateQuestionInfo(){

    const interval =
        Number(
            document.getElementById(
                "intervalMinutes"
            ).value
        );


    const questionMap = {

        5: 1,

        10: 3,

        15: 6,

        20: 9

    };


    const count =
        questionMap[interval];


    document.getElementById(
        "questionInfo"
    ).innerHTML = `

        <strong>
            AI will generate:
        </strong>

        ${count} question(s)

        <br>

        <strong>
            Interval:
        </strong>

        Every ${interval} minutes

    `;

}


/* ==========================================
   LOAD SETTINGS
========================================== */

async function loadSettings(){

    try {

        const token =
            localStorage.getItem("token");


        const res = await fetch(

            API +
            "/founder/ai-classroom/settings",

            {

                headers: {

                    "Authorization":
                        "Bearer " + token

                }

            }

        );


        const result =
            await res.json();


        if(
            result.success &&
            result.data
        ){

            document.getElementById(
                "aiEnabled"
            ).value =
                String(
                    result.data.enabled
                );


            document.getElementById(
                "intervalMinutes"
            ).value =
                result.data.intervalMinutes;


            updateQuestionInfo();

        }

    }
    catch(error){

        console.log(
            "AI settings load error:",
            error
        );

    }

}


/* ==========================================
   SAVE SETTINGS
========================================== */

async function saveSettings(){

    const token =
        localStorage.getItem("token");


    const enabled =
        document.getElementById(
            "aiEnabled"
        ).value === "true";


    const intervalMinutes =
        Number(
            document.getElementById(
                "intervalMinutes"
            ).value
        );


    try {

        const res = await fetch(

            API +
            "/founder/ai-classroom/settings",

            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token

                },

                body: JSON.stringify({

                    enabled,

                    intervalMinutes

                })

            }

        );


        const result =
            await res.json();


        const message =
            document.getElementById(
                "statusMessage"
            );


        if(result.success){

            message.style.color =
                "green";

            message.innerText =
                "✅ AI Classroom settings saved successfully.";

        }
        else{

            message.style.color =
                "red";

            message.innerText =
                result.message ||
                "Unable to save settings.";

        }

    }
    catch(error){

        console.log(error);

        document.getElementById(
            "statusMessage"
        ).innerText =
            "Server error.";

    }

}


/* INITIAL LOAD */

updateQuestionInfo();

loadSettings();

</script>


</body>

</html>
