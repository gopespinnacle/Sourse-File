<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<link rel="stylesheet" href="style.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>
</head>

<body class="login-page">


<div class="login-box">

    <img src="images/logo.png">

    <h2>Admin Login</h2>


    <div class="input-box">

        <i class="fa fa-user"></i>

        <input
            type="text"
            id="email"
            placeholder="Login ID"
        >

    </div>


    <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

    </div>


    <div class="remember">

        <input
            type="checkbox"
            id="rememberMe"
        >

        Remember Me

    </div>


    <button
        type="button"
        class="login-btn"
        onclick="loginUser()"
    >
        Log In
    </button>


    <div class="links">

        <a href="#">
            Forgot Password?
        </a>

    </div>


</div>


<script>

console.log("ADMIN LOGIN SCRIPT LOADED ✅");


function loginUser() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    console.log(
        "ADMIN LOGIN CLICKED",
        email
    );


    /* ================= VALIDATION ================= */

    if (!email) {

        alert("Please enter your Admin Login ID.");

        return;

    }


    if (!password) {

        alert("Please enter your password.");

        return;

    }


    /* ================= LOGIN API ================= */

    fetch(
        "https://academy-backend-eatl.onrender.com/api/auth/login",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                email: email,

                password: password,

                role: "admin"

            })
        }
    )

    .then(res => res.json())

    .then(data => {

        console.log(
            "ADMIN LOGIN RESPONSE:",
            data
        );


        if (
            data.message ===
            "Login successful"
        ) {


            /* ================= SAVE TOKEN ================= */

            localStorage.setItem(
                "token",
                data.token
            );


            /* ================= SAVE ROLE ================= */

            localStorage.setItem(
                "role",
                "admin"
            );


            /* ================= SAVE USER ================= */

            if (data.user) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

            }


            alert(
    "Admin Login Successful ✅"
);

window.location.href =
    "admin-dashboard.html";


        } else {

            alert(
                data.message ||
                "Admin Login Failed ❌"
            );

        }

    })

    .catch(error => {

        console.error(
            "ADMIN LOGIN ERROR:",
            error
        );

        alert(
            "Server error ❌"
        );

    });

}

</script>


</body>
</html>
