    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /* =====================================================
           CLASSROOM
           ===================================================== */

        #classroom {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        #topBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            background: #1f2937;

            border-bottom:
                1px solid #374151;

        }


        #academyTitle {

            font-size: 18px;

            font-weight: 600;

        }


        #meetingInfo {

            display: flex;

            align-items: center;

            gap: 18px;

            font-size: 14px;

        }


        /* =====================================================
           ROLE
           ===================================================== */

        #userRole {

            font-weight: 600;

        }


        /* =====================================================
           CONNECTION STATUS
           ===================================================== */

        #connectionStatus {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        #connectionDot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: #f59e0b;

        }


        #connectionText {

            color: #d1d5db;

        }


        /* =====================================================
           MAIN AREA
           ===================================================== */

        #mainArea {

            flex: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        #welcomeMessage {

            text-align: center;

            color: #d1d5db;

        }


        #welcomeMessage h2 {

            margin: 0 0 10px 0;

            font-size: 26px;

        }


        #welcomeMessage p {

            margin: 7px 0;

            font-size: 14px;

        }


        /* =====================================================
           PARTICIPANT CAPACITY
           ===================================================== */

        #capacityInfo {

            margin-top: 18px;

            padding: 10px 16px;

            border-radius: 8px;

            background: #1f2937;

            color: #9ca3af;

            font-size: 13px;

        }


        /* =====================================================
           BOTTOM BAR
           ===================================================== */

        #bottomBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #1f2937;

            border-top:
                1px solid #374151;

        }


        #systemStatus {

            font-size: 13px;

            color: #9ca3af;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            #topBar {

                height: auto;

                min-height: 60px;

                padding: 10px 12px;

                gap: 10px;

            }


            #academyTitle {

                font-size: 14px;

            }


            #meetingInfo {

                gap: 8px;

                font-size: 11px;

            }


            #welcomeMessage h2 {

                font-size: 21px;

            }

        }

   STUDENT — HIDE ANNOTATE BUTTON

body.student-role #annotationOpenButtonV1 {

    <script>

        /*
        ========================================================
        GOPES PINNACLE ACADEMY
        VIRTUAL CLASSROOM
        ========================================================

        PHASE 1

        This module currently handles ONLY:

        1. Server connection
        2. Room information
        3. User role
        4. Socket connection status

        NOT YET IMPLEMENTED:

        - WebRTC
        - Camera
        - Microphone
        - Participants
        - Whiteboard
        - PDF
        - Screen sharing
        - Chat
        - Recording
        - Attendance

        ========================================================
        */


        /* =====================================================
           SERVER
           ===================================================== */

        const SERVER_URL =
            "https://academy-backend-eatl.onrender.com";


        /* =====================================================
           MAXIMUM CLASSROOM CAPACITY
           ===================================================== */

        const MAX_FOUNDERS = 1;

        const MAX_TEACHERS = 2;

        const MAX_STUDENTS = 10;

        const MAX_PARTICIPANTS =
            MAX_FOUNDERS +
            MAX_TEACHERS +
            MAX_STUDENTS;


        /* =====================================================
           READ URL PARAMETERS
           ===================================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        /* =====================================================
           ROOM
           ===================================================== */

        const meetingRoom =
            urlParams.get("room") ||
            localStorage.getItem("meetingRoom") ||
            "";


        /* =====================================================
           ROLE
           ===================================================== */

        const meetingRole =
            (
                urlParams.get("role") ||
                localStorage.getItem("meetingRole") ||
                ""

(function(){

    const currentRole =
        new URLSearchParams(
            window.location.search
        ).get("role");

    /*
    =========================================================
    STATE
    =========================================================
    */

    let studentAnnotationAllowed = false;


    /*
    =========================================================
    GET CURRENT ANNOTATION CANVAS
    =========================================================
    */

    function getAnnotationCanvas(){

        return document.getElementById(
            "annotationCanvasV1"
        );

    }


    /*
    =========================================================
    LOCK STUDENT
    =========================================================
    */

    function lockStudentAnnotation(){

        studentAnnotationAllowed = false;


        const canvas =
            getAnnotationCanvas();


        if(canvas){

            canvas.style.pointerEvents =
                "none";

            canvas.style.cursor =
                "not-allowed";

        }


        console.log(
            "ANNOTATION PERMISSION: STUDENT LOCKED"
        );

    }


    /*
    =========================================================
    ALLOW STUDENT
    =========================================================
    */

    function allowStudentAnnotation(){

        studentAnnotationAllowed = true;


        const canvas =
            getAnnotationCanvas();


        if(canvas){

            canvas.style.pointerEvents =
                "auto";

            canvas.style.cursor =
                "crosshair";

        }


        console.log(
            "ANNOTATION PERMISSION: STUDENT ALLOWED"
        );

    }


    /*
    =========================================================
    PERMISSION EVENT FROM SERVER
    =========================================================
    */

    socket.on(
        "annotationPermissionChanged",
        (data) => {

            console.log(
                "ANNOTATION PERMISSION EVENT:",
                data
            );


            /*
            -------------------------------------------------
            TEACHER
            -------------------------------------------------
            */

           if(
    currentRole === "teacher"
){

                return;

            }


            /*
            -------------------------------------------------
            STUDENT
            -------------------------------------------------
            */

            const mySocketId =
                socket.id;


            if(
                data &&
                data.studentSocketId ===
                    mySocketId
            ){

                allowStudentAnnotation();

            }
            else{

                lockStudentAnnotation();

            }

        }
    );


    /*
    =========================================================
    INITIAL STUDENT STATE
    =========================================================
    */

    if(
    currentRole === "student"
){

        /*
        ---------------------------------------------
        IMPORTANT:
        STUDENT STARTS LOCKED
        ---------------------------------------------
        */

        lockStudentAnnotation();

    }


    /*
    =========================================================
    ANNOTATION SESSION CLOSED
    =========================================================
    */

    socket.on(
        "annotationStopped",
        (data) => {

            if(
    currentRole !== "student"
){

                return;

            }


            lockStudentAnnotation();


            console.log(
                "ANNOTATION PERMISSION: LOCKED AFTER SESSION STOP"
            );

        }
    );


    /*
    =========================================================
    ANNOTATION SESSION STARTED
    =========================================================
    */

    socket.on(
        "annotationStarted",
        (data) => {

            if(
    currentRole !== "student"
){

                return;

            }


            /*
            ---------------------------------------------
            IMPORTANT:
            NEW SESSION STARTS LOCKED
            ---------------------------------------------
            */

            lockStudentAnnotation();


            console.log(
                "ANNOTATION PERMISSION: NEW SESSION LOCKED"
            );

        }
    );


})();

/* =========================================================

   ========================================================= */

(function(){

    const meetingControls =
        document.getElementById(
            "meetingControls"
        );

    const participantGrid =
        document.getElementById(
            "participantGrid"
        );


    if(
        !meetingControls ||
        !participantGrid
    ){

        console.warn(
            "PIP CONTROLS: required elements not found"
        );

        return;

    }


    /*
    =========================================================
    REMEMBER ORIGINAL LOCATION
    =========================================================
    */

    const originalParent =
        meetingControls.parentElement;

    const originalNextSibling =
        meetingControls.nextSibling;


    let controlsInsidePiP =
        false;


    /*
    =========================================================
    MOVE CONTROLS INTO PIP
    =========================================================
    */

    function moveControlsIntoPiP(){

        if(
            controlsInsidePiP
        ){

            return;

        }


        if(
            !participantGrid.classList.contains(
                "annotation-active"
            )
        ){

            return;

        }


        participantGrid.appendChild(
            meetingControls
        );


        controlsInsidePiP =
            true;


        console.log(
            "PIP CONTROLS: MOVED INTO PIP"
        );

    }


    /*
    =========================================================
    RETURN CONTROLS TO ORIGINAL LOCATION
    =========================================================
    */

    function restoreControls(){

        if(
            !controlsInsidePiP
        ){

            return;

        }


        if(
            originalNextSibling &&
            originalNextSibling.parentNode ===
                originalParent
        ){

            originalParent.insertBefore(
                meetingControls,
                originalNextSibling
            );

        }
        else{

            originalParent.appendChild(
                meetingControls
            );

        }


        controlsInsidePiP =
            false;


        console.log(
            "PIP CONTROLS: RESTORED"
        );

    }


    /*
    =========================================================
    WATCH ANNOTATION STATE
    =========================================================
    */

    const observer =
        new MutationObserver(
            () => {

                if(
                    participantGrid.classList.contains(
                        "annotation-active"
                    )
                ){

                    moveControlsIntoPiP();

                }
                else{

                    restoreControls();

                }

            }
        );


    observer.observe(
        participantGrid,
        {

            attributes:true,

            attributeFilter:[
                "class"
            ]

        }
    );


    /*
    =========================================================
    INITIAL CHECK
    =========================================================
    */

    if(
        participantGrid.classList.contains(
            "annotation-active"
        )
    ){

        moveControlsIntoPiP();

    }

})();


/* =========================================================
   ANNOTATION PIP — DRAG CONTROLLER
   ========================================================= */

(function(){

    let pipDragging = false;

    let pipStartX = 0;

    let pipStartY = 0;

    let pipStartLeft = 0;

    let pipStartTop = 0;


    function getPiP(){

        return document.getElementById(
            "participantGrid"
        );

    }


    function startPiPDrag(event){

        const pip =
            getPiP();


        if(
            !pip ||
            !pip.classList.contains(
                "annotation-active"
            )
        ){

            return;

        }

         /*
    -----------------------------------------------------
    ONLY START PIP DRAG IF POINTER IS INSIDE PIP
    -----------------------------------------------------
    */

    if(
        !pip.contains(
            event.target
        )
    ){

        return;

    }


    /*
    -----------------------------------------------------
    DO NOT START DRAGGING FROM VIDEO
    -----------------------------------------------------
    */

    if(
        event.target.closest(
            "video"
        )
    ){

        return;

    }

            /*
    -----------------------------------------------------
    ALLOW NATIVE PIP RESIZE
    -----------------------------------------------------

    The bottom-right corner belongs to the
    browser's native resize operation.

    DO NOT start our drag controller there.
    -----------------------------------------------------
    */

    const pipRect =
        pip.getBoundingClientRect();


    const resizeZone =
        28;


    const insideResizeZone =
        event.clientX >=
            pipRect.right - resizeZone &&
        event.clientY >=
            pipRect.bottom - resizeZone;


    if(
        insideResizeZone
    ){

        console.log(
            "PIP RESIZE ZONE — NATIVE RESIZE ACTIVE"
        );

        return;

    }


        /*
-----------------------------------------------------
DO NOT START DRAGGING FROM BUTTONS / CONTROLS
-----------------------------------------------------
*/

if(
    event.target.closest(
        "button"
    )
){

    return;

}


/*
-----------------------------------------------------
DO NOT START DRAGGING FROM VIDEO
-----------------------------------------------------
*/

if(
    event.target.closest(
        "video"
    )
){

    return;

}


        /*
        -----------------------------------------------------
        GET POINTER POSITION
        -----------------------------------------------------
        */

        const point =
            event.touches
                ? event.touches[0]
                : event;


        const rect =
            pip.getBoundingClientRect();


        pipDragging =
            true;


        pipStartX =
            point.clientX;


        pipStartY =
            point.clientY;


        pipStartLeft =
            rect.left;


        pipStartTop =
            rect.top;


        /*
        -----------------------------------------------------
        CHANGE FROM RIGHT/TOP POSITIONING
        TO LEFT/TOP DURING DRAG
        -----------------------------------------------------
        */

        pip.style.left =
            rect.left + "px";


        pip.style.top =
            rect.top + "px";


        pip.style.right =
            "auto";


        pip.style.bottom =
            "auto";


        /*
        -----------------------------------------------------
        PREVENT TEXT SELECTION
        -----------------------------------------------------
        */

        document.body.style.userSelect =
            "none";


        /*
        -----------------------------------------------------
        POINTER EVENTS
        -----------------------------------------------------
        */

        if(
            event.pointerId !== undefined &&
            pip.setPointerCapture
        ){

            try{

                pip.setPointerCapture(
                    event.pointerId
                );

            }
            catch(error){

                console.warn(
                    "PiP pointer capture failed:",
                    error
                );

            }

        }


        event.preventDefault();

    }


    function movePiPDrag(event){

        if(!pipDragging){

            return;

        }


        const pip =
            getPiP();


        if(
            !pip ||
            !pip.classList.contains(
                "annotation-active"
            )
        ){

            return;

        }


        const point =
            event.touches
                ? event.touches[0]
                : event;


        const deltaX =
            point.clientX -
            pipStartX;


        const deltaY =
            point.clientY -
            pipStartY;


        let newLeft =
            pipStartLeft +
            deltaX;


        let newTop =
            pipStartTop +
            deltaY;


        /*
        -----------------------------------------------------
        KEEP PIP INSIDE SCREEN
        -----------------------------------------------------
        */

        const maxLeft =
            window.innerWidth -
            pip.offsetWidth;


        const maxTop =
            window.innerHeight -
            pip.offsetHeight;


        newLeft =
            Math.max(
                0,
                Math.min(
                    maxLeft,
                    newLeft
                )
            );


        newTop =
            Math.max(
                0,
                Math.min(
                    maxTop,
                    newTop
                )
            );


        pip.style.left =
            newLeft + "px";


        pip.style.top =
            newTop + "px";

    }


    function stopPiPDrag(event){

        if(!pipDragging){

            return;

        }


        pipDragging =
            false;


        document.body.style.userSelect =
            "";


        const pip =
            getPiP();


        if(
            pip &&
            event.pointerId !== undefined &&
            pip.releasePointerCapture
        ){

            try{

                pip.releasePointerCapture(
                    event.pointerId
                );

            }
            catch(error){

                console.warn(
                    "PiP pointer release failed:",
                    error
                );

            }

        }

    }


    /*
    =========================================================
    POINTER EVENTS
    =========================================================
    */

    document.addEventListener(
        "pointerdown",
        startPiPDrag
    );


    document.addEventListener(
        "pointermove",
        movePiPDrag
    );


    document.addEventListener(
        "pointerup",
        stopPiPDrag
    );


    document.addEventListener(
        "pointercancel",
        stopPiPDrag
    );

})();

/* =========================================================

   ========================================================= */

(function(){

    let speakerTimer = null;


    function getParticipantCards(){

        return Array.from(
            document.querySelectorAll(
                "#participantGrid.annotation-active .meeting-participant"
            )
        );

    }


    function getParticipantVideo(card){

        return card.querySelector(
            "video"
        );

    }


    function getAudioLevel(video){

        if(
            !video ||
            !video.srcObject
        ){

            return 0;

        }


        const stream =
            video.srcObject;


        const audioTracks =
            stream.getAudioTracks();


        if(
            !audioTracks.length
        ){

            return 0;

        }


        try{

            if(
                !video._pipAudioContext
            ){

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if(!AudioContext){

                    return 0;

                }


                const audioContext =
                    new AudioContext();


                const source =
                    audioContext.createMediaStreamSource(
                        stream
                    );


                const analyser =
                    audioContext.createAnalyser();


                analyser.fftSize =
                    256;


                source.connect(
                    analyser
                );


                video._pipAudioContext =
                    audioContext;


                video._pipAudioAnalyser =
                    analyser;

            }


            const analyser =
                video._pipAudioAnalyser;


            const data =
                new Uint8Array(
                    analyser.frequencyBinCount
                );


            analyser.getByteFrequencyData(
                data
            );


            let total = 0;


            for(
                let i = 0;
                i < data.length;
                i++
            ){

                total +=
                    data[i];

            }


            return data.length
                ? total / data.length
                : 0;

        }
        catch(error){

            console.warn(
                "PiP speaker detection error:",
                error
            );


            return 0;

        }

    }


    function updateActiveSpeaker(){

        const grid =
            document.getElementById(
                "participantGrid"
            );


        if(
            !grid ||
            !grid.classList.contains(
                "annotation-active"
            )
        ){

            return;

        }


        const cards =
            getParticipantCards();


        if(
            cards.length <= 1
        ){

            if(cards[0]){

                cards[0].classList.add(
                    "active-speaker"
                );

            }

            return;

        }


        let loudestCard =
            null;


        let loudestLevel =
            0;


        cards.forEach(
            card => {

                const video =
                    getParticipantVideo(
                        card
                    );


                const level =
                    getAudioLevel(
                        video
                    );


                if(
                    level >
                    loudestLevel
                ){

                    loudestLevel =
                        level;


                    loudestCard =
                        card;

                }

            }
        );


        if(
            !loudestCard ||
            loudestLevel < 8
        ){

            return;

        }


        cards.forEach(
            card => {

                card.classList.remove(
                    "active-speaker"
                );


                card.classList.remove(
                    "secondary-speaker"
                );


                if(
                    card === loudestCard
                ){

                    card.classList.add(
                        "active-speaker"
                    );

                }
                else{

                    card.classList.add(
                        "secondary-speaker"
                    );

                }

            }
        );

    }


    function startSpeakerDetection(){

        if(
            speakerTimer
        ){

            return;

        }


        speakerTimer =
            setInterval(
                updateActiveSpeaker,
                250
            );

    }


    function stopSpeakerDetection(){

        if(
            speakerTimer
        ){

            clearInterval(
                speakerTimer
            );


            speakerTimer =
                null;

        }

    }


    const observer =
        new MutationObserver(
            () => {

                const grid =
                    document.getElementById(
                        "participantGrid"
                    );


                if(!grid){

                    return;

                }


                if(
                    grid.classList.contains(
                        "annotation-active"
                    )
                ){

                    startSpeakerDetection();

                }
                else{

                    stopSpeakerDetection();

                }

            }
        );


    const grid =
        document.getElementById(
            "participantGrid"
        );


    if(grid){

        observer.observe(
            grid,
            {

                attributes:true,

                attributeFilter:[
                    "class"
                ]

            }
        );

    }

})();

/* =========================================================
   MOBILE LANDSCAPE — HIDE ANNOTATION PIP
   ========================================================= */

(function(){

    function updateMobileLandscapePiP(){

        const grid =
            document.getElementById(
                "participantGrid"
            );

        if(!grid){

            return;

        }


        /*
        =====================================================
        CHECK WHETHER ANNOTATION IS ACTIVE
        =====================================================
        */

        const annotationActive =
            grid.classList.contains(
                "annotation-active"
            );


        /*
        =====================================================
        CHECK MOBILE / TOUCH DEVICE
        =====================================================
        */

        const isTouchDevice =
            window.matchMedia(
                "(pointer: coarse)"
            ).matches;


        /*
        =====================================================
        CHECK MOBILE-SIZED DEVICE
        =====================================================
        */

        const smallestDimension =
            Math.min(
                window.innerWidth,
                window.innerHeight
            );


        const isMobileSize =
            smallestDimension <= 700;


        /*
        =====================================================
        CHECK LANDSCAPE
        =====================================================
        */

        const isLandscape =
            window.innerWidth >
            window.innerHeight;


        /*
        =====================================================
        HIDE PIP ONLY WHEN ALL CONDITIONS ARE TRUE
        =====================================================
        */

        if(
            annotationActive &&
            isTouchDevice &&
            isMobileSize &&
            isLandscape
        ){

            grid.style.setProperty(
                "display",
                "none",
                "important"
            );

            console.log(
                "MOBILE LANDSCAPE: ANNOTATION PIP HIDDEN"
            );

        }
        else{

            /*
            -----------------------------------------------
            REMOVE OUR INLINE OVERRIDE
            -----------------------------------------------
            */

            grid.style.removeProperty(
                "display"
            );

        }

    }


    /*
    =========================================================
    INITIAL CHECK
    =========================================================
    */

    updateMobileLandscapePiP();


    /*
    =========================================================
    ROTATION / RESIZE
    =========================================================
    */

    window.addEventListener(
        "resize",
        updateMobileLandscapePiP
    );


    window.addEventListener(
        "orientationchange",
        () => {

            setTimeout(
                updateMobileLandscapePiP,
                100
            );

        }
    );


    /*
    =========================================================
    WATCH ANNOTATION ACTIVE / INACTIVE
    =========================================================
    */

    const grid =
        document.getElementById(
            "participantGrid"
        );


    if(grid){

        const observer =
            new MutationObserver(
                updateMobileLandscapePiP
            );


        observer.observe(
            grid,
            {

                attributes:true,

                attributeFilter:[
                    "class"
                ]

            }
        );

    }

})();

    </script>
