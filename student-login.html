<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{

    margin:0;

    font-family:
        Arial,
        sans-serif;

}


/* =====================================================
   LOGIN PAGE
   ===================================================== */

.login-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

    linear-gradient(
        rgba(255,255,255,.65),
        rgba(255,255,255,.65)
    ),

    url("images/image1.png");

    background-size:cover;

    background-position:center;

}


/* =====================================================
   LOGIN BOX
   ===================================================== */

.login-box{

    width:90%;

    max-width:420px;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);

}


/* =====================================================
   LOGO
   ===================================================== */

.login-box img{

    width:180px;

    display:block;

    margin:auto;

}


/* =====================================================
   TITLE
   ===================================================== */

.login-box h2{

    text-align:center;

}


/* =====================================================
   INPUT
   ===================================================== */

.input-box{

    margin-bottom:20px;

}


.input-box input{

    width:100%;

    height:50px;

}


/* =====================================================
   LOGIN BUTTON
   ===================================================== */

.login-btn{

    width:100%;

    height:55px;

    border:none;

    border-radius:30px;

    color:white;

    background:

    linear-gradient(
        90deg,
        #1e045c,
        #337dec
    );

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:768px){

    .login-page{

        min-height:100vh;

        display:flex;

        justify-content:center;

        align-items:center;

        padding:20px;

        background:

        linear-gradient(
            rgba(255,255,255,.65),
            rgba(255,255,255,.65)
        ),

        url("images/image1.png");

        background-size:cover;

        background-position:center;

    }


    .login-box{

        width:92%;

        max-width:none;

        background:white;

        border-radius:30px;

        padding:40px 30px;

        box-shadow:
            0 15px 40px rgba(0,0,0,.18);

    }


    .login-box img{

        width:220px;

        display:block;

        margin:0 auto 20px;

    }


    .login-box h2{

        text-align:center;

        font-size:36px;

        margin-bottom:35px;

        color:#222;

    }


    .input-box{

        margin-bottom:18px;

    }


    .input-box input{

        width:100%;

        height:65px;

        font-size:18px;

        border:none;

        border-bottom:
            2px solid #ddd;

        border-radius:0;

        background:none;

    }


    .login-btn{

        width:100%;

        height:65px;

        border:none;

        border-radius:30px;

        font-size:20px;

        font-weight:bold;

        letter-spacing:1px;

        color:white;

        background:

        linear-gradient(
            90deg,
            #1e045c,
            #337dec
        );

    }


    .remember{

        margin:15px 0 20px;

    }

}

</style>

</head>


<body class="login-page">


<div class="login-box">


    <img src="images/logo.png">


    <h2>
        Student Login
    </h2>


    <div class="input-box">

        <i class="fa fa-user"></i>

        <input
            type="text"
            id="email"
            placeholder="Student Email"
        >

    </div>


    <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

    </div>


    <div class="remember">

        <input
            type="checkbox"
        >

        Remember Me

    </div>

    <div style="text-align:right; margin-bottom:20px;">

    <a
        href="#"
        onclick="showForgotPassword(); return false;"
        style="
            color:#1e045c;
            text-decoration:none;
            font-weight:bold;
        "
    >
        Forgot Password?
    </a>

</div>


    <button
        type="button"
        class="login-btn"
        onclick="loginStudent()">

        Login

    </button>


</div>

<!-- CHAMPIONSHIP PASSWORD RECOVERY -->

<div
    id="forgotPasswordBox"
    class="login-box"
    style="display:none;"
>

    <h2>Password Recovery</h2>

    <p style="text-align:center;color:#666;">
        Recover your Pinnacle Star Championship account.
    </p>

    <!-- STEP 1: PARTICIPANT ID -->

    <div id="recoveryStep1">

        <div class="input-box">

            <input
                type="text"
                id="recoveryParticipantId"
                placeholder="Participant ID (PSC26-0001)"
            >

        </div>

        <button
            type="button"
            class="login-btn"
            onclick="sendRecoveryOTP()"
        >
            Send WhatsApp OTP
        </button>

    </div>


    <!-- STEP 2: OTP -->

    <div id="recoveryStep2" style="display:none;">

        <div class="input-box">

            <input
                type="text"
                id="recoveryOTP"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                inputmode="numeric"
            >

        </div>

        <button
            type="button"
            class="login-btn"
            onclick="verifyRecoveryOTP()"
        >
            Verify OTP
        </button>

    </div>


    <!-- STEP 3: NEW PASSWORD -->

    <div id="recoveryStep3" style="display:none;">

        <div class="input-box">

            <input
                type="password"
                id="recoveryNewPassword"
                placeholder="New Password"
            >

        </div>

        <div class="input-box">

            <input
                type="password"
                id="recoveryConfirmPassword"
                placeholder="Confirm New Password"
            >

        </div>

        <button
            type="button"
            class="login-btn"
            onclick="resetRecoveryPassword()"
        >
            Reset Password
        </button>

    </div>


    <p
        id="recoveryMessage"
        style="text-align:center;margin-top:20px;"
    ></p>


    <div style="text-align:center;margin-top:20px;">

        <a
            href="#"
            onclick="showLogin(); return false;"
            style="color:#1e045c;text-decoration:none;font-weight:bold;"
        >
            Back to Login
        </a>

    </div>

</div>


<script>

async function loginStudent() {

    const email =
        document.getElementById(
            "email"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;


    if (!email || !password) {

        alert(
            "Please enter email and password"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "https://academy-backend-eatl.onrender.com/api/auth/login",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        email,

                        password,

                        role:"student"

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "USER OBJECT:",
            data.user
        );


        if (response.ok) {


            /* =================================================
               ROLE CHECK
               ================================================= */

            if (
                data.role !== "student"
            ) {

                alert(
                    "Access denied. Not a Student account."
                );

                return;

            }


            /* =================================================
               SAVE LOGIN DATA
               ================================================= */

            localStorage.setItem(
                "token",
                data.token
            );


            console.log(
                "LOGIN DATA:",
                data
            );


            localStorage.setItem(
                "studentId",
                data.user._id
            );


            localStorage.setItem(
                "studentName",
                data.user.studentName
            );


            localStorage.setItem(
                "className",
                data.user.className
            );


            console.log(
                "Saved Name:",
                data.user.studentName
            );


            console.log(
                "Saved Class:",
                data.user.className
            );


            console.log(
                localStorage
            );


            /* =================================================
   REDIRECT BASED ON ACCOUNT TYPE
   ================================================= */


if (
    data.user.accountType === "championship" &&
    data.user.mustChangePassword === true
) {

    window.location.href =
        "championship-change-password.html";

} else if (data.user.accountType === "championship") {

    window.location.href =
        "championship-dashboard.html";

} else {

    window.location.href =
        "student-dashboard.html";

}



        }
        else {

            alert(
                data.message ||
                "Login failed"
            );

        }


    }
    catch (error) {

        console.error(
            error
        );

        alert(
            "Server not running"
        );

    }

}


let championshipResetToken = null;


// SHOW FORGOT PASSWORD
function showForgotPassword() {

    document.querySelector(".login-box").style.display = "none";

    document.getElementById("forgotPasswordBox").style.display = "block";

}


// BACK TO LOGIN
function showLogin() {

    document.getElementById("forgotPasswordBox").style.display = "none";

    document.querySelector(".login-box").style.display = "block";

}


// STEP 1: SEND OTP
async function sendRecoveryOTP() {

    const participantId =
        document.getElementById("recoveryParticipantId").value.trim();

    const message =
        document.getElementById("recoveryMessage");

    if (!participantId) {
        message.innerText = "Please enter your Participant ID.";
        return;
    }

    message.innerText = "Processing your request...";

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/participant/forgot-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ participantId })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.innerText = data.message || "Unable to process request.";
            return;
        }

        document.getElementById("recoveryStep1").style.display = "none";
        document.getElementById("recoveryStep2").style.display = "block";

        message.innerText =
            "If your Participant ID is valid, an OTP has been sent to the registered WhatsApp number.";

    } catch (error) {

        console.error(error);
        message.innerText = "Server connection failed. Please try again.";

    }

}


// STEP 2: VERIFY OTP
async function verifyRecoveryOTP() {

    const participantId =
        document.getElementById("recoveryParticipantId").value.trim();

    const otp =
        document.getElementById("recoveryOTP").value.trim();

    const message =
        document.getElementById("recoveryMessage");

    if (!/^\d{6}$/.test(otp)) {
        message.innerText = "Please enter a valid 6-digit OTP.";
        return;
    }

    message.innerText = "Verifying OTP...";

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/participant/verify-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    participantId,
                    otp
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.innerText = data.message || "OTP verification failed.";
            return;
        }

        championshipResetToken = data.resetToken;

        document.getElementById("recoveryStep2").style.display = "none";
        document.getElementById("recoveryStep3").style.display = "block";

        message.innerText = "OTP verified successfully. Create your new password.";

    } catch (error) {

        console.error(error);
        message.innerText = "Server connection failed. Please try again.";

    }

}


// STEP 3: RESET PASSWORD
async function resetRecoveryPassword() {

    const newPassword =
        document.getElementById("recoveryNewPassword").value;

    const confirmPassword =
        document.getElementById("recoveryConfirmPassword").value;

    const message =
        document.getElementById("recoveryMessage");

    if (!newPassword || !confirmPassword) {
        message.innerText = "Please fill both password fields.";
        return;
    }

    if (newPassword.length < 8) {
        message.innerText = "Password must contain at least 8 characters.";
        return;
    }

    if (newPassword !== confirmPassword) {
        message.innerText = "Passwords do not match.";
        return;
    }

    if (!championshipResetToken) {
        message.innerText = "Your recovery session has expired. Please start again.";
        return;
    }

    message.innerText = "Updating your password...";

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/participant/reset-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    resetToken: championshipResetToken,
                    newPassword,
                    confirmPassword
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.innerText = data.message || "Password reset failed.";
            return;
        }

        championshipResetToken = null;

        alert("Password changed successfully! Please login using your new password.");

        window.location.reload();

    } catch (error) {

        console.error(error);
        message.innerText = "Server connection failed. Please try again.";

    }

}


</script>


</body>
</html>
