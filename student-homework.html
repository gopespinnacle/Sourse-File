<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Homework</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Segoe UI,Arial,sans-serif;color:#172033}
header{background:#1e3a5f;color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}
main{max-width:1100px;margin:22px auto;padding:0 16px}.filters,.homework{background:#fff;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #0f172a0c}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.field{min-width:180px;flex:1}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:100px}
button{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.muted{font-size:13px;color:#64748b}.tag{background:#dbeafe;color:#1d4ed8;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700}.hwhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.message{margin-top:10px;font-weight:600}.error{color:#b91c1c}.success{color:#15803d}.attachments a{display:inline-block;margin:5px 8px 5px 0}
</style>
</head>
<body>
<header><h1>Student Homework</h1><button onclick="history.back()">← Back</button></header>
<main>
<section class="filters">
<div class="field"><label for="subjectFilter">Subject</label><select id="subjectFilter"><option value="">All Subjects</option></select></div>
<div class="field"><label for="statusFilter">Status</label><select id="statusFilter"><option value="">All Status</option><option value="pending">Pending</option><option value="submitted">Submitted</option><option value="reviewed">Reviewed</option></select></div>
<button onclick="loadHomework()">Refresh</button>
</section>
<div id="homeworkList">Loading your homework…</div>
</main>
<script>
const API="https://academy-backend-eatl.onrender.com";
let token=sessionStorage.getItem("token")||localStorage.getItem("token");
if(!token&&window.GPAAndroid&&typeof window.GPAAndroid.getToken==="function"){token=window.GPAAndroid.getToken();if(token)sessionStorage.setItem("token",token)}
if(!token)location.href="student-login.html";
const headers={"Authorization":"Bearer "+token};
let allHomework=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleString()}
function statusOf(h){return h.submission?.status||"pending"}
async function loadHomework(){
 const box=document.getElementById("homeworkList");box.textContent="Loading your homework…";
 try{const r=await fetch(API+"/api/homework-flow/student/assignments",{headers});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"Could not load homework");
 allHomework=j.data||[];const select=document.getElementById("subjectFilter");const old=select.value;const subjects=[...new Set(allHomework.map(h=>h.subject).filter(Boolean))];select.innerHTML='<option value="">All Subjects</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");select.value=subjects.includes(old)?old:"";renderHomework();
 }catch(e){box.innerHTML=`<p class="error">${esc(e.message)}</p>`}
}
function renderHomework(){
 const subject=document.getElementById("subjectFilter").value;const status=document.getElementById("statusFilter").value;
 const list=allHomework.filter(h=>(!subject||h.subject===subject)&&(!status||statusOf(h)===status));
 const box=document.getElementById("homeworkList");
 if(!list.length){box.innerHTML='<section class="homework">No homework assigned to your account yet.</section>';return}
 box.innerHTML=list.map(h=>{const sub=h.submission;return `<article class="homework">
 <div class="hwhead"><div><h2>${esc(h.title)}</h2><p class="muted">${esc(h.className)} • ${esc(h.subject)} • Due ${esc(date(h.dueDate))}</p></div><span class="tag">${esc(statusOf(h))}</span></div>
 ${h.topic?`<p><strong>Topic:</strong> ${esc(h.topic)}</p>`:""}<p>${esc(h.instructions||"No extra instructions")}</p>
 <p class="muted">Teacher: ${esc(h.teacher?.name||"Teacher")}</p>
 
 <div class="attachments">
 ${(h.attachments || []).length
 ? `<p><strong>Homework Attachments</strong></p>` +
 h.attachments.map(a =>
 `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name || "Open attachment")}</a>`
 ).join("")
 : ""}
 </div>
 <div class="attachments">
 ${(h.materialAttachments || []).length
 ? `<p><strong>Class Materials</strong></p>` +
 h.materialAttachments.map(a =>
 `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name || "Open material")}</a>`
 ).join("")
 : ""}
 </div>

 ${sub?.marks!=null?`<p><strong>Marks:</strong> ${esc(sub.marks)}</p>`:""}${sub?.feedback?`<p><strong>Teacher feedback:</strong> ${esc(sub.feedback)}</p>`:""}
 <form onsubmit="submitHomework(event,'${h._id}')">
 <label for="answer-${h._id}">Your answer</label><textarea id="answer-${h._id}" placeholder="Type your answer here">${esc(sub?.answerText||"")}</textarea>
 <label for="file-${h._id}">Attach answer file (optional)</label><input id="file-${h._id}" type="file">
 <p class="muted">You may submit text, a file, or both. Submitting again replaces your previous submission.</p>
 <button type="submit">Submit Homework</button><div class="message" id="message-${h._id}"></div></form></article>`}).join("");
}
async function uploadFile(file){const fd=new FormData();fd.append("file",file);const r=await fetch(API+"/upload-file",{method:"POST",headers,body:fd});const j=await r.json();if(!r.ok||!j.url)throw new Error(j.message||"File upload failed");return{name:file.name,url:j.url}}
async function submitHomework(event,id){
 event.preventDefault();const form=event.currentTarget;const message=document.getElementById("message-"+id);message.className="message";message.textContent="Submitting…";
 try{const answerText=document.getElementById("answer-"+id).value.trim();const file=document.getElementById("file-"+id).files[0];const attachments=[];if(file)attachments.push(await uploadFile(file));
 const r=await fetch(API+`/api/homework-flow/assignments/${id}/submit`,{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({answerText,attachments})});const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||"Submission failed");
 message.className="message success";message.textContent="Homework submitted successfully.";await loadHomework();
 }catch(e){message.className="message error";message.textContent=e.message}
}
document.getElementById("subjectFilter").addEventListener("change",renderHomework);document.getElementById("statusFilter").addEventListener("change",renderHomework);
loadHomework();
</script>
</body>
</html>
