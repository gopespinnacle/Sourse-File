<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Academy Calendar | Gopes Pinnacle Academy</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f5f7fb;

}

header{

background:#0d6efd;

color:white;

padding:30px;

text-align:center;

}

header h1{

font-size:38px;

margin-bottom:10px;

}

header p{

font-size:18px;

opacity:.9;

}

.container{

width:95%;

max-width:1400px;

margin:40px auto;

display:grid;

grid-template-columns:3fr 1fr;

gap:30px;

}

.calendar-card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.upcoming-card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.calendar-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}

.calendar-header h2{

font-size:32px;

}

.calendar-header button{

padding:10px 18px;

border:none;

background:#0d6efd;

color:white;

border-radius:8px;

cursor:pointer;

font-size:16px;

}

.weekdays{

display:grid;

grid-template-columns:repeat(7,1fr);

background:#0d6efd;

color:white;

border-radius:8px 8px 0 0;

overflow:hidden;

}

.weekdays div{

padding:15px;

text-align:center;

font-weight:bold;

}

.calendar-grid{

display:grid;

grid-template-columns:repeat(7,1fr);

}

.day{

height:120px;

border:1px solid #ddd;

padding:8px;

background:white;

}

.day-number{

font-weight:bold;

margin-bottom:8px;

}

.today{

background:#dbeafe;

}

.upcoming-card h2{

margin-bottom:20px;

}

.coming-soon{

padding:18px;
min-height:95px;
line-height:1.5;

background:#eef5ff;

border-left:5px solid #0d6efd;

border-radius:8px;

margin-bottom:15px;

}

/* =====================================
   MOBILE RESPONSIVE - BLOCK 1
===================================== */


@media (max-width:768px){

/* Page */

.container{

    width:100%;

    margin:20px 0;

    padding:0 12px;

    display:flex;

    flex-direction:column;

    gap:20px;

}

/* Header */

header{

    padding:20px 15px;

}

header h1{

    font-size:30px;

    line-height:1.2;

}

header p{

    font-size:14px;

    margin-top:8px;

}

/* Cards */

.calendar-card,
.upcoming-card{

    width:100%;

    padding:15px;

    border-radius:12px;

}

/* Month Header */

.calendar-header{

    margin-bottom:15px;

}

.calendar-header h2{

    font-size:24px;

}

.calendar-header button{

    width:38px;

    height:38px;

    padding:0;

    font-size:16px;

}

/* Weekdays */

.weekdays div{

    padding:6px 1px;

    font-size:10px;

    font-weight:bold;

}

/* Calendar Cells */

.day{

    min-height:55px;

    height:55px;

    padding:2px;

    overflow:hidden;

}

.day-number{

    font-size:11px;

    margin-bottom:2px;

    font-weight:bold;

}

/* Event Chips */

.day div:not(.day-number){

    font-size:8px !important;

    padding:1px 3px !important;

    margin-top:2px !important;

    border-radius:3px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

/* Upcoming */

.upcoming-card h2{

    font-size:22px;

}

.coming-soon{

    padding:14px;

    min-height:auto;

    font-size:14px;

}

}

</style>

</head>

<body>

<header>

<h1>Academy Events Calendar</h1>

<p>Stay updated with Holidays, Admissions, Competitions and Academy Events.</p>

</header>

<div class="container">

<div class="calendar-card">

<div class="calendar-header">

<button id="prevMonth">◀</button>

<h2 id="monthYear">July 2026</h2>

<button id="nextMonth">▶</button>

</div>

<div class="weekdays">

<div>Sun</div>
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>

</div>

<div
id="calendarGrid"
class="calendar-grid">

</div>

</div>

<div class="upcoming-card">

<h2>Upcoming Events</h2>

<div id="upcomingEvents">

<div class="coming-soon">

Upcoming events will appear here.

</div>

</div>

</div>

</div>

<script>

let currentDate = new Date();

const API =
"https://academy-backend-eatl.onrender.com/api/academy-calendar";

let events = [];

const monthYear = document.getElementById("monthYear");

const calendarGrid = document.getElementById("calendarGrid");



/*
====================================
LOAD PUBLIC EVENTS
====================================
*/

async function loadEvents(){

    try{

        const res = await fetch(`${API}/list`);

        const data = await res.json();

        if(data.success){

            events = data.data.filter(event=>{

                return event.audience &&
                       event.audience.includes("Public");

            });
            drawCalendar();
            drawUpcomingEvents();

        }

        console.log(events);

    }catch(err){

        console.log(err);

    }

}

/*
====================================
DRAW CALENDAR
====================================
*/

function drawCalendar(){

    calendarGrid.innerHTML = "";

    const year = currentDate.getFullYear();

    const month = currentDate.getMonth();

    monthYear.innerHTML = currentDate.toLocaleString("default",{

        month:"long",

        year:"numeric"

    });

    const firstDay = new Date(year,month,1).getDay();

    const daysInMonth = new Date(year,month+1,0).getDate();

    // Empty cells
    for(let i=0;i<firstDay;i++){

        const empty = document.createElement("div");

        empty.className = "day";

        calendarGrid.appendChild(empty);

    }

    // Days
    for(let day=1;day<=daysInMonth;day++){

        const cell = document.createElement("div");

        cell.className = "day";

        const today = new Date();

        if(

            day===today.getDate() &&

            month===today.getMonth() &&

            year===today.getFullYear()

        ){

            cell.classList.add("today");

        }

        cell.innerHTML = `
            <div class="day-number">${day}</div>
        `;

        const cellDate = new Date(year,month,day);

        const todayEvents = events.filter(event => {

    const eventDate = new Date(
    event.startDate.split("T")[0]
);

console.log(
    event.title,
    event.startDate,
    eventDate,
    cellDate
);

    return (

        eventDate.getFullYear() === cellDate.getFullYear() &&
        eventDate.getMonth() === cellDate.getMonth() &&
        eventDate.getDate() === cellDate.getDate()

    );

});

        todayEvents.forEach(event=>{

            const eventDiv=document.createElement("div");

            eventDiv.style.marginTop="5px";

            eventDiv.style.padding="4px 6px";

            eventDiv.style.borderRadius="5px";

            eventDiv.style.fontSize="12px";

            eventDiv.style.color="#fff";

            eventDiv.style.background=event.color || "#0d6efd";

            eventDiv.style.cursor="pointer";
            eventDiv.style.lineHeight = "1.3";
eventDiv.style.minHeight = "34px";

            eventDiv.innerHTML = `
<div style="font-weight:bold;">
    ${event.title}
</div>

<div style="
    font-size:10px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
">
    ${event.description || ""}
</div>
`;

            cell.appendChild(eventDiv);

        });

        calendarGrid.appendChild(cell);

    }

}
loadEvents();

/*
====================================
PREVIOUS MONTH
====================================
*/

document.getElementById("prevMonth").onclick = function(){

    currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() - 1,
        1
    );

    drawCalendar();

    drawUpcomingEvents();

};

/*
====================================
DRAW UPCOMING EVENTS
====================================
*/

function drawUpcomingEvents(){

    const container = document.getElementById("upcomingEvents");

    container.innerHTML = "";

    const year = currentDate.getFullYear();

const month = currentDate.getMonth();

const upcoming = events
    .filter(event => {

        const eventDate = new Date(
            event.startDate.split("T")[0]
        );

        return (

            eventDate.getFullYear() === year &&

            eventDate.getMonth() === month

        );

    })
    .sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));

    if(upcoming.length===0){

        container.innerHTML=`
    <div class="coming-soon">

        <strong>No events scheduled for</strong>

        <br><br>

        ${currentDate.toLocaleString("default",{

            month:"long",

            year:"numeric"

        })}

    </div>
`;

        return;

    }

    upcoming.forEach(event=>{

        const card=document.createElement("div");

        card.className="coming-soon";

        const date = new Date(
    event.startDate.split("T")[0]
);

        card.innerHTML=`
    <strong>${event.title}</strong><br>

    <small>
        ${date.toLocaleDateString("en-IN",{
            day:"2-digit",
            month:"short",
            year:"numeric"
        })}
    </small>

    <br><br>

    <b>Description:</b><br>

    <span style="font-size:13px;color:#555;">
        ${event.description || "No description available."}
    </span>
`;

        container.appendChild(card);

    });

}

/*
====================================
NEXT MONTH
====================================
*/

document.getElementById("nextMonth").onclick = function(){

    currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() + 1,
        1
    );

    drawCalendar();

    drawUpcomingEvents();

};

</script>

</body>

</html>
