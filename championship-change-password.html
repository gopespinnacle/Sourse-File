
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Permanent Password | Pinnacle Star Championship</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #100b3d, #173f83);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .password-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 20px 55px rgba(0,0,0,.25);
        }

        .trophy {
            text-align: center;
            font-size: 45px;
            color: #d4a72c;
        }

        h2 {
            text-align: center;
            color: #172d63;
        }

        .description {
            text-align: center;
            color: #666;
            line-height: 1.6;
        }

        .input-group {
            margin-top: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .password-wrapper {
            display: flex;
            border: 1px solid #ccc;
            border-radius: 9px;
            overflow: hidden;
        }

        .password-wrapper input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .password-wrapper button {
            border: none;
            background: white;
            padding: 0 15px;
            cursor: pointer;
            color: #555;
        }

        .update-btn {
            width: 100%;
            padding: 15px;
            margin-top: 28px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #1e045c, #337dec);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        @media(max-width:480px) {
            .password-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="password-card">

    <div class="trophy">
        <i class="fa fa-trophy"></i>
    </div>

    <h2>Create Your Permanent Password</h2>

    <p class="description">
        Welcome to Pinnacle Star Championship 2026.
        For your account security, please create a new password
        before accessing your participant dashboard.
    </p>

    <div class="input-group">
        <label>New Permanent Password</label>

        <div class="password-wrapper">
            <input type="password"
                   id="newPassword"
                   placeholder="Enter new password">
            <button type="button"
                    onclick="togglePassword('newPassword', this)">
                <i class="fa fa-eye"></i>
            </button>
        </div>
    </div>

    <div class="input-group">
        <label>Confirm Permanent Password</label>

        <div class="password-wrapper">
            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm new password">
            <button type="button"
                    onclick="togglePassword('confirmPassword', this)">
                <i class="fa fa-eye"></i>
            </button>
        </div>
    </div>

    <button class="update-btn"
            id="updateButton"
            onclick="changePassword()">
        UPDATE PASSWORD
    </button>

    <div id="message"></div>

</div>

<script>

function togglePassword(id, button) {

    const input = document.getElementById(id);

    input.type =
        input.type === "password" ? "text" : "password";

    button.innerHTML =
        input.type === "password"
        ? '<i class="fa fa-eye"></i>'
        : '<i class="fa fa-eye-slash"></i>';

}


async function changePassword() {

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("updateButton");

    const token = localStorage.getItem("token");

    if (!token) {
        localStorage.clear();
        window.location.href = "student-login.html";
        return;
    }

    if (!newPassword || !confirmPassword) {
        message.style.color = "red";
        message.textContent = "Please fill both password fields.";
        return;
    }

    if (newPassword.length < 8) {
        message.style.color = "red";
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    if (newPassword !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "UPDATING...";

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/auth/change-championship-password",
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    newPassword,
                    confirmPassword
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Password update failed.");
        }

        message.style.color = "green";
        message.textContent = "Password updated successfully. Logging out...";

        setTimeout(() => {

            localStorage.removeItem("token");
            localStorage.removeItem("studentId");
            localStorage.removeItem("studentName");
            localStorage.removeItem("className");

            window.location.href = "student-login.html";

        }, 1500);

    } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;

        button.disabled = false;
        button.textContent = "UPDATE PASSWORD";

    }

}

</script>

</body>
</html>
