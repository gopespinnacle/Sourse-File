<body>

<!-- Existing teacher sidebar -->
<div id="sidebar-container" class="desktop-sidebar"></div>

<div class="main-content">

    <h1 class="page-heading">My Students</h1>
    <p class="page-subtitle">
        Teacher-wise student assignments and weekly timetable
    </p>

    <div id="status" class="loading-message">
        Loading teacher and student details...
    </div>

    <div id="teacherStudents"></div>

</div>

<script>
const API = "https://academy-backend-eatl.onrender.com";

const token = sessionStorage.getItem("token");
const role = sessionStorage.getItem("role");

const output = document.getElementById("teacherStudents");
const statusBox = document.getElementById("status");

/* Load the existing sidebar */
fetch("teacher-sidebar.html")
    .then(response => {
        if (!response.ok) {
            throw new Error("Unable to load teacher sidebar.");
        }
        return response.text();
    })
    .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;
    })
    .catch(error => console.warn(error.message));

/* Safely display API values */
function safe(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

/* Read a value from alternative API field names */
function firstValue(object, fields) {
    if (!object || typeof object !== "object") return "";

    for (const field of fields) {
        const value = object[field];

        if (value !== undefined && value !== null && value !== "") {
            if (typeof value === "object") {
                if (value.$oid) return value.$oid;
                if (value._id) return value._id;
                if (value.name) return value.name;
                if (value.fullName) return value.fullName;
                continue;
            }

            return value;
        }
    }

    return "";
}

/* Get display name */
function getName(person) {
    return firstValue(person, [
        "name",
        "fullName",
        "teacherName",
        "studentName",
        "username"
    ]) || "Name unavailable";
}

/* Get teacher ID */
function getTeacherId(teacher) {
    return firstValue(teacher, [
        "teacherId",
        "teacherID",
        "teacherCode",
        "staffId",
        "staffID"
    ]) || "";
}

/* Get student ID */
function getStudentId(student) {
    return firstValue(student, [
        "studentId",
        "studentID",
        "studentCode",
        "admissionNumber",
        "admissionNo"
    ]) || "";
}

/* Format time from HH:mm or HH:mm:ss */
function formatTime(value) {
    if (!value) return "-";

    const match = String(value).match(/^(\d{1,2}):(\d{2})/);

    if (!match) return safe(value);

    let hour = Number(match[1]);
    const minute = match[2];
    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return `${hour}:${minute} ${suffix}`;
}

/* Normalize populated student objects */
function normalizeStudent(value) {
    if (!value) return null;

    if (Array.isArray(value)) return null;

    if (typeof value === "string") {
        return {
            _id: value,
            name: "Student details unavailable"
        };
    }

    if (typeof value !== "object") return null;

    return value;
}

/* Group period records by teacher and student */
function buildTeacherGroups(periods) {
    const teacherGroups = new Map();

    periods.forEach(period => {
        const teacher = period.teacher;

        if (!teacher || typeof teacher !== "object") {
            return;
        }

        const teacherKey =
            String(teacher._id || teacher.id || getTeacherId(teacher) ||
            getName(teacher));

        if (!teacherGroups.has(teacherKey)) {
            teacherGroups.set(teacherKey, {
                teacher,
                students: new Map()
            });
        }

        const group = teacherGroups.get(teacherKey);

        /*
         * Support either:
         * period.assignments = [{ student: {...} }]
         * or period.student = {...}
         */
        let assignments = [];

        if (Array.isArray(period.assignments)) {
            assignments = period.assignments;
        } else if (Array.isArray(period.students)) {
            assignments = period.students.map(student => ({ student }));
        } else if (period.student) {
            assignments = [{ student: period.student }];
        }

        assignments.forEach(assignment => {
            const student = normalizeStudent(
                assignment.student || assignment
            );

            if (!student) return;

            const studentKey = String(
                student._id ||
                student.id ||
                getStudentId(student) ||
                getName(student)
            );

            if (!group.students.has(studentKey)) {
                group.students.set(studentKey, {
                    student,
                    periods: []
                });
            }

            group.students.get(studentKey).periods.push({
                subject:
                    period.subject ||
                    assignment.subject ||
                    "-",

                className:
                    period.className ||
                    assignment.className ||
                    student.grade ||
                    "-",

                day:
                    period.day ||
                    assignment.day ||
                    "-",

                startTime:
                    period.startTime ||
                    assignment.startTime ||
                    "",

                endTime:
                    period.endTime ||
                    assignment.endTime ||
                    ""
            });
        });
    });

    return [...teacherGroups.values()].sort((a, b) =>
        getName(a.teacher).localeCompare(getName(b.teacher))
    );
}

/* Display all teacher and student details */
function renderTeacherStudents(periods) {
    const groups = buildTeacherGroups(periods);

    if (!groups.length) {
        output.innerHTML = `
            <div class="empty-message">
                No teacher-student assignments were found.
            </div>
        `;

        statusBox.textContent = "No assignments found.";
        return;
    }

    let totalStudents = 0;
    let totalPeriods = 0;

    output.innerHTML = groups.map(group => {
        const teacher = group.teacher;
        const teacherName = getName(teacher);
        const teacherId = getTeacherId(teacher);

        const students = [...group.students.values()].sort((a, b) =>
            getName(a.student).localeCompare(getName(b.student))
        );

        totalStudents += students.length;

        const studentCards = students.map(item => {
            const student = item.student;
            const studentName = getName(student);
            const studentId = getStudentId(student);

            /*
             * Remove duplicate timetable entries without
             * merging different subjects or different times.
             */
            const uniquePeriods = [];
            const seenPeriods = new Set();

            item.periods.forEach(period => {
                const key = [
                    period.subject,
                    period.className,
                    period.day,
                    period.startTime,
                    period.endTime
                ].join("|");

                if (!seenPeriods.has(key)) {
                    seenPeriods.add(key);
                    uniquePeriods.push(period);
                }
            });

            totalPeriods += uniquePeriods.length;

            uniquePeriods.sort((a, b) => {
                const dayOrder = [
                    "Monday", "Tuesday", "Wednesday",
                    "Thursday", "Friday", "Saturday", "Sunday"
                ];

                const dayDifference =
                    dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day);

                if (dayDifference !== 0) {
                    return (
                        (dayDifference < 0 ? 0 : dayDifference) -
                        (dayDifference < 0 ? dayDifference : 0)
                    );
                }

                return String(a.startTime).localeCompare(
                    String(b.startTime)
                );
            });

            const periodBadges = uniquePeriods.map(period => `
                <span class="period-badge period-subject">
                    📘 ${safe(period.subject)}
                </span>

                <span class="period-badge period-class">
                    🎓 ${safe(period.className)}
                </span>

                <span class="period-badge period-day">
                    📅 ${safe(period.day)}
                </span>

                <span class="period-badge period-time">
                    🕒 ${formatTime(period.startTime)}
                    - ${formatTime(period.endTime)}
                </span>
            `).join("");

            return `
                <article class="student-card">
                    <h3 class="student-heading">
                        <span>👤 ${safe(studentName)}</span>
                        <span class="student-id">
                            / ${safe(studentId || "Student ID unavailable")}
                        </span>
                    </h3>

                    <div class="period-list">
                        ${periodBadges || `
                            <span class="period-badge">
                                No timetable details available
                            </span>
                        `}
                    </div>
                </article>
            `;
        }).join("");

        return `
            <section class="teacher-section">
                <header class="teacher-heading">
                    <h2 class="teacher-name">
                        👩‍🏫 ${safe(teacherName)}
                        <span class="teacher-id">
                            (${safe(teacherId || "Teacher ID unavailable")})
                        </span>
                    </h2>

                    <span class="student-count">
                        ${students.length} student(s)
                    </span>
                </header>

                ${studentCards || `
                    <div class="empty-message">
                        No students assigned to this teacher.
                    </div>
                `}
            </section>
        `;
    }).join("");

    statusBox.textContent =
        `${groups.length} teacher(s), ${totalStudents} student(s), ` +
        `${totalPeriods} student-period mapping(s) loaded.`;
}

/* Fetch existing backend data */
async function loadTeacherStudents() {
    try {
        if (!token || role !== "teacher") {
            window.location.href = "teacher-login.html";
            return;
        }

        const response = await fetch(
            `${API}/api/teacher/all-period-assignments`,
            {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Unable to load student assignments."
            );
        }

        const periods = Array.isArray(result.data)
            ? result.data
            : [];

        renderTeacherStudents(periods);

    } catch (error) {
        console.error("Teacher students page error:", error);

        statusBox.textContent = "Unable to load student assignments.";

        output.innerHTML = `
            <div class="error-message">
                ${safe(error.message || "An unexpected error occurred.")}
                <br><br>
                Please check your login and backend connection.
            </div>
        `;
    }
}

loadTeacherStudents();
</script>

</body>
</html>
