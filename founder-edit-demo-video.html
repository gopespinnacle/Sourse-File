<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Edit Demo Video</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:30px;
}

.container{

max-width:700px;

margin:auto;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

h2{

margin-bottom:25px;

}

label{

display:block;

margin-top:20px;

margin-bottom:8px;

font-weight:bold;

}

input{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:8px;

}

button{

margin-top:30px;

width:100%;

padding:14px;

background:#0d6efd;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}

#status{

margin-top:20px;

font-weight:bold;

color:green;

}

</style>

</head>

<body>

<div class="container">

<h2>Edit Demo Video</h2>

<label>Title</label>

<input
type="text"
id="title">

<label>Teacher Name</label>

<input
type="text"
id="teacher">

<button onclick="saveChanges()">

Save Changes

</button>

<div id="status"></div>

</div>

<script>

const API="https://academy-backend-eatl.onrender.com/api/demo-videos";

const id=new URLSearchParams(location.search).get("id");

async function loadVideo(){

const res=await fetch(`${API}/${id}`);

const data=await res.json();

document.getElementById("title").value=data.data.title;

document.getElementById("teacher").value=data.data.teacherName;

}

async function saveChanges(){

const title=document.getElementById("title").value;

const teacher=document.getElementById("teacher").value;

const res=await fetch(`${API}/${id}`,{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

title,

teacherName:teacher

})

});

const data=await res.json();

if(data.success){

document.getElementById("status").innerHTML="Updated Successfully";

setTimeout(()=>{

history.back();

},1000);

}else{

document.getElementById("status").innerHTML=data.message;

}

}

loadVideo();

</script>

</body>

</html>
