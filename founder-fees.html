<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Monthly Fee Report</title>

<link rel="stylesheet" href="style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.main-content.fee-page {
    padding: 25px;
    display: block !important;
    flex-direction: column !important;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    float: none !important;
    position: relative;
}
.main-content.fee-page > .fee-header,
.main-content.fee-page > .fee-summary,
.main-content.fee-page > .fee-table-wrapper {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    float: none !important;
}
.fee-header {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    width: 100%;
    margin-bottom: 20px;
    gap: 15px;
    box-sizing: border-box;
}

.fee-header h1 {
    margin: 0;
    color: #12395f;
}

.month-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.fee-controls {
    display: flex !important;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    width: 100%;
    box-sizing: border-box;
}

.fee-control-input,
.fee-control-select {
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
    background: white;
}

.fee-control-input {
    width: 180px;
}

.fee-control-select {
    min-width: 220px;
}

.fee-control-input:focus,
.fee-control-select:focus {
    outline: none;
    border-color: #12395f;
}

.fee-control-label {
    font-weight: 600;
    color: #333;
}

.month-filter label {
    font-weight: 600;
}

.month-filter select {
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.fee-summary {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    width: 100%;
    margin-bottom: 25px;
    box-sizing: border-box;
    clear: both;
}

.fee-card {
    background: white;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.fee-card-title {
    font-size: 14px;
    color: #666;
    margin-bottom: 8px;
}

.fee-card-value {
    font-size: 23px;
    font-weight: 700;
    color: #12395f;
}

.fee-table-wrapper {
    background: white;
    border-radius: 10px;
    padding: 15px;
    overflow-x: auto;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    clear: both;
}

#feeTable {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

#feeTable th,
#feeTable td {
    padding: 12px 10px;
    border-bottom: 1px solid #e5e5e5;
    text-align: center;
}

#feeTable th {
    background: #12395f;
    color: white;
    font-weight: 600;
}

#feeTable td:first-child,
#feeTable td:nth-child(2) {
    text-align: left;
}

#feeTable tfoot td {
    font-weight: 700;
    background: #f1f5f9;
}

.loading-row {
    text-align: center !important;
    padding: 30px !important;
}

@media(max-width: 900px) {

    .fee-summary {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media(max-width: 600px) {

    .fee-page {
        padding: 15px;
    }

    .fee-summary {
        grid-template-columns: 1fr;
    }

    .fee-header {
        align-items: flex-start;
        flex-direction: column;
    }

}

.fee-input {

    width: 100px;

    padding: 7px 8px;

    border: 1px solid #ccc;

    border-radius: 5px;

    text-align: right;

    font-size: 14px;

    box-sizing: border-box;

}


.fee-input:focus {

    outline: none;

    border-color: #12395f;

}


.save-fee-btn {

    background: #12395f;

    color: white;

    border: none;

    padding: 7px 12px;

    border-radius: 5px;

    cursor: pointer;

    font-weight: 600;

}


.save-fee-btn:hover {

    opacity: 0.9;

}

</style>

</head>


<body class="dashboard-page">


<!-- SIDEBAR -->

<div id="sidebar-container"></div>


<script>

fetch("sidebar.html")

.then(res => res.text())

.then(data => {

    document.getElementById(
        "sidebar-container"
    ).innerHTML = data;

});

</script>



<!-- MAIN CONTENT -->

<div class="main-content fee-page">


    <div class="fee-header">

        <h1>
            <i class="fa fa-money-bill-wave"></i>
            Monthly Fee Report
        </h1>


        <div class="fee-controls">

    <!-- MONTH -->
    <div class="month-filter">

        <label for="feeMonth">
            Month:
        </label>

        <select id="feeMonth" class="fee-control-select">
        </select>

    </div>


    <!-- NAME SEARCH -->
    <div class="month-filter">

        <label
            for="studentNameFilter"
            class="fee-control-label"
        >
            Name:
        </label>

        <input
            type="text"
            id="studentNameFilter"
            class="fee-control-input"
            placeholder="Search student name..."
        >

    </div>


    <!-- STUDENT ID SEARCH -->
    <div class="month-filter">

        <label
            for="studentIdFilter"
            class="fee-control-label"
        >
            Student ID:
        </label>

        <input
            type="text"
            id="studentIdFilter"
            class="fee-control-input"
            placeholder="Search GPA-0001..."
        >

    </div>


    <!-- SORT -->
    <div class="month-filter">

        <label
            for="studentSort"
            class="fee-control-label"
        >
            Sort:
        </label>

        <select
            id="studentSort"
            class="fee-control-select"
        >

            <option value="id-asc">
                Student ID: GPA-0001 → GPA-∞
            </option>

            <option value="id-desc">
                Student ID: GPA-∞ → GPA-0001
            </option>

            <option value="name-asc">
                Name: A → Z
            </option>

            <option value="name-desc">
                Name: Z → A
            </option>

        </select>

    </div>

</div>

        </div>

    </div>



    <!-- SUMMARY -->

    <div class="fee-summary">


        <div class="fee-card">

            <div class="fee-card-title">
                Total Actual Fee
            </div>

            <div
                class="fee-card-value"
                id="totalActualFee"
            >
                ₹0
            </div>

        </div>



        <div class="fee-card">

            <div class="fee-card-title">
                Total Fee Paid
            </div>

            <div
                class="fee-card-value"
                id="totalFeePaid"
            >
                ₹0
            </div>

        </div>



        <div class="fee-card">

            <div class="fee-card-title">
                Total Teacher Fee
            </div>

            <div
                class="fee-card-value"
                id="totalTeacherFee"
            >
                ₹0
            </div>

        </div>



        <div class="fee-card">

            <div class="fee-card-title">
                Total Academy Fee
            </div>

            <div
                class="fee-card-value"
                id="totalAcademyFee"
            >
                ₹0
            </div>

        </div>


    </div>



    <!-- TABLE -->

    <div class="fee-table-wrapper">

        <table id="feeTable">

           <thead>

    <tr>

        <th>Student ID</th>

        <th>Student Name</th>

        <th>Actual Fee</th>

        <th>Fee Paid</th>

        <th>Fee to Teacher</th>

        <th>Fee to Academy</th>

        <th>Action</th>

    </tr>

</thead>


            <tbody id="feeTableBody">

                <tr>

                    <td
    colspan="7"
    class="loading-row"
>
                        Loading...
                    </td>

                </tr>

            </tbody>


            <tfoot>

                
    <tr>

        <td colspan="2">
            TOTAL
        </td>

        <td id="tableTotalActual">
            ₹0
        </td>

        <td id="tableTotalPaid">
            ₹0
        </td>

        <td id="tableTotalTeacher">
            ₹0
        </td>

        <td id="tableTotalAcademy">
            ₹0
        </td>

        <td>
            -
        </td>

    </tr>

</tfoot>


        </table>

    </div>


</div>



<script>


const API_BASE =
"https://academy-backend-eatl.onrender.com";
let currentFeeReport = [];


const monthNames = [

    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"

];


function formatCurrency(value){

    return "₹ " +
        Number(value || 0)
        .toLocaleString("en-IN");

}



function populateMonthDropdown(){

    const select =
        document.getElementById("feeMonth");

    select.innerHTML = "";

    const currentYear =
        new Date().getFullYear();

    for(
        let year = currentYear;
        year >= currentYear - 2;
        year--
    ){

        for(
            let month = 11;
            month >= 0;
            month--
        ){

            const option =
                document.createElement("option");

            option.value =
                `${month + 1}-${year}`;

            option.textContent =
                `${monthNames[month]} ${year}`;

            select.appendChild(option);

        }

    }

    const currentMonth =
        new Date().getMonth() + 1;

    select.value =
        `${currentMonth}-${currentYear}`;

}



async function loadFeeReport(){

    const select =
        document.getElementById("feeMonth");

    const [month, year] =
        select.value.split("-")
        .map(Number);

    const token =
        localStorage.getItem("token");


    document.getElementById(
        "feeTableBody"
    ).innerHTML = `

        <tr>

            <td
                colspan="6"
                class="loading-row"
            >
                Loading...
            </td>

        </tr>

    `;


    try{

        const response =
            await fetch(

                `${API_BASE}/api/founder/fee-report?month=${month}&year=${year}`,

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                        "Bearer " + token

                    }

                }

            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load fee report"
            );

        }


        renderFeeReport(data);


    }catch(error){

        console.error(
            "FEE REPORT ERROR:",
            error
        );


        document.getElementById(
            "feeTableBody"
        ).innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="loading-row"
                >
                    Error loading fee report
                </td>

            </tr>

        `;

    }

}

async function saveFeeRecord(studentId, actualFee) {

    const select =
        document.getElementById("feeMonth");

    const [month, year] =
        select.value
            .split("-")
            .map(Number);


    const paidInput =
        document.getElementById(
            `paid-${studentId}`
        );

    const teacherInput =
        document.getElementById(
            `teacher-${studentId}`
        );


    const feePaid =
        Number(paidInput.value || 0);

    const teacherFee =
        Number(teacherInput.value || 0);


    // ================= VALIDATION =================

    if (feePaid < 0) {

        alert("Fee Paid cannot be negative.");

        return;

    }


    if (teacherFee < 0) {

        alert("Fee to Teacher cannot be negative.");

        return;

    }


    

    const academyFee =
        feePaid - teacherFee;


    // Show calculated Academy Fee immediately

    document.getElementById(
        `academy-${studentId}`
    ).innerText =
        formatCurrency(academyFee);


    const token =
        localStorage.getItem("token");


    try {

        const response =
            await fetch(
                `${API_BASE}/api/founder/fee-record`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body: JSON.stringify({

                        studentId,

                        month,

                        year,

                        feePaid,

                        teacherFee

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to save fee"
            );

        }


        alert(
            "Monthly fee saved successfully."
        );


        // Reload report so totals update

        loadFeeReport();


    } catch (error) {

        console.error(
            "SAVE FEE ERROR:",
            error
        );

        alert(
            error.message ||
            "Error saving monthly fee."
        );

    }

}


function renderFeeReport(data){

    currentFeeReport = data.report || [];

    renderFilteredFeeReport();

    // ================= TOTALS =================

    const totals =
        data.totals;


    document.getElementById(
        "totalActualFee"
    ).innerText =
        formatCurrency(totals.actualFee);


    document.getElementById(
        "totalFeePaid"
    ).innerText =
        formatCurrency(totals.feePaid);


    document.getElementById(
        "totalTeacherFee"
    ).innerText =
        formatCurrency(totals.teacherFee);


    document.getElementById(
        "totalAcademyFee"
    ).innerText =
        formatCurrency(totals.academyFee);


    // TABLE TOTALS

    document.getElementById(
        "tableTotalActual"
    ).innerText =
        formatCurrency(totals.actualFee);


    document.getElementById(
        "tableTotalPaid"
    ).innerText =
        formatCurrency(totals.feePaid);


    document.getElementById(
        "tableTotalTeacher"
    ).innerText =
        formatCurrency(totals.teacherFee);


    document.getElementById(
        "tableTotalAcademy"
    ).innerText =
        formatCurrency(totals.academyFee);

}

function renderFilteredFeeReport(){

    const tbody =
        document.getElementById(
            "feeTableBody"
        );

    tbody.innerHTML = "";


    // ================= FILTER VALUES =================

    const nameFilter =
        document.getElementById(
            "studentNameFilter"
        ).value
        .trim()
        .toLowerCase();


    const idFilter =
        document.getElementById(
            "studentIdFilter"
        ).value
        .trim()
        .toLowerCase();


    const sortType =
        document.getElementById(
            "studentSort"
        ).value;


    // ================= FILTER =================

    let filteredStudents =
        currentFeeReport.filter(student => {

            const studentName =
                String(
                    student.studentName || ""
                ).toLowerCase();


            const studentId =
                String(
                    student.studentId || ""
                ).toLowerCase();


            const nameMatch =
                studentName.includes(
                    nameFilter
                );


            const idMatch =
                studentId.includes(
                    idFilter
                );


            return nameMatch && idMatch;

        });


    // ================= SORT =================

    filteredStudents.sort((a, b) => {

        const nameA =
            String(
                a.studentName || ""
            ).toLowerCase();

        const nameB =
            String(
                b.studentName || ""
            ).toLowerCase();


        const idA =
            String(
                a.studentId || ""
            ).toUpperCase();

        const idB =
            String(
                b.studentId || ""
            ).toUpperCase();


        if(sortType === "name-asc"){

            return nameA.localeCompare(
                nameB,
                undefined,
                {
                    sensitivity: "base"
                }
            );

        }


        if(sortType === "name-desc"){

            return nameB.localeCompare(
                nameA,
                undefined,
                {
                    sensitivity: "base"
                }
            );

        }


        // Extract number from GPA-0001

        const numberA =
            parseInt(
                idA.replace(/\D/g, ""),
                10
            ) || 0;


        const numberB =
            parseInt(
                idB.replace(/\D/g, ""),
                10
            ) || 0;


        if(sortType === "id-desc"){

            return numberB - numberA;

        }


        // Default:
        // GPA-0001 → GPA-∞

        return numberA - numberB;

    });


    // ================= NO RESULTS =================

    if(filteredStudents.length === 0){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="loading-row"
                >
                    No students found.
                </td>

            </tr>

        `;

        return;

    }


    // ================= RENDER =================

    filteredStudents.forEach(student => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${student.studentId || "-"}
            </td>

            <td>
                ${student.studentName || "-"}
            </td>

            <td>
                ${formatCurrency(
                    student.actualFee
                )}
            </td>

            <td>

                <input
                    type="number"
                    min="0"
                    step="1"
                    class="fee-input"
                    id="paid-${student.studentId}"
                    value="${student.feePaid || 0}"
                >

            </td>

            <td>

                <input
                    type="number"
                    min="0"
                    step="1"
                    class="fee-input"
                    id="teacher-${student.studentId}"
                    value="${student.teacherFee || 0}"
                >

            </td>

            <td>

                <span
                    id="academy-${student.studentId}"
                >
                    ${formatCurrency(
                        student.academyFee
                    )}
                </span>

            </td>

            <td>

                <button
                    class="save-fee-btn"
                    onclick="saveFeeRecord(
                        '${student.studentId}',
                        ${student.actualFee}
                    )"
                >
                    Save
                </button>

            </td>

        `;


        tbody.appendChild(row);

    });

}

document.getElementById(
    "feeMonth"
).addEventListener(
    "change",
    loadFeeReport
);


// ================= NAME FILTER =================

document.getElementById(
    "studentNameFilter"
).addEventListener(
    "input",
    renderFilteredFeeReport
);


// ================= STUDENT ID FILTER =================

document.getElementById(
    "studentIdFilter"
).addEventListener(
    "input",
    renderFilteredFeeReport
);


// ================= SORT =================

document.getElementById(
    "studentSort"
).addEventListener(
    "change",
    renderFilteredFeeReport
);


populateMonthDropdown();

loadFeeReport();


</script>


</body>

</html>
