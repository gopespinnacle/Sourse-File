<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gopes Pinnacle Academy - Annotation
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /*
        =====================================================
        MAIN ANNOTATION APPLICATION
        =====================================================
        */

        #annotationApp {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /*
        =====================================================
        TOP BAR
        =====================================================
        */

        #annotationTopBar {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;

    background: #171a1f;

    border-bottom:
        1px solid #2d333b;

    position: relative;

    z-index: 1000;

}


        #academyTitle {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: .3px;

    color: #ffffff;

}


        #materialTitle {

            font-size: 14px;

            color: #d1d5db;

        }


        /*
        =====================================================
        CONNECTION / STATUS
        =====================================================
        */

        #annotationStatus {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

        }


        #annotationStatusDot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }


        /*
        =====================================================
        MAIN WORKSPACE
        =====================================================
        */

        #annotationMain {

    flex: 1;

    position: relative;

    background: #e5e7eb;

    overflow: hidden;

}
/*
=====================================================
ANNOTATION WORKSPACE
=====================================================
*/

#annotationWorkspaceV1 {

    position: absolute;

    left: 24px;

    right: 24px;

    top: 20px;

    bottom: 20px;

    background: #ffffff;

    overflow: hidden;

    border-radius: 8px;

    box-shadow:
        0 4px 18px
        rgba(0, 0, 0, .15);

}

/*
=====================================================
ANNOTATION TOOLBAR V1
=====================================================
*/

#annotationToolbarV1 {

    position: absolute;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 2000;

}


        


        /*
        =====================================================
        MATERIAL INFORMATION
        =====================================================
        */

        #materialInfo {

    position: absolute;

    top: 10px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 1100;

    padding: 7px 18px;

    background:
        rgba(17, 24, 39, .92);

    border-radius: 20px;

    font-size: 13px;

    text-align: center;

    pointer-events: none;

    white-space: nowrap;

}


        /*
        =====================================================
        MOBILE
        =====================================================
        */

        @media (max-width: 700px) {

            #annotationTopBar {

                height: 52px;

                padding:
                    0 12px;

            }

            #academyTitle {

                font-size: 14px;

            }

            #materialTitle {

                display: none;

            }
            #annotationWorkspaceV1 {

    left: 8px;

    right: 8px;

    top: 10px;

    bottom: 10px;

    border-radius: 6px;

}

            

        }

        /*
===========================================================
CLOSE CONFIRMATION MODAL
===========================================================
*/

.annotationCloseOverlayV1 {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0, 0, 0, .65);

    backdrop-filter:
        blur(4px);

}


.annotationCloseDialogV1 {

    width: 420px;

    max-width: calc(100vw - 32px);

    padding: 28px;

    background: #171a1f;

    border:
        1px solid #343b45;

    border-radius: 16px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, .45);

    text-align: center;

}


.annotationCloseIconV1 {

    width: 48px;

    height: 48px;

    margin:
        0 auto 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #3a2f16;

    color: #fbbf24;

    font-size: 23px;

}


.annotationCloseTitleV1 {

    font-size: 19px;

    font-weight: 700;

    color: #ffffff;

    margin-bottom: 10px;

}


.annotationCloseMessageV1 {

    font-size: 14px;

    line-height: 1.6;

    color: #cbd5e1;

}


.annotationCloseActionsV1 {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

}


.annotationCloseButtonV1 {

    min-width: 105px;

    padding:
        10px 16px;

    border: none;

    border-radius: 8px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .15s ease,
        opacity .15s ease;

}


.annotationCloseButtonV1:hover {

    transform:
        translateY(-1px);

    opacity: .9;

}


.annotationCloseSaveButtonV1 {

    background: #2563eb;

    color: #ffffff;

}


.annotationCloseDontSaveButtonV1 {

    background: #374151;

    color: #ffffff;

}


.annotationCloseCancelButtonV1 {

    background: #111827;

    color: #d1d5db;

    border:
        1px solid #4b5563;

}


/*
===========================================================
MOBILE
===========================================================
*/

@media (max-width: 700px) {

    .annotationCloseDialogV1 {

        padding: 22px;

    }


    .annotationCloseActionsV1 {

        flex-direction: column;

    }


    .annotationCloseButtonV1 {

        width: 100%;

    }

}

    </style>

</head>


<body>


<div id="annotationApp">


    <!-- =================================================
         TOP BAR
         ================================================= -->

    <div id="annotationTopBar">


        <div>

            <div id="academyTitle">

                GOPES PINNACLE ACADEMY

            </div>


            <div id="materialTitle">

                Annotation

            </div>

        </div>


        <div id="annotationStatus">

            <span
                id="annotationStatusDot"
            ></span>

            <span
                id="annotationStatusText"
            >
                Annotation Active
            </span>

        </div>

    </div>



    <!-- =================================================
         MAIN ANNOTATION AREA
         ================================================= -->

    <div id="annotationMain">


      <div
    id="annotationWorkspaceV1"
>

    <canvas
        id="annotationCanvasV1"
    ></canvas>

</div>


        <!-- MATERIAL INFORMATION -->

        <div id="materialInfo">

            <div>
                <strong id="materialSubject">
                    Subject
                </strong>
            </div>

            <div id="materialTopic">
                Topic
            </div>

            
        </div>
        <!-- =====================================================
     ANNOTATION TOOLBAR V1
     ===================================================== -->

<div id="annotationToolbarV1"></div>


    </div>


</div>


<!-- =====================================================
     SOCKET.IO
     REQUIRED FOR ANNOTATION PERSISTENCE
     ===================================================== -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>

/*
===========================================================
GOPES PINNACLE ACADEMY
STANDALONE ANNOTATION SOCKET
===========================================================

IMPORTANT:

The classroom already has a socket.

The standalone annotation page is a NEW browser tab,
so it needs its own Socket.IO connection.

AnnotationCanvasV1 expects:

    window.socket

===========================================================
*/

window.socket =
    io(
        "https://academy-backend-eatl.onrender.com",
        {

            transports: [
                "websocket",
                "polling"
            ],

            reconnection: true,

            reconnectionAttempts:
                Infinity,

            reconnectionDelay:
                1000,

            reconnectionDelayMax:
                5000,

            timeout:
                20000

        }
    );


/*
===========================================================
SOCKET CONNECTED
===========================================================
*/

window.socket.on(
    "connect",
    () => {

        console.log(
            "ANNOTATION TAB: SOCKET CONNECTED",
            window.socket.id
        );

    }
);


/*
===========================================================
SOCKET DISCONNECTED
===========================================================
*/

window.socket.on(
    "disconnect",
    reason => {

        console.warn(
            "ANNOTATION TAB: SOCKET DISCONNECTED",
            reason
        );

    }
);


/*
===========================================================
SOCKET ERROR
===========================================================
*/

window.socket.on(
    "connect_error",
    error => {

        console.error(
            "ANNOTATION TAB: SOCKET ERROR",
            error
        );

    }
);

</script>


<!-- =====================================================
     ANNOTATION CANVAS
     ===================================================== -->

<script src="assets/js/meeting/annotation/annotationCanvasV1.js"></script>


<!-- =====================================================
     ANNOTATION TOOLBAR
     ===================================================== -->

<script src="assets/js/meeting/annotation/annotationToolbarV1.js"></script>


<!-- =====================================================
     ANNOTATION PAGE
     ===================================================== -->

<script src="assets/js/meeting/annotation/annotationPageV1.js"></script>



</body>

</html>
