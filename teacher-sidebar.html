<div class="sidebar">

    <div class="logo-box">

        <img src="images/logo.png" alt="Academy Logo">

    </div>

    <hr>

    <ul>

        <li onclick="window.location.href='teacher-dashboard.html'">

            <i class="fa fa-chart-line"></i>

            Dashboard

        </li>

        <li onclick="logout()">

            <i class="fa fa-sign-out-alt"></i>

            Logout

        </li>

    </ul>

</div>
<style>

.sidebar{
    width:240px;
    height:100vh;
    position:fixed;
    top:0;
    left:0;
    background:#1e2a38;
    color:#fff;

    display:flex;
    flex-direction:column;

    z-index:9999;
}

/* HEADER */
.logo-box{

    text-align:center;

    padding:20px 15px 15px;

}

.logo-box img{

    width:140px;

    height:auto;

}

.sidebar hr{

    border:none;

    border-top:1px solid rgba(255,255,255,.15);

    margin:0 15px 15px;

}

/* MENU */
.sidebar ul{
    list-style:none;
    padding:10px 0;
    margin:0;
    flex:1;
}

.sidebar ul li{

    margin:12px 15px;

    padding:14px 18px;

    border-radius:12px;

    cursor:pointer;

    transition:.3s;

    display:flex;

    align-items:center;

    gap:12px;

    font-size:16px;

    font-weight:600;

}

.sidebar ul li:hover{

    background:#2f6df5;

    transform:translateX(5px);

    box-shadow:0 6px 18px rgba(0,0,0,.25);

}

.sidebar i{

    width:22px;

    text-align:center;

    font-size:18px;

}

/* ======================
MOBILE
====================== */

@media(max-width:768px){

.sidebar{

    left:-260px;
    transition:.3s;

}

.sidebar.show{

    left:0;

}

.sidebar h2{

    font-size:22px;

}

.sidebar ul li{

    padding:18px 20px;
    font-size:18px;

}

}

</style>

<script>
function go(page){
    window.location.href = page;
}

function logout(){

    sessionStorage.clear();

    window.location.replace(
        "teacher-login.html"
    );

}
</script>
<script>
function goToDashboard(){
    window.location.href = "teacher-dashboard.html";
}

const permissions = JSON.parse(

sessionStorage.getItem("menuPermissions") || "{}"

);

function applyMenuPermissions(){

    Object.keys(permissions).forEach(menu=>{

        if(permissions[menu] === false){

            const item = document.getElementById(

                "menu-" + menu

            );

            if(item){

                item.style.display = "none";

            }

        }

    });

}

applyMenuPermissions();
</script>
