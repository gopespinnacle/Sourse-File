<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gopes Pinnacle Academy - Annotation
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /*
        =====================================================
        MAIN ANNOTATION APPLICATION
        =====================================================
        */

        #annotationApp {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /*
        =====================================================
        TOP BAR
        =====================================================
        */

        #annotationTopBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            background: #1f2937;

            border-bottom:
                1px solid #374151;

        }


        #academyTitle {

            font-size: 18px;

            font-weight: 700;

        }


        #materialTitle {

            font-size: 14px;

            color: #d1d5db;

        }


        /*
        =====================================================
        CONNECTION / STATUS
        =====================================================
        */

        #annotationStatus {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

        }


        #annotationStatusDot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }


        /*
        =====================================================
        MAIN WORKSPACE
        =====================================================
        */

        #annotationMain {

            flex: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffffff;

            overflow: hidden;

        }


        /*
        =====================================================
        CANVAS
        =====================================================
        */

        #annotationCanvas {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: block;

            background: #ffffff;

            touch-action: none;

            cursor: crosshair;

        }


        /*
        =====================================================
        TEMPORARY TOOLBAR
        =====================================================
        */

        

        #annotationToolbar button:hover {

            background: #4b5563;

        }


        /*
        =====================================================
        MATERIAL INFORMATION
        =====================================================
        */

        #materialInfo {

            position: absolute;

            top: 15px;

            left: 15px;

            z-index: 100;

            padding: 10px 14px;

            background:
                rgba(17,24,39,.85);

            border-radius: 8px;

            font-size: 13px;

        }


        /*
        =====================================================
        MOBILE
        =====================================================
        */

        @media (max-width: 700px) {

            #annotationTopBar {

                height: 52px;

                padding:
                    0 12px;

            }

            #academyTitle {

                font-size: 14px;

            }

            #materialTitle {

                display: none;

            }

            #annotationToolbar {

                bottom: 10px;

                max-width: 95vw;

                overflow-x: auto;

            }

        }

    </style>

</head>


<body>


<div id="annotationApp">


    <!-- =================================================
         TOP BAR
         ================================================= -->

    <div id="annotationTopBar">


        <div>

            <div id="academyTitle">

                GOPES PINNACLE ACADEMY

            </div>


            <div id="materialTitle">

                Annotation

            </div>

        </div>


        <div id="annotationStatus">

            <span
                id="annotationStatusDot"
            ></span>

            <span
                id="annotationStatusText"
            >
                Annotation Active
            </span>

        </div>

    </div>



    <!-- =================================================
         MAIN ANNOTATION AREA
         ================================================= -->

    <div id="annotationMain">


        <div
    id="annotationWorkspaceV1"
    style="
        position:absolute;
        left:0;
        top:0;
        right:0;
        bottom:0;
        width:100%;
        height:100%;
        background:#ffffff;
        overflow:hidden;
    "
></div>


        <!-- MATERIAL INFORMATION -->

        <div id="materialInfo">

            <div>
                <strong id="materialSubject">
                    Subject
                </strong>
            </div>

            <div id="materialTopic">
                Topic
            </div>

        </div>


    

        <!-- =====================================================
     GOPES PINNACLE ACADEMY
     ANNOTATION TOOLBAR V1
     ===================================================== -->

<div
    id="annotationToolbarV1"
></div>


    </div>


</div>


<script src="assets/js/meeting/annotation/annotationCanvasV1.js"></script>

<script src="assets/js/meeting/annotation/annotationToolbarV1.js"></script>

<script src="assets/js/meeting/annotation/annotationPageV1.js"></script>



</body>

</html>
