
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinnacle Star Championship 2026</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f5fb;
        color: #17213b;
    }

    #dashboard {
        max-width: 1000px;
        margin: 35px auto;
        padding: 25px;
    }

    #dashboard > h1 {
        background: linear-gradient(120deg, #100b3d, #173f83);
        color: white;
        padding: 35px 20px;
        border-radius: 20px;
        text-align: center;
        border-bottom: 5px solid #d8ad45;
        font-size: 30px;
    }

    #dashboard > p {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        margin: 25px 0;
    }

    #dashboard > div {
        background: white;
        padding: 25px;
        margin: 20px 0;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0,0,0,.06);
        border: 1px solid #e8eaf2;
    }

    #dashboard h2 {
        color: #172d63;
        border-bottom: 2px solid #e5bd58;
        padding-bottom: 12px;
        font-size: 21px;
    }

    #dashboard h3 {
        color: #173f83;
        margin-bottom: 8px;
    }

    #dashboard p {
        line-height: 1.7;
        font-size: 16px;
    }

    #competitions > div {
        background: #f5f7fc;
        border-left: 4px solid #d8ad45;
        border-radius: 10px;
        padding: 12px 18px;
        margin: 12px 0;
    }

    @media (max-width: 600px) {
        #dashboard {
            margin: 10px auto;
            padding: 12px;
        }

        #dashboard > h1 {
            font-size: 23px;
            padding: 28px 15px;
        }

        #dashboard > div {
            padding: 18px;
        }
    }
</style>

</head>

<body>

    <div id="dashboard">

        <h1>Pinnacle Star Championship 2026</h1>

        <p>Welcome, <span id="studentName">Loading...</span></p>

        <div>
            <h2>Participant Details</h2>
            <p>Participant ID: <span id="participantId">Loading...</span></p>
            <p>Grade: <span id="grade">Loading...</span></p>
        </div>

        <div>
            <h2>Registered Competitions</h2>
            <div id="competitions">Loading...</div>
        </div>

        <div>
            <h2>Event Information</h2>
            <p>Event Date: December 27, 2026</p>
            <p>Reporting Time: To be announced</p>
        </div>

    </div>


<script>

async function loadParticipantDashboard() {

    const token = localStorage.getItem("token");

    if (!token) {
        alert("Please login first.");
        window.location.href = "student-login.html";
        return;
    }

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/participant/me",
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            alert(data.message || "Unable to load participant details.");
            return;
        }

        const participant = data.participant;

        document.getElementById("studentName").textContent =
            participant.studentName || "-";

        document.getElementById("participantId").textContent =
            participant.participantId || "-";

        document.getElementById("grade").textContent =
            participant.grade || "-";

        const competitionsContainer =
            document.getElementById("competitions");

        competitionsContainer.innerHTML = "";

        if (participant.competitions &&
            participant.competitions.length > 0) {

            participant.competitions.forEach(item => {

                const competitionCard = document.createElement("div");

                const competitionName =
                    document.createElement("h3");

                competitionName.textContent =
                    item.competition;

                const categoryName =
                    document.createElement("p");

                categoryName.textContent =
                    "Category: " + (item.category || "-");

                competitionCard.appendChild(competitionName);
                competitionCard.appendChild(categoryName);

                competitionsContainer.appendChild(competitionCard);

            });

        } else {

            competitionsContainer.textContent =
                "No competitions found.";

        }

    } catch (error) {

        console.error("Dashboard Error:", error);

        alert("Unable to connect to the server.");

    }

}

loadParticipantDashboard();

</script>
</body>
</html>



</body>
</html>
