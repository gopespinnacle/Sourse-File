<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gopes Pinnacle Academy - Annotation
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /*
        =====================================================
        MAIN ANNOTATION APPLICATION
        =====================================================
        */

        #annotationApp {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /*
        =====================================================
        TOP BAR
        =====================================================
        */

        #annotationTopBar {

            height: 60px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            background: #1f2937;

            border-bottom:
                1px solid #374151;

        }


        #academyTitle {

            font-size: 18px;

            font-weight: 700;

        }


        #materialTitle {

            font-size: 14px;

            color: #d1d5db;

        }


        /*
        =====================================================
        CONNECTION / STATUS
        =====================================================
        */

        #annotationStatus {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

        }


        #annotationStatusDot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }


        /*
        =====================================================
        MAIN WORKSPACE
        =====================================================
        */

        #annotationMain {

            flex: 1;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffffff;

            overflow: hidden;

        }


        /*
        =====================================================
        CANVAS
        =====================================================
        */

        #annotationCanvas {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: block;

            background: #ffffff;

            touch-action: none;

            cursor: crosshair;

        }


        /*
        =====================================================
        TEMPORARY TOOLBAR
        =====================================================
        */

        #annotationToolbar {

            position: absolute;

            left: 50%;

            bottom: 20px;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px 14px;

            background:
                rgba(31,41,55,.95);

            border-radius: 14px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.25);

            z-index: 100;

        }


        #annotationToolbar button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 10px;

            background: #374151;

            color: white;

            cursor: pointer;

            font-size: 18px;

        }


        #annotationToolbar button:hover {

            background: #4b5563;

        }


        /*
        =====================================================
        MATERIAL INFORMATION
        =====================================================
        */

        #materialInfo {

            position: absolute;

            top: 15px;

            left: 15px;

            z-index: 100;

            padding: 10px 14px;

            background:
                rgba(17,24,39,.85);

            border-radius: 8px;

            font-size: 13px;

        }


        /*
        =====================================================
        MOBILE
        =====================================================
        */

        @media (max-width: 700px) {

            #annotationTopBar {

                height: 52px;

                padding:
                    0 12px;

            }

            #academyTitle {

                font-size: 14px;

            }

            #materialTitle {

                display: none;

            }

            #annotationToolbar {

                bottom: 10px;

                max-width: 95vw;

                overflow-x: auto;

            }

        }

    </style>

</head>


<body>


<div id="annotationApp">


    <!-- =================================================
         TOP BAR
         ================================================= -->

    <div id="annotationTopBar">


        <div>

            <div id="academyTitle">

                GOPES PINNACLE ACADEMY

            </div>


            <div id="materialTitle">

                Annotation

            </div>

        </div>


        <div id="annotationStatus">

            <span
                id="annotationStatusDot"
            ></span>

            <span
                id="annotationStatusText"
            >
                Annotation Active
            </span>

        </div>

    </div>



    <!-- =================================================
         MAIN ANNOTATION AREA
         ================================================= -->

    <div id="annotationMain">


        <div
    id="annotationWorkspaceV1"
    style="
        position:absolute;
        left:0;
        top:0;
        right:0;
        bottom:0;
        width:100%;
        height:100%;
        background:#ffffff;
        overflow:hidden;
    "
></div>


        <!-- MATERIAL INFORMATION -->

        <div id="materialInfo">

            <div>
                <strong id="materialSubject">
                    Subject
                </strong>
            </div>

            <div id="materialTopic">
                Topic
            </div>

        </div>


    

        <!-- =====================================================
     GOPES PINNACLE ACADEMY
     ANNOTATION TOOLBAR V1
     ===================================================== -->




    </div>


</div>


<script src="assets/js/meeting/annotation/annotationCanvasV1.js"></script>

<script src="assets/js/meeting/annotation/annotationToolbarV1.js"></script>

<script src="assets/js/meeting/annotation/annotationPageV1.js"></script>
<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {


        /*
        =================================================
        READ MATERIAL KEY
        =================================================
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const key =
            params.get("key");


        console.log(
            "NEW ANNOTATION PAGE"
        );


        console.log(
            "ANNOTATION KEY:",
            key
        );


        if (!key) {

            console.error(
                "ANNOTATION: MATERIAL KEY NOT FOUND"
            );

            alert(
                "Annotation information is missing."
            );

            return;

        }


        /*
        =================================================
        GET MATERIAL DETAILS
        =================================================
        */

        const saved =
            localStorage.getItem(
                key
            );


        if (!saved) {

            console.error(
                "ANNOTATION: MATERIAL DATA NOT FOUND"
            );

            alert(
                "Learning material information could not be loaded."
            );

            return;

        }


        let materialDetails;


        try {

            materialDetails =
                JSON.parse(
                    saved
                );

        }
        catch (error) {

            console.error(
                "ANNOTATION: INVALID MATERIAL DATA",
                error
            );

            return;

        }


        console.log(
            "ANNOTATION MATERIAL:",
            materialDetails
        );


        /*
        =================================================
        DISPLAY MATERIAL DETAILS
        =================================================
        */

        const subject =
            document.getElementById(
                "materialSubject"
            );


        const topic =
            document.getElementById(
                "materialTopic"
            );


        if (subject) {

            subject.textContent =
                materialDetails.subject ||
                "General";

        }


        if (topic) {

            topic.textContent =
                materialDetails.topic ||
                "";

        }


        /*
        =================================================
        CANVAS
        =================================================
        */

        const canvas =
            document.getElementById(
                "annotationCanvas"
            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        function resizeCanvas() {

            const rect =
                canvas.getBoundingClientRect();


            canvas.width =
                rect.width;


            canvas.height =
                rect.height;


            ctx.fillStyle =
                "#ffffff";


            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /*
        =================================================
        BASIC PEN
        =================================================
        */

        let drawing = false;


        let lastX = 0;

        let lastY = 0;


        canvas.addEventListener(
            "pointerdown",
            event => {

                drawing = true;


                lastX =
                    event.offsetX;


                lastY =
                    event.offsetY;

            }
        );


        canvas.addEventListener(
            "pointermove",
            event => {

                if (!drawing) {

                    return;

                }


                ctx.beginPath();


                ctx.moveTo(
                    lastX,
                    lastY
                );


                ctx.lineTo(
                    event.offsetX,
                    event.offsetY
                );


                ctx.strokeStyle =
                    "#111111";


                ctx.lineWidth =
                    3;


                ctx.lineCap =
                    "round";


                ctx.stroke();


                lastX =
                    event.offsetX;


                lastY =
                    event.offsetY;

            }
        );


        canvas.addEventListener(
            "pointerup",
            () => {

                drawing = false;

            }
        );


        canvas.addEventListener(
            "pointerleave",
            () => {

                drawing = false;

            }
        );


        /*
        =================================================
        CLEAR
        =================================================
        */

        document
            .getElementById(
                "clearButton"
            )
            .addEventListener(
                "click",
                () => {

                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    ctx.fillStyle =
                        "#ffffff";


                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                }
            );


        /*
        =================================================
        CLOSE
        =================================================
        */

        document
            .getElementById(
                "closeButton"
            )
            .addEventListener(
                "click",
                () => {

                    window.close();

                }
            );


        /*
        =================================================
        DEBUG
        =================================================
        */

        console.log(
            "NEW ANNOTATION PAGE READY"
        );

    }

);

</script>


</body>

</html>
