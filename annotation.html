<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gopes Pinnacle Academy - Annotation
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /*
        =====================================================
        MAIN ANNOTATION APPLICATION
        =====================================================
        */

        #annotationApp {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /*
        =====================================================
        TOP BAR
        =====================================================
        */

        #annotationTopBar {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;

    background: #171a1f;

    border-bottom:
        1px solid #2d333b;

    position: relative;

    z-index: 1000;

}


        #academyTitle {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: .3px;

    color: #ffffff;

}


        #materialTitle {

            font-size: 14px;

            color: #d1d5db;

        }


        /*
        =====================================================
        CONNECTION / STATUS
        =====================================================
        */

        #annotationStatus {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 13px;

        }


        #annotationStatusDot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }


        /*
        =====================================================
        MAIN WORKSPACE
        =====================================================
        */

        #annotationMain {

    flex: 1;

    position: relative;

    background: #e5e7eb;

    overflow: hidden;

}
/*
=====================================================
ANNOTATION WORKSPACE
=====================================================
*/

#annotationWorkspaceV1 {

    position: absolute;

    left: 24px;

    right: 24px;

    top: 20px;

    bottom: 20px;

    background: #ffffff;

    overflow: hidden;

    border-radius: 8px;

    box-shadow:
        0 4px 18px
        rgba(0, 0, 0, .15);

}


        


        /*
        =====================================================
        MATERIAL INFORMATION
        =====================================================
        */

        #materialInfo {

    position: absolute;

    top: 10px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 1100;

    padding: 7px 18px;

    background:
        rgba(17, 24, 39, .92);

    border-radius: 20px;

    font-size: 13px;

    text-align: center;

    pointer-events: none;

    white-space: nowrap;

}


        /*
        =====================================================
        MOBILE
        =====================================================
        */

        @media (max-width: 700px) {

            #annotationTopBar {

                height: 52px;

                padding:
                    0 12px;

            }

            #academyTitle {

                font-size: 14px;

            }

            #materialTitle {

                display: none;

            }
            #annotationWorkspaceV1 {

    left: 8px;

    right: 8px;

    top: 10px;

    bottom: 10px;

    border-radius: 6px;

}

            

        }

    </style>

</head>


<body>


<div id="annotationApp">


    <!-- =================================================
         TOP BAR
         ================================================= -->

    <div id="annotationTopBar">


        <div>

            <div id="academyTitle">

                GOPES PINNACLE ACADEMY

            </div>


            <div id="materialTitle">

                Annotation

            </div>

        </div>


        <div id="annotationStatus">

            <span
                id="annotationStatusDot"
            ></span>

            <span
                id="annotationStatusText"
            >
                Annotation Active
            </span>

        </div>

    </div>



    <!-- =================================================
         MAIN ANNOTATION AREA
         ================================================= -->

    <div id="annotationMain">


        <div
    id="annotationWorkspaceV1"
></div>


        <!-- MATERIAL INFORMATION -->

        <div id="materialInfo">

            <div>
                <strong id="materialSubject">
                    Subject
                </strong>
            </div>

            <div id="materialTopic">
                Topic
            </div>

        </div>


    

        <!-- =====================================================
     GOPES PINNACLE ACADEMY
     ANNOTATION TOOLBAR V1
     ===================================================== -->




    </div>


</div>


<script src="assets/js/meeting/annotation/annotationCanvasV1.js"></script>

<script src="assets/js/meeting/annotation/annotationToolbarV1.js"></script>

<script src="assets/js/meeting/annotation/annotationPageV1.js"></script>



</body>

</html>
