<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo Videos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.uploadBtn{

background:#0d6efd;

color:white;

border:none;

padding:12px 20px;

border-radius:8px;

cursor:pointer;

font-size:15px;

}

.videoCard{

background:white;

padding:20px;

margin-bottom:20px;

border-radius:12px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.videoTitle{

font-size:22px;

font-weight:bold;

margin-bottom:10px;

}

.teacher{

margin-bottom:20px;

color:#666;

}

.actions{

display:flex;

gap:12px;

flex-wrap:wrap;

}

.actions button{

padding:10px 18px;

border:none;

border-radius:8px;

cursor:pointer;

}

.preview{
background:#198754;
color:white;
}

.copy{
background:#0d6efd;
color:white;
}

.edit{
background:#ffc107;
}

.delete{
background:#dc3545;
color:white;
}

.backBtn{
margin-bottom:20px;
padding:10px 18px;
cursor:pointer;
}

.uploadDate{

margin-bottom:20px;

color:#888;

font-size:14px;

}

#searchBox{

width:300px;

padding:10px 14px;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

}
.noVideos{

background:white;

padding:50px;

text-align:center;

border-radius:12px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.noVideos h2{

margin-bottom:15px;

color:#555;

}

.noVideos p{

color:#777;

font-size:16px;

}

#videoCount{

margin-top:8px;

color:#666;

font-size:15px;

}

/*==================================================
MOBILE UI
==================================================*/

@media (max-width:768px){

.container{

    width:100%;
    max-width:100%;
    padding:18px;
    box-sizing:border-box;

}

.header{

    flex-direction:column;
    align-items:flex-start;
    gap:15px;

}

.logo{

    width:180px;
    margin:auto;

}

.pageTitle{

    width:100%;
    text-align:center;
    font-size:30px;
    line-height:38px;

}

.pageSubTitle{

    text-align:center;
    font-size:20px;
    margin-top:8px;

}

.searchBox{

    width:100%;
    margin-top:15px;

}

.searchBox input{

    width:100%;
    font-size:16px;
    padding:14px 18px;
    border-radius:12px;

}

/*=========================================
MOBILE VIDEO CARD
=========================================*/

.videoCard{

    width:100%;
    margin:20px 0;
    padding:20px;
    border-radius:18px;

}

.videoTitle{

    font-size:22px;
    line-height:30px;
    margin-bottom:15px;

}

.teacher{

    font-size:16px;
    margin-bottom:15px;

}

.uploadDate{

    font-size:15px;
    margin-bottom:15px;

}

/*=========================================
MOBILE BUTTONS
=========================================*/

.actions{

    display:flex;
    flex-direction:column;
    gap:12px;

}

.actions button{

    width:100%;
    padding:14px;
    font-size:16px;
    border-radius:12px;

}

#searchBox{

    width:100%;

}



}



</style>

</head>

<body>

<div class="container">

<button class="backBtn" onclick="history.back()">
← Back
</button>

<div class="header">

<div>

<h1 style="color:#0d6efd;">
    Gopes Pinnacle Academy
</h1>

<h2 id="pageTitle" style="margin-top:8px;"></h2>

<p style="margin-top:8px;color:#666;">
    Watch our free demo classes before enrolling.
</p>

<p id="videoCount"></p>

</div>





<input
type="text"
id="searchBox"
placeholder="Search by title or teacher..."
onkeyup="filterVideos()">

</div>

<div id="videoContainer"></div>

</div>

<script>

const API="https://academy-backend-eatl.onrender.com/api/demo-videos";

const params=new URLSearchParams(location.search);

const grade=params.get("grade");

const subject=params.get("subject");

document.getElementById("pageTitle").innerHTML=
`${grade} - ${subject}`;

let allVideos = [];

async function loadVideos(){

const res=await fetch(

`${API}/list?grade=${encodeURIComponent(grade)}&subject=${encodeURIComponent(subject)}`

);

const data=await res.json();

allVideos = data.data;

const container=document.getElementById("videoContainer");

container.innerHTML="";

document.getElementById("videoCount").innerHTML =
`Total Videos : ${allVideos.length}`;

if(allVideos.length===0){

container.innerHTML=`
<div class="noVideos">

<h2>No Demo Videos Found</h2>

<p>No demo videos are available for this subject yet. Please check back later.</p>

</div>
`;

return;

}

renderVideos(allVideos);



}

function copyLink(id){

const url=`https://www.gopespinnacle.com/demo.html?id=${id}`;

navigator.clipboard.writeText(url);

alert("Video URL Copied");

}

async function shareVideo(id){

const url=`https://www.gopespinnacle.com/demo.html?id=${id}`;

if(navigator.share){

try{

await navigator.share({

title:"Gopes Pinnacle Academy Demo Class",

text:"Watch our free demo class.",

url:url

});

}catch(err){}

}else{

navigator.clipboard.writeText(url);

alert("Demo Video URL Copied");

}

}


loadVideos();

function renderVideos(videos){

const container=document.getElementById("videoContainer");

container.innerHTML="";

videos.sort((a,b)=>
new Date(b.uploadDate)-new Date(a.uploadDate)
);

videos.forEach(video=>{

container.innerHTML+=`

<div class="videoCard">

<div class="videoTitle">

${video.title}

</div>

<div class="teacher">

Teacher : ${video.teacherName}

</div>

<div style="color:#666;margin-bottom:8px;">
Duration : ${video.duration || 0} mins
</div>

<div style="color:#666;margin-bottom:18px;">
Views : ${video.views || 0}
</div>

<div class="uploadDate">

Uploaded :
${new Date(video.uploadDate).toLocaleDateString("en-IN",{

day:"2-digit",

month:"short",

year:"numeric"

})}

</div>

<div class="actions">

<button
class="▶ Watch Demo"
onclick="window.location.href='demo.html?id=${video._id}'">

▶ Watch Demo

</button>

<button
class="copy"
onclick="copyLink('${video._id}')">

Copy Video URL

</button>

<button
class="preview"
onclick="shareVideo('${video._id}')">

Share

</button>





</div>

</div>

`;

});

}

function filterVideos(){

const keyword=document.getElementById("searchBox").value.toLowerCase();

const filtered=allVideos.filter(video=>

video.title.toLowerCase().includes(keyword) ||

video.teacherName.toLowerCase().includes(keyword)

);

renderVideos(filtered);

}


</script>

</body>

</html>
