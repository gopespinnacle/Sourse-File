<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Homework</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f4f6f9;

}

.header{

background:#1e3a5f;

color:white;

padding:18px 30px;

display:flex;

justify-content:space-between;

align-items:center;

}

.header h2{

font-size:28px;

}

.backBtn{

background:white;

color:#1e3a5f;

border:none;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

.container{

padding:25px;

}

table{

width:100%;

border-collapse:collapse;

background:white;

box-shadow:0 2px 10px rgba(0,0,0,.1);

}

th{

background:#1e3a5f;

color:white;

padding:14px;

border:1px solid #d8d8d8;

}

td{

padding:12px;

border:1px solid #d8d8d8;

vertical-align:top;

}

.status{

padding:5px 12px;

border-radius:20px;

font-size:13px;

font-weight:bold;

display:inline-block;

}

.pending{

background:#ffeeba;

color:#856404;

}

.submitted{

background:#cce5ff;

color:#004085;

}

.reviewed{

background:#d4edda;

color:#155724;

}

.actionBtn{

background:#1e3a5f;

color:white;

border:none;

padding:8px 14px;

border-radius:6px;

cursor:pointer;

}

.downloadBtn{

background:#28a745;

color:white;

padding:6px 10px;

border-radius:6px;

display:inline-block;

text-decoration:none;

margin-bottom:5px;

}

.videoBtn{

background:#dc3545;

color:white;

padding:6px 10px;

border-radius:6px;

display:inline-block;

text-decoration:none;

margin-bottom:5px;

}

/* =========================================================
   STUDENT HOMEWORK — PROFESSIONAL MOBILE UI
   DESKTOP UI REMAINS UNCHANGED
   ========================================================= */

@media (max-width: 768px) {

    body {
        background: #f4f7fb;
        overflow-x: hidden;
    }


    /* =====================================================
       MOBILE HEADER
       ===================================================== */

    .header {
        padding: 15px 16px;
        min-height: 64px;
        box-sizing: border-box;

        position: sticky;
        top: 0;

        z-index: 100;

        box-shadow:
            0 3px 12px rgba(0,0,0,.15);
    }


    .header h2 {
        font-size: 20px;
        margin: 0;
    }


    .backBtn {
        padding: 9px 13px;
        font-size: 13px;
        border-radius: 8px;
        white-space: nowrap;
    }


    /* =====================================================
       MAIN CONTAINER
       ===================================================== */

    .container {
        padding: 15px;
    }


    /* =====================================================
       FILTER CARD
       ===================================================== */

    .container > div:first-child {

        display: flex !important;

        flex-direction: column !important;

        align-items: stretch !important;

        gap: 14px !important;

        padding: 18px !important;

        margin-bottom: 18px !important;

        border-radius: 16px !important;

        box-shadow:
            0 5px 18px rgba(15,23,42,.08) !important;

        border: 1px solid #e5eaf0;

    }


    .container > div:first-child > div {

        width: 100%;

    }


    .container > div:first-child label {

        display: block;

        font-size: 14px;

        color: #334155;

        margin-bottom: 5px;

    }


    #filterDate,
    #filterSubject,
    #filterStatus {

        width: 100% !important;

        min-width: 0 !important;

        height: 46px;

        padding: 0 12px !important;

        border: 1px solid #d7dee8;

        border-radius: 10px;

        background: #fff;

        font-size: 15px;

        box-sizing: border-box;

    }


    /* =====================================================
       REMOVE NORMAL TABLE HEADER
       ===================================================== */

    table {
        width: 100%;

        background: transparent;

        box-shadow: none;

        border-collapse: separate;

        border-spacing: 0;
    }


    table thead {
        display: none;
    }


    /* =====================================================
       HOMEWORK CARD
       ===================================================== */

    table tbody {
        display: block;

        width: 100%;
    }


    table tr {

        display: block;

        width: 100%;

        background: white;

        margin-bottom: 16px;

        padding: 16px;

        border-radius: 16px;

        box-shadow:
            0 5px 18px rgba(15,23,42,.08);

        border: 1px solid #e5eaf0;

        box-sizing: border-box;
    }


    table td {

        display: block;

        width: 100%;

        padding: 9px 0;

        border: none;

        border-bottom: 1px solid #eef2f6;

        font-size: 14px;

        line-height: 1.6;

        vertical-align: middle;

        box-sizing: border-box;

        word-break: break-word;
    }


    table td:last-child {

        border-bottom: none;

    }


    /* =====================================================
       FIELD LABELS
       ===================================================== */

    table td::before {

        display: block;

        font-size: 12px;

        font-weight: 700;

        color: #64748b;

        text-transform: uppercase;

        letter-spacing: .4px;

        margin-bottom: 3px;

    }


    table td:nth-child(1)::before {
        content: "Date";
    }


    table td:nth-child(2)::before {
        content: "Subject";
    }


    table td:nth-child(3)::before {
        content: "Topic";
    }


    table td:nth-child(4)::before {
        content: "Topic Summary";
    }


    table td:nth-child(5)::before {
        content: "Homework";
    }


    table td:nth-child(6)::before {
        content: "Homework Document";
    }


    table td:nth-child(7)::before {
        content: "Class Materials";
    }


    table td:nth-child(8)::before {
        content: "Videos";
    }


    table td:nth-child(9)::before {
        content: "Status";
    }


    table td:nth-child(10)::before {
        content: "Upload Homework";
    }


    table td:nth-child(11)::before {
        content: "Reviewed Files";
    }


    /* =====================================================
       SUBJECT — MAKE PROMINENT
       ===================================================== */

    table td:nth-child(2) {

        font-size: 17px;

        font-weight: 700;

        color: #1e3a5f;

    }


    /* =====================================================
       DATE
       ===================================================== */

    table td:nth-child(1) {

        color: #64748b;

        font-size: 13px;

    }


    /* =====================================================
       DOWNLOAD / VIDEO BUTTONS
       ===================================================== */

    .downloadBtn,
    .videoBtn {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        min-height: 40px;

        padding: 8px 13px;

        margin: 4px 4px 4px 0;

        border-radius: 8px;

        font-size: 13px;

        font-weight: 600;

        box-sizing: border-box;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {

        margin-top: 3px;

        padding: 6px 13px;

        font-size: 12px;

        border-radius: 20px;

    }


    /* =====================================================
       UPLOAD SECTION
       ===================================================== */

    .homeworkFile {

        width: 100% !important;

        max-width: 100%;

        margin-bottom: 8px !important;

        font-size: 13px;

        box-sizing: border-box;

    }


    .actionBtn {

        width: 100%;

        min-height: 44px;

        padding: 10px 14px;

        border-radius: 9px;

        font-size: 14px;

        font-weight: 700;

    }


    /* =====================================================
       VIDEO
       ===================================================== */

    table video {

        width: 100% !important;

        max-width: 100%;

        height: auto;

        border-radius: 10px;

    }


    /* =====================================================
       EMPTY / LOADING MESSAGE
       ===================================================== */

    table td[colspan] {

        text-align: center;

        border: none;

        padding: 30px 10px;

    }


    table td[colspan]::before {

        display: none;

    }

}

</style>

</head>

<body>

<div class="header">

<h2>Student Homework</h2>

<button
class="backBtn"
onclick="window.location='student-dashboard.html'">

← Back

</button>

</div>

<div class="container">

<div style="
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
display:flex;
gap:25px;
align-items:center;
flex-wrap:wrap;
">

<div>

<label><b>Filter Date</b></label><br>

<input
type="date"
id="filterDate"
onchange="loadHomework()"
style="
padding:8px;
margin-top:5px;
">

</div>

<div>

<label><b>Subject</b></label><br>

<select
id="filterSubject"
onchange="loadHomework()"
style="
padding:8px;
margin-top:5px;
min-width:170px;
">

<option value="">All Subjects</option>

</select>

</div>

<div>

<label><b>Status</b></label><br>

<select
id="filterStatus"
onchange="loadHomework()"
style="
padding:8px;
margin-top:5px;
min-width:170px;
">

<option value="">All Status</option>

<option value="Pending">Pending</option>

<option value="Submitted">Submitted</option>

<option value="Reviewed">Reviewed</option>

</select>

</div>

</div>

<table>

<thead>

<tr>

<th>Date</th>

<th>Subject</th>

<th>Topic</th>

<th>Topic Summary</th>

<th>Homework</th>

<th>Homework Document</th>

<th>Class Materials</th>

<th>Videos</th>

<th>Status</th>

<th>Upload</th>

<th>Reviewed Files</th>

</tr>

</thead>

<tbody id="homeworkBody">

<tr>

<td colspan="11"
style="text-align:center;padding:40px;">

Loading Homework...

</td>

</tr>

</tbody>

</table>

</div>

<script>

const API =
"https://academy-backend-eatl.onrender.com/api";

const studentId =
localStorage.getItem("studentId");

console.log("STUDENT ID:", studentId);

const tbody =
document.getElementById("homeworkBody");

async function loadHomework(){

try{

const res = await fetch(

API + "/student-homework/" + studentId

);

const result = await res.json();

if(!result.success){

tbody.innerHTML = `

<tr>

<td colspan="11"
style="text-align:center;color:red;">

Unable to load homework.

</td>

</tr>

`;

return;

}

console.log(result.data);

let html = "";

const subjectSelect =
document.getElementById("filterSubject");

const currentSubject =
subjectSelect.value;

subjectSelect.innerHTML =

`<option value="">All Subjects</option>`;

const subjects = [];

result.data.forEach(hw=>{

    if(
!subjects.includes(hw.lessonPlan.subject)
){

subjects.push(hw.lessonPlan.subject);

}

const filterDate =
document.getElementById("filterDate").value;

const filterSubject =
document.getElementById("filterSubject").value;

const filterStatus =
document.getElementById("filterStatus").value;

const plan = hw.lessonPlan;

(plan.lessons || [])
.filter(lesson => lesson.topicId === hw.topicId)
.forEach(lesson=>{

if(
filterDate &&
plan.date !== filterDate
){
return;
}

if(
filterSubject &&
plan.subject !== filterSubject
){
return;
}

if(
filterStatus &&
hw.status !== filterStatus
){
return;
}

html += `

<tr>

<td>${plan.date}</td>

<td>${plan.subject}</td>

<td>${lesson.topic || "-"}</td>

<td>${lesson.topicSummary || "-"}</td>

<td>${lesson.homework || "-"}</td>

<td>

${

lesson.homeworkDocuments &&

lesson.homeworkDocuments.length>0

?

lesson.homeworkDocuments.map(file=>`

<a
href="${file.s3Url}"
target="_blank"
class="downloadBtn">

📄 ${file.fileName}

</a><br>

`).join("")

:

"-"

}

</td>

<td>

${(lesson.classMaterials || []).map(file=>`

<a
href="${file.s3Url}"
target="_blank"
class="downloadBtn">

📎 Download

</a>

`).join("")}

</td>

<td>

${(lesson.videoLinks || []).map(link=>`

<a
href="${link}"
target="_blank"
class="videoBtn">

▶ Watch

</a>

`).join("")}

</td>

<td>

<span class="status ${hw.status.toLowerCase()}">

${hw.status}

</span>

</td>

<td>

<input
type="file"
class="homeworkFile"
style="
width:150px;
margin-bottom:5px;
">

<br>

<button
class="actionBtn"
onclick="uploadHomework(
this,
'${plan._id}',
'${studentId}',
'${lesson.topicId}'
)"
>

Upload

</button>

</td>

<td>

${
hw.reviewFiles && hw.reviewFiles.length

?

hw.reviewFiles.map(file=>`

<a
href="${file.s3Url}"
target="_blank"
class="downloadBtn"
>

📄 ${file.fileName}

</a><br>

`).join("")

:

"-"

}

</td>

</tr>

`;

});

});

subjects.sort();

subjects.forEach(subject=>{

subjectSelect.innerHTML +=

`<option value="${subject}">

${subject}

</option>`;

});

subjectSelect.value =
currentSubject;

tbody.innerHTML = html;

}catch(err){

console.log(err);

tbody.innerHTML = `

<tr>

<td colspan="11"
style="text-align:center;color:red;">

Server Error

</td>

</tr>

`;

}

}

loadHomework();

async function uploadHomework(
button,
lessonPlanId,
studentId,
topicId
){

    const td = button.parentElement;

    const input = td.querySelector(".homeworkFile");

    if(!input.files.length){

        alert("Please choose a file.");

        return;

    }

    const fd = new FormData();

    fd.append("lessonPlanId", lessonPlanId);

fd.append("studentId", studentId);

fd.append("topicId", topicId);

    fd.append("files", input.files[0]);

    const res = await fetch(

        "https://academy-backend-eatl.onrender.com/api/student-upload-homework",

        {

            method:"POST",

            body:fd

        }

    );

    const data = await res.json();

    if(data.success){

        alert("Homework uploaded successfully.");

        loadHomework();

    }else{

        alert(data.message);

    }

}

</script>

</body>

</html>
