<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Assessment</title>

<style>

body{

font-family:Arial;

background:#f5f7fb;

margin:0;

padding:30px;

}

.container{

max-width:900px;

margin:auto;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 0 15px rgba(0,0,0,.1);

}

h2{

margin-top:0;

color:#2c3e50;

}

label{

display:block;

margin-top:18px;

font-weight:bold;

}

select,
input[type=text],
input[type=file]{

width:100%;

padding:10px;

margin-top:6px;

border:1px solid #ccc;

border-radius:6px;

box-sizing:border-box;

}

button{

margin-top:25px;

background:#0d6efd;

color:white;

border:none;

padding:12px 25px;

border-radius:6px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#0b5ed7;

}

#status{

margin-top:20px;

font-weight:bold;

color:green;

}

</style>

</head>

<body>

<div class="container">

<h2>AI Assessment Generator</h2>

<label>Class</label>

<select id="className">

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>

</select>

<label>Subject</label>

<input
type="text"
id="subject"
placeholder="Science">

<label>Chapter</label>

<input
type="text"
id="chapter"
placeholder="Chapter 1">

<label>Question Paper Level</label>

<select id="questionLevel">

    <option value="Easy">Easy</option>

    <option value="Medium" selected>
        Medium
    </option>

    <option value="Hard">Hard</option>

</select>

<label>Total Marks</label>

<select id="totalMarks">

    <option value="10">10 Marks</option>

    <option value="25" selected>25 Marks</option>

    <option value="50">50 Marks</option>

    <option value="80">80 Marks</option>

    <option value="100">100 Marks</option>

</select>

<label>Duration</label>

<input
    type="text"
    id="duration"
    value="40 Minutes"
    readonly
    style="background:#f1f3f5;"
>

<label>Question Mode</label>

<select id="questionMode">

    <option value="Direct">Direct Question</option>

    <option value="Indirect">Indirect Question</option>

    <option value="Direct + Indirect" selected>
        Direct + Indirect
    </option>

</select>

<label>Question Type</label>

<select id="questionTypes" multiple size="8">

    <option value="MCQ">MCQ</option>

    <option value="Fill in the Blanks">
        Fill in the Blanks
    </option>

    <option value="True / False">
        True / False
    </option>

    <option value="Match the Following">
        Match the Following
    </option>

    <option value="One Word Answer">
        One Word Answer
    </option>

    <option value="Very Short Answer">
        Very Short Answer
    </option>

    <option value="Short Answer">
        Short Answer
    </option>

    <option value="Long Answer">
        Long Answer
    </option>

    <option value="Problem Solving">
        Problem Solving
    </option>

    <option value="Word Problems">
        Word Problems
    </option>

    <option value="Case Study">
        Case Study
    </option>

    <option value="Competency-Based">
        Competency-Based
    </option>

    <option value="Assertion & Reason">
        Assertion & Reason
    </option>

    <option value="Statement-Based">
        Statement-Based
    </option>

    <option value="Reasoning / Logical Thinking">
        Reasoning / Logical Thinking
    </option>

    <option value="Odd One Out">
        Odd One Out
    </option>

    <option value="Pattern-Based">
        Pattern-Based
    </option>

    <option value="Sequence Questions">
        Sequence Questions
    </option>

    <option value="Data Interpretation">
        Data Interpretation
    </option>

    <option value="Diagram-Based">
        Diagram-Based
    </option>

    <option value="Source-Based">Source-Based</option>

    <option value="Error Identification">
        Error Identification
    </option>

    <option value="Correct the Solution">
        Correct the Solution
    </option>

    <option value="Compare & Explain">
        Compare & Explain
    </option>

    <option value="Justify Your Answer">
        Justify Your Answer
    </option>

    <option value="Prove / Show That">
        Prove / Show That
    </option>

    <option value="Construction-Based">
        Construction-Based
    </option>

    <option value="Practical / Application-Based">
        Practical / Application-Based
    </option>

    <option value="Open-Ended">
        Open-Ended
    </option>

    <option value="HOTS">
        Higher-Order Thinking (HOTS)
    </option>

</select>

<small style="
    display:block;
    margin-top:6px;
    color:#666;
">
    Hold Ctrl (Windows) or Command (Mac) to select multiple types.
</small>

<label>Select PDF</label>

<input
type="file"
id="pdfFile"
accept=".pdf">

<button
id="uploadBtn">

Generate Question Bank

</button>

<div id="selectionSummary" style="
    margin-top:20px;
    padding:15px;
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:8px;
    display:none;
">

    <strong>Question Paper Configuration</strong>

    <div id="selectionSummaryText"
         style="margin-top:8px; line-height:1.7;">
    </div>

</div>

<div id="status"></div>

<hr style="margin:30px 0;">

<h3>Generated Question Bank</h3>

<div id="questionBankContainer">

    <p>No Question Bank Generated Yet.</p>

</div>

</div>

<script>

    const token = sessionStorage.getItem("token");

if (!token) {

    alert("Please login first");

    window.location.href = "teacher-login.html";

}

document.getElementById("uploadBtn").onclick = async () => {

    const questionLevel =
    document.getElementById("questionLevel").value;

const totalMarks =
    document.getElementById("totalMarks").value;

const questionMode =
    document.getElementById("questionMode").value;

const selectedQuestionTypes =
    Array.from(
        document.getElementById("questionTypes").selectedOptions
    ).map(option => option.value);

const summary =
    document.getElementById("selectionSummary");

const summaryText =
    document.getElementById("selectionSummaryText");

summary.style.display = "block";

const durationMap = {
    "10": "20 Minutes",
    "25": "40 Minutes",
    "50": "60 Minutes",
    "80": "90 Minutes",
    "100": "120 Minutes"
};

const duration =
    durationMap[totalMarks] || "40 Minutes";

document.getElementById("duration").value =
    duration;

summaryText.innerHTML = `
    <b>Level:</b> ${questionLevel}<br>
    <b>Total Marks:</b> ${totalMarks}<br>
    <b>Mode:</b> ${questionMode}<br>
    <b>Question Types:</b>
    ${selectedQuestionTypes.length
        ? selectedQuestionTypes.join(", ")
        : "None selected"}
`;

    const status = document.getElementById("status");

    status.style.color = "blue";
    status.innerHTML = "Uploading...";

    const file =
        document.getElementById("pdfFile").files[0];

    if (!file) {

        status.style.color = "red";
        status.innerHTML = "Please select a PDF.";

        return;

    }

    const formData = new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "className",
        document.getElementById("className").value
    );

    formData.append(
        "subject",
        document.getElementById("subject").value
    );

    formData.append(
        "chapter",
        document.getElementById("chapter").value
    );

    formData.append(
    "questionLevel",
    document.getElementById("questionLevel").value
);

formData.append(
    "totalMarks",
    document.getElementById("totalMarks").value
);

formData.append(
    "questionMode",
    document.getElementById("questionMode").value
);

formData.append(
    "duration",
    duration
);


    if (selectedQuestionTypes.length === 0) {

    status.style.color = "red";

    status.innerHTML =
        "Please select at least one Question Type.";

    return;

}

formData.append(
    "questionTypes",
    JSON.stringify(selectedQuestionTypes)
);

    /*
      Replace this with the logged-in teacher ID later.
    */

    const teacherId = sessionStorage.getItem("teacherId");

formData.append(
    "teacherId",
    teacherId
);

    formData.append(
        "uploadMode",
        "newVersion"
    );

    try {

        const response = await fetch(

            "https://academy-backend-eatl.onrender.com/api/ai-assessment/upload-chapter",

            {

                method: "POST",

                body: formData

            }

        );

        const result = await response.json();

        console.log(result);

        if (result.success) {

    status.style.color = "green";

    status.innerHTML = `
✅ Question Bank Generated Successfully
<br><br>
<button id="openQuestionBankBtn">
📚 Open Question Bank
</button>
`;
    

document.getElementById(
    "openQuestionBankBtn"
).onclick = function(){

    sessionStorage.setItem(
    "currentClass",
    document.getElementById("className").value
);

sessionStorage.setItem(
    "currentSubject",
    document.getElementById("subject").value
);

sessionStorage.setItem(
    "currentChapter",
    document.getElementById("chapter").value
);

console.log("Saved Class:",
    sessionStorage.getItem("currentClass"));

console.log("Saved Subject:",
    sessionStorage.getItem("currentSubject"));

console.log("Saved Chapter:",
    sessionStorage.getItem("currentChapter"));

window.location.href =
"teacher-question-bank.html";

};

sessionStorage.setItem(
    "currentQuestionBankId",
    result.questionBank._id
);

    const container =
        document.getElementById("questionBankContainer");

    container.innerHTML = "";

    if (result.questionBank &&
        result.questionBank.questions &&
        result.questionBank.questions.length > 0) {

        result.questionBank.questions.forEach((q, index) => {

            container.innerHTML += `

                <div style="
                    border:1px solid #ddd;
                    border-radius:8px;
                    padding:15px;
                    margin-bottom:15px;
                    background:#fafafa;
                ">

                    <strong>Q${index + 1}</strong><br><br>

                    ${q.question}<br><br>

                    <b>Answer:</b> ${q.answer}

                </div>

            `;

        });

    } else {

        container.innerHTML =
            "<p>No questions returned by the server.</p>";

    }

}

        else {

            status.style.color = "red";

            status.innerHTML = result.message;

        }

    }

    catch (err) {

        console.log(err);

        status.style.color = "red";

        status.innerHTML = err.message;

    }

};

</script>

</body>

</html>
