
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinnacle Star Championship Registrations</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            margin: 0;
        }

        .main-content {
            padding: 25px;
        }

        .registration-card {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .registration-card h3 {
            color: #172d63;
        }

        .status {
            font-weight: bold;
        }

        .verify-btn {
            background: #16a34a;
            color: white;
        }

        .reject-btn {
            background: #dc2626;
            color: white;
        }

        .action-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 6px 5px 6px 0;
            font-weight: bold;
        }

        .proof-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
        }

        @media(max-width:600px) {
            .main-content {
                padding: 12px;
            }
        }
    </style>
</head>

<body class="dashboard-page">

    <div id="sidebar-container"></div>

    <div class="main-content">

        <h1>
            <i class="fa fa-trophy"></i>
            Pinnacle Star Championship 2026
        </h1>

        <h2>Participant Registrations</h2>

        <div id="registrationList">
            Loading registrations...
        </div>

    </div>


<script>

// Load Founder Sidebar
fetch("sidebar.html")
    .then(response => response.text())
    .then(html => {
        document.getElementById("sidebar-container").innerHTML = html;
    });


// Load Championship Registrations
async function loadChampionshipRegistrations() {

    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "founder-login.html";
        return;
    }

    const container = document.getElementById("registrationList");

    container.textContent = "Loading registrations...";

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/founder/registrations",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            container.textContent =
                data.message || "Unable to load registrations.";
            return;
        }

        const registrations = data.registrations || [];

        container.innerHTML = "";

        if (registrations.length === 0) {
            container.textContent = "No championship registrations found.";
            return;
        }

        registrations.forEach(reg => {

            const card = document.createElement("div");
            card.className = "registration-card";

            const title = document.createElement("h3");
            title.textContent = reg.studentName || "Unnamed Participant";
            card.appendChild(title);

            const details = [
                ["Parent Name", reg.parentName],
                ["Parent Phone", reg.parentPhone],
                ["Parent Email", reg.parentEmail],
                ["Grade", reg.grade],
                ["School", reg.schoolName],
                ["Competition Fee", "₹" + (reg.feePerCompetition || 199)],
                ["Total Amount", "₹" + (reg.totalAmount || 0)],
                ["Payment Method", reg.payment?.method],
                ["Transaction Reference", reg.payment?.transactionReference],
                ["Payment Status", reg.payment?.status],
                ["Registration Status", reg.registrationStatus],
                ["Participant ID", reg.participantId]
            ];

            details.forEach(([label, value]) => {

                const p = document.createElement("p");
                const strong = document.createElement("strong");

                strong.textContent = label + ": ";

                p.appendChild(strong);
                p.appendChild(document.createTextNode(value || "-"));

                card.appendChild(p);

            });

            const competitionHeading = document.createElement("h4");
            competitionHeading.textContent = "Selected Competitions";
            card.appendChild(competitionHeading);

            (reg.competitions || []).forEach(item => {

                const p = document.createElement("p");

                p.textContent =
                    (item.competition || "-") +
                    " — Category: " +
                    (item.category || "-");

                card.appendChild(p);

            });

            
if (reg.payment?.paymentProofUrl) {

    const proofLink = document.createElement("a");

    proofLink.href = reg.payment.paymentProofUrl;
    proofLink.target = "_blank";
    proofLink.rel = "noopener noreferrer";
    proofLink.className = "proof-btn";
    proofLink.textContent = "View Payment Proof";

    card.appendChild(proofLink);

}


// PAYMENT VERIFICATION BUTTONS
if (
    reg.payment?.status === "Pending" &&
    reg.registrationStatus === "Payment Pending"
) {

    const actionDiv = document.createElement("div");

    actionDiv.style.marginTop = "20px";

    const verifyButton = document.createElement("button");

    verifyButton.className = "action-btn verify-btn";
    verifyButton.textContent = "Verify Payment";

    verifyButton.onclick = function () {
        verifyChampionshipPayment(reg._id, card);
    };


    const rejectButton = document.createElement("button");

    rejectButton.className = "action-btn reject-btn";
    rejectButton.textContent = "Reject Payment";

    rejectButton.onclick = function () {
        rejectChampionshipPayment(reg._id);
    };


    actionDiv.appendChild(verifyButton);
    actionDiv.appendChild(rejectButton);

    card.appendChild(actionDiv);

}

container.appendChild(card);


        });

    } catch (error) {

        console.error("Championship Registration Error:", error);

        container.textContent =
            "Server connection failed. Please try again.";

    }

}


// VERIFY CHAMPIONSHIP PAYMENT
async function verifyChampionshipPayment(registrationId, card) {

    const confirmed = confirm(
        "Have you checked the payment proof and confirmed the payment?"
    );

    if (!confirmed) return;

    const token = localStorage.getItem("token");

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/founder/" +
            registrationId + "/verify",
            {
                method: "PUT",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            alert(data.message || "Payment verification failed.");
            return;
        }

        alert(
            "PAYMENT VERIFIED SUCCESSFULLY!\n\n" +
            "Participant ID: " + data.participantId + "\n" +
            "Login ID: " + data.loginId + "\n" +
            "Temporary Password: " + data.temporaryPassword +
            "\n\nPlease save these credentials securely."
        );

        await loadChampionshipRegistrations();

    } catch (error) {

        console.error("Verification Error:", error);
        alert("Server error during payment verification.");

    }

}


// REJECT CHAMPIONSHIP PAYMENT
async function rejectChampionshipPayment(registrationId) {

    const reason = prompt(
        "Enter the reason for rejecting this payment:"
    );

    if (reason === null) return;

    if (!reason.trim()) {
        alert("Please enter a rejection reason.");
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to reject this registration?"
    );

    if (!confirmed) return;

    const token = localStorage.getItem("token");

    try {

        const response = await fetch(
            "https://academy-backend-eatl.onrender.com/api/championship/founder/" +
            registrationId + "/reject",
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    reason: reason.trim()
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            alert(data.message || "Payment rejection failed.");
            return;
        }

        alert("Registration rejected successfully.");

        await loadChampionshipRegistrations();

    } catch (error) {

        console.error("Rejection Error:", error);
        alert("Server error during payment rejection.");

    }

}


loadChampionshipRegistrations();

</script>
</body>
</html>


</body>
</html>
