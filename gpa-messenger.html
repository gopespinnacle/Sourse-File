<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GPA Messenger</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f1f5f9;

    overflow: hidden;
}


/* =========================================================
   MAIN APP
   ========================================================= */

.messenger-app {

    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;

    background: white;

}


/* =========================================================
   LEFT CHAT LIST
   ========================================================= */

.chat-list {

    width: 360px;

    min-width: 360px;

    height: 100%;

    border-right:
        1px solid #e2e8f0;

    background: #ffffff;

    display: flex;

    flex-direction: column;

}


/* HEADER */

.chat-list-header {

    height: 72px;

    background: #0f172a;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

}


.brand {

    display: flex;

    align-items: center;

    gap: 10px;

}


.brand-icon {

    width: 40px;

    height: 40px;

    border-radius: 12px;

    background: #2563eb;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;

}


.brand-title {

    font-size: 18px;

    font-weight: 700;

}


.back-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 20px;

    cursor: pointer;

}


/* SEARCH */

.search-box {

    padding: 12px;

    border-bottom:
        1px solid #e2e8f0;

}


.search-box input {

    width: 100%;

    height: 42px;

    border: none;

    outline: none;

    border-radius: 10px;

    background: #f1f5f9;

    padding: 0 14px;

    font-size: 14px;

}


/* CONTACT LIST */

.contact-list {

    flex: 1;

    overflow-y: auto;

}


.contact-item {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px;

    cursor: pointer;

    border-bottom:
        1px solid #f1f5f9;

}


.contact-item:hover {

    background: #f8fafc;

}


.contact-item.active {

    background: #eff6ff;

}


.avatar {

    width: 46px;

    height: 46px;

    min-width: 46px;

    border-radius: 50%;

    background: #dbeafe;

    color: #1d4ed8;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 700;

    font-size: 17px;

}


.contact-info {

    flex: 1;

    min-width: 0;

}


.contact-name {

    font-weight: 600;

    color: #172033;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.contact-role {

    font-size: 12px;

    color: #64748b;

    margin-top: 3px;

}


.unread-badge {

    min-width: 22px;

    height: 22px;

    padding: 0 6px;

    border-radius: 20px;

    background: #2563eb;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;

    font-weight: 700;

}

/* =========================================================
   FOUNDER FOLDERS
   ========================================================= */

.founder-section {

    border-bottom:
        1px solid #e2e8f0;

}


.founder-section-header {

    min-height: 52px;

    padding:
        0 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    cursor: pointer;

    background: #f8fafc;

    color: #172033;

    font-weight: 700;

    font-size: 14px;

}


.founder-section-header:hover {

    background: #eff6ff;

}


.founder-section-header > div {

    display: flex;

    align-items: center;

    gap: 9px;

}


.founder-section-header
.fa-folder {

    color: #f59e0b;

}


.founder-count {

    min-width: 22px;

    height: 20px;

    padding: 0 6px;

    border-radius: 10px;

    background: #e2e8f0;

    color: #475569;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    font-size: 11px;

}


.founder-section-content {

    display: block;

}


.founder-person-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        10px 14px;

    border-bottom:
        1px solid #f1f5f9;

    cursor: pointer;

}


.founder-person-item:hover {

    background: #f8fafc;

}


.founder-person-item
.avatar {

    width: 38px;

    height: 38px;

    min-width: 38px;

    font-size: 14px;

}


.founder-person-item
.contact-role {

    font-size: 11px;

    color: #64748b;

}


.founder-conversation-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        12px 14px;

    cursor: pointer;

    border-bottom:
        1px solid #f1f5f9;

}


.founder-conversation-item:hover {

    background: #f8fafc;

}


.founder-conversation-item.active {

    background: #eff6ff;

}


.founder-conversation-item
.avatar {

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 15px;

}


.founder-empty {

    padding:
        18px 14px;

    text-align: center;

    color: #94a3b8;

    font-size: 12px;

}


/* =========================================================
   CHAT AREA
   ========================================================= */

.chat-area {

    flex: 1;

    height: 100%;
    min-height: 0;

    display: flex;

    flex-direction: column;

    background: #f8fafc;

}


.chat-header {

    height: 72px;

    background: white;

    border-bottom:
        1px solid #e2e8f0;

    display: flex;

    align-items: center;

    padding: 0 20px;

    gap: 12px;

}


.mobile-back {

    display: none;

    border: none;

    background: transparent;

    font-size: 20px;

    cursor: pointer;

}


.selected-avatar {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    background: #dbeafe;

    color: #1d4ed8;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 700;

}


.selected-info {

    flex: 1;

}


.selected-name {

    font-size: 16px;

    font-weight: 700;

    color: #172033;

}


.selected-role {

    font-size: 12px;

    color: #64748b;

    margin-top: 2px;

}


/* =========================================================
   MESSAGE AREA
   ========================================================= */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.empty-chat {

    margin: auto;

    text-align: center;

    color: #64748b;

}


.empty-chat i {

    font-size: 46px;

    margin-bottom: 12px;

    color: #94a3b8;

}


/* MESSAGE */

.message-row {

    display: flex;

}

.message-sender-name {

    font-size: 11px;

    font-weight: 700;

    color: #64748b;

    margin-bottom: 4px;

    padding: 0 4px;

}


.message-row.mine {

    justify-content: flex-end;

}


.message-row.mine
.message-sender-name {

    text-align: right;

}


.message-row.theirs
.message-sender-name {

    text-align: left;

}


.message-row.mine {

    justify-content: flex-end;

}


.message-bubble {

    width: fit-content;

    max-width: 100%;

    padding: 10px 13px;

    border-radius: 14px;

    font-size: 14px;

    line-height: 1.45;

    word-wrap: break-word;

    overflow-wrap: break-word;

}

/* =========================================================
   MESSAGE WRAPPER
   ========================================================= */

.message-row > div {

    width: max-content;

    max-width: 70%;

    min-width: 0;

}


.message-row.mine > div {

    margin-left: auto;

}


.message-row.theirs > div {

    margin-right: auto;

}


/* Keep the sender name on one line */

.message-sender-name {

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    max-width: 100%;

}


/* Make sure the bubble uses the wrapper width */

.message-row .message-bubble {

    max-width: 100%;

}


.message-row.mine
.message-bubble {

    background: #2563eb;

    color: white;

    border-bottom-right-radius: 4px;

}


.message-row.theirs
.message-bubble {

    background: white;

    color: #172033;

    border:
        1px solid #e2e8f0;

    border-bottom-left-radius: 4px;

}


.message-time {

    display: block;

    font-size: 10px;

    margin-top: 4px;

    opacity: .65;

    text-align: right;

}


/* =========================================================
   TYPING
   ========================================================= */

.typing-indicator {

    min-height: 22px;

    padding:
        0 20px
        5px;

    font-size: 12px;

    color: #64748b;

}


/* =========================================================
   MESSAGE INPUT
   ========================================================= */

.message-input-area {

    background: white;

    border-top:
        1px solid #e2e8f0;

    padding: 12px;

    padding-bottom:
        max(12px, env(safe-area-inset-bottom));

    display: flex;

    gap: 10px;

    flex-shrink: 0;

}


.message-input {

    flex: 1;

    min-width: 0;

    height: 44px;

    border:
        1px solid #dbe2ea;

    border-radius: 22px;

    outline: none;

    padding:
        0 16px;

    font-size: 14px;

}


.send-button {

    width: 44px;

    height: 44px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    cursor: pointer;

    font-size: 16px;

}


.send-button:hover {

    background: #1d4ed8;

}


/* =========================================================
   FOUNDER ACTION AREA
   ========================================================= */

.founder-actions {

    display: none;

    gap: 8px;

}


.founder-actions button {

    border: none;

    background: #f1f5f9;

    width: 38px;

    height: 38px;

    border-radius: 50%;

    cursor: pointer;

}


body.founder-mode
.founder-actions {

    display: flex;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {
        .messenger-app {
        height: 100vh;
        height: 100dvh;
    }

    .chat-area {
        height: 100%;
        min-height: 0;
    }

    .messages {
        min-height: 0;
    }

    .message-input-area {
        flex-shrink: 0;
    }

    .chat-list {

        width: 100%;

        min-width: 100%;

        border-right: none;

    }


    .chat-area {

        display: none;

        width: 100%;

    }


    body.mobile-chat-open
    .chat-list {

        display: none;

    }


    body.mobile-chat-open
    .chat-area {

        display: flex;

    }


    .mobile-back {

        display: block;

    }


    .message-bubble {

        max-width: 82%;

    }


    .chat-list-header {

        height: 64px;

    }


    .chat-header {

        height: 64px;

        padding: 0 12px;

    }


    .messages {

        padding: 14px;

    }

}

</style>

</head>


<body>

<div class="messenger-app">


    <!-- =====================================================
         CONTACT LIST
         ===================================================== -->

    <div class="chat-list">

        <div class="chat-list-header">

            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-comments"></i>

                </div>

                <div class="brand-title">

                    GPA Messenger

                </div>

            </div>


            <button
                class="back-button"
                onclick="goBack()">

                <i class="fa-solid fa-arrow-left"></i>

            </button>

        </div>


        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="Search..."
                oninput="filterContacts()"
            >

        </div>


        <div
            id="contactList"
            class="contact-list">

            <div
                style="
                padding:30px;
                text-align:center;
                color:#64748b;
                ">

                Loading...

            </div>

        </div>

    </div>


    <!-- =====================================================
         CHAT
         ===================================================== -->

    <div class="chat-area">


        <div class="chat-header">


            <button
                class="mobile-back"
                onclick="closeMobileChat()">

                <i class="fa-solid fa-arrow-left"></i>

            </button>


            <div
                id="selectedAvatar"
                class="selected-avatar">

                ?

            </div>


            <div class="selected-info">

                <div
                    id="selectedName"
                    class="selected-name">

                    Select a conversation

                </div>

                <div
                    id="selectedRole"
                    class="selected-role">

                </div>

            </div>


            <!-- Founder-only actions -->
            <div class="founder-actions">

                <button
                    title="Voice Call"
                    onclick="founderVoiceCall()">

                    <i class="fa-solid fa-phone"></i>

                </button>


                <button
                    title="Attachment"
                    onclick="founderAttachment()">

                    <i class="fa-solid fa-paperclip"></i>

                </button>


                <button
                    title="Image / File"
                    onclick="founderFile()">

                    <i class="fa-solid fa-image"></i>

                </button>

            </div>


        </div>


        <div
            id="messages"
            class="messages">

            <div class="empty-chat">

                <i class="fa-solid fa-comments"></i>

                <div>

                    Select a contact to start messaging.

                </div>

            </div>

        </div>


        <div
            id="typingIndicator"
            class="typing-indicator">

        </div>


        <div class="message-input-area">

            <input
                id="messageInput"
                class="message-input"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
            >


            <button
                id="sendButton"
                class="send-button"
                onclick="sendMessage()">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     SOCKET.IO
     ========================================================= -->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_BASE =
    "https://academy-backend-eatl.onrender.com";


/* =========================================================
   AUTH
   ========================================================= */

const token =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");


let role = null;

/* =========================================================
   AUTH CHECK
   ========================================================= */

if (!token) {

    window.location.href =
        "index.html";

}


/* =========================================================
   STATE
   ========================================================= */

let socket = null;

let currentUser = null;

let contacts = [];

let conversations = [];

let selectedContact = null;

let selectedConversation = null;

let typingTimeout = null;


/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        if (role === "founder") {

            document.body.classList.add(
                "founder-mode"
            );

        }

        const userLoaded =
            await loadCurrentUser();

        if (!userLoaded) {

            return;

        }

        connectMessenger();

        loadContacts();

        loadConversations();

    }
);


/* =========================================================
   SOCKET CONNECTION
   ========================================================= */

function connectMessenger() {

    socket =
        io(
            API_BASE + "/messenger",
            {

                auth: {
                    token: token
                },

                transports: [
                    "websocket"
                ]

            }
        );


    socket.on(
        "connect",
        () => {

            console.log(
                "GPA Messenger connected:",
                socket.id
            );

        }
    );


    socket.on(
        "messengerAuthenticated",
        data => {

            console.log(
                "Messenger authenticated",
                data
            );

        }
    );


    socket.on(
        "messengerError",
        data => {

            console.error(
                "Messenger error:",
                data
            );

        }
    );


    socket.on(
        "newMessengerMessage",
        message => {

            handleIncomingMessage(
                message
            );

        }
    );


    socket.on(
        "messengerNewMessageNotification",
        data => {

            handleNotification(
                data
            );

        }
    );


    socket.on(
        "messengerConversationRead",
        data => {

            console.log(
                "Conversation read:",
                data
            );

        }
    );


    socket.on(
        "messengerTyping",
        data => {

            if (
                selectedConversation &&
                String(
                    data.conversationId
                ) ===
                String(
                    selectedConversation._id
                )
            ) {

                if (
                    data.isTyping
                ) {

                    document.getElementById(
                        "typingIndicator"
                    ).innerText =
                        data.userName +
                        " is typing...";

                }
                else {

                    document.getElementById(
                        "typingIndicator"
                    ).innerText = "";

                }

            }

        }
    );

}

/* =========================================================
   LOAD CURRENT USER
   ========================================================= */

async function loadCurrentUser() {

    try {

        const res =
            await fetch(
                API_BASE +
                "/api/messenger/me",
                {

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            throw new Error(
                data.message ||
                "Unable to identify logged-in user."
            );

        }


        currentUser =
    data.user;


// Use the authenticated user's actual role
role =
    currentUser.role;


// Founder-only UI mode
if (role === "founder") {

    document.body.classList.add(
        "founder-mode"
    );

}


console.log(
    "GPA Messenger current user:",
    currentUser
);

console.log(
    "GPA Messenger role:",
    role
);


        return true;

    }
    catch (error) {

        console.error(
            "CURRENT USER ERROR:",
            error
        );


        alert(
            "Unable to identify your Messenger account. Please login again."
        );


        return false;

    }

}


/* =========================================================
   LOAD CONTACTS
   ========================================================= */

async function loadContacts() {

    try {

        const res =
            await fetch(
                API_BASE +
                "/api/messenger/contacts",
                {

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            throw new Error(
                data.message ||
                "Unable to load contacts"
            );

        }


        contacts =
            Array.isArray(
                data.contacts
            )
                ? data.contacts
                : [];


        renderContacts();

    }
    catch (error) {

        console.error(
            "CONTACT ERROR:",
            error
        );


        document.getElementById(
            "contactList"
        ).innerHTML = `

            <div
                style="
                padding:30px;
                text-align:center;
                color:#dc2626;
                ">

                Unable to load contacts.

            </div>

        `;

    }

}


/* =========================================================
   LOAD CONVERSATIONS
   ========================================================= */

async function loadConversations() {

    try {

        const res =
            await fetch(
                API_BASE +
                "/api/messenger/conversations",
                {

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            throw new Error(
                data.message ||
                "Unable to load conversations"
            );

        }


        conversations =
            Array.isArray(
                data.conversations
            )
                ? data.conversations
                : [];


        renderContacts();

    }
    catch (error) {

        console.error(
            "CONVERSATION ERROR:",
            error
        );

    }

}


/* =========================================================
   RENDER CONTACTS
   ========================================================= */

function renderContacts(
    list = contacts
) {

    // Founder sees existing conversations,
    // not individual contacts.
    if (role === "founder") {

        renderFounderConversations();

        return;

    }

        // =====================================================
    // ADMIN
    // SHOW STUDENTS AND TEACHERS IN SEPARATE FOLDERS
    // =====================================================

    if (role === "admin") {

        renderAdminContacts();

        return;

    }


    // =====================================================
    // TEACHER / STUDENT
    // SHOW ADMIN ONLY WHEN AN ADMIN CONVERSATION EXISTS
    // =====================================================

    let displayContacts = [
        ...list
    ];


    if (
        role === "teacher" ||
        role === "student"
    ) {

        conversations.forEach(
            conversation => {

                const adminParticipant =
                    conversation.participants?.find(
                        participant =>
                            participant.role === "admin"
                    );


                if (!adminParticipant) {

                    return;

                }


                // Make sure this Admin is not already
                // present in the contact list.

                const alreadyExists =
                    displayContacts.some(
                        contact =>
                            String(
                                contact._id
                            ) ===
                            String(
                                adminParticipant._id
                            )
                    );


                if (!alreadyExists) {

                    displayContacts.push(
                        adminParticipant
                    );

                }

            }
        );

    }


    const container =
        document.getElementById(
            "contactList"
        );


    if (!displayContacts.length) {

        container.innerHTML = `

            <div
                style="
                padding:30px;
                text-align:center;
                color:#64748b;
                ">

                No contacts available.

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    displayContacts.forEach(
        contact => {

            const conversation =
                conversations.find(
                    c =>
                        c.participants?.some(
                            p =>
                                String(
                                    p._id
                                ) ===
                                String(
                                    contact._id
                                )
                        )
                );


            const unread =
                getUnreadCount(
                    conversation
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "contact-item";


            if (
                selectedContact &&
                String(
                    selectedContact._id
                ) ===
                String(
                    contact._id
                )
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.onclick =
                () =>
                    openContact(
                        contact
                    );


            item.innerHTML = `

                <div class="avatar">

                    ${getInitial(
                        contact.name
                    )}

                </div>


                <div class="contact-info">

                    <div class="contact-name">

                        ${escapeHtml(
                            contact.name
                        )}

                    </div>


                    <div class="contact-role">

                        ${formatRole(
                            contact.role
                        )}

                    </div>

                </div>


                ${
                    unread > 0
                        ? `
                        <div class="unread-badge">

                            ${unread}

                        </div>
                        `
                        : ""
                }

            `;


            container.appendChild(
                item
            );

        }
    );

}

// =========================================================
// RENDER ADMIN CONTACTS
// =========================================================

// =========================================================
// TOGGLE ADMIN FOLDER
// =========================================================

function toggleAdminSection(
    sectionId
) {

    const section =
        document.getElementById(
            sectionId
        );


    if (!section) {

        return;

    }


    const isOpen =
        section.style.display !==
        "none";


    section.style.display =
        isOpen
            ? "none"
            : "block";


    const iconId =
        sectionId ===
        "adminStudentsSection"

            ? "adminStudentsSectionIcon"

            : "adminTeachersSectionIcon";


    const icon =
        document.getElementById(
            iconId
        );


    if (icon) {

        icon.className =
            isOpen
                ? "fa-solid fa-chevron-right"
                : "fa-solid fa-chevron-down";

    }

}

// =========================================================
// OPEN ADMIN CONTACT

function openContactById(
    userId
) {

    const contact =
        contacts.find(
            item =>
                String(
                    item._id
                ) ===
                String(
                    userId
                )
        );


    if (!contact) {

        return;

    }


    openContact(
        contact
    );

}

function openFounderConversationById(

) {

    const conversation =
        conversations.find(
            item =>
                String(
                    item._id
                ) ===
                String(
                    conversationId

        );


    if (!conversation) {

        return;

    }


    openFounderConversation(
        conversation
    );

}

// =========================================================
// OPEN FOUNDER PERSONAL CONVERSATION
// =========================================================

async function openFounderPersonConversation(
    personId
) {

    try {

        // -------------------------------------------------
        // FIND THE SELECTED PERSON
        // -------------------------------------------------

        const person =
            contacts.find(
                contact =>
                    String(
                        contact._id
                    ) ===
                    String(
                        personId
                    )
            );


        if (!person) {

            alert(
                "Unable to find the selected person."
            );

            return;

        }


        // -------------------------------------------------
        // IMPORTANT:
        // Find ONLY a DIRECT conversation between
        // Founder + this person.
        //
        // Do NOT open a Teacher + Student group here.
        // -------------------------------------------------

        let conversation =
            conversations.find(
                item => {

                    const participants =
                        item.participants || [];


                    if (
                        item.conversationType !==
                        "direct"
                    ) {

                        return false;

                    }


                    if (
                        participants.length !==
                        2
                    ) {

                        return false;

                    }


                    const hasFounder =
                        participants.some(
                            participant =>
                                String(
                                    participant._id
                                ) ===
                                String(
                                    getCurrentUserId()
                                )
                        );


                    const hasPerson =
                        participants.some(
                            participant =>
                                String(
                                    participant._id
                                ) ===
                                String(
                                    person._id
                                )
                        );


                    return (
                        hasFounder &&
                        hasPerson
                    );

                }
            );


        // -------------------------------------------------
        // IF PERSONAL CONVERSATION DOES NOT EXIST
        // CREATE ONE
        // -------------------------------------------------

        if (!conversation) {

            const res =
                await fetch(
                    API_BASE +
                    "/api/messenger/conversations",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                token

                        },

                        body:
                            JSON.stringify({

                                userId:
                                    person._id

                            })

                    }
                );


            const data =
                await res.json();


            if (!res.ok) {

                throw new Error(
                    data.message ||
                    "Unable to create personal conversation."
                );

            }


            conversation =
                data.conversation;


            // -------------------------------------------------
            // ADD NEW CONVERSATION TO LOCAL LIST
            // -------------------------------------------------

            conversations.unshift(
                conversation
            );

        }


        // -------------------------------------------------
        // IMPORTANT:
        // Tell sendMessage() exactly who Founder is
        // messaging.
        // -------------------------------------------------

        selectedContact =
            person;


        // -------------------------------------------------
        // OPEN THE PERSONAL CONVERSATION
        // -------------------------------------------------

        await openFounderConversation(
            conversation
        );

    }
    catch (error) {

        console.error(
            "OPEN FOUNDER PERSONAL CONVERSATION ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to open personal conversation."
        );

    }

}

function toggleFounderSection(
    sectionId
) {

    const section =
        document.getElementById(
            sectionId
        );


    if (!section) {

        return;

    }


    const isOpen =
        section.style.display !==
        "none";


    section.style.display =
        isOpen
            ? "none"
            : "block";


    const iconId =
    sectionId ===

        : sectionId ===
          "teachersSection"

    const icon =

        );


    if (icon) {

        icon.className =
            isOpen
                ? "fa-solid fa-chevron-right"
                : "fa-solid fa-chevron-down";

    }

}
// =========================================================
// OPEN FOUNDER CONVERSATION
// =========================================================

async function openFounderConversation(
    conversation
) {

    try {

        // -------------------------------------------------
        // SELECT THE EXISTING CONVERSATION
        // -------------------------------------------------

        selectedConversation =
            conversation;


        // -------------------------------------------------
        // GET OTHER PARTICIPANTS
        // -------------------------------------------------

        let otherParticipants =
            (conversation.participants || [])
                .filter(
                    participant =>
                        String(
                            participant._id
                        ) !==
                        String(
                            getCurrentUserId()
                        )
                );


        // -------------------------------------------------
        // FOUNDER JOINS THE EXISTING CONVERSATION
        // -------------------------------------------------

        const isAlreadyParticipant =
            (conversation.participants || [])
                .some(
                    participant =>
                        String(
                            participant._id
                        ) ===
                        String(
                            getCurrentUserId()
                        )
                );


        if (!isAlreadyParticipant) {

            const res =
                await fetch(

                    API_BASE +
                    "/api/messenger/conversations/" +
                    conversation._id +
                    "/join",

                    {

                        method: "POST",

                        headers: {

                            "Authorization":
                                "Bearer " +
                                token

                        }

                    }

                );


            const data =
                await res.json();


            if (!res.ok) {

                throw new Error(
                    data.message ||
                    "Unable to join conversation."
                );

            }


            // -------------------------------------------------
            // USE UPDATED CONVERSATION
            // -------------------------------------------------

            conversation =
                data.conversation;


            selectedConversation =
                conversation;


            // Update conversation in local array
            conversations =
                conversations.map(
                    item =>
                        String(
                            item._id
                        ) ===
                        String(
                            conversation._id
                        )
                            ? conversation
                            : item
                );


            // Recalculate participants
            otherParticipants =
                (conversation.participants || [])
                    .filter(
                        participant =>
                            String(
                                participant._id
                            ) !==
                            String(
                                getCurrentUserId()
                            )
                    );

        }


        // -------------------------------------------------
        // SET MOBILE CHAT MODE
        // -------------------------------------------------

        document.body.classList.add(
            "mobile-chat-open"
        );


        // -------------------------------------------------
        // UPDATE HEADER
        // -------------------------------------------------

        const conversationName =
            otherParticipants
                .map(
                    participant =>
                        participant.name
                )
                .join(" + ");


        const firstParticipant =
            otherParticipants[0];


        document.getElementById(
            "selectedAvatar"
        ).innerText =
            getInitial(
                firstParticipant?.name ||
                "C"
            );


        document.getElementById(
            "selectedName"
        ).innerText =
            conversationName ||
            "Conversation";


     const conversationParticipantRoles =
    otherParticipants
        .map(
            participant =>
                formatRole(
                    participant.role
                )
        )
        .filter(Boolean);


document.getElementById(
    "selectedRole"
).innerText =
    conversationParticipantRoles.join(
        " + "
    );


        // -------------------------------------------------
        // JOIN SOCKET ROOM
        // -------------------------------------------------

        socket.emit(
            "joinMessengerConversation",
            String(
                conversation._id
            )
        );


        // -------------------------------------------------
        // LOAD EXISTING MESSAGE HISTORY
        // -------------------------------------------------

        await loadMessages(
            conversation._id
        );


        // -------------------------------------------------
        // MARK FOUNDER'S MESSAGES AS READ
        // -------------------------------------------------

        socket.emit(
            "markMessengerConversationRead",
            String(
                conversation._id
            )
        );


        // -------------------------------------------------
        // REFRESH FOUNDER CONVERSATION LIST
        // -------------------------------------------------

        renderFounderConversations();

    }
    catch (error) {

        console.error(
            "OPEN FOUNDER CONVERSATION ERROR:",
            error
        );


        alert(
            error.message ||
            "Unable to open conversation."
        );

    }

}


/* =========================================================
   OPEN CONTACT
   ========================================================= */

async function openContact(
    contact
) {

    selectedContact =
        contact;


    document.body.classList.add(
        "mobile-chat-open"
    );


    updateSelectedContact();


    let conversation =
        findConversationForContact(
            contact
        );


    try {

        if (!conversation) {

            const res =
                await fetch(
                    API_BASE +
                    "/api/messenger/conversations",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                token

                        },

                        body:
                            JSON.stringify({
                                userId:
                                    contact._id
                            })

                    }
                );


            const data =
                await res.json();


            if (!res.ok) {

                throw new Error(
                    data.message ||
                    "Unable to create conversation"
                );

            }


            conversation =
                data.conversation;


            conversations.unshift(
                conversation
            );

        }


        selectedConversation =
            conversation;


        renderContacts();


        socket.emit(
            "joinMessengerConversation",
            String(
                conversation._id
            )
        );


        await loadMessages(
            conversation._id
        );


        socket.emit(
            "markMessengerConversationRead",
            String(
                conversation._id
            )
        );


    }
    catch (error) {

        console.error(
            "OPEN CONTACT ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to open conversation."
        );

    }

}


/* =========================================================
   LOAD MESSAGES
   ========================================================= */

async function loadMessages(
    conversationId
) {

    try {

        const res =
            await fetch(

                API_BASE +
                "/api/messenger/conversations/" +
                conversationId +
                "/messages",

                {

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }

            );


        const data =
            await res.json();


        if (!res.ok) {

            throw new Error(
                data.message ||
                "Unable to load messages"
            );

        }


        renderMessages(
            data.messages || []
        );


        // Reload conversation data
        await loadConversations();


        // Mark read
        socket.emit(
            "markMessengerConversationRead",
            String(
                conversationId
            )
        );

    }
    catch (error) {

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );

    }

}


/* =========================================================
   RENDER MESSAGES
   ========================================================= */

function renderMessages(
    messages
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!messages.length) {

        container.innerHTML = `

            <div class="empty-chat">

                <i class="fa-solid fa-comments"></i>

                <div>

                    No messages yet.

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    messages.forEach(
        message => {

            appendMessage(
                message,
                false
            );

        }
    );


    scrollMessages();

}


/* =========================================================
   APPEND MESSAGE
   ========================================================= */

function appendMessage(
    message,
    scroll = true
) {

    const container =
        document.getElementById(
            "messages"
        );


    // Avoid duplicate
    if (
        document.querySelector(
            `[data-message-id="${message._id}"]`
        )
    ) {

        return;

    }


    const senderId =
        typeof message.sender ===
        "object"
            ? message.sender._id
            : message.sender;


    const currentUserId =
        getCurrentUserId();


    const mine =
        String(senderId) ===
        String(currentUserId);


    // -------------------------------------------------
    // GET SENDER NAME
    // -------------------------------------------------

    let senderName =
        "User";


    if (
        message.sender &&
        typeof message.sender === "object"
    ) {

        if (
            message.sender.role ===
            "founder"
        ) {

            senderName =
                "Founder";

        }
        else {

            senderName =
                message.sender.name ||
                "User";

        }

    }


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            mine
                ? "mine"
                : "theirs"
        );


    row.dataset.messageId =
        message._id;


    // -------------------------------------------------
    // MESSAGE CONTENT WRAPPER
    // -------------------------------------------------

    const messageWrapper =
        document.createElement(
            "div"
        );


    // -------------------------------------------------
    // SENDER NAME
    // -------------------------------------------------

    const senderLabel =
        document.createElement(
            "div"
        );


    senderLabel.className =
        "message-sender-name";


    senderLabel.innerText =
        senderName;


    messageWrapper.appendChild(
        senderLabel
    );


    // -------------------------------------------------
    // MESSAGE BUBBLE
    // -------------------------------------------------

    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "message-bubble";


    const text =
        document.createElement(
            "div"
        );


    text.innerText =
        message.message;


    bubble.appendChild(
        text
    );


    // -------------------------------------------------
    // TIME
    // -------------------------------------------------

    const time =
        document.createElement(
            "span"
        );


    time.className =
        "message-time";


    time.innerText =
        formatTime(
            message.createdAt
        );


    bubble.appendChild(
        time
    );


    messageWrapper.appendChild(
        bubble
    );


    row.appendChild(
        messageWrapper
    );


    container.appendChild(
        row
    );


    if (scroll) {

        scrollMessages();

    }

}

/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage() {

    if (
        !selectedConversation
    ) {

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    socket.emit(
        "sendMessengerMessage",
        {

            conversationId:
                String(
                    selectedConversation._id
                ),

            message:
                message,

            // Needed for Founder
            receiverId:
                selectedContact
                    ? selectedContact._id
                    : null

        }
    );


    input.value = "";

    stopTyping();

}


/* =========================================================
   ENTER TO SEND
   ========================================================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   TYPING
   ========================================================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "input",
    () => {

        if (
            !selectedConversation ||
            !socket
        ) {

            return;

        }


        socket.emit(
            "messengerTyping",
            {

                conversationId:
                    String(
                        selectedConversation._id
                    ),

                isTyping: true

            }
        );


        clearTimeout(
            typingTimeout
        );


        typingTimeout =
            setTimeout(
                stopTyping,
                1000
            );

    }
);


function stopTyping() {

    clearTimeout(
        typingTimeout
    );


    if (
        !selectedConversation ||
        !socket
    ) {

        return;

    }


    socket.emit(
        "messengerTyping",
        {

            conversationId:
                String(
                    selectedConversation._id
                ),

            isTyping: false

        }
    );

}


/* =========================================================
   INCOMING MESSAGE
   ========================================================= */

function handleIncomingMessage(
    message
) {

    // Current conversation
    if (
        selectedConversation &&
        String(
            message.conversation
        ) ===
        String(
            selectedConversation._id
        )
    ) {

        appendMessage(
            message
        );


        socket.emit(
            "markMessengerConversationRead",
            String(
                selectedConversation._id
            )
        );

    }


    loadConversations();

}


/* =========================================================
   NOTIFICATION
   ========================================================= */

function handleNotification(
    data
) {

    console.log(
        "New Messenger message:",
        data
    );


    loadConversations();

}




/* =========================================================
   FIND PERSONAL DIRECT CONVERSATION FOR CONTACT
   ========================================================= */

function findConversationForContact(
    contact
) {

    const currentUserId =
        getCurrentUserId();


    return conversations.find(
        conversation => {

            const participants =
                conversation.participants || [];


            // -------------------------------------------------
            // PERSONAL CHAT MUST BE DIRECT
            // -------------------------------------------------

            if (
                conversation.conversationType !==
                "direct"
            ) {

                return false;

            }


            // -------------------------------------------------
            // PERSONAL CHAT MUST HAVE EXACTLY 2 PEOPLE
            // -------------------------------------------------

            if (
                participants.length !==
                2
            ) {

                return false;

            }


            // -------------------------------------------------
            // CURRENT USER MUST BE ONE PARTICIPANT
            // -------------------------------------------------

            const hasCurrentUser =
                participants.some(
                    participant =>
                        String(
                            participant._id
                        ) ===
                        String(
                            currentUserId
                        )
                );


            // -------------------------------------------------
            // SELECTED CONTACT MUST BE THE OTHER PERSON
            // -------------------------------------------------

            const hasContact =
                participants.some(
                    participant =>
                        String(
                            participant._id
                        ) ===
                        String(
                            contact._id
                        )
                );


            return (
                hasCurrentUser &&
                hasContact
            );

        }
    );

}


/* =========================================================
   UNREAD
   ========================================================= */

function getUnreadCount(
    conversation
) {

    if (!conversation) {

        return 0;

    }


    const currentUserId =
        getCurrentUserId();


    const entry =
        conversation.unreadCounts?.find(
            item =>
                String(
                    item.user
                ) ===
                String(
                    currentUserId
                )
        );


    return entry
        ? entry.count
        : 0;

}


/* =========================================================
   CURRENT USER ID
   ========================================================= */

function getCurrentUserId() {

    if (
        currentUser &&
        currentUser._id
    ) {

        return currentUser._id;

    }

    return null;

}


/* =========================================================
   SELECTED CONTACT
   ========================================================= */

function updateSelectedContact() {

    if (!selectedContact) {

        return;

    }


    document.getElementById(
        "selectedAvatar"
    ).innerText =
        getInitial(
            selectedContact.name
        );


    document.getElementById(
        "selectedName"
    ).innerText =
        selectedContact.name;


    document.getElementById(
        "selectedRole"
    ).innerText =
        formatRole(
            selectedContact.role
        );

}


/* =========================================================
   SEARCH
   ========================================================= */

function filterContacts() {

    const value =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const filtered =
        contacts.filter(
            contact =>
                contact.name
                    ?.toLowerCase()
                    .includes(
                        value
                    )
        );


    renderContacts(
        filtered
    );

}

/* =========================================================
   HELPERS
   ========================================================= */

function getInitial(
    name
) {

    if (!name) {

        return "?";

    }


    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}


function formatRole(
    role
) {

    if (!role) {

        return "";

    }


    return role
        .charAt(0)
        .toUpperCase() +
        role.slice(1);

}


function formatTime(
    value
) {

    if (!value) {

        return "";

    }


    return new Date(
        value
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );

    div.innerText =
        value || "";

    return div.innerHTML;

}


function scrollMessages() {

    const container =
        document.getElementById(
            "messages"
        );


    container.scrollTop =
        container.scrollHeight;

}
