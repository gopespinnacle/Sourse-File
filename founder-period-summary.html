
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Period Summary | Founder Panel</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="dashboard.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #172033;
}

.main-content {
    margin-left: 240px;
    padding: 20px;
    width: calc(100% - 240px);
}

h2 {
    margin-top: 0;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    padding: 15px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.filters input,
.filters select,
.filters button {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
}

.filters input,
.filters select {
    background: #fff;
    min-width: 150px;
}

.filters button {
    background: #24466e;
    color: #fff;
    border: none;
    cursor: pointer;
}

.filters button.clear {
    background: #64748b;
}

.teacher-card {
    background: #fff;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.teacher-name {
    font-size: 16px;
    font-weight: bold;
    color: #17375e;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e5e7eb;
}

.teacher-id {
    font-size: 12px;
    font-weight: normal;
    color: #64748b;
}

.student-section {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e5e7eb;
}

.student-section:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
}

.student-name {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
    color: #26374d;
}

.student-id {
    font-size: 12px;
    font-weight: normal;
    color: #64748b;
}

.tag {
    display: inline-block;
    background: #eef0ff;
    color: #263b63;
    padding: 4px 8px;
    border-radius: 6px;
    margin: 3px;
    font-size: 12px;
}

#status {
    margin: 12px 0;
    color: #52647a;
    font-size: 13px;
}

@media (max-width: 700px) {
    .main-content {
        margin-left: 0;
        width: 100%;
        padding: 14px;
    }

    .filters {
        flex-direction: column;
    }

    .filters input,
    .filters select,
    .filters button {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- FOUNDER SIDEBAR -->
<div id="sidebar-container"></div>

<script>
fetch("founder-sidebar.html")
.then(res => {
    if (!res.ok) throw new Error("Unable to load Founder sidebar");
    return res.text();
})
.then(html => {
    document.getElementById("sidebar-container").innerHTML = html;
})
.catch(err => console.error("Sidebar error:", err));
</script>

<div class="main-content">

    <h2>Period Summary</h2>
    <p>Teacher – Student – Subject – Timetable Mapping</p>

    <div class="filters">

        <select id="teacherFilter">
            <option value="">All Teachers</option>
        </select>

        <select id="studentFilter">
            <option value="">All Students</option>
        </select>

        <select id="subjectFilter">
            <option value="">All Subjects</option>
        </select>

        <select id="dayFilter">
            <option value="">All Days</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
        </select>

        <input
            type="text"
            id="searchInput"
            placeholder="Search teacher or student"
        >

        <button onclick="applyFilters()">
            <i class="fa fa-filter"></i> Apply Filter
        </button>

        <button class="clear" onclick="clearFilters()">
            Clear
        </button>

    </div>

    <p id="status">Loading period summary...</p>

    <div id="teachersContainer"></div>

</div>

<script>
const API = "https://academy-backend-eatl.onrender.com";

const token =
    sessionStorage.getItem("token") ||
    localStorage.getItem("token");

const role =
    sessionStorage.getItem("role") ||
    localStorage.getItem("role");

let allRows = [];

function safe(value) {
    return String(value ?? "-").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[ch]);
}

/*
 * Read a populated object or a plain ID.
 */
function getObject(value) {
    return value && typeof value === "object" ? value : null;
}

function getTeacherId(teacher) {
    if (!teacher || typeof teacher !== "object") return "";

    return teacher.teacherId ||
           teacher.teacherID ||
           teacher.employeeId ||
           teacher.employeeID ||
           teacher.user?.teacherId ||
           teacher.profile?.teacherId ||
           teacher._id ||
           teacher.id ||
           "";
}

function getStudentId(student) {
    if (!student || typeof student !== "object") return "";

    return student.studentId ||
           student.studentID ||
           student.admissionNumber ||
           student.admissionNo ||
           student._id ||
           student.id ||
           "";
}

function getName(person, fallback) {
    if (!person || typeof person !== "object") return fallback;

    return person.name ||
           person.fullName ||
           person.username ||
           fallback;
}



function teacherLabel(teacher) {
    if (!teacher || typeof teacher !== "object") {
        return "Unknown Teacher (ID unavailable)";
    }

    const name = getName(teacher, "Unknown Teacher");
    const id = getTeacherId(teacher);

    return id
        ? `${name} (${id})`
        : `${name} (ID unavailable)`;
}

function studentLabel(student) {
    if (!student || typeof student !== "object") {
        return "Unknown Student (ID unavailable)";
    }

    const name = getName(student, "Unknown Student");

    const id =
        getStudentId(student) ||
        getStudentId(student.user) ||
        getStudentId(student.profile) ||
        "";

    return `${name} (${id || "ID unavailable"})`;
}



function formatTime(time) {
    if (!time) return "-";

    const match = String(time).match(/^(\d{1,2}):(\d{2})/);

    if (!match) return String(time);

    let hour = Number(match[1]);
    const minute = match[2];
    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return `${String(hour).padStart(2, "0")}:${minute} ${suffix}`;
}

/*
 * Convert the API response into one row per student-period mapping.
 * Supports both:
 *   1. period.assignments[].student
 *   2. period.students[]
 */


function normalizePerson(value, fallbackName) {
    if (!value) return null;

    if (typeof value === "object") return value;

    // A raw MongoDB ObjectId is serialized by JSON as a string.
    if (typeof value === "string") {
        return { _id: value, name: fallbackName };
    }

    return null;
}

function asStringArray(value) {
    if (Array.isArray(value)) {
        return value
            .flat(Infinity)
            .filter(item => item !== null && item !== undefined && String(item).trim() !== "")
            .map(item => String(item).trim());
    }

    if (typeof value === "string" && value.trim()) {
        return [value.trim()];
    }

    return [];
}

function extractRows(periods) {
    const rows = [];

    (Array.isArray(periods) ? periods : []).forEach(period => {
        const teacher = normalizePerson(period.teacher, "Unknown Teacher");
        const assistantTeacher = normalizePerson(
            period.assistantTeacher,
            "Unknown Assistant Teacher"
        );

        const assignments = Array.isArray(period.assignments)
            ? period.assignments
            : [];

        // Preserve the timetable record even if no student is assigned.
        const entries = assignments.length
            ? assignments
            : [{ student: null, subjects: [], languages: [], eca: [] }];

        entries.forEach(assignment => {
            const student = normalizePerson(
                assignment.student,
                "Unknown Student"
            );

            // The student's own assignment is the most precise source.
            // Fall back to the schedule-level arrays for legacy/incomplete
            // assignment entries. "language" is singular on the schedule
            // schema, while assignment entries use "languages".
            let subjects = asStringArray(assignment.subjects);
            if (!subjects.length) {
                subjects = asStringArray(assignment.subject);
            }
            if (!subjects.length) {
                subjects = asStringArray(period.subject);
            }
            if (!subjects.length) subjects = ["-"];

            let languages = asStringArray(assignment.languages);
            if (!languages.length) {
                languages = asStringArray(assignment.language);
            }
            if (!languages.length) {
                languages = asStringArray(period.language);
            }

            let eca = asStringArray(assignment.eca);
            if (!eca.length) eca = asStringArray(period.eca);

            subjects.forEach(subject => {
                rows.push({
                    scheduleId: period._id || "",
                    teacher,
                    assistantTeacher,
                    student,
                    subject,
                    languages,
                    eca,
                    className: period.className || student?.grade || "-",
                    day: period.day || "-",
                    startTime: period.startTime || "",
                    endTime: period.endTime || "",
                    unassigned: !student
                });
            });
        });
    });

    return rows;
}

async function loadPeriodSummary() {
    const container = document.getElementById("teachersContainer");
    const status = document.getElementById("status");

    try {
        if (!token) {
            throw new Error("Your login session is missing. Please log in again.");
        }

        const response = await fetch(
            `${API}/api/founder/periodassignments`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Unable to load period mappings.");
        }

        const periods = Array.isArray(result)
            ? result
            : Array.isArray(result.data)
                ? result.data
                : Array.isArray(result.periods)
                    ? result.periods
                    : [];

        allRows = extractRows(periods);

        populateFilters();
        renderTeachers(allRows);

        const scheduleCount = Number.isFinite(result.summary?.scheduleRecords)
            ? result.summary.scheduleRecords
            : periods.length;

        status.textContent =
            `${scheduleCount} timetable record(s) | ` +
            `${allRows.length} student-subject-period row(s) loaded.`;

    } catch (error) {
        console.error("Period Summary error:", error);

        status.textContent = error.message;

        container.innerHTML = `
            <div class="teacher-card">
                Unable to load period summary.
                Please check your login session and API response.
            </div>
        `;
    }
}

function populateFilters() {
    const teacherSelect = document.getElementById("teacherFilter");
    const studentSelect = document.getElementById("studentFilter");
    const subjectSelect = document.getElementById("subjectFilter");

    const teachers = new Map();
    const students = new Map();
    const subjects = new Set();

    allRows.forEach(row => {
        [row.teacher, row.assistantTeacher].filter(Boolean).forEach(person => {
            const key = person._id ||
                        person.id ||
                        getTeacherId(person) ||
                        getName(person, "Unknown Teacher");

            teachers.set(String(key), teacherLabel(person));
        });

        if (row.student) {
            const key = row.student._id ||
                        row.student.id ||
                        getStudentId(row.student) ||
                        getName(row.student, "Unknown Student");

            students.set(String(key), studentLabel(row.student));
        }

        if (row.subject && row.subject !== "-") {
            subjects.add(row.subject);
        }
    });

    teacherSelect.innerHTML = '<option value="">All Teachers</option>';
    studentSelect.innerHTML = '<option value="">All Students</option>';
    subjectSelect.innerHTML = '<option value="">All Subjects</option>';

    [...teachers.entries()]
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([id, label]) => {
            teacherSelect.add(new Option(label, id));
        });

    [...students.entries()]
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([id, label]) => {
            studentSelect.add(new Option(label, id));
        });

    [...subjects].sort().forEach(subject => {
        subjectSelect.add(new Option(subject, subject));
    });
}

function getPersonKey(person, fallback) {
    if (!person) return fallback;

    return String(
        person._id ||
        person.id ||
        getTeacherId(person) ||
        getStudentId(person) ||
        getName(person, fallback)
    );
}

function renderTeachers(rows) {
    const container = document.getElementById("teachersContainer");

    if (!rows.length) {
        container.innerHTML = `
            <div class="teacher-card">
                No matching period mappings found.
            </div>
        `;
        return;
    }

    /*
     * Group periods by teacher, then by student.
     */
    const teacherMap = new Map();

    rows.forEach(row => {
        const teacherKey = getPersonKey(row.teacher, "unknown-teacher");

        if (!teacherMap.has(teacherKey)) {
            teacherMap.set(teacherKey, {
                teacher: row.teacher,
                students: new Map()
            });
        }

        const teacherGroup = teacherMap.get(teacherKey);
        const studentKey = getPersonKey(row.student, "unassigned-student");

        if (!teacherGroup.students.has(studentKey)) {
            teacherGroup.students.set(studentKey, {
                student: row.student,
                periods: []
            });
        }

        teacherGroup.students.get(studentKey).periods.push(row);
    });

    const teacherGroups = [...teacherMap.values()]
        .sort((a, b) =>
            teacherLabel(a.teacher).localeCompare(teacherLabel(b.teacher))
        );

    container.innerHTML = teacherGroups.map(group => {
        const studentGroups = [...group.students.values()]
            .sort((a, b) =>
                studentLabel(a.student).localeCompare(studentLabel(b.student))
            );

        const studentsHTML = studentGroups.map(studentGroup => {
            const periodsHTML = studentGroup.periods.map(period => `
                <div>
                    <span class="tag">
                        <i class="fa fa-book"></i>
                        ${safe(period.subject)}
                    </span>

                    <span class="tag">
                        <i class="fa fa-graduation-cap"></i>
                        ${safe(period.className)}
                    </span>

                    <span class="tag">
                        <i class="fa fa-calendar"></i>
                        ${safe(period.day)}
                    </span>

                    <span class="tag">
                        <i class="fa fa-clock"></i>
                        ${safe(formatTime(period.startTime))} -
                        ${safe(formatTime(period.endTime))}
                    </span>

                    ${period.assistantTeacher ? `
                        <span class="tag">
                            <i class="fa fa-user-tie"></i>
                            Assistant: ${safe(getName(period.assistantTeacher, "Unknown Assistant Teacher"))}
                        </span>
                    ` : ""}

                    ${period.languages.map(language => `
                        <span class="tag">
                            <i class="fa fa-language"></i>
                            ${safe(language)}
                        </span>
                    `).join("")}

                    ${period.eca.map(activity => `
                        <span class="tag">
                            <i class="fa fa-star"></i>
                            ${safe(activity)}
                        </span>
                    `).join("")}
                </div>
            `).join("");

            const studentName = studentGroup.student
                ? getName(studentGroup.student, "Unknown Student")
                : "No student assigned";

            const studentId = studentGroup.student
                ? getStudentId(studentGroup.student)
                : "";

            return `
                <div class="student-section">
                    <div class="student-name">
                        <i class="fa fa-user-graduate"></i>
                        ${safe(studentName)}
                        <span class="student-id">
                            / ${safe(studentId || "ID unavailable")}
                        </span>
                    </div>

                    ${periodsHTML}
                </div>
            `;
        }).join("");

        const teacherName = getName(group.teacher, "Unknown Teacher");
        const teacherId = getTeacherId(group.teacher);

        const periodCount = studentGroups.reduce(
            (total, student) => total + student.periods.length,
            0
        );

        return `
            <div class="teacher-card">
                <div class="teacher-name">
                    <i class="fa fa-chalkboard-teacher"></i>
                    ${safe(teacherName)}
                    <span class="teacher-id">
                        (${safe(teacherId || "ID unavailable")})
                    </span>
                    <span style="float:right;font-size:12px;color:#64748b;">
                        ${periodCount} Period(s)
                    </span>
                </div>

                ${studentsHTML}
            </div>
        `;
    }).join("");
}

function applyFilters() {
    const teacherId = document.getElementById("teacherFilter").value;
    const studentId = document.getElementById("studentFilter").value;
    const subject = document.getElementById("subjectFilter").value;
    const day = document.getElementById("dayFilter").value;
    const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const filtered = allRows.filter(row => {
        const teacherKey = getPersonKey(row.teacher, "");
        const assistantKey = getPersonKey(row.assistantTeacher, "");
        const studentKey = getPersonKey(row.student, "");

        if (teacherId && teacherKey !== teacherId && assistantKey !== teacherId) return false;
        if (studentId && studentKey !== studentId) return false;
        if (subject && row.subject !== subject) return false;
        if (day && row.day.toLowerCase() !== day.toLowerCase()) return false;

        if (search) {
            const teacherText = teacherLabel(row.teacher).toLowerCase();
            const assistantText = row.assistantTeacher
                ? teacherLabel(row.assistantTeacher).toLowerCase()
                : "";
            const studentText = studentLabel(row.student).toLowerCase();

            if (
                !teacherText.includes(search) &&
                !assistantText.includes(search) &&
                !studentText.includes(search)
            ) {
                return false;
            }
        }

        return true;
    });

    renderTeachers(filtered);

    document.getElementById("status").textContent =
        `${filtered.length} matching student-subject-period row(s).`;
}

function clearFilters() {
    document.getElementById("teacherFilter").value = "";
    document.getElementById("studentFilter").value = "";
    document.getElementById("subjectFilter").value = "";
    document.getElementById("dayFilter").value = "";
    document.getElementById("searchInput").value = "";

    renderTeachers(allRows);

    document.getElementById("status").textContent =
        `${allRows.length} student-subject-period row(s) loaded.`;
}

document.getElementById("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") applyFilters();
});

loadPeriodSummary();
</script>

</body>
</html>
