const socket = MeetingSocket.connect(

);


socket.onAny((event, ...args) => {

    console.log(
        "SOCKET EVENT:",
        event,
        args
    );

});

function sendNetworkQuality(){

    if(!socket.connected) return;

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;

    let quality = "Excellent";

    if(connection){

        const type = connection.effectiveType;

        if(type === "slow-2g" || type === "2g"){

            quality = "Poor";

        }else if(type === "3g"){

            quality = "Good";

        }

    }

    socket.emit("networkStatus",{

        quality

    });

}
setInterval(sendNetworkQuality,5000);

// ===========================
// BATTERY STATUS
// ===========================

async function sendBatteryStatus(){

    if(!socket.connected) return;

    if(!navigator.getBattery){

        socket.emit("batteryStatus",{

            level: -1,

            charging: false

        });

        return;

    }

    const battery = await navigator.getBattery();

    socket.emit("batteryStatus",{

        level: Math.round(battery.level * 100),

        charging: battery.charging

    });

}

function sendDeviceInfo(){

    const ua = navigator.userAgent;

    let device = "Unknown";

    if(/Android/i.test(ua)){

        device = /Mobile/i.test(ua)
            ? "Android Phone"
            : "Android Tablet";

    }
    else if(/iPhone/i.test(ua)){

        device = "iPhone";

    }
    else if(/iPad/i.test(ua)){

        device = "iPad";

    }
    else if(/Windows/i.test(ua)){

        device = "Windows";

    }
    else if(/Macintosh|Mac OS X/i.test(ua)){

        device = "macOS";

    }
    else if(/Linux/i.test(ua)){

        device = "Linux";

    }

    socket.emit("deviceInfo",{

        device

    });

}

async function createOffer(socketId){

    console.log("CREATING OFFER FOR:", socketId);

    const pc = peers[socketId];

    if(!pc){
        console.log("NO PEER");
        return;
    }

    console.log("SIGNAL:", pc.signalingState);

    const offer = await pc.createOffer();

    console.log("OFFER CREATED");

    await pc.setLocalDescription(offer);

    console.log("LOCAL DESCRIPTION SET");

    socket.emit("offer",{

        room,
        targetSocketId: socketId,
        offer

    });

    console.log("OFFER SENT");

}

// RECEIVE OFFER
socket.on("offer", async(data)=>{

    const teacherSocketId = data.teacherSocketId;

    let pc = peers[teacherSocketId];

if (!pc) {

    pc = await createPeer(teacherSocketId);

}

    if(
    pc.signalingState !== "stable"
){

    console.log(
        "Offer ignored:",
        pc.signalingState
    );

    return;

}

    await pc.setRemoteDescription(

        new RTCSessionDescription(data.offer)

    );

    if (pendingCandidates[teacherSocketId]) {

    for (const candidate of pendingCandidates[teacherSocketId]) {

        await pc.addIceCandidate(
            new RTCIceCandidate(candidate)
        );

    }

    delete pendingCandidates[teacherSocketId];

}

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    socket.emit("answer",{

        teacherSocketId,

        answer

    });

});
// RECEIVE ANSWER

        if (pc.remoteDescription) {

            await pc.addIceCandidate(
                new RTCIceCandidate(data.candidate)
            );

        } else {

            if (!pendingCandidates[data.senderSocketId]) {
                pendingCandidates[data.senderSocketId] = [];
            }

            pendingCandidates[data.senderSocketId].push(data.candidate);

        }

    } catch (err) {

        console.log("ICE Error", err);

    }

});

async function loadPDFToCanvas(url){
    drawCanvas.style.pointerEvents = "auto";
sessionStorage.setItem("pdfOpen", "true");
    document.getElementById("pdfWindow").style.display = "block";
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    document.getElementById("pdfTab").style.display = "none";

    const loadingTask = pdfjsLib.getDocument(url);
    const pdf = await loadingTask.promise;

    const container = document.getElementById("pdfWindow");

    // 🔥 REMOVE OLD PAGES
    const oldCanvases = container.querySelectorAll("canvas.pdfPage");
    oldCanvases.forEach(c => c.remove());

    for(let i = 1; i <= pdf.numPages; i++){

        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.2 });

        const pageCanvas = document.createElement("canvas");
        pageCanvas.className = "pdfPage";

        pageCanvas.width = viewport.width;
        pageCanvas.height = viewport.height;

        const pageCtx = pageCanvas.getContext("2d");

        await page.render({
            canvasContext: pageCtx,
            viewport: viewport
        }).promise;

        container.appendChild(pageCanvas);
    }
    drawCanvas.width = container.scrollWidth;
drawCanvas.height = container.scrollHeight;


}

async function saveAsPDF(){

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    const isPDFOpen = document.getElementById("pdfWindow").style.display === "block";

    // ================= CASE 1 & 2 (WHITE / LINES) =================
    if(!isPDFOpen){

        // convert mainBoard to image
        const imgData = mainBoard.toDataURL("image/png");

        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
        pdf.save("whiteboard.pdf");

        return;
    }

    // ================= CASE 3 (UPLOADED PDF + DRAWING) =================

    const pages = document.querySelectorAll(".pdfPage");

    for(let i = 0; i < pages.length; i++){

        const pageCanvas = pages[i];

        // create temp canvas
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = pageCanvas.width;
        tempCanvas.height = pageCanvas.height;

        const tempCtx = tempCanvas.getContext("2d");

        // draw PDF page
        tempCtx.drawImage(pageCanvas, 0, 0);

        // draw annotations
        tempCtx.drawImage(drawCanvas, 0, 0);

        const imgData = tempCanvas.toDataURL("image/png");

        if(i > 0) pdf.addPage();

        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
    }

    pdf.save("annotated.pdf");
}

        const scale =
            detectState.s * 220;

        // ROTATION
        const rot =
            detectState.ry;

        ctx.save();

        // MOVE TO HEAD
        ctx.translate(
            x,
            y - 80
        );

        // ROTATE WITH HEAD
        ctx.rotate(rot);

        // DRAW FILTER
        ctx.drawImage(
            dogImg,
            -scale/2,
            -scale/1.2,
            scale,
            scale * 0.7
        );

        ctx.restore();
    }
}
    });
}

async function initMedia(cameraId = null){

    try{

        // Stop previous camera & mic
        if(localStream){
            localStream.getTracks().forEach(track => track.stop());
        }

        // Try selected camera
        localStream = await navigator.mediaDevices.getUserMedia({

            video: cameraId
                ? {
                    deviceId:{
                        exact:cameraId
                    }
                }
                : true,

            audio:true

        });

    }catch(err){

        console.error("Selected camera not available:", err);

        alert("Selected camera not found. Switching to default camera.");

        // Fallback to default camera
        localStream = await navigator.mediaDevices.getUserMedia({

            video:true,
            audio:true

        });

        socket.emit("mediaStatus", {

    camera: localStream.getVideoTracks()[0]?.enabled ?? false,

    mic: localStream.getAudioTracks()[0]?.enabled ?? false

});

    }

    const localVideo = document.getElementById("localVideo");

    if(localVideo){

        localVideo.srcObject = localStream;

        try{
            await localVideo.play();
        }catch(e){
            console.log("Video autoplay blocked", e);
        }

    }

    // Refresh camera list
    await loadCameraList();

}
