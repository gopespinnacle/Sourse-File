<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Minutes of Meeting | Gopes Pinnacle Academy
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                #e9e9e9;

            color:
                #14243b;

        }


        /* =================================================
           MOM PAGE HEADER
        ================================================= */

        .mom-header {

            width: 100%;

            padding: 20px;

            background:
                #14243b;

            color:
                #ffffff;

            text-align: center;

            font-family:
                Arial,
                sans-serif;

        }


        .mom-header h1 {

            margin: 0;

            font-size: 26px;

            letter-spacing: 1px;

        }


        .mom-header p {

            margin: 6px 0 0;

            font-size: 14px;

            opacity: 0.85;

        }


        /* =================================================
           MOM EDITOR
        ================================================= */

        .mom-container {

            width: min(
                1100px,
                94%
            );

            margin:
                30px auto 60px;

        }


        /* =================================================
           CARD
        ================================================= */

        .mom-card {

            position: relative;

            width: 100%;

            min-height: 500px;

            margin-bottom: 30px;

            padding: 30px;

            background:
                #ffffff;

            border:
                2px solid #c99732;

            border-radius: 8px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.12);

        }


        .mom-card-number {

            position: absolute;

            top: 15px;

            left: 15px;

            width: 38px;

            height: 38px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #14243b;

            color:
                #ffffff;

            font-family:
                Arial,
                sans-serif;

            font-weight: bold;

        }


        .mom-card-title {

            margin:
                5px 0 25px;

            text-align: center;

            font-family:
                Arial,
                sans-serif;

            color:
                #14243b;

            letter-spacing:
                1px;

        }


        /* =================================================
           CARD 1
        ================================================= */

        #coverCard {

            min-height:
                900px;

        }


        /* =================================================
           CARD 2
        ================================================= */

        #bodyCard {

            min-height:
                700px;

        }


        /* =================================================
           DOWNLOAD AREA
        ================================================= */

        .mom-actions {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 30px;

        }


        .mom-download-btn {

            padding:
                14px 30px;

            border: none;

            border-radius: 8px;

            background:
                #14243b;

            color:
                #ffffff;

            font-family:
                Arial,
                sans-serif;

            font-size:
                16px;

            font-weight:
                600;

            cursor:
                pointer;

        }


        .mom-download-btn:hover {

            background:
                #c99732;

            color:
                #14243b;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (
            max-width: 600px
        ) {

            .mom-container {

                width: 96%;

                margin-top: 15px;

            }


            .mom-card {

                padding:
                    22px 15px;

            }


            .mom-card-number {

                width: 32px;

                height: 32px;

                font-size:
                    13px;

            }


            .mom-card-title {

                font-size:
                    20px;

            }


            #coverCard {

                min-height:
                    700px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         PAGE HEADER
    ================================================= -->

    <header class="mom-header">

        <h1>
            GOPES PINNACLE ACADEMY
        </h1>

        <p>
            Minutes of Meeting
        </p>

    </header>



    <!-- =================================================
         MOM CONTAINER
    ================================================= -->

    <main class="mom-container">


        <!-- =============================================
             CARD 1 — COVER PAGE
        ============================================== -->

        <section
            class="mom-card"
            id="coverCard"
        >

            <div class="mom-card-number">
                1
            </div>

            <h2 class="mom-card-title">
                COVER PAGE
            </h2>


            <!-- COVER PAGE CONTENT
                 WILL BE ADDED IN STEP 2
            -->


        </section>



        <!-- =============================================
             CARD 2 — BODY OF MOM
        ============================================== -->

        <section
            class="mom-card"
            id="bodyCard"
        >

            <div class="mom-card-number">
                2
            </div>

            <h2 class="mom-card-title">
                BODY OF MOM
            </h2>


            <!-- MOM BODY EDITOR
                 WILL BE ADDED IN A LATER STEP
            -->


        </section>



        <!-- =============================================
             DOWNLOAD
        ============================================== -->

        <div class="mom-actions">

            <button
                type="button"
                class="mom-download-btn"
                id="downloadMomBtn"
            >

                DOWNLOAD MOM

            </button>

        </div>


    </main>


</body>

</html>
