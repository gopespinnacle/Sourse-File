<div class="sidebar">

    <div class="logo-box">

        <img src="images/logo.png" alt="Academy Logo">

    </div>

    <hr>

    <ul>

        <li onclick="window.location.href='teacher-dashboard.html'">

            <i class="fa fa-chart-line"></i>

            Dashboard

        </li>

        <li onclick="logout()">

            <i class="fa fa-sign-out-alt"></i>

            Logout

        </li>

    </ul>

</div>
<style>

.sidebar{
    width:240px;
    height:100vh;
    position:fixed;
    top:0;
    left:0;
    background:#1e2a38;
    color:#fff;

    display:flex;
    flex-direction:column;

    z-index:9999;
}

/* HEADER */
.logo-box{

    text-align:center;

    padding:20px 15px 15px;

}

.logo-box img{

    width:140px;

    height:auto;

}

.sidebar hr{

    border:none;

    border-top:1px solid rgba(255,255,255,.15);

    margin:0 15px 15px;

}

/* MENU */
.sidebar ul{
    list-style:none;
    padding:10px 0;
    margin:0;
    flex:1;
}

.sidebar ul li{
    padding:12px 20px;
    cursor:pointer;
    transition:.3s;
}

.sidebar ul li:hover{
    background:#2f3e52;
}

.sidebar i{
    margin-right:10px;
}

/* ======================
MOBILE
====================== */

@media(max-width:768px){

.sidebar{

    left:-260px;
    transition:.3s;

}

.sidebar.show{

    left:0;

}

.sidebar h2{

    font-size:22px;

}

.sidebar ul li{

    padding:18px 20px;
    font-size:18px;

}

}

</style>

<script>
function go(page){
    window.location.href = page;
}

function logout(){

    sessionStorage.clear();

    window.location.replace(
        "teacher-login.html"
    );

}
</script>
<script>
function goToDashboard(){
    window.location.href = "teacher-dashboard.html";
}

const permissions = JSON.parse(

sessionStorage.getItem("menuPermissions") || "{}"

);

function applyMenuPermissions(){

    Object.keys(permissions).forEach(menu=>{

        if(permissions[menu] === false){

            const item = document.getElementById(

                "menu-" + menu

            );

            if(item){

                item.style.display = "none";

            }

        }

    });

}

applyMenuPermissions();
</script>
