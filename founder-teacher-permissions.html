<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Teacher Permissions</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

.page-title{

font-size:30px;

font-weight:bold;

margin-bottom:25px;

}

.permission-table{

width:100%;

border-collapse:collapse;

background:white;

border-radius:10px;

overflow:hidden;

box-shadow:0 2px 10px rgba(0,0,0,.1);

}

.permission-table th{

background:#0d6efd;

color:white;

padding:15px;

text-align:left;

}

.permission-table td{

padding:15px;

border-bottom:1px solid #eee;

}

.permission-table tr:hover{

background:#f8f9fa;

}

.manage-btn{

background:#198754;

color:white;

border:none;

padding:10px 20px;

border-radius:6px;

cursor:pointer;

font-weight:bold;

}

.manage-btn:hover{

background:#157347;

}

</style>

</head>

<body class="dashboard-page">

<div id="sidebar-container"></div>

<script>

fetch("sidebar.html")
.then(r=>r.text())
.then(html=>{

document.getElementById("sidebar-container").innerHTML=html;

});

</script>

<div class="main-content">

<div class="page-title">

Teacher Permissions

</div>

<table
class="permission-table"
id="teacherTable">

<thead>

<tr>

<th>Teacher</th>

<th>Email</th>

<th>Subject</th>

<th>Action</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script src="assets/js/founder/teacherPermissions.js"></script>

</body>

</html>
