    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111827;

            color: white;

            overflow: hidden;

        }


        /*
        =====================================================
        MAIN ANNOTATION APPLICATION
        =====================================================
        */

        #annotationApp {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

        }


        /*
        =====================================================
        TOP BAR
        =====================================================
        */

        #annotationTopBar {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;

    background: #171a1f;

    border-bottom:
        1px solid #2d333b;

    position: relative;

    z-index: 1000;

}


        #academyTitle {

    font-size: 17px;

    font-weight: 700;

    letter-spacing: .3px;

    color: #ffffff;

}


        #materialTitle {

            color: #d1d5db;

        }

        =====================================================
        CONNECTION / STATUS
        =====================================================

            display: flex;

            align-items: center;

        }


        #annotationStatusDot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #22c55e;

        }

        =====================================================
        MAIN WORKSPACE
        =====================================================

#annotationMain {

    flex: 1;

    position: relative;

    background: #e5e7eb;

    overflow: auto;

}

/*
=====================================================
ANNOTATION WORKSPACE
=====================================================
*/



#annotationWorkspaceV1 {
    position: absolute;
    isolation: isolate;

    width: min(210mm, calc(100% - 32px));
    aspect-ratio: 210 / 297;
    height: auto;

    left: 50%;
    top: 20px;
    bottom: auto;
    transform: translateX(-50%);

    background: #ffffff;
    overflow: hidden;

    border: 1.5px solid #000000;
    border-radius: 0;

    box-shadow: 0 4px 18px rgba(0, 0, 0, .15);
}

/* Notebook background is a separate layer and is never erased */
#annotationPageBackgroundV1 {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    display: block;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    z-index: 0;
    pointer-events: none;
    background-color: #fff;
}

/* Keep the canvas filling the A4 page */
#annotationCanvasV1 {
    position: absolute !important;
    inset: 0;
    z-index: 2 !important;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: auto !important;
    touch-action: none;
    background: transparent !important;
    cursor: crosshair;
}


/* A4 page inner margin — all four sides */
#annotationWorkspaceV1::before {
    content: "";
    position: absolute;
    top: 10mm;
    right: 10mm;
    bottom: 10mm;
    left: 10mm;
    border: 1.5px solid #000;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 10;
}




/*
=====================================================
ANNOTATION TOOLBAR V1
=====================================================
*/

#annotationToolbarV1 {

    position: absolute;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 2000;

}


        


        /*
        =====================================================
        MATERIAL INFORMATION
        =====================================================
        */

    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);

    line-height: 1.25;
    text-align: center;
    pointer-events: none;

#materialSubject { font-weight: 700; }
#materialChapterNumber { font-size: 12px; color: #e5e7eb; }
#materialTopic { font-size: 12px; color: #f3f4f6; }

        =====================================================
        MOBILE
        =====================================================

                    0 12px;

CLOSE CONFIRMATION MODAL

<!-- Learning material header values passed from period-students.html -->
<script>
(function populateAnnotationMaterialHeader(){
    const params = new URLSearchParams(window.location.search);
    let saved = {};
    try {
        saved = JSON.parse(sessionStorage.getItem("learningMaterialDetails") || "{}");
    } catch (error) {
        saved = {};
    }

    const subject = params.get("subject") || saved.subject || "Subject";
    const chapterNumber = params.get("chapterNumber") || saved.chapterNumber || "";
    const topic = params.get("topic") || saved.topic || "Topic";

    const subjectElement = document.getElementById("materialSubject");
    const chapterElement = document.getElementById("materialChapterNumber");
    const topicElement = document.getElementById("materialTopic");

    if (subjectElement) subjectElement.textContent = subject;
    if (chapterElement) chapterElement.textContent = chapterNumber ? "Chapter No. " + chapterNumber : "";
    if (topicElement) topicElement.textContent = topic;
})();
</script>

<script>
/*
===========================================================
JOIN THE LOGGED-IN TEACHER'S GOOGLE MEET FROM ANNOTATION
Uses the same backend endpoint as the existing Attend Class flow.
===========================================================
*/
async function joinClassFromAnnotation() {
    const button = document.getElementById("joinClassFromAnnotation");
    if (!button || button.disabled) return;

    // Open synchronously from the button click to avoid popup blockers.
    const meetWindow = window.open("about:blank", "_blank");
    if (!meetWindow) {
        alert("Please allow pop-ups for this website to join the class.");
        return;
    }

    button.disabled = true;
    const originalText = button.textContent;
    button.textContent = "Connecting...";

    try {
        const token = sessionStorage.getItem("token");
        if (!token) {
            meetWindow.close();
            alert("Your login session was not found. Please sign in again, then reopen the annotation page.");
            return;
        }

        const meetingResponse = await fetch(
            "https://academy-backend-eatl.onrender.com/api/teacher/my-meeting-link",
            {
                method: "GET",
                headers: { "Authorization": "Bearer " + token }
            }
        );

        let meetingData = {};
        try { meetingData = await meetingResponse.json(); } catch (_) {}

        if (!meetingResponse.ok || !meetingData.meetingLink) {
            meetWindow.close();
            alert(meetingData.message || "Google Meet link is not available for the logged-in teacher.");
            return;
        }

        // This endpoint resolves the unique meeting link for the logged-in teacher.
        meetWindow.location.href = meetingData.meetingLink;
        sessionStorage.setItem("teacherMeetingLink", meetingData.meetingLink);
    } catch (error) {
        console.error("ANNOTATION JOIN CLASS ERROR:", error);
        if (meetWindow && !meetWindow.closed) meetWindow.close();
        alert("Unable to open Google Meet. Please try again.");
    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}
</script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


<script>

/*
===========================================================
GOPES PINNACLE ACADEMY
STANDALONE ANNOTATION SOCKET
===========================================================

IMPORTANT:

The classroom already has a socket.

The standalone annotation page is a NEW browser tab,
so it needs its own Socket.IO connection.

AnnotationCanvasV1 expects:

    window.socket

===========================================================
*/

window.socket =
    io(
        "https://academy-backend-eatl.onrender.com",
        {

            transports: [
                "websocket",
                "polling"
            ],

            reconnection: true,

            reconnectionAttempts:
                Infinity,

            reconnectionDelay:
                1000,

            reconnectionDelayMax:
                5000,

            timeout:
                20000

        }
    );


/*
===========================================================
SOCKET CONNECTED
===========================================================
*/

window.socket.on(
    "connect",
    () => {

        console.log(
            "ANNOTATION TAB: SOCKET CONNECTED",
            window.socket.id
        );

    }
);


/*
===========================================================
SOCKET DISCONNECTED
===========================================================
*/

window.socket.on(
    "disconnect",
    reason => {

        console.warn(
            "ANNOTATION TAB: SOCKET DISCONNECTED",
            reason
        );

    }
);


/*
===========================================================
SOCKET ERROR
===========================================================
*/

window.socket.on(
    "connect_error",
    error => {

        console.error(
            "ANNOTATION TAB: SOCKET ERROR",
            error
        );

    }
);

</script>

<!-- Reliable startup: initialize drawing/paste handlers automatically for every teacher. -->
<script>
(function startAnnotationToolsSafely() {
    function start() {
        const canvas = document.getElementById("annotationCanvasV1");
        if (window.AnnotationCanvasV1 && canvas) {
            window.AnnotationCanvasV1.init(canvas);
            window.AnnotationCanvasV1.setTool("pen");
        }
        if (window.AnnotationToolbarV1) {
            window.AnnotationToolbarV1.init();
            window.AnnotationToolbarV1.show();
            window.AnnotationToolbarV1.setActiveTool("pen");
        }
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
        start();
    }
})();
</script>
